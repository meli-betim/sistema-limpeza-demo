        b.textContent = '📥 Exportar Excel 52 Semanas';
        b.onclick = abrirModal;
        const upd = [...bar.querySelectorAll('button')].find(x=>/Atualizar Excel/.test(x.textContent));
        if(upd){ upd.style.marginLeft = '0'; bar.insertBefore(b, upd); } else bar.appendChild(b);
      }
      return r;
    };
  }

})();
</script>

<!-- ===== Efetivo Contratado — Documentação dos colaboradores ===== -->
<script>
/* =====================================================================
   EFETIVO CONTRATADO — DOCUMENTAÇÃO / TREINAMENTOS POR COLABORADOR
   ---------------------------------------------------------------------
   Somente Administrador. Arquivos ficam no mesmo banco de dados (Realtime
   Database), sem armazenamento remoto:
     sistema_limpeza/efetivoDocs/tipos/{tipoId}            {nome, ativo, ordem}
     sistema_limpeza/efetivoDocs/meta/{colab}/{docId}       {tipoId, tipoNome, descricao,
                                                             arquivoNome, mime, tamanho,
                                                             criadoEm, criadoPor, ...}
     sistema_limpeza/efetivoDocs/arquivos/{docId}           conteúdo (base64)
   {colab} = chave do colaborador derivada do nome. Ao renomear um
   colaborador pelo ✏️, os documentos acompanham o novo nome.
   Novos tipos de documento são cadastrados pela tela (⚙️ Tipos de documento).
   ===================================================================== */
(function(){
  'use strict';

  const BASE = () => fbRoot.child('efetivoDocs');
  const MAX_BYTES = 5*1024*1024;          // limite por arquivo (o banco aceita até ~10 MB por gravação)
  const OUTROS = '__outros__';
  const TIPOS_PADRAO = [
    {id:'ficha_epi',  nome:'Ficha de EPI'},
    {id:'nr12',       nome:'NR-12'},
    {id:'trein_maq',  nome:'Treinamento de Máquinas'},
  ];

  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
  const chaveColab = nome => norm(nome).replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'') || 'sem_nome';
  const novoId = () => 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const quem = () => (currentUser && currentUser.nome) || 'Admin';
  const fmtData = ts => { const d = new Date(ts); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); };
  const fmtTam = b => b>=1048576 ? (b/1048576).toFixed(1).replace('.',',')+' MB' : Math.max(1,Math.round(b/1024))+' KB';

  let tipos = {};       // id -> {nome, ativo, ordem}
  let meta = {};        // colabKey -> {docId: {...}}
  let abertos = new Set();

  /* ------------------------------------------------------------------
     Dados
     ------------------------------------------------------------------ */
  async function carregar(){
    const [t, m] = await Promise.all([
      withTimeout(BASE().child('tipos').get(), 15000),
      withTimeout(BASE().child('meta').get(), 15000),
    ]);
    tipos = t.exists() ? t.val() : {};
    meta = m.exists() ? m.val() : {};
    if(!Object.keys(tipos).length){
      const seed = {}; TIPOS_PADRAO.forEach((x,i)=>seed[x.id] = {nome:x.nome, ativo:true, ordem:i+1});
      try{
        const r = await BASE().child('tipos').transaction(cur => cur ? undefined : seed);
        tipos = (r.snapshot && r.snapshot.val()) || seed;
      }catch(e){ tipos = seed; }
    }
  }
  const tiposOrdenados = (incluirInativos) => Object.entries(tipos)
    .filter(([,t])=>incluirInativos || t.ativo!==false)
    .sort((a,b)=>(a[1].ordem||0)-(b[1].ordem||0)).map(([id,t])=>({id, ...t}));
  const docsDe = key => Object.entries(meta[key]||{}).map(([id,d])=>({id, ...d})).sort((a,b)=>(b.criadoEm||0)-(a.criadoEm||0));

  function lerArquivo(file){
    return new Promise((res, rej)=>{
      const fr = new FileReader();
      fr.onload = ()=>{ const s = String(fr.result); res({b64: s.slice(s.indexOf(',')+1), mime: file.type || 'application/octet-stream'}); };
      fr.onerror = ()=>rej(new Error('Não foi possível ler o arquivo.'));
      fr.readAsDataURL(file);
    });
  }
  async function prepararArquivo(file){
    if(file.type && file.type.startsWith('image/') && file.size > 1024*1024 && typeof compressImageWithLimit==='function'){
      const dataUrl = await compressImageWithLimit(file, 1500*1024);   // fotos grandes de fichas são comprimidas
      return {b64: dataUrl.slice(dataUrl.indexOf(',')+1), mime:'image/jpeg', tamanho: Math.round(dataUrl.length*0.75),
              nome: file.name.replace(/\.[^.]+$/,'')+'.jpg'};
    }
    if(file.size > MAX_BYTES) throw new Error('Arquivo maior que '+fmtTam(MAX_BYTES)+'. Reduza o arquivo (ex.: salve o PDF em qualidade menor) e tente de novo.');
    const {b64, mime} = await lerArquivo(file);
    return {b64, mime, tamanho:file.size, nome:file.name};
  }

  async function salvarDocumento(nomeColab, tipoId, descricao, file){
    if(!isAdmin) throw new Error('Ação restrita ao administrador.');
    const key = chaveColab(nomeColab), id = novoId();
    const arq = await prepararArquivo(file);
    const tipoNome = tipoId===OUTROS ? 'Outros' : (tipos[tipoId] ? tipos[tipoId].nome : tipoId);
    const m = {colaborador:nomeColab, tipoId, tipoNome, arquivoNome:arq.nome, mime:arq.mime, tamanho:arq.tamanho,
               criadoEm:Date.now(), criadoPor:quem()};
    if(tipoId===OUTROS) m.descricao = descricao;
    // arquivo e cadastro gravados juntos (atômico)
    await withTimeout(BASE().update({['arquivos/'+id]: arq.b64, ['meta/'+key+'/'+id]: m}), 60000);
    (meta[key] = meta[key] || {})[id] = m;
  }
  async function substituirDocumento(key, id, file){
    if(!isAdmin) throw new Error('Ação restrita ao administrador.');
    const arq = await prepararArquivo(file);
    const atual = meta[key][id];
    const m = Object.assign({}, atual, {arquivoNome:arq.nome, mime:arq.mime, tamanho:arq.tamanho,
               substituidoEm:Date.now(), substituidoPor:quem(), arquivoAnterior: atual.arquivoNome});
    await withTimeout(BASE().update({['arquivos/'+id]: arq.b64, ['meta/'+key+'/'+id]: m}), 60000);
    meta[key][id] = m;
  }
  async function excluirDocumento(key, id){
    if(!isAdmin) throw new Error('Ação restrita ao administrador.');
    await withTimeout(BASE().update({['arquivos/'+id]: null, ['meta/'+key+'/'+id]: null}), 30000);
    delete meta[key][id];
  }
  async function abrirDocumento(key, id, baixar){
    const d = meta[key] && meta[key][id]; if(!d) return;
    const w = baixar ? null : window.open('', '_blank');
    if(w) w.document.write('<p style="font-family:Arial;padding:20px;color:#555">Carregando documento…</p>');
    try{
      const s = await withTimeout(BASE().child('arquivos/'+id).get(), 60000);
      if(!s.exists()) throw new Error('Arquivo não encontrado no banco.');
      const bin = atob(s.val()); const u = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([u], {type: d.mime || 'application/octet-stream'}));
      if(baixar || !w){ const a = document.createElement('a'); a.href = url; a.download = d.arquivoNome || 'documento'; document.body.appendChild(a); a.click(); a.remove(); }
      else w.location.href = url;
      setTimeout(()=>URL.revokeObjectURL(url), 120000);
    }catch(e){
      if(w) w.close();
      alert('❌ '+(e.message||'Não foi possível abrir o documento.'));
    }
  }
  async function moverDocumentos(deKey, paraKey, novoNome){
    const docs = meta[deKey]; if(!docs || deKey===paraKey) return;
    const up = {};
    Object.entries(docs).forEach(([id,d])=>{ up['meta/'+paraKey+'/'+id] = Object.assign({}, d, {colaborador:novoNome}); up['meta/'+deKey+'/'+id] = null; });
    await withTimeout(BASE().update(up), 30000);
    meta[paraKey] = Object.assign(meta[paraKey]||{}, ...Object.keys(docs).map(id=>({[id]: up['meta/'+paraKey+'/'+id]})));
    delete meta[deKey];
  }

  /* ------------------------------------------------------------------
     Renomear colaborador pelo ✏️ → documentos acompanham
     ------------------------------------------------------------------ */
  let ultimaLista = null;
  const _load = loadColaboradores;
  loadColaboradores = async function(){
    const r = await _load.apply(this, arguments);
    ultimaLista = (r||[]).map(p=>p.nome||p);
    return r;
  };
  const _save = saveColaboradores;
  saveColaboradores = async function(list){
    const antes = ultimaLista;
    const r = await _save.apply(this, arguments);
    try{
      const depois = (list||[]).map(p=>p.nome||p);
      if(isAdmin && antes && antes.length===depois.length){
        for(let i=0;i<depois.length;i++){
          if(antes[i]!==depois[i] && chaveColab(antes[i])!==chaveColab(depois[i]) && meta[chaveColab(antes[i])]){
            await moverDocumentos(chaveColab(antes[i]), chaveColab(depois[i]), depois[i]);
          }
        }
      }
      ultimaLista = depois;
    }catch(e){ console.warn('[Docs] não foi possível mover documentos do colaborador renomeado', e); }
    return r;
  };

  /* ------------------------------------------------------------------
     Interface
     ------------------------------------------------------------------ */
  const style = document.createElement('style');
  style.textContent = `
    .ed-btn{background:none;border:1px solid var(--line);color:var(--teal-bright);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer;margin-right:6px;font-family:inherit;white-space:nowrap}
    .ed-btn.on{background:rgba(63,214,201,.12);border-color:var(--teal)}
    .ed-box{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:2px 0 6px}
    .ed-box table{width:100%;border-collapse:collapse;font-size:12.5px}
    .ed-box th{text-align:left;font-size:11px;color:var(--text-dim);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
    .ed-box td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
    .ed-box tr:last-child td{border-bottom:none}
    .ed-act{background:none;border:none;cursor:pointer;font-size:12.5px;padding:2px 6px;font-family:inherit;font-weight:600}
    .ed-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
    .ed-form select,.ed-form input[type=text]{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:8px;font-size:13px;font-family:inherit}
    .ed-form input[type=file]{font-size:12.5px;color:var(--text-dim);max-width:260px}
    .ed-tipo{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:rgba(63,214,201,.12);color:var(--teal-bright)}
    @media (max-width:767px){ .ed-form > div{flex:1 1 100%} .ed-form select,.ed-form input[type=text]{width:100%;font-size:16px} .ed-hide-m{display:none} }
  `;
  document.head.appendChild(style);

  function htmlDocs(nome){
    const key = chaveColab(nome), docs = docsDe(key);
    const opts = tiposOrdenados(false).map(t=>`<option value="${esc(t.id)}">${esc(t.nome)}</option>`).join('');
    return `<div class="ed-box" data-ed-key="${esc(key)}">
      <div style="font-size:13px;font-weight:700;margin-bottom:6px;">📎 Documentação — ${esc(nome)}</div>
      ${docs.length ? `<div style="overflow-x:auto;"><table><thead><tr><th>Tipo</th><th>Arquivo</th><th class="ed-hide-m">Data</th><th style="text-align:right;">Ações</th></tr></thead><tbody>
        ${docs.map(d=>`<tr>
          <td><span class="ed-tipo">${esc(d.tipoNome)}</span>${d.descricao?`<div style="font-size:11.5px;margin-top:3px;">${esc(d.descricao)}</div>`:''}</td>
          <td style="word-break:break-all;">${esc(d.arquivoNome)} <span style="color:var(--text-dim);font-size:11px;">(${fmtTam(d.tamanho||0)})</span>
            ${d.substituidoEm?`<div style="font-size:11px;color:var(--text-dim);">substituído em ${fmtData(d.substituidoEm)}</div>`:''}</td>
          <td class="ed-hide-m" style="white-space:nowrap;">${fmtData(d.criadoEm)}<div style="font-size:11px;color:var(--text-dim);">${esc(d.criadoPor||'')}</div></td>
          <td style="text-align:right;white-space:nowrap;">
            <button class="ed-act" style="color:var(--teal-bright);" data-ed-ver="${esc(d.id)}">Visualizar</button>
            <button class="ed-act" style="color:var(--teal-bright);" data-ed-baixar="${esc(d.id)}">Baixar</button>
            <button class="ed-act" style="color:var(--amber);" data-ed-subst="${esc(d.id)}">Substituir</button>
            <button class="ed-act" style="color:var(--bad);" data-ed-del="${esc(d.id)}">Excluir</button>
          </td></tr>`).join('')}
      </tbody></table></div>` : '<div style="font-size:12.5px;color:var(--text-dim);">Nenhum documento cadastrado.</div>'}
      <button class="btn small secondary" data-ed-novo style="margin-top:10px;">+ Adicionar documento</button>
      <div class="ed-form" data-ed-form style="display:none;">
        <div><label class="lbl-base">TIPO DE DOCUMENTO</label>
          <select data-ed-tipo><option value="">— Selecionar —</option>${opts}<option value="${OUTROS}">Outros</option></select></div>
        <div data-ed-descrow style="display:none;flex:1;min-width:200px;"><label class="lbl-base">DESCRIÇÃO</label>
          <input type="text" data-ed-desc maxlength="80" placeholder="Informe o nome do documento/treinamento" style="width:100%;"></div>
        <div><label class="lbl-base">ARQUIVO</label><input type="file" data-ed-arq accept=".pdf,image/*,.doc,.docx,.xls,.xlsx"></div>
        <div style="display:flex;gap:8px;">
          <button class="btn small" data-ed-salvar>Salvar documento</button>
          <button class="btn small secondary" data-ed-cancelar>Cancelar</button>
        </div>
        <div data-ed-err style="flex-basis:100%;font-size:12px;color:var(--bad);min-height:14px;"></div>
      </div>
      <input type="file" data-ed-substarq accept=".pdf,image/*,.doc,.docx,.xls,.xlsx" style="display:none;">
    </div>`;
  }

  function ligarBox(td, nome){
    const box = td.querySelector('.ed-box'); const key = chaveColab(nome);
    const q = s => box.querySelector(s);
    q('[data-ed-novo]').onclick = ()=>{ q('[data-ed-form]').style.display='flex'; q('[data-ed-novo]').style.display='none'; };
    q('[data-ed-cancelar]').onclick = ()=>{ q('[data-ed-form]').style.display='none'; q('[data-ed-novo]').style.display=''; };
    q('[data-ed-tipo]').onchange = e=>{ q('[data-ed-descrow]').style.display = e.target.value===OUTROS ? 'block' : 'none'; };
    q('[data-ed-salvar]').onclick = async ()=>{
      const err = q('[data-ed-err]'); err.textContent = '';
      const tipo = q('[data-ed-tipo]').value, desc = q('[data-ed-desc]').value.trim(), file = q('[data-ed-arq]').files[0];
      if(!tipo){ err.textContent = 'Selecione o tipo de documento.'; return; }
      if(tipo===OUTROS && !desc){ err.textContent = 'Informe a descrição do documento/treinamento.'; return; }
      if(!file){ err.textContent = 'Selecione o arquivo.'; return; }
      const b = q('[data-ed-salvar]'); b.disabled = true; b.textContent = 'Enviando...';
      try{ await salvarDocumento(nome, tipo, desc, file); redesenhar(td, nome); atualizarContador(nome); }
      catch(e){ err.textContent = '❌ '+(e.message||'Não foi possível salvar.'); b.disabled = false; b.textContent = 'Salvar documento'; }
    };
    box.querySelectorAll('[data-ed-ver]').forEach(b=>b.onclick = ()=>abrirDocumento(key, b.dataset.edVer, false));
    box.querySelectorAll('[data-ed-baixar]').forEach(b=>b.onclick = ()=>abrirDocumento(key, b.dataset.edBaixar, true));
    box.querySelectorAll('[data-ed-del]').forEach(b=>b.onclick = async ()=>{
      const d = meta[key][b.dataset.edDel];
      if(!confirm('Excluir o documento "'+(d.descricao||d.tipoNome)+' — '+d.arquivoNome+'" de '+nome+'?\nEsta ação não pode ser desfeita.')) return;
      try{ await excluirDocumento(key, b.dataset.edDel); redesenhar(td, nome); atualizarContador(nome); }
      catch(e){ alert('❌ '+(e.message||'Não foi possível excluir.')); }
    });
    const inpSub = q('[data-ed-substarq]');
    box.querySelectorAll('[data-ed-subst]').forEach(b=>b.onclick = ()=>{ inpSub.dataset.alvo = b.dataset.edSubst; inpSub.value=''; inpSub.click(); });
    inpSub.onchange = async ()=>{
      const file = inpSub.files[0], id = inpSub.dataset.alvo; if(!file || !id) return;
      const d = meta[key][id];
      if(!confirm('Substituir "'+d.arquivoNome+'" por "'+file.name+'"?')) return;
      try{ await substituirDocumento(key, id, file); redesenhar(td, nome); }
      catch(e){ alert('❌ '+(e.message||'Não foi possível substituir.')); }
    };
  }
  function redesenhar(td, nome){ td.innerHTML = htmlDocs(nome); ligarBox(td, nome); }
  function atualizarContador(nome){
    const n = docsDe(chaveColab(nome)).length;
    document.querySelectorAll('[data-ed-toggle]').forEach(b=>{ if(b.dataset.edNome===nome) b.textContent = '📎 Documentos ('+n+')'; });
  }

  function alternar(btn, tr, nome){
    const prox = tr.nextElementSibling;
    if(prox && prox.classList.contains('ed-row')){ prox.remove(); btn.classList.remove('on'); abertos.delete(nome); return; }
    const row = document.createElement('tr');
    row.className = 'ed-row';
    const td = document.createElement('td'); td.colSpan = tr.children.length || 5; td.style.padding = '0 12px 10px';
    row.appendChild(td); tr.after(row);
    redesenhar(td, nome); btn.classList.add('on'); abertos.add(nome);
  }

  /* ---------- Tipos de documento (configuráveis) ---------- */
  function abrirTipos(){
    document.getElementById('edTiposModal')?.remove();
    const ov = document.createElement('div');
    ov.id = 'edTiposModal';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';
    const desenhar = ()=>{
      const lista = tiposOrdenados(true);
      ov.innerHTML = `<div style="background:var(--panel);border:1px solid var(--teal);border-radius:14px;padding:22px;max-width:460px;width:100%;max-height:90vh;overflow-y:auto;">
        <div style="font-size:16px;font-weight:700;margin-bottom:4px;">⚙️ Tipos de documento</div>
        <div style="font-size:12.5px;color:var(--text-dim);margin-bottom:14px;">Tipos disponíveis em "Adicionar documento". "Outros" está sempre disponível, com descrição livre.</div>
        ${lista.map(t=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);">
          <div style="flex:1;font-size:13.5px;${t.ativo===false?'opacity:.5;text-decoration:line-through;':''}">${esc(t.nome)}</div>
          <button class="btn small secondary" data-tp="${esc(t.id)}" style="${t.ativo===false?'color:var(--ok);border-color:var(--ok);':'color:var(--bad);border-color:var(--bad);'}">${t.ativo===false?'Reativar':'Inativar'}</button></div>`).join('')}
        <div style="display:flex;gap:8px;margin-top:14px;">
          <input type="text" id="edTpNovo" maxlength="60" placeholder="Novo tipo (ex.: NR-35, ASO)" class="inp-base" style="flex:1;">
          <button class="btn small" id="edTpAdd">Adicionar</button></div>
        <div id="edTpErr" style="font-size:12px;color:var(--bad);min-height:16px;margin-top:6px;"></div>
        <button class="btn secondary" id="edTpFechar" style="width:100%;margin-top:6px;">Fechar</button></div>`;
      ov.querySelector('#edTpFechar').onclick = ()=>{ ov.remove(); document.querySelectorAll('.ed-row td').forEach(td=>{ const n = td.closest('tr').previousElementSibling?.querySelector('[data-ed-toggle]')?.dataset.edNome; if(n) redesenhar(td, n); }); };
      ov.querySelector('#edTpAdd').onclick = async ()=>{
        const nome = ov.querySelector('#edTpNovo').value.replace(/\s+/g,' ').trim(), err = ov.querySelector('#edTpErr');
        if(!nome){ err.textContent = 'Informe o nome do tipo.'; return; }
        if(norm(nome)==='outros' || Object.values(tipos).some(t=>norm(t.nome)===norm(nome))){ err.textContent = 'Esse tipo já existe.'; return; }
        const id = 't'+Date.now().toString(36);
        const ordem = Math.max(0, ...Object.values(tipos).map(t=>t.ordem||0)) + 1;
        try{ await withTimeout(BASE().child('tipos/'+id).set({nome, ativo:true, ordem, criadoPor:quem(), criadoEm:Date.now()}), 15000); tipos[id] = {nome, ativo:true, ordem}; desenhar(); }
        catch(e){ err.textContent = '❌ Não foi possível salvar.'; }
      };
      ov.querySelectorAll('[data-tp]').forEach(b=>b.onclick = async ()=>{
        const id = b.dataset.tp, ativo = tipos[id].ativo===false;
        try{ await withTimeout(BASE().child('tipos/'+id+'/ativo').set(ativo), 15000); tipos[id].ativo = ativo; desenhar(); }
        catch(e){ alert('❌ Não foi possível alterar.'); }
      });
    };
    desenhar();
    document.body.appendChild(ov);
    ov.addEventListener('click', e=>{ if(e.target===ov) ov.querySelector('#edTpFechar').click(); });
  }

  /* ---------- Documentos sem colaborador (excluído/renomeado fora do ✏️) ---------- */
  function htmlOrfaos(nomesAtuais){
    const keysAtuais = new Set(nomesAtuais.map(chaveColab));
    const orf = Object.keys(meta).filter(k=>!keysAtuais.has(k) && Object.keys(meta[k]||{}).length);
    if(!orf.length) return '';
    const opts = nomesAtuais.slice().sort((a,b)=>a.localeCompare(b,'pt-BR')).map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');
    return `<div class="ed-box" style="margin-top:14px;border-color:rgba(227,179,65,.4);">
      <div style="font-size:13px;font-weight:700;color:var(--amber);margin-bottom:4px;">⚠️ Documentos sem colaborador vinculado</div>
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;">O colaborador foi removido ou teve o nome alterado. Os documentos foram preservados — vincule-os ao colaborador correto.</div>
      ${orf.map(k=>{ const docs = docsDe(k); const nome = docs[0]?.colaborador || k;
        return `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line);">
          <div style="flex:1;min-width:180px;font-size:13px;"><b>${esc(nome)}</b> — ${docs.length} documento(s)</div>
          <select data-orf-sel="${esc(k)}" class="inp-base" style="width:auto;min-width:200px;"><option value="">Vincular a…</option>${opts}</select>
          <button class="btn small" data-orf-ok="${esc(k)}">Vincular</button></div>`; }).join('')}
    </div>`;
  }

  /* ---------- Injeção na tela Efetivo Contratado ---------- */
  async function injetar(){
    if(!isAdmin) return;
    const painel = document.getElementById('efPanel-contratado'); if(!painel) return;
    const linhas = [...painel.querySelectorAll('tr[id^="colab-row-"]')];
    if(!linhas.length) return;
    try{ await carregar(); }catch(e){ console.warn('[Docs] não foi possível carregar a documentação', e); return; }
    if(!document.body.contains(painel)) return;

    const filtros = painel.querySelector('[data-filter-status]')?.parentElement;
    if(filtros && !document.getElementById('edBarra')){
      const bar = document.createElement('div');
      bar.id = 'edBarra';
      bar.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:-4px 0 12px;font-size:12.5px;color:var(--text-dim);';
      bar.innerHTML = '<span>📎 Use “Documentos” em cada colaborador para anexar Ficha de EPI, NR-12, treinamentos e outros.</span><button class="btn small secondary" id="edBtnTipos">⚙️ Tipos de documento</button>';
      filtros.after(bar);
      bar.querySelector('#edBtnTipos').onclick = abrirTipos;
      painel.querySelectorAll('[data-filter-status]').forEach(b=>b.addEventListener('click', ()=>{
        painel.querySelectorAll('.ed-row').forEach(r=>r.remove());
        painel.querySelectorAll('[data-ed-toggle]').forEach(x=>x.classList.remove('on'));
        abertos.clear();
      }));
    }
    const nomes = [];
    linhas.forEach(tr=>{
      const nome = (tr.querySelector('td')?.textContent||'').trim(); if(!nome) return;
      nomes.push(nome);
      const acoes = tr.querySelector('[data-editcolab]')?.parentElement;
      if(!acoes || acoes.querySelector('[data-ed-toggle]')) return;
      const b = document.createElement('button');
      b.className = 'ed-btn'; b.dataset.edToggle = '1'; b.dataset.edNome = nome;
      b.textContent = '📎 Documentos ('+docsDe(chaveColab(nome)).length+')';
      b.onclick = ()=>alternar(b, tr, nome);
      acoes.insertBefore(b, acoes.firstChild);
      if(abertos.has(nome)) alternar(b, tr, nome);
    });
    const tabela = linhas[0].closest('div[style*="overflow-x"]') || linhas[0].closest('table');
    document.getElementById('edOrfaos')?.remove();
    const orfHtml = htmlOrfaos(nomes);
    if(orfHtml && tabela){
      const w = document.createElement('div'); w.id = 'edOrfaos'; w.innerHTML = orfHtml; tabela.after(w);
      w.querySelectorAll('[data-orf-ok]').forEach(b=>b.onclick = async ()=>{
        const k = b.dataset.orfOk, alvo = w.querySelector(`[data-orf-sel="${CSS.escape(k)}"]`).value;
        if(!alvo){ alert('Escolha o colaborador.'); return; }
        try{ await moverDocumentos(k, chaveColab(alvo), alvo); renderEfetivo(); }
        catch(e){ alert('❌ Não foi possível vincular.'); }
      });
    }
  }

  if(typeof renderEfetivo === 'function'){
    const _orig = renderEfetivo;
    renderEfetivo = async function(){
      const r = await _orig.apply(this, arguments);
      try{ await injetar(); }catch(e){ console.error('[Docs]', e); }
      return r;
    };
  }
})();
</script>
<!-- ===== Dimensionamento de Efetivo (cadastro administrativo) ===== -->
<script>
/* =====================================================================
   DIMENSIONAMENTO DE EFETIVO — efetivo PREVISTO por turno (parametrizável)
   ---------------------------------------------------------------------
   Antes: TURNO_PREVISTO = {T1D:11, T1N:10, T2D:11, T2N:10} fixo no código.
   Agora: cadastro administrativo (mesmo padrão do cadastro de Áreas).

   banco de dados (mesmo banco/projeto):
     sistema_limpeza/efetivoDim/turnos/{chave}
         { nome, ordem, paridade:'par'|'impar'|'todos', periodo:'dia'|'noite',
           periodos:[{de:'AAAA-MM-DD', ate:'AAAA-MM-DD'|(ausente = em aberto)}] }
     sistema_limpeza/efetivoDim/vig/{chave}/{AAAA-MM-DD}
         { padrao:<inteiro>, dias:{d0..d6:<inteiro>}  (opcional, 0=Dom), salvoEm, salvoPor }
     sistema_limpeza/efetivoDimLog/{pushId}     (trilha: anterior × novo × vigência × usuário)

   Vigência: o previsto de uma data usa a última versão com data <= aquela
   data. Cada lançamento de efetivo também guarda uma cópia do previsto usado
   (_previsto), então mudar o dimensionamento NUNCA altera lançamentos já
   feitos. Nada é excluído: turnos só são desativados (período encerrado).

   Migração: sem cadastro no banco, vale o valor original do código
   (T1D 11 · T1N 10 · T2D 11 · T2N 10) como vigência "desde o início";
   ao abrir a tela pela 1ª vez, o admin grava essa base 1 vez só (transação).
   ===================================================================== */
(function(){
  'use strict';
  /* Diagnóstico: abra o sistema com ?semdim=1 para desligar este módulo por completo. */
  if(new URLSearchParams(location.search).get('semdim')==='1'){ console.warn('[Dimensionamento] desligado por ?semdim=1'); return; }
  try{
  const KIOSK = (()=>{ const p = new URLSearchParams(location.search); return p.get('tab')==='requests' || p.get('kiosk')==='1'; })();
  const BASE = fbRoot.child('efetivoDim');
  const LOG = fbRoot.child('efetivoDimLog');
  const BASELINE = '2000-01-01';
  const DIA_ABREV = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const PARIDADE_LBL = {par:'Dias pares', impar:'Dias ímpares', todos:'Todos os dias'};
  const PERIODO_LBL = {dia:'Diurno', noite:'Noturno'};
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
  const hojeOp = () => dateStr(getOperationalDate());
  const quem = () => (typeof currentUser!=='undefined' && currentUser && currentUser.nome) || (typeof currentEmployee!=='undefined' && currentEmployee) || 'Administrador';
  const fmtDs = ds => ds ? ds.split('-').reverse().join('/') : '—';
  const partes = ds => ds.split('-').map(Number);
  const wdOf = ds => { const [y,m,d] = partes(ds); return new Date(y, m-1, d).getDay(); };
  const diaAnterior = ds => { const [y,m,d] = partes(ds); return dateStr(new Date(y, m-1, d-1)); };
  const clone = o => JSON.parse(JSON.stringify(o));

  /* ---------- base original (valores que estavam no código) ---------- */
  const SEED = [
    {key:'T1D', paridade:'par',   periodo:'dia'},
    {key:'T1N', paridade:'par',   periodo:'noite'},
    {key:'T2D', paridade:'impar', periodo:'dia'},
    {key:'T2N', paridade:'impar', periodo:'noite'},
  ];
  function seedRaw(quemSalvou){
    const raw = {turnos:{}, vig:{}};
    SEED.forEach((s,i)=>{
      raw.turnos[s.key] = {nome:TURNO_LABELS_PADRAO[s.key], ordem:i, paridade:s.paridade, periodo:s.periodo, periodos:[{de:BASELINE}], criadoEm:Date.now(), criadoPor:quemSalvou};
      raw.vig[s.key] = {}; raw.vig[s.key][BASELINE] = {padrao:TURNO_PREVISTO_PADRAO[s.key], salvoEm:Date.now(), salvoPor:quemSalvou};
    });
    return raw;
  }
  function normalizar(raw){
    const turnos = {}, vig = {};
    Object.keys(raw.turnos||{}).forEach(k=>{
      const t = raw.turnos[k]||{};
      const per = Array.isArray(t.periodos) ? t.periodos : Object.values(t.periodos||{});
      turnos[k] = {key:k, nome:t.nome||k, ordem:+t.ordem||0, paridade:t.paridade||'todos', periodo:t.periodo||'dia',
                   periodos:per.filter(Boolean).map(p=>({de:p.de, ate:p.ate||null}))};
    });
    Object.keys(raw.vig||{}).forEach(k=>{
      vig[k] = {};
      Object.keys(raw.vig[k]||{}).forEach(ds=>{
        const v = raw.vig[k][ds]||{}, dias = {};
        Object.keys(v.dias||{}).forEach(dk=>{ const n = parseInt(v.dias[dk],10); if(/^d[0-6]$/.test(dk) && Number.isInteger(n) && n>=0) dias[+dk.slice(1)] = n; });
        vig[k][ds] = {padrao:Math.max(0, parseInt(v.padrao,10)||0), dias, salvoEm:v.salvoEm, salvoPor:v.salvoPor};
      });
    });
    return {turnos, vig};
  }

  let cache = normalizar(seedRaw('(valores do código)'));
  let persistido = false;
  let resolvePronto; const pronto = new Promise(r=>{ resolvePronto = r; });
  const aoMudar = [];
  const aguardar = () => Promise.race([pronto, new Promise(r=>setTimeout(r, 2500))]);   // espera no máximo 2,5 s

  /* ---------- consultas (síncronas, usadas pelos cálculos) ---------- */
  const listaTurnos = () => Object.values(cache.turnos).sort((a,b)=>(a.ordem-b.ordem)||a.key.localeCompare(b.key));
  function vigenciaDe(tk, ds){
    const vs = cache.vig[tk]; if(!vs) return null;
    const datas = Object.keys(vs).sort(); if(!datas.length) return null;
    let sel = null; for(const d of datas){ if(d<=ds) sel = d; else break; }
    return sel || datas[0];                       // antes da 1ª versão vale a 1ª (base migrada)
  }
  function previsto(tk, ds){
    const d = vigenciaDe(tk, ds);
    if(!d) return TURNO_PREVISTO_PADRAO[tk] || 0;
    const v = cache.vig[tk][d], o = v.dias && v.dias[wdOf(ds)];
    return Number.isInteger(o) ? o : v.padrao;
  }
  function ativoEm(tk, ds){
    const t = cache.turnos[tk]; if(!t) return !!TURNO_LABELS_PADRAO[tk];
    return t.periodos.some(p=>p.de<=ds && (!p.ate || ds<=p.ate));
  }
  function nome(tk){ const t = cache.turnos[tk]; return t ? t.nome : null; }
  function turnosDoDia(date){
    const ds = dateStr(date||currentDate), par = (date||currentDate).getDate()%2===0;
    if(!Object.keys(cache.turnos).length) return activeTurns(date);
    return listaTurnos().filter(t=>ativoEm(t.key, ds) && (t.paridade==='todos' || (t.paridade==='par')===par))
                        .map(t=>({key:t.key, label:t.nome}));
  }
  const grupoManha = k => { const t = cache.turnos[k]; return t ? (t.periodo==='dia'?'T1':'T2') : ((k==='T1D'||k==='T2D')?'T1':'T2'); };
  const grupoPar   = k => { const t = cache.turnos[k]; return (k==='T1D'||k==='T1N') ? 'T1' : ((k==='T2D'||k==='T2N') ? 'T2' : (t && t.paridade==='par' ? 'T1' : 'T2')); };
  /* Guarda, no próprio lançamento, o previsto usado — o histórico nunca muda retroativamente. */
  function snapshot(ds, data){
    if(!data || typeof data!=='object') return;
    const ks = Array.isArray(data._turnos) ? data._turnos : Object.keys(data).filter(k=>Array.isArray(data[k]));
    if(!data._previsto || typeof data._previsto!=='object') data._previsto = {};
    ks.forEach(k=>{ if(data._previsto[k]==null) data._previsto[k] = previsto(k, ds); });
  }
  function descVig(tk, ds){
    const d = vigenciaDe(tk, ds); if(!d) return '—';
    const v = cache.vig[tk][d], ex = Object.keys(v.dias||{}).map(Number).sort().filter(i=>v.dias[i]!==v.padrao);
    return v.padrao + (ex.length ? ' ('+ex.map(i=>DIA_ABREV[i]+' '+v.dias[i]).join(', ')+')' : '');
  }

  /* ---------- carregamento (tempo real) ---------- */
  function receber(snap){
    try{
      const v = snap && snap.val();
      if(v && v.turnos){ cache = normalizar(v); persistido = true; }
      else { cache = normalizar(seedRaw('(valores do código)')); persistido = false; }
    }catch(e){ console.warn('[Dimensionamento] cadastro ilegível, usando valores originais', e); cache = normalizar(seedRaw('(valores do código)')); persistido = false; }
    resolvePronto(); aoMudar.forEach(f=>{ try{ f(); }catch(e){} });
  }
  if(KIOSK){ resolvePronto(); }
  else {
    try{ BASE.on('value', receber, ()=>{ resolvePronto(); }); }catch(e){ resolvePronto(); }
    setTimeout(resolvePronto, 6000);
  }

  /* ---------- gravação (somente Admin; as regras do banco de dados também exigem) ---------- */
  function exigirAdmin(){ if(!isAdmin) throw new Error('Acesso restrito ao administrador.'); }
  async function garantirBase(){
    if(persistido) return;
    const r = await BASE.transaction(cur => cur===null ? seedRaw('Migração (valores do código)') : undefined);
    if(r.committed){
      await LOG.push({ts:Date.now(), usuario:quem(), turno:'*', turnoNome:'Todos', acao:'migracao',
                      para:SEED.map(s=>TURNO_LABELS_PADRAO[s.key]+': '+TURNO_PREVISTO_PADRAO[s.key]).join(' · '), desde:BASELINE});
    }
    const s = await BASE.get(); receber(s);
  }
  const reInt = /^\d{1,4}$/;
  function validarNome(n, ignorarKey){
    n = String(n||'').replace(/\s+/g,' ').trim();
    if(!n) throw new Error('Informe o nome do turno.');
    if(n.length>60) throw new Error('O nome do turno pode ter no máximo 60 caracteres.');
    if(/[<>"'`&\\]/.test(n)) throw new Error('O nome não pode conter < > " \' ` & \\.');
    if(listaTurnos().some(t=>t.key!==ignorarKey && norm(t.nome)===norm(n))) throw new Error('Já existe um turno com esse nome.');
    return n;
  }
  function validarQtd(v, rotulo){
    const s = String(v==null?'':v).trim();
    if(!reInt.test(s)) throw new Error(rotulo+': informe um número inteiro maior ou igual a zero (ex.: 11).');
    return parseInt(s,10);
  }
  function validarDesde(ds){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(String(ds||''))) throw new Error('Informe a data de início da vigência.');
    if(ds < hojeOp()) throw new Error('A vigência não pode começar antes de hoje ('+fmtDs(hojeOp())+'): os dias anteriores não são alterados.');
    return ds;
  }
  function novaChave(){ return 'X'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,4).toUpperCase(); }

  /* dados = {key?, nome, paridade?, periodo?, padrao, dias:{0..6:valor|''}, desde} */
  async function salvarTurno(dados){
    exigirAdmin();
    await garantirBase();
    const existente = dados.key ? cache.turnos[dados.key] : null;
    if(dados.key && !existente) throw new Error('Turno não encontrado.');
    const nomeNovo = validarNome(dados.nome, dados.key);
    const padrao = validarQtd(dados.padrao, 'Efetivo previsto');
    const dias = {};
    Object.keys(dados.dias||{}).forEach(i=>{
      const raw = dados.dias[i]; if(raw===''||raw==null) return;
      const n = validarQtd(raw, 'Efetivo de '+DIA_ABREV[+i]); if(n!==padrao) dias[+i] = n;
    });
    const desde = validarDesde(dados.desde);
    const key = existente ? existente.key : novaChave();
    const up = {}, logs = [];
    const novoTexto = padrao + (Object.keys(dias).length ? ' ('+Object.keys(dias).map(Number).sort().map(i=>DIA_ABREV[i]+' '+dias[i]).join(', ')+')' : '');

    if(!existente){
      if(!PARIDADE_LBL[dados.paridade]) throw new Error('Escolha em quais dias o turno se aplica.');
      if(!PERIODO_LBL[dados.periodo]) throw new Error('Escolha se o turno é diurno ou noturno.');
      const ordem = Math.max(-1, ...listaTurnos().map(t=>t.ordem)) + 1;
      up['turnos/'+key] = {nome:nomeNovo, ordem, paridade:dados.paridade, periodo:dados.periodo, periodos:[{de:desde}], criadoEm:Date.now(), criadoPor:quem()};
      logs.push({acao:'criou_turno', turno:key, turnoNome:nomeNovo, de:'—', para:novoTexto, desde});
    } else {
      if(nomeNovo!==existente.nome){
        up['turnos/'+key+'/nome'] = nomeNovo;
        logs.push({acao:'renomeou', turno:key, turnoNome:nomeNovo, de:existente.nome, para:nomeNovo, desde:hojeOp()});
      }
    }
    const antesTxt = existente ? descVig(key, desde) : '—';
    if(existente){
      const mudou = previsto0(existente.key, desde) !== padrao || JSON.stringify(dias) !== JSON.stringify(diasDe(key, desde));
      if(mudou) logs.push({acao:'alterou_previsto', turno:key, turnoNome:nomeNovo, de:antesTxt, para:novoTexto, desde});
      if(!mudou && !logs.length) throw new Error('Nenhuma alteração para salvar.');
    }
    const gravaVig = !existente || logs.some(l=>l.acao==='alterou_previsto');
    if(gravaVig){
      if(desde <= hojeOp()) await congelarHoje(key);      // não altera lançamentos de hoje já feitos
      const v = {padrao, salvoEm:Date.now(), salvoPor:quem()};
      if(Object.keys(dias).length){ v.dias = {}; Object.keys(dias).forEach(i=>{ v.dias['d'+i] = dias[i]; }); }
      up['vig/'+key+'/'+desde] = v;
    }
    await BASE.update(up);
    for(const l of logs) await LOG.push(Object.assign({ts:Date.now(), usuario:quem()}, l));
    return key;
  }
  const previsto0 = (tk, ds) => previsto(tk, ds);
  const diasDe = (tk, ds) => { const d = vigenciaDe(tk, ds); return d ? Object.assign({}, cache.vig[tk][d].dias) : {}; };
  /* Antes de uma vigência começar hoje: grava o previsto antigo nos lançamentos de hoje que ainda não o guardavam. */
  async function congelarHoje(tk){
    try{
      const ds = hojeOp(), s = await window.storage.get('efetivo:'+ds, true);
      if(!s) return; const data = JSON.parse(s.value);
      if(data && data._previsto && data._previsto[tk]!=null) return;
      if(!data || !Array.isArray(data[tk])) return;
      snapshot(ds, data); await window.storage.set('efetivo:'+ds, JSON.stringify(data), true);
    }catch(e){ console.warn('[Dimensionamento] congelarHoje', e); }
  }

  async function alternarAtivo(key, ativar, desdeStr){
    exigirAdmin(); await garantirBase();
    const t = cache.turnos[key]; if(!t) throw new Error('Turno não encontrado.');
    const desde = validarDesde(desdeStr);
    const per = t.periodos.map(p=>({de:p.de, ate:p.ate||null}));
    const ult = per[per.length-1];
    if(ativar){
      if(ult && !ult.ate) throw new Error('O turno já está ativo.');
      if(ult && ult.ate && desde<=ult.ate) throw new Error('A reativação deve começar depois de '+fmtDs(ult.ate)+'.');
      per.push({de:desde});
    } else {
      if(!ult || ult.ate) throw new Error('O turno já está inativo.');
      if(desde<=ult.de) throw new Error('O turno começou em '+fmtDs(ult.de)+'. Escolha uma data posterior.');
      ult.ate = diaAnterior(desde);
    }
    await BASE.child('turnos/'+key+'/periodos').set(per);
    await LOG.push({ts:Date.now(), usuario:quem(), acao:ativar?'ativou':'desativou', turno:key, turnoNome:t.nome,
                    de:ativar?'Inativo':'Ativo', para:ativar?'Ativo':'Inativo', desde});
  }
  async function listarLog(){ const s = await LOG.limitToLast(200).get(); const o = s.val()||{}; return Object.keys(o).map(k=>o[k]).sort((a,b)=>(b.ts||0)-(a.ts||0)); }

  window.efDim = {pronto, aguardar, previsto, vigenciaDe, ativoEm, nome, turnosDoDia, grupoManha, grupoPar, snapshot, descVig,
                  turnos:listaTurnos, salvarTurno, alternarAtivo, listarLog, hoje:hojeOp, aoMudar, get persistido(){ return persistido; }, garantirBase};

  /* Os consumidores sempre esperam o cadastro carregar antes de ler os lançamentos. */
  const _le = loadEfetivo;
  loadEfetivo = async function(){ try{ await aguardar(); }catch(e){} return _le.apply(this, arguments); };

  /* ------------------------------------------------------------------
     Tela administrativa
     ------------------------------------------------------------------ */
  const style = document.createElement('style');
  style.textContent = `
    .dm-st{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
    .dm-st.on{background:rgba(76,175,110,.18);color:var(--ok)} .dm-st.off{background:rgba(255,255,255,.08);color:var(--text-dim)}
    .dm-num{font-size:18px;font-weight:800} .dm-sub{font-size:11.5px;color:var(--text-dim);margin-top:2px}
    tr.dm-inativo td{opacity:.55}
    .dm-dias{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
    .dm-dias div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--text-dim)}
    .dm-dias input{width:100%;text-align:center}
  `;
  document.head.appendChild(style);

  async function renderDimensionamento(){
    const app = document.getElementById('app');
    if(!isAdmin){ app.innerHTML = '<div class="empty-state" style="margin-top:40px;">⛔ Acesso restrito ao administrador.</div>'; return; }
    app.innerHTML = `
      <div style="max-width:1100px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px;">
          <div><div style="font-size:18px;font-weight:700;">📐 Dimensionamento de Efetivo</div>
            <div style="font-size:13px;color:var(--text-dim);margin-top:2px;">Efetivo previsto por turno, usado na aba Efetivo e nos relatórios de aderência e absenteísmo. Alterações valem a partir da data escolhida; os dias anteriores e os lançamentos já feitos não mudam.</div></div>
          <button class="btn" id="dmNovo">+ Novo turno</button>
        </div>
        <div id="dmLista"><div class="loading">Carregando dimensionamento...</div></div>
        <div style="font-size:16px;font-weight:700;margin:26px 0 8px;">🕘 Histórico de alterações</div>
        <div id="dmHist"><div class="loading">Carregando histórico...</div></div>
      </div>`;
    document.getElementById('dmNovo').onclick = ()=>abrirModal(null);
    await pronto;
    try{ await garantirBase(); }catch(e){ console.warn('[Dimensionamento] base', e); }
    desenhar(); desenharHistorico();
  }
  function proximaVig(tk, ds){ const ds2 = Object.keys(cache.vig[tk]||{}).sort().find(d=>d>ds); return ds2 ? {desde:ds2, txt:descVig(tk, ds2)} : null; }

  function desenhar(){
    const out = document.getElementById('dmLista'); if(!out) return;
    const hoje = hojeOp(), ts = listaTurnos();
    if(!ts.length){ out.innerHTML = '<div class="empty-state">Nenhum turno cadastrado.</div>'; return; }
    out.innerHTML = `
      ${persistido ? '' : '<div style="background:rgba(227,179,65,.1);border:1px solid rgba(227,179,65,.3);border-radius:8px;padding:10px 14px;font-size:12px;color:#e3b341;margin-bottom:12px;">Exibindo os valores originais do sistema (T1 Par 11 · T2 Par 10 · T1 Ímpar 11 · T2 Ímpar 10). Eles serão gravados no cadastro automaticamente.</div>'}
      <div class="tablewrap"><table class="report-table">
        <thead><tr><th>Turno</th><th>Aplica-se a</th><th>Efetivo previsto</th><th>Vigência atual</th><th>Status</th><th style="text-align:right;">Ações</th></tr></thead>
        <tbody>${ts.map(t=>{
          const at = ativoEm(t.key, hoje), vd = vigenciaDe(t.key, hoje), prox = proximaVig(t.key, hoje);
          const ult = t.periodos[t.periodos.length-1];
          const aviso = ult && ult.ate && ult.ate>=hoje ? `<div class="dm-sub">Encerra em ${fmtDs(ult.ate)}</div>` : '';
          return `<tr class="${at?'':'dm-inativo'}">
            <td><div style="font-weight:600;">${esc(t.nome)}</div><div class="dm-sub">${PERIODO_LBL[t.periodo]||''}</div></td>
            <td>${PARIDADE_LBL[t.paridade]||'—'}</td>
            <td><div class="dm-num">${esc(descVig(t.key, hoje))}</div>${prox?`<div class="dm-sub">Próxima: ${esc(prox.txt)} a partir de ${fmtDs(prox.desde)}</div>`:''}</td>
            <td style="white-space:nowrap;">${vd===BASELINE?'<span style="color:var(--text-dim);">Desde o início</span>':'Desde '+fmtDs(vd)}</td>
            <td><span class="dm-st ${at?'on':'off'}">${at?'Ativo':'Inativo'}</span>${aviso}</td>
            <td style="text-align:right;white-space:nowrap;">
              <button class="btn small secondary" data-dm-edit="${esc(t.key)}">Editar</button>
              <button class="btn small secondary" data-dm-tog="${esc(t.key)}" style="${at?'color:var(--bad);border-color:var(--bad);':'color:var(--ok);border-color:var(--ok);'}">${at?'Desativar':'Reativar'}</button>
            </td></tr>`; }).join('')}</tbody></table></div>
      <div style="font-size:11.5px;color:var(--text-dim);margin-top:8px;">Turnos não são excluídos: ao desativar, os lançamentos anteriores continuam nos relatórios.</div>`;
    out.querySelectorAll('[data-dm-edit]').forEach(b=>b.onclick = ()=>abrirModal(b.getAttribute('data-dm-edit')));
    out.querySelectorAll('[data-dm-tog]').forEach(b=>b.onclick = ()=>abrirModalStatus(b.getAttribute('data-dm-tog')));
  }
  async function desenharHistorico(){
    const out = document.getElementById('dmHist'); if(!out) return;
    let log = []; try{ log = await listarLog(); }catch(e){ out.innerHTML = '<div class="empty-state">Não foi possível carregar o histórico.</div>'; return; }
    const ACAO = {criou_turno:'Novo turno', alterou_previsto:'Alterou previsto', renomeou:'Renomeou', ativou:'Reativou', desativou:'Desativou', migracao:'Base inicial (migração)'};
    out.innerHTML = log.length ? `<div class="tablewrap"><table class="report-table">
      <thead><tr><th>Data/hora</th><th>Usuário</th><th>Turno</th><th>Ação</th><th>Valor anterior</th><th>Valor novo</th><th>Vigência a partir de</th></tr></thead>
      <tbody>${log.map(l=>`<tr><td style="white-space:nowrap;">${l.ts?esc(fmtBRTime(new Date(l.ts))):'—'}</td><td>${esc(l.usuario||'—')}</td><td>${esc(l.turnoNome||'—')}</td>
        <td>${esc(ACAO[l.acao]||l.acao)}</td><td>${esc(l.de||'—')}</td><td>${esc(l.para||'—')}</td><td style="white-space:nowrap;">${l.desde===BASELINE?'Desde o início':fmtDs(l.desde)}</td></tr>`).join('')}</tbody></table></div>`
      : '<div class="empty-state">Nenhuma alteração registrada.</div>';
  }
  aoMudar.push(()=>{ if(document.getElementById('dmLista')){ desenhar(); } });

  function abrirModal(key){
    document.getElementById('dmModal')?.remove();
    const t = key ? cache.turnos[key] : null, hoje = hojeOp();
    const vd = t ? vigenciaDe(key, hoje) : null, v = t && vd ? cache.vig[key][vd] : null;
    const temDias = !!(v && Object.keys(v.dias||{}).length);
    const ov = document.createElement('div'); ov.id = 'dmModal';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';
    ov.innerHTML = `
      <div style="background:var(--panel);border:1px solid var(--teal);border-radius:14px;padding:22px;max-width:560px;width:100%;max-height:92vh;overflow-y:auto;">
        <div style="font-size:16px;font-weight:700;margin-bottom:14px;">${t?'✏️ Editar turno':'+ Novo turno'}</div>
        <div class="form-row"><label>Nome do turno *</label><input type="text" id="dmNome" maxlength="60" value="${esc(t?t.nome:'')}" placeholder="Ex.: T1 Ímpar (Diurno)"></div>
        ${t ? `<div style="font-size:12px;color:var(--text-dim);margin-bottom:10px;">${PARIDADE_LBL[t.paridade]} · ${PERIODO_LBL[t.periodo]}</div>` : `
        <div class="form-row"><label>Aplica-se a *</label><select id="dmParidade"><option value="">— Selecione —</option>${Object.keys(PARIDADE_LBL).map(k=>`<option value="${k}">${PARIDADE_LBL[k]}</option>`).join('')}</select></div>
        <div class="form-row"><label>Período do dia *</label><select id="dmPeriodo"><option value="">— Selecione —</option>${Object.keys(PERIODO_LBL).map(k=>`<option value="${k}">${PERIODO_LBL[k]}</option>`).join('')}</select>
          <div style="font-size:11.5px;color:var(--text-dim);">Define se entra em "T1 (Manhã)" ou "T2 (Noite)" nos relatórios.</div></div>`}
        <div class="form-row"><label>Efetivo previsto (todos os dias) *</label><input type="text" inputmode="numeric" id="dmPadrao" maxlength="4" value="${v?v.padrao:''}" placeholder="Ex.: 11"></div>
        <label style="display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer;margin-bottom:4px;"><input type="checkbox" id="dmUsaDias" ${temDias?'checked':''}> Definir efetivo diferente em dias da semana específicos</label>
        <div id="dmDiasBox" style="display:${temDias?'block':'none'};margin-bottom:10px;">
          <div class="dm-dias">${DIA_ABREV.map((d,i)=>`<div>${d}<input type="text" inputmode="numeric" maxlength="4" data-dm-dia="${i}" value="${v&&v.dias&&v.dias[i]!=null?v.dias[i]:''}" placeholder="igual"></div>`).join('')}</div>
          <div style="font-size:11.5px;color:var(--text-dim);margin-top:4px;">Deixe em branco os dias que seguem o valor geral.</div>
        </div>
        <div class="form-row"><label>Vigência a partir de *</label><input type="date" id="dmDesde" min="${hoje}" value="${hoje}">
          <div style="font-size:11.5px;color:var(--text-dim);">Valores anteriores a esta data e lançamentos já feitos permanecem como estão.${vd&&vd!==BASELINE?' Vigência atual: desde '+fmtDs(vd)+'.':''}</div></div>
        <div id="dmErr" style="color:var(--bad);font-size:12.5px;min-height:18px;margin-top:4px;"></div>
        <div style="display:flex;gap:10px;margin-top:6px;"><button class="btn" id="dmSalvar" style="flex:1;">Salvar</button><button class="btn secondary" id="dmCancelar" style="flex:1;">Cancelar</button></div>
      </div>`;
    document.body.appendChild(ov);
    const $ = id => ov.querySelector('#'+id);
    $('dmUsaDias').onchange = e=>{ $('dmDiasBox').style.display = e.target.checked ? 'block' : 'none'; };
    $('dmCancelar').onclick = ()=>ov.remove();
    $('dmSalvar').onclick = async ()=>{
      const btn = $('dmSalvar'), err = $('dmErr'); err.textContent = ''; btn.disabled = true; btn.textContent = 'Salvando...';
      const dias = {}; if($('dmUsaDias').checked) ov.querySelectorAll('[data-dm-dia]').forEach(i=>{ dias[i.getAttribute('data-dm-dia')] = i.value; });
      try{
        await salvarTurno({key:key||null, nome:$('dmNome').value, paridade:$('dmParidade')?.value, periodo:$('dmPeriodo')?.value, padrao:$('dmPadrao').value, dias, desde:$('dmDesde').value});
        ov.remove(); desenhar(); desenharHistorico();
      }catch(e){ err.textContent = '❌ '+(e.message||'Não foi possível salvar.'); btn.disabled = false; btn.textContent = 'Salvar'; }
    };
  }
  function abrirModalStatus(key){
    document.getElementById('dmModal')?.remove();
    const t = cache.turnos[key]; if(!t) return;
    const hoje = hojeOp(), ativar = !ativoEm(key, hoje) || (t.periodos.length && !!t.periodos[t.periodos.length-1].ate);
    const ov = document.createElement('div'); ov.id = 'dmModal';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';
    ov.innerHTML = `<div style="background:var(--panel);border:1px solid var(--teal);border-radius:14px;padding:22px;max-width:460px;width:100%;">
      <div style="font-size:16px;font-weight:700;margin-bottom:10px;">${ativar?'Reativar':'Desativar'} turno</div>
      <div style="font-size:13px;margin-bottom:12px;"><b>${esc(t.nome)}</b><br><span style="color:var(--text-dim);">${ativar?'O turno volta a aparecer no lançamento de efetivo a partir da data escolhida.':'O turno deixa de aparecer no lançamento de efetivo a partir da data escolhida. Os lançamentos anteriores são preservados.'}</span></div>
      <div class="form-row"><label>A partir de</label><input type="date" id="dmDesde" min="${hoje}" value="${hoje}"></div>
      <div id="dmErr" style="color:var(--bad);font-size:12.5px;min-height:18px;"></div>
      <div style="display:flex;gap:10px;"><button class="btn" id="dmOk" style="flex:1;">Confirmar</button><button class="btn secondary" id="dmCancelar" style="flex:1;">Cancelar</button></div></div>`;
    document.body.appendChild(ov);
    ov.querySelector('#dmCancelar').onclick = ()=>ov.remove();
    ov.querySelector('#dmOk').onclick = async ()=>{
      const err = ov.querySelector('#dmErr'); err.textContent = '';
      try{ await alternarAtivo(key, ativar, ov.querySelector('#dmDesde').value); ov.remove(); desenhar(); desenharHistorico(); }
      catch(e){ err.textContent = '❌ '+(e.message||'Não foi possível salvar.'); }
    };
  }
  window.renderDimensionamento = renderDimensionamento;

  /* ------------------------------------------------------------------
     Navegação (desktop + menu "Mais" do celular) — somente Admin
     ------------------------------------------------------------------ */
  function atualizarVisibilidade(){
    const show = !!isAdmin;
    const b = document.getElementById('navDim');
    if(b){ b.style.display = show ? '' : 'none'; b.classList.toggle('active', section==='dimens'); }
    const mb = document.getElementById('msheetDim'); if(mb) mb.style.display = show ? '' : 'none';
  }
  function abrirDim(){
    if(!isAdmin){ alert('Acesso restrito ao administrador.'); return; }
    section = 'dimens'; renderTopControls();
    if(typeof window.updateMobileActiveState === 'function') window.updateMobileActiveState('navDim');
    renderDimensionamento();
  }
  function instalarNavegacao(){
    if(KIOSK) return;
    const nav = document.querySelector('.mainnav');
    if(nav && !document.getElementById('navDim')){
      const b = document.createElement('button'); b.id = 'navDim'; b.textContent = '📐 Dimensionamento'; b.style.display = 'none';
      nav.insertBefore(b, document.getElementById('navAdmin')); b.addEventListener('click', abrirDim);
    }
    /* (sem item no menu "Mais" do celular: o Dimensionamento é só do desktop) */
    atualizarVisibilidade();
  }
  const _rtc = renderTopControls;
  renderTopControls = function(){ const r = _rtc.apply(this, arguments); atualizarVisibilidade(); return r; };
  const _sab = showAdminBadge;
  showAdminBadge = function(){ const r = _sab.apply(this, arguments); atualizarVisibilidade(); return r; };
  const _alo = adminLogout;
  adminLogout = function(){ if(section==='dimens') section='checklist'; const r = _alo.apply(this, arguments); atualizarVisibilidade(); return r; };
  const _rul = renderUserLogin;
  renderUserLogin = async function(){ if(section==='dimens') section='checklist'; const r = await _rul.apply(this, arguments); atualizarVisibilidade(); return r; };
  instalarNavegacao();
  }catch(erro){
    /* Se algo falhar, o módulo se desliga e o sistema funciona exatamente como antes (valores originais do código). */
    window.efDim = undefined;
    console.error('[Dimensionamento] módulo desativado por erro:', erro);
  }
})();
</script>

<style id="ds-estilo">
/* ═══════════════════════════════════════════════════════════════════
   REDESIGN DESKTOP — tela inicial, cabeçalho e menu lateral

     (classe body.ds-on) e o novo painel em ≥769px (marcação .ds-home, que o

  #dsSide .ds-item{position:relative;display:flex;align-items:center;gap:12px;width:100%;height:36px;padding:0 12px;margin:0 0 4px;border:none;border-radius:8px;background:transparent;color:#d3dcea;font-size:13px;font-weight:500;text-align:left;cursor:pointer;font-family:inherit;}
  #dsSide .ds-item svg{width:18px;height:18px;flex:0 0 18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  #dsSide .ds-item.adm.active{background:transparent;color:#d3dcea;font-weight:500;} #dsSide .ds-item .ds-on-dot{display:none;width:8px;height:8px;border-radius:50%;background:var(--ds-yellow);margin-left:auto;margin-right:6px;} #dsSide .ds-item.adm.active .ds-on-dot{display:block;}
  #dsSide .ds-item .ds-badge{margin-left:auto;min-width:22px;height:20px;padding:0 6px;border-radius:11px;background:var(--ds-yellow);color:#14181f;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  #dsSide .ds-item.active .ds-badge{background:#14181f;color:var(--ds-yellow);}
  #dsSide .ds-item .ds-chev{margin-left:auto;width:14px;height:14px;flex:0 0 14px;opacity:.7;}
  #dsSide .ds-sep{height:1px;background:var(--ds-line);margin:12px 4px;}
  #dsSide .ds-foot{margin-top:auto;display:flex;gap:10px;align-items:stretch;padding:10px 4px 0;color:#cdd7e6;font-size:12px;line-height:1.35;}
  #dsSide .ds-foot i{width:3px;border-radius:2px;background:var(--ds-yellow);flex:0 0 3px;}

  body.ds-on .topbar{position:fixed;top:0;left:var(--ds-side);right:0;height:64px;padding:0 24px;background:var(--ds-bg);border-bottom:1px solid var(--ds-line);flex-wrap:nowrap;gap:16px;justify-content:flex-start;align-items:center;}
  body.ds-on .topbar h1{font-size:16px;font-weight:700;color:#fff;letter-spacing:.1px;white-space:nowrap;}
  body.ds-on .topbar > div:first-child{flex:0 0 auto;}
  body.ds-on .topbar .sub{font-size:0;margin-top:1px;opacity:1;}
  body.ds-on .topbar .sub::after{content:'MG02 • Betim';font-size:12px;color:var(--ds-dim);}
  body.ds-on .topbar .controls{margin-left:auto;flex-wrap:nowrap;gap:10px;}
  body.ds-on .topbar .controls > div[style*="column"]{flex-direction:row !important;gap:0 !important;}
  body.ds-on .topbar .controls > div[style*="column"] > span{display:none;}
  body.ds-on .topbar input[type=date]{height:36px;background:var(--ds-panel2);border:1px solid #26365a;border-radius:8px;color:var(--ds-text);padding:0 10px;font-size:13px;font-family:inherit;}
  body.ds-on .topbar .nav-btn{width:32px;height:36px;background:var(--ds-panel2);border:1px solid #26365a;border-radius:8px;color:var(--ds-text);}
  body.ds-on .topbar .nav-btn:hover{border-color:var(--ds-yellow);color:var(--ds-yellow);}
  body.ds-on .topbar .controls .btn.small,body.ds-on .topbar #homeHoje{height:36px;background:var(--ds-panel2) !important;border:1px solid #26365a !important;color:var(--ds-text) !important;border-radius:8px !important;padding:0 12px !important;font-size:12.5px !important;}
  body.ds-on .topbar .seg{background:var(--ds-panel2);border:1px solid #26365a;}
  body.ds-on .topbar .seg button.active{background:var(--ds-yellow);color:#14181f;}
  body.ds-on .topbar .header-turn-selector button{background:var(--ds-panel2);border:1px solid #26365a;color:var(--ds-text);}
  body.ds-on .topbar .header-turn-selector button.active{background:var(--ds-yellow);color:#14181f;border-color:var(--ds-yellow);}
  body.ds-on .topbar .controls select{height:36px;background:var(--ds-panel2);border:1px solid #26365a;color:var(--ds-text);border-radius:8px;}
  #dsBell{order:4;position:relative;width:38px;height:38px;border-radius:10px;border:none;background:transparent;color:#e8eef8;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  #dsBell:hover{background:#142036;} #dsBell svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  #dsBell i{position:absolute;top:6px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--ds-yellow);box-shadow:0 0 0 2px var(--ds-bg);display:none;} #dsBell.on i{display:block;}
  .ds-user{order:5;position:relative;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;margin-left:4px;border-left:1px solid var(--ds-line);height:40px;cursor:pointer;color:var(--ds-text);background:transparent !important;border-radius:0 !important;}
  .ds-user .ds-av{width:34px;height:34px;border-radius:50%;background:#e9edf5;color:#2b3550;display:flex;align-items:center;justify-content:center;flex:0 0 34px;}
  .ds-user .ds-av svg{width:20px;height:20px;fill:currentColor;}
  .ds-user .ds-un{display:flex;flex-direction:column;line-height:1.2;} .ds-user .ds-un b{font-size:12.5px;font-weight:600;color:#fff;white-space:nowrap;} .ds-user .ds-un small{font-size:11px;color:var(--ds-dim);}
  .ds-user .ds-uc{width:14px;height:14px;stroke:var(--ds-dim);fill:none;stroke-width:2;} .ds-user #btnChangePin,.ds-user #btnLogoutUser{display:none !important;}
  .ds-umenu{position:absolute;top:46px;right:0;min-width:170px;background:var(--ds-panel);border:1px solid var(--ds-line);border-radius:10px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.45);display:none;z-index:500;}
  .ds-umenu.open{display:block;} .ds-umenu button{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--ds-text);font-size:13px;padding:9px 12px;border-radius:7px;cursor:pointer;font-family:inherit;} .ds-umenu button:hover{background:#17253d;}
  body.ds-on .wrap{margin:0 0 0 var(--ds-side);max-width:none;padding:78px 28px 40px;}
  body.ds-on:not(.sec-home) .wrap{max-width:calc(var(--ds-side) + 1240px);}

/* data em formato de pílula (o input nativo continua funcionando por baixo) */

  .ds-dp{order:2;position:relative;display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border:1px solid #26365a;border-radius:8px;background:var(--ds-panel2);color:var(--ds-text);font-size:12.5px;cursor:pointer;white-space:nowrap;}
  .ds-dp:hover{border-color:var(--ds-yellow);} .ds-dp svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .ds-dp input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none;padding:0;}
