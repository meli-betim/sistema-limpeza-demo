      });
    }
    ov.querySelectorAll('[data-turno]').forEach(b=>b.onclick = ()=>{
      const t = b.dataset.turno, outro = t==='T1'?'T2':'T1';
      if(st.turnos[t]){ st.turnos[t] = null; }
      else st.turnos[t] = st.turnos[outro] ? clone(st.turnos[outro]) : padrao();   // já vem com a config do outro turno
      desenhar();
    });
    $('apCancelar').onclick = ()=>ov.remove();
    ov.addEventListener('click', e=>{ if(e.target===ov) ov.remove(); });
    desenhar();

    $('apSalvar').onclick = async ()=>{
      const err = $('apErr'); err.textContent = '';
      ov.querySelectorAll('[data-qin]').forEach(inp=>{ const t = inp.closest('[data-bloco]').dataset.bloco; st.turnos[t].quadros = parseInt(inp.value,10)||1; });
      const nome = limpaNome($('apNome').value);
      if(!nome){ err.textContent = 'Informe o nome da área.'; return; }
      if(nome.includes('|')){ err.textContent = 'O nome não pode conter o caractere "|".'; return; }
      const ts = ['T1','T2'].filter(t=>st.turnos[t]);
      if(!ts.length){ err.textContent = 'Marque ao menos um turno.'; return; }
      for(const t of ts){
        const c = st.turnos[t];
        if(!Number.isInteger(c.quadros) || c.quadros<1 || c.quadros>MAX_Q[c.periodicidade]){ err.textContent = TURNO_LBL[t]+': quantidade de quadros inválida.'; return; }
        if(c.periodicidade==='semanal' && c.dias.length!==c.quadros){ err.textContent = TURNO_LBL[t]+': selecione exatamente '+c.quadros+' dia(s) da semana (1 quadro por dia).'; return; }
      }
      const dup = areasAtuais().find(a=>norm(a.nome)===norm(nome) && (!editando || a.id!==area.id));
      if(dup){ err.textContent = 'Já existe a área "'+dup.nome+'"'+(dup.ativo===false?' (inativa — reative-a em vez de criar outra)':'')+'. Edite o cadastro existente.'; return; }

      // monta a configuração final por turno, preservando horários de refeição já existentes
      const turnosFinal = {};
      ts.forEach(t=>{
        const c = st.turnos[t];
        const o = {periodicidade:c.periodicidade, quadros:c.quadros, paridade:c.paridade||'todos'};
        if(c.periodicidade==='semanal') o.dias = c.dias.slice().sort((a,b)=>a-b);
        const antigo = editando && area.turnos[t];
        if(antigo && antigo.janelas) o.janelas = antigo.janelas;
        turnosFinal[t] = o;
      });

      const btn = $('apSalvar'); btn.disabled = true; btn.textContent = 'Salvando...';
      try{
        if(!editando){
          const ordem = Math.max(0, ...areasAtuais().map(a=>a.ordem||0)) + 1;
          await salvarAlteracao(areas=>{
            if(Object.values(areas).some(a=>norm(a.nome)===norm(nome))) return 'duplicada';
            const id = novoId();
            areas[id] = {id, nome, ativo:true, ordem, turnos:turnosFinal, criadoEm:Date.now()};
          }, {acao:'criou', nome, turnos:turnosFinal});
        } else {
          const antes = clone(area);
          await salvarAlteracao(areas=>{
            const x = areas[area.id]; if(!x) return 'não encontrada';
            if(Object.values(areas).some(a=>a.id!==area.id && norm(a.nome)===norm(nome))) return 'duplicada';
            x.nome = nome; x.turnos = turnosFinal; x.atualizadoEm = Date.now();
          }, {acao:'editou', areaId:area.id, antes, depois:{nome, turnos:turnosFinal}});
          if(nome !== area.nome) await migrarMarcacoesDeHoje(area.nome, nome);
        }
        ov.remove();
      }catch(e){
        err.textContent = '❌ '+(e.message||'Não foi possível salvar.');
        btn.disabled = false; btn.textContent = 'Salvar';
      }
    };
  }

  window.renderAreas = renderAreas;

  /* ------------------------------------------------------------------
     Navegação (desktop + menu "Mais" do celular) — somente Admin
     ------------------------------------------------------------------ */
  function atualizarVisibilidade(){
    const show = !!isAdmin;
    const b = document.getElementById('navAreas');
    if(b){ b.style.display = show ? '' : 'none'; b.classList.toggle('active', section==='areas'); }
    const mb = document.getElementById('msheetAreas');
    if(mb) mb.style.display = show ? '' : 'none';
  }
  function abrirAreas(){
    if(!isAdmin){ alert('Acesso restrito ao administrador.'); return; }
    section = 'areas';
    renderTopControls();
    if(typeof window.updateMobileActiveState === 'function') window.updateMobileActiveState('navAreas');
    renderAreas();
  }
  function instalarNavegacao(){
    if(KIOSK) return;
    const nav = document.querySelector('.mainnav');
    if(nav && !document.getElementById('navAreas')){
      const b = document.createElement('button');
      b.id = 'navAreas'; b.textContent = '🗂️ Áreas'; b.style.display = 'none';
      nav.insertBefore(b, document.getElementById('navAdmin'));
      b.addEventListener('click', abrirAreas);
    }
    const sheet = document.querySelector('#mobileMoreMenu .mobile-more-sheet');
    if(sheet && !document.getElementById('msheetAreas')){
      const mb = document.createElement('button');
      mb.id = 'msheetAreas'; mb.style.display = 'none';
      mb.innerHTML = '<span class="msheet-icon">🗂️</span> Áreas e Periodicidades';
      sheet.insertBefore(mb, sheet.querySelector('button[data-target="navAdmin"]'));
      mb.addEventListener('click', ()=>{ document.getElementById('mobileMoreMenu')?.classList.remove('open'); abrirAreas(); });
    }
    atualizarVisibilidade();
  }
  const _rtc = renderTopControls;
  renderTopControls = function(){ const r = _rtc.apply(this, arguments); atualizarVisibilidade(); return r; };
  const _sab = showAdminBadge;
  showAdminBadge = function(){ const r = _sab.apply(this, arguments); atualizarVisibilidade(); return r; };
  const _alo = adminLogout;
  adminLogout = function(){ if(section==='areas') section='checklist'; const r = _alo.apply(this, arguments); atualizarVisibilidade(); return r; };
  const _rul = renderUserLogin;
  renderUserLogin = async function(){ if(section==='areas') section='checklist'; const r = await _rul.apply(this, arguments); atualizarVisibilidade(); return r; };

  instalarNavegacao();

})();

<!-- ===== Plano 52 Semanas — Exportação no Excel modelo ===== -->
<script>
/* =====================================================================
   PLANO 52 SEMANAS — EXPORTAÇÃO NO EXCEL (modelo = VISUAL · sistema = CONTEÚDO)
   ---------------------------------------------------------------------
   A planilha de referência (modelo-plano-52-semanas.xlsx) define COMO o arquivo
   parece: cabeçalho, logos, painéis congelados, larguras, alturas, bordas,
   fontes, mesclagens, estilos por posição na área e a estrutura das semanas.
   O SISTEMA define O QUE aparece: áreas, atividades, planejado, execução e
   pendências — pela MESMA lista (p52Atividades, derivada do Plano de Limpeza) e
   pela MESMA regra de status da tela do Plano 52 (p52RenderWeek).

   Nenhum valor do modelo é copiado: as linhas de atividade são GERADAS (quantas
   forem), com o estilo clonado das linhas-modelo (primeira/meio/última da área),
   e o calendário é regenerado com as semanas do sistema (segunda → domingo).
   O arquivo NÃO é reconstruído por uma biblioteca de planilhas: o .xlsx é aberto
   como pacote (JSZip) e só a aba do Plano 52 e os estilos de status são reescritos.
   Cores de status: E verde · NR vermelho · NP amarelo (as do modelo). O modelo nomeia
   PE (Pendente) e R (Reprogramado) na legenda, mas não define cor para eles: usam as
   cores da tela do Plano 52 (âmbar e roxo), explicadas numa linha abaixo da grade.
   ===================================================================== */
(function(){
  'use strict';

  const MODELO_URL = 'modelo-plano-52-semanas.xlsx';
  const SITE = 'MG02';
  const JSZIP_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
  const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const CODIGOS = ['E','PE','NR','R','NP'];

  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm = s => String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
  const p2 = n => String(n).padStart(2,'0');
  const dsOf = d => d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
  const brOf = d => p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear();
  const colNum = s => { let n=0; for(const ch of s) n = n*26 + ch.charCodeAt(0)-64; return n; };
  const colLet = n => { let s=''; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; };
  const splitRef = r => { const m = /^([A-Z]+)(\d+)$/.exec(r); return m ? [colNum(m[1]), +m[2]] : [0,0]; };

  function carregarScript(src){
    return new Promise((res, rej)=>{
      if(window.JSZip) return res();
      const s = document.createElement('script');
      s.src = src; s.onload = ()=>res(); s.onerror = ()=>rej(new Error('Não foi possível carregar a biblioteca JSZip. Verifique a conexão.'));
      document.head.appendChild(s);
    });
  }

  /* ------------------------------------------------------------------
     Leitura do modelo
     ------------------------------------------------------------------ */
  async function lerTexto(zip, caminho){ const f = zip.file(caminho); return f ? f.async('string') : null; }
  const parseXml = t => new DOMParser().parseFromString(t, 'application/xml');
  const serializar = doc => '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n' +
    new XMLSerializer().serializeToString(doc).replace(/^<\?xml[^>]*\?>\s*/, '');

  /* ------------------------------------------------------------------
     MODELO = VISUAL.  Abre o pacote .xlsx e lê a aba do Plano 52 como TEXTO
     (sem DOM, pois a aba tem ~30 MB). Nada do conteúdo antigo é usado.
     ------------------------------------------------------------------ */
  async function abrirModeloTxt(buf){
    const zip = await JSZip.loadAsync(buf);
    const wbDoc = parseXml(await lerTexto(zip, 'xl/workbook.xml'));
    const relsDoc = parseXml(await lerTexto(zip, 'xl/_rels/workbook.xml.rels'));
    const sheets = [...wbDoc.getElementsByTagNameNS(NS, 'sheet')];
    const aba = sheets.find(s=>{ const n = norm(s.getAttribute('name')); return n.includes('plan') && n.includes('pt'); });
    if(!aba) throw new Error('A aba "Plan PT" não foi encontrada no modelo.');
    const rid = aba.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id') || aba.getAttribute('r:id');
    const rel = [...relsDoc.getElementsByTagName('Relationship')].find(r=>r.getAttribute('Id')===rid);
    const alvo = rel.getAttribute('Target').replace(/^\//,'');
    const caminho = alvo.startsWith('xl/') ? alvo : 'xl/'+alvo;
    const sst = [];
    const sstTxt = await lerTexto(zip, 'xl/sharedStrings.xml');
    if(sstTxt){ [...parseXml(sstTxt).getElementsByTagNameNS(NS,'si')].forEach(si=>sst.push([...si.getElementsByTagNameNS(NS,'t')].map(t=>t.textContent).join(''))); }
    const xml = await lerTexto(zip, caminho);
    if(!xml || xml.indexOf('<sheetData>')<0) throw new Error('Não foi possível ler a aba do modelo.');
    return {zip, caminho, xml, sst, nomeAba: aba.getAttribute('name')};
  }

  /* ------------------------------------------------------------------
     Dados reais do sistema (somente leitura)
     ------------------------------------------------------------------ */
  async function lerFaixa(prefixo, ini, fim){
    const out = {};
    try{
      const snap = await withTimeout(fbRoot.orderByKey()
        .startAt(encodeKey(prefixo+ini)).endAt(encodeKey(prefixo+fim)).get(), 90000);
      if(snap.exists()) snap.forEach(ch=>{ const k = decodeKey(ch.key); out[k.slice(prefixo.length)] = ch.val(); });
      return out;
    }catch(e){
      console.warn('[P52 export] leitura em faixa falhou, lendo dia a dia', e);
      const dias = []; for(let d=new Date(ini+'T00:00:00'); dsOf(d)<=fim; d.setDate(d.getDate()+1)) dias.push(dsOf(d));
      for(let i=0;i<dias.length;i+=25){
        const lote = dias.slice(i,i+25);
        const res = await Promise.all(lote.map(ds=>window.storage.get(prefixo+ds, true)));
        res.forEach((r,j)=>{ if(r && r.value!=null) out[lote[j]] = r.value; });
      }
      return out;
    }
  }
  const parseJson = v => { if(v==null) return null; if(typeof v==='object') return v; try{ return JSON.parse(v); }catch(e){ return null; } };

  /* ==================================================================
     NOVO MOTOR — o MODELO define o VISUAL; o SISTEMA define o CONTEÚDO
       modelo  → cabeçalho, calendário (estrutura), estilos por posição, mesclagens, painéis, larguras
       sistema → áreas, atividades, planejado, status (mesma lista e mesma regra da TELA do Plano 52)
     ================================================================== */
  const COR_STATUS = {E:'FF00FF00', NR:'FFFF0000', NP:'FFFFFF00', PE:'FFFFC000', R:'FFB4A7D6'};   // E/NR/NP = cores da legenda do modelo
  const LETRAS_DIA = ['D','L','M','M','J','V','S'];            // iniciais usadas pelo modelo, indexadas por Date.getDay()
  const COLS_MESCLA_ATV = [5,6,7,8,9,12,13];                   // E F G H I L M (mescladas nas 2 linhas de cada atividade)
  const LINHAS_FINAIS = 40;                                    // linhas brancas ao final (o modelo tem ~1000, só estética)
  const attr = (a, n) => { const m = new RegExp('(?:^|\\s)'+n+'="([^"]*)"').exec(a); return m ? m[1] : null; };
  const escXml = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const desescXml = s => String(s).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
  const COLREF = []; const refCol = n => COLREF[n] || (COLREF[n] = colLet(n));

  function indexarLinhas(body){
    const pos = [], re = /<row r="(\d+)"/g; let m;
    while((m = re.exec(body))) pos.push([+m[1], m.index]);
    const idx = new Map();
    pos.forEach((p,i)=>idx.set(p[0], [p[1], i+1<pos.length ? pos[i+1][1] : body.length]));
    return idx;
  }
  function parseLinha(xml){
    const mh = /^<row r="(\d+)"([^>]*?)(\/?)>/.exec(xml);
    if(!mh) return null;
    const cels = [];
    if(!mh[3]){
      const re = /<c r="([A-Z]+)\d+"([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g; let m;
      while((m = re.exec(xml))) cels.push({col: colNum(m[1]), attrs: m[2], inner: m[3]||''});
    }
    return {r:+mh[1], attrs: mh[2].replace(/\sspans="[^"]*"/,''), cels};
  }
  const valorDe = (c, sst) => {
    const t = attr(c.attrs,'t');
    if(t==='inlineStr'){ const m = /<t[^>]*>([\s\S]*?)<\/t>/.exec(c.inner); return m ? desescXml(m[1]) : ''; }
    const m = /<v>([\s\S]*?)<\/v>/.exec(c.inner); if(!m) return null;
    return t==='s' ? (sst[+m[1]]||'') : m[1];
  };
  const celXml = (col, r, s, v) => {
    const ref = refCol(col)+r, sa = (s!=null && s!=='') ? ' s="'+s+'"' : '';
    if(v==null || v==='') return '<c r="'+ref+'"'+sa+'/>';
    if(typeof v==='number') return '<c r="'+ref+'"'+sa+'><v>'+v+'</v></c>';
    return '<c r="'+ref+'"'+sa+' t="inlineStr"><is><t xml:space="preserve">'+escXml(v)+'</t></is></c>';
  };
  const linhaXml = (r, attrs, partes) => '<row r="'+r+'"'+attrs+'>'+partes.join('')+'</row>';

  /* Descobre cabeçalho, colunas de dia, semanas e as linhas-modelo (estilo por posição na área) */
  function mapearModelo2(M){
    const i0 = M.xml.indexOf('<sheetData>'), i1 = M.xml.indexOf('</sheetData>');
    const head = M.xml.slice(0,i0), body = M.xml.slice(i0+11,i1), tail = M.xml.slice(i1+12);
    const idx = indexarLinhas(body);
    const L = r => { const p = idx.get(r); return p ? parseLinha(body.slice(p[0],p[1])) : null; };
    let hdr = null;
    for(let r=1;r<=40 && !hdr;r++){
      const lin = L(r); if(!lin) continue;
      for(const c of lin.cels){ if(c.col<=20 && norm(valorDe(c,M.sst))==='area'){ hdr = {row:r, colArea:c.col, lin}; break; } }
    }
    if(!hdr) throw new Error('Cabeçalho "Área" não encontrado no modelo.');
    const achar = txt => { const c = hdr.lin.cels.find(c=>c.col<=30 && norm(valorDe(c,M.sst)).startsWith(txt)); return c ? c.col : 0; };
    const cAtv = achar('atividade'), cFreq = achar('frequencia'), cTurno = achar('turno');
    if(!cAtv || !cFreq || !cTurno) throw new Error('Colunas "Atividade"/"Frequência"/"Turno" não encontradas no modelo.');
    const rMes = hdr.row-1, rDia = hdr.row+1, linDia = L(rDia);
    if(!linDia || !L(rMes)) throw new Error('Linhas de meses/dias não encontradas no modelo.');
    const colsDia = linDia.cels.filter(c=>c.col>cTurno+1).map(c=>({col:c.col, v:valorDe(c,M.sst)})).filter(x=>x.v!=null && x.v!=='' && !isNaN(+x.v));
    if(!colsDia.length) throw new Error('Linha de datas não encontrada no modelo.');
    const blocos = []; let atual = [];
    colsDia.forEach((x,i)=>{ if(i>0 && x.col!==colsDia[i-1].col+1 && atual.length){ blocos.push(atual); atual = []; } atual.push(x.col); });
    if(atual.length) blocos.push(atual);
    if(blocos.some(b=>b.length!==7)) throw new Error('O calendário do modelo não está organizado em semanas de 7 dias.');
    const mm = /<mergeCells[^>]*>([\s\S]*?)<\/mergeCells>/.exec(tail);
    const merges = mm ? [...mm[1].matchAll(/ref="([A-Z]+)(\d+):([A-Z]+)(\d+)"/g)].map(m=>({c1:colNum(m[1]), r1:+m[2], c2:colNum(m[3]), r2:+m[4]})) : [];
    const primeira = rDia+2;
    const areasM = merges.filter(m=>m.c1===hdr.colArea && m.c2===hdr.colArea && m.r1>=primeira).sort((a,b)=>a.r1-b.r1);
    if(!areasM.length) throw new Error('Não foi possível identificar o desenho de uma área no modelo.');
    const ref = areasM.find(a=>(a.r2-a.r1+1)/2>=3) || areasM.find(a=>(a.r2-a.r1+1)/2>=2) || areasM[0];
    const n = (ref.r2-ref.r1+1)/2;
    const T = { priPlano:L(ref.r1), priStatus:L(ref.r1+1),
                meioPlano:L(n>=3 ? ref.r1+2 : ref.r1), meioStatus:L(n>=3 ? ref.r1+3 : ref.r1+1),
                ultPlano:L(ref.r2-1), ultStatus:L(ref.r2) };
    if(Object.values(T).some(x=>!x)) throw new Error('Linhas-modelo de atividade incompletas.');
    const ultModelo = Math.max(...areasM.map(a=>a.r2));
    return {head, body, tail, idx, L, hdr, cAtv, cFreq, cTurno, rMes, rDia, primeira, blocos, merges, T, pad: L(ultModelo+1), ultModelo};
  }

  /* Calendário do SISTEMA: mesmas semanas da tela (segunda → domingo; a 1ª contém 1º/jan) */
  function calendarioSistema(ano){
    const jan1 = new Date(ano,0,1), dow = jan1.getDay();
    const seg = new Date(ano,0,1-(dow===0 ? 6 : dow-1));
    const semanas = [];
    for(let d=new Date(seg); d<=new Date(ano,11,31); d.setDate(d.getDate()+7)){
      const dias = []; for(let i=0;i<7;i++){ const x = new Date(d); x.setDate(d.getDate()+i); dias.push(x); }
      semanas.push(dias);
    }
    return semanas;
  }

  /* Estilos derivados: mesma borda/fonte/alinhamento do modelo, com a cor da legenda por status */
  async function abrirEstilos(M){
    const doc = parseXml(await lerTexto(M.zip,'xl/styles.xml'));
    const fills = doc.getElementsByTagNameNS(NS,'fills')[0], xfs = doc.getElementsByTagNameNS(NS,'cellXfs')[0];
    const cache = new Map();
    const fillPara = rgb => {
      if(!rgb) return '0';
      const lista = [...fills.getElementsByTagNameNS(NS,'fill')];
      const i = lista.findIndex(f=>{ const pf = f.getElementsByTagNameNS(NS,'patternFill')[0], fg = pf && pf.getElementsByTagNameNS(NS,'fgColor')[0];
                                     return pf && pf.getAttribute('patternType')==='solid' && fg && fg.getAttribute('rgb')===rgb; });
      if(i>=0) return String(i);
      const f = doc.createElementNS(NS,'fill'), pf = doc.createElementNS(NS,'patternFill'); pf.setAttribute('patternType','solid');
      const fg = doc.createElementNS(NS,'fgColor'); fg.setAttribute('rgb',rgb);
      const bg = doc.createElementNS(NS,'bgColor'); bg.setAttribute('indexed','64');
      pf.appendChild(fg); pf.appendChild(bg); f.appendChild(pf); fills.appendChild(f); fills.setAttribute('count', String(lista.length+1));
      return String(lista.length);
    };
    const derivar = (base, rgb, h) => {
      const k = base+'|'+(rgb||'-')+'|'+(h||'center'); if(cache.has(k)) return cache.get(k);
      const lista = [...xfs.getElementsByTagNameNS(NS,'xf')], orig = lista[+base];
      if(!orig){ cache.set(k,+base); return +base; }
      const novo = orig.cloneNode(true);
      novo.setAttribute('fillId', fillPara(rgb)); novo.setAttribute('applyFill','1');
      let al = novo.getElementsByTagNameNS(NS,'alignment')[0];
      if(!al){ al = doc.createElementNS(NS,'alignment'); novo.insertBefore(al, novo.firstChild); }
      al.setAttribute('horizontal', h||'center'); al.setAttribute('vertical','center'); novo.setAttribute('applyAlignment','1');
      xfs.appendChild(novo); xfs.setAttribute('count', String(lista.length+1));
      cache.set(k, lista.length); return lista.length;
    };
    return {derivar, novos:()=>cache.size, salvar:()=>M.zip.file('xl/styles.xml', serializar(doc), {createFolders:false})};
  }

  /* Estado de uma célula = EXATAMENTE a regra da tela (p52RenderWeek):
       st = status gravado || (previsto ? (futuro ? 'future' : 'PE') : 'NP')
       futuro → vazio ('·') · não previsto → NP ('—') · previsto → st                         */
  function estadoDaCelula(atv, date, hoje, statusDia, chkDia, inicio){
    const fut = date > hoje, prev = p52IsPlanned(atv, date);
    if(fut) return {prev, cod:null};
    if(!prev) return {prev:false, cod:'NP'};
    const reg = statusDia[dsOf(date)] && statusDia[dsOf(date)][atv.id] && statusDia[dsOf(date)][atv.id].status;
    return {prev:true, cod: reg || plStatusPadrao(atv, date, (chkDia||{})[dsOf(date)], inicio)};
  }

  /* ------------------------------------------------------------------
     Onde buscar o modelo (nessa ordem):
       1. arquivo escolhido na janela
       2. modelo salvo no sistema (banco de dados: sistema_limpeza/p52ModeloExcel)
       3. arquivo publicado ao lado do index.html (modelo-plano-52-semanas.xlsx)
     ------------------------------------------------------------------ */
  const REF_MODELO = () => fbRoot.child('p52ModeloExcel');
  function bufParaB64(buf){
    const u = new Uint8Array(buf); let s = '';
    for(let i=0;i<u.length;i+=0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i+0x8000));
    return btoa(s);
  }
  function b64ParaBuf(b64){
    const bin = atob(b64); const u = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
    return u.buffer;
  }
  async function infoModeloSalvo(){
    try{ const s = await withTimeout(REF_MODELO().child('meta').get(), 10000); return s.exists() ? s.val() : null; }
    catch(e){ return null; }
  }
  async function salvarModelo(file, buf){
    const quem = (typeof currentUser!=='undefined' && currentUser && currentUser.nome) || 'Admin';
    await withTimeout(REF_MODELO().set({
      arquivo: bufParaB64(buf),
      meta: {nome: file.name, tamanho: buf.byteLength, salvoEm: Date.now(), salvoPor: quem}
    }), 60000);
  }
  function erroSemModelo(detalhe){
    const e = new Error('Modelo do Excel não encontrado'+(detalhe?' ('+detalhe+')':'')+'. Selecione o arquivo "MG02 de Plan 52 SEMANAS" para gerar — e, se quiser, salve-o como modelo oficial do sistema para não precisar escolher de novo.');
    e.semModelo = true; return e;
  }
  async function obterModelo(opts, progresso){
    if(opts.arquivoModelo) return {buf: await opts.arquivoModelo.arrayBuffer(), origem:'arquivo selecionado ('+opts.arquivoModelo.name+')'};
    progresso('Buscando o modelo salvo no sistema…');
    try{
      const s = await withTimeout(REF_MODELO().child('arquivo').get(), 60000);
      if(s.exists() && s.val()) return {buf: b64ParaBuf(s.val()), origem:'modelo salvo no sistema'};
    }catch(e){ console.warn('[P52 export] modelo do banco de dados indisponível', e); }
    progresso('Buscando o modelo publicado com o sistema…');
    let resp;
    try{ resp = await fetch(new URL(MODELO_URL, location.href).href+'?v='+Date.now(), {cache:'no-store'}); }
    catch(e){ throw erroSemModelo(location.protocol==='file:' ? 'o sistema foi aberto como arquivo local' : 'falha ao baixar'); }
    if(!resp.ok) throw erroSemModelo('arquivo não publicado no servidor');
    return {buf: await resp.arrayBuffer(), origem:'arquivo publicado com o sistema'};
  }

  /* ------------------------------------------------------------------
     Processo completo
     ------------------------------------------------------------------ */
  async function gerar(opts, progresso){
    progresso('Carregando o modelo…');
    await carregarScript(JSZIP_URL);
    const {buf, origem} = await obterModelo(opts, progresso);
    let M;
    try{ M = await abrirModeloTxt(buf); }
    catch(e){ const err = new Error('O arquivo de modelo não pôde ser lido: '+(e.message||e)); err.semModelo = !!opts.arquivoModelo; throw err; }
    let modeloSalvo = false;
    if(opts.arquivoModelo && opts.salvarModelo && isAdmin){
      progresso('Salvando o modelo oficial no sistema…');
      try{ await salvarModelo(opts.arquivoModelo, buf); modeloSalvo = true; }
      catch(e){ console.warn('[P52 export] não foi possível salvar o modelo', e); }
    }
    progresso('Analisando o layout do modelo…');
    const A = mapearModelo2(M);

    // ── CONTEÚDO: MESMA lista e MESMO resolvedor que a tela do Plano 52 usa ──
    progresso('Lendo as áreas e atividades do Plano 52…');
    p52Atividades = await p52LoadAtividades();
    const filtradas = p52Atividades.filter(a=>
      (!opts.area || a.area===opts.area) &&
      (!opts.turno || String(a.turno||'').includes(opts.turno)) &&
      (!opts.freq || a.freq===opts.freq));
    const hoje = p52Today(), ano = hoje.getFullYear();
    const semanas = calendarioSistema(ano);
    if(semanas.length > A.blocos.length) throw new Error('O modelo comporta '+A.blocos.length+' semanas e o calendário de '+ano+' tem '+semanas.length+'.');
    const dias = semanas.flat(), ini = dsOf(dias[0]), fim = dsOf(dias[dias.length-1]);
    progresso('Lendo os status registrados ('+brOf(dias[0])+' a '+brOf(dias[dias.length-1])+')…');
    const statusRaw = await lerFaixa('p52:status:', ini, fim);
    const statusDia = {}; Object.entries(statusRaw).forEach(([ds,v])=>{ const o = parseJson(v); if(o) statusDia[ds] = o; });
    progresso('Lendo as execuções do Plano de Limpeza…');
    const hojeDs = dsOf(hoje), chkRaw = await lerFaixa('checklist:', ini, hojeDs<fim ? hojeDs : fim), chkDia = {};
    dias.filter(d=>d<=hoje).forEach(d=>{ const ds = dsOf(d); chkDia[ds] = parseJson(chkRaw[ds]) || {}; });
    plLimparCacheNR(); const inicioReg = await plInicioRegistro();

    // calendário: coluna do modelo ↔ data do sistema
    const colData = new Map(), usedCols = [];
    semanas.forEach((sem,b)=>sem.forEach((d,i)=>{ const c = A.blocos[b][i]; colData.set(c, d); usedCols.push(c); }));
    const lastCol = A.blocos[semanas.length-1][6], firstDayCol = A.blocos[0][0];
    const colDoDia = new Map(); colData.forEach((d,c)=>colDoDia.set(dsOf(d), c));

    progresso('Montando o cabeçalho e o calendário…');
    const EST = await abrirEstilos(M);
    const rotulos = new Map();
    for(let m=0;m<12;m++){ const c = m===0 ? A.blocos[0][0] : colDoDia.get(dsOf(new Date(ano,m,1))); if(c) rotulos.set(c, P52_MESES[m].toUpperCase()); }
    const cab = [];
    for(let r=1; r<A.primeira; r++){
      const p = A.idx.get(r); if(!p) continue;
      const bruto = A.body.slice(p[0], p[1]);
      if(r!==A.rMes && r!==A.hdr.row && r!==A.rDia){ cab.push(bruto); continue; }
      const lin = parseLinha(bruto);
      cab.push(linhaXml(r, lin.attrs, lin.cels.map(c=>{
        const s = attr(c.attrs,'s');
        if(c.col < firstDayCol) return '<c r="'+refCol(c.col)+r+'"'+c.attrs+(c.inner ? '>'+c.inner+'</c>' : '/>');
        const d = colData.get(c.col);
        if(r===A.rMes) return celXml(c.col, r, s, rotulos.get(c.col) || null);
        if(r===A.hdr.row) return celXml(c.col, r, s, d ? LETRAS_DIA[d.getDay()] : null);
        return celXml(c.col, r, s, d ? d.getDate() : null);
      })));
    }

    progresso('Gerando as linhas de áreas e atividades…');
    const mk = lin => { const est = new Map(); lin.cels.forEach(c=>est.set(c.col, attr(c.attrs,'s')));
                        const cols = [...new Set([...lin.cels.map(c=>c.col).filter(c=>c<=lastCol), ...usedCols])].sort((x,y)=>x-y);
                        return {attrs:lin.attrs, est, cols}; };
    const TM = {}; Object.keys(A.T).forEach(k=>TM[k] = mk(A.T[k]));
    const defDia = tm => { for(const c of usedCols){ if(tm.est.has(c)) return tm.est.get(c); } return null; };
    const defPlano = defDia(TM.meioPlano), defStatus = defDia(TM.meioStatus);

    const corpo = [], mesclas = [], cont = {P:0, E:0, PE:0, NR:0, R:0, NP:0, outros:0};
    const areasOrdem = [...new Set(filtradas.map(a=>a.area))];       // mesma ordem da tela
    let r = A.primeira;
    for(const area of areasOrdem){
      const lista = filtradas.filter(a=>a.area===area), n = lista.length;
      mesclas.push(refCol(A.hdr.colArea)+r+':'+refCol(A.hdr.colArea)+(r+2*n-1));
      lista.forEach((a,k)=>{
        const pos = n===1 ? 'uni' : (k===0 ? 'pri' : (k===n-1 ? 'ult' : 'meio'));
        const tp = TM[pos==='uni' || pos==='pri' ? 'priPlano' : pos==='ult' ? 'ultPlano' : 'meioPlano'];
        const ts = TM[pos==='uni' || pos==='ult' ? 'ultStatus' : pos==='pri' ? 'priStatus' : 'meioStatus'];
        const est = usedCols.map(c=>estadoDaCelula(a, colData.get(c), hoje, statusDia, chkDia, inicioReg));
        const t1 = String(a.turno||'').includes('1T') ? 1 : 0, t2 = String(a.turno||'').includes('2T') ? 1 : 0;
        // linha PLANEJADO
        corpo.push(linhaXml(r, tp.attrs, tp.cols.map(col=>{
          const dc = colData.has(col); const s = tp.est.has(col) ? tp.est.get(col) : (dc ? defPlano : null);
          let v = null;
          if(col===A.hdr.colArea) v = k===0 ? area : null;
          else if(col===A.cAtv) v = a.atividade; else if(col===A.cFreq) v = a.freq;
          else if(col===A.cTurno) v = '1T'; else if(col===A.cTurno+1) v = '2T';
          else if(dc){ const e = est[usedCols.indexOf(col)]; if(e.prev){ v = 'P'; cont.P++; } }
          return celXml(col, r, s, v);
        })));
        // linha STATUS
        corpo.push(linhaXml(r+1, ts.attrs, ts.cols.map(col=>{
          const dc = colData.has(col); let s = ts.est.has(col) ? ts.est.get(col) : (dc ? defStatus : null);
          let v = null;
          if(col===A.cTurno) v = t1; else if(col===A.cTurno+1) v = t2;
          else if(dc){ const cod = est[usedCols.indexOf(col)].cod;
            s = EST.derivar(s==null ? '0' : s, cod && COR_STATUS[cod] ? COR_STATUS[cod] : null);
            if(cod){ v = cod; if(cont[cod]!=null) cont[cod]++; else cont.outros++; } }
          return celXml(col, r+1, s, v);
        })));
        COLS_MESCLA_ATV.forEach(c=>mesclas.push(refCol(c)+r+':'+refCol(c)+(r+1)));
        r += 2;
      });
    }
    const ultAtv = r-1;

    // ── áreas do Plano de Limpeza ainda sem atividades + legenda complementar (mesma informação do rodapé da tela) ──
    const vazias = (opts.area || opts.turno || opts.freq) ? [] : (p52AreasSemAtividade || []).slice();
    const padCols = A.pad ? A.pad.cels.filter(c=>c.col<=lastCol) : [];
    const estPad = new Map(padCols.map(c=>[c.col, attr(c.attrs,'s')]));
    const attrsPad = A.pad ? A.pad.attrs : '';
    const sTexto = EST.derivar(estPad.get(A.cAtv) || '0', null, 'left');
    const linhaPad = rr => { corpo.push(linhaXml(rr, attrsPad, padCols.map(c=>celXml(c.col, rr, estPad.get(c.col), null)))); };
    const linhaTxt = (rr, txt) => { corpo.push(linhaXml(rr, attrsPad, padCols.map(c=>celXml(c.col, rr, c.col===A.cAtv ? sTexto : estPad.get(c.col), c.col===A.cAtv ? txt : null)))); };
    linhaPad(r++);
    linhaTxt(r++, 'Códigos: P = Planejado (1ª linha de cada atividade) · NR = prazo encerrado sem execução (mesmo critério do cadeado) · NP = não planejado · vazio = data futura. Cores: E, NR e NP seguem a legenda do cabeçalho; PE (âmbar) e R (roxo) o modelo nomeia mas não colore — seguem a tela do Plano 52.');
    if(vazias.length){
      linhaPad(r++);
      linhaTxt(r++, 'Áreas do Plano de Limpeza ainda sem atividades cadastradas ('+vazias.length+'):');
      vazias.forEach(nm=>linhaTxt(r++, '• '+nm));
    }
    for(let i=0;i<LINHAS_FINAIS;i++) linhaPad(r++);
    const lastRow = r-1;

    progresso('Aplicando a formatação do modelo…');
    const mCab = A.merges.filter(m=>m.r1<A.primeira && m.c2<=lastCol).map(m=>refCol(m.c1)+m.r1+':'+refCol(m.c2)+m.r2);
    const todasMesclas = mCab.concat(mesclas);
    const headNovo = A.head.replace(/<dimension ref="[^"]*"\/>/, '<dimension ref="A1:'+refCol(lastCol)+lastRow+'"/>');
    const mergeXml = '<mergeCells count="'+todasMesclas.length+'">'+todasMesclas.map(x=>'<mergeCell ref="'+x+'"/>').join('')+'</mergeCells>';
    const tailNovo = /<mergeCells[^>]*>[\s\S]*?<\/mergeCells>/.test(A.tail) ? A.tail.replace(/<mergeCells[^>]*>[\s\S]*?<\/mergeCells>/, mergeXml) : mergeXml+A.tail;
    const xml = headNovo+'<sheetData>'+cab.join('')+corpo.join('')+'</sheetData>'+tailNovo;

    progresso('Validando…');
    const problemas = [];
    if(!/<sheetViews>[\s\S]*?<pane [^>]*state="frozen"/.test(xml) && /state="frozen"/.test(M.xml)) problemas.push('Painéis congelados do modelo foram perdidos.');
    if((xml.match(/<mergeCell /g)||[]).length !== todasMesclas.length) problemas.push('Contagem de mesclagens inconsistente.');
    if(problemas.length) throw new Error('Validação falhou: '+problemas.join(' '));
    M.zip.file(M.caminho, xml, {createFolders:false});
    EST.salvar();
    const blob = await M.zip.generateAsync({type:'blob', compression:'DEFLATE', compressionOptions:{level:6},
      mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});

    return {
      blob, nome: 'Plano_52_Semanas_'+SITE+'_'+ano+'.xlsx', areasSemAtividade: vazias,
      resumo: {
        ano, semanas: semanas.length, dias: dias.length, periodo: brOf(dias[0])+' a '+brOf(dias[dias.length-1]),
        areas: areasOrdem.length, atividades: filtradas.length, linhasAtividade: ultAtv-A.primeira+1,
        cont, estilosNovos: EST.novos(), mesclas: {modelo: A.merges.length, gerado: todasMesclas.length},
        modeloSemanas: A.blocos.length, origem, modeloSalvo,
      },
    };
  }
  window.p52GerarExcel = gerar;   // uso programático / testes (mesma função do botão)
