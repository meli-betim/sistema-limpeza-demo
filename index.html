function p52SetView(v){
  p52View = v;
  ['Sem','Mes','Ano'].forEach(x=>document.getElementById('p52v'+x)?.classList.remove('active'));
  document.getElementById('p52v'+v.charAt(0).toUpperCase()+v.slice(1))?.classList.add('active');
  p52RenderCurrent();
}

async function p52RenderCurrent(){
  if(p52View==='semana') await p52RenderWeek();
  else if(p52View==='mes') await p52RenderMonth();
  else await p52RenderAnnual();
}

// ── VISÃO SEMANAL ─────────────────────────────────────────────

async function p52RenderWeek(){
  const cont = document.getElementById('p52ViewContainer');
  if(!cont) return;
  const days = p52GetWeekDates(p52WeekOffset);
  const today = p52Today();
  const todayStr = p52DateStr(today);

  const statuses = {};
  await Promise.all(days.map(async d=>{
    const ds = p52DateStr(d);
    statuses[ds] = await p52LoadStatusDay(ds);
    p52StatusCache[ds] = statuses[ds];
  }));

  plLimparCacheNR();
  const _inicio = await plInicioRegistro();
  const _chk = await plLerChecklists(days.filter(d=>d<=today));
  const d0=days[0], d6=days[6];
  const wn = p52WeekNum(days[3]);

  let atvs = p52Atividades;
  if(p52Filters.area) atvs = atvs.filter(a=>a.area===p52Filters.area);
  if(p52Filters.turno) atvs = atvs.filter(a=>a.turno.includes(p52Filters.turno));
  if(p52Filters.freq) atvs = atvs.filter(a=>a.freq===p52Filters.freq);

  let totalPlan=0, totalE=0;
  for(const d of days){
    const ds=p52DateStr(d);
    if(d>today) continue;
    for(const atv of atvs){
      if(!p52IsPlanned(atv,d)) continue;
      totalPlan++;
      const st = statuses[ds]?.[atv.id]?.status || plStatusPadrao(atv,d,_chk[ds],_inicio);
      if(st==='E') totalE++;
    }
  }
  const pct = totalPlan>0 ? Math.round(totalE/totalPlan*100) : 0;

  const areas = [...new Set(atvs.map(a=>a.area))];

  let html = `
<div class="p52-nav">
  <button class="nav-btn" onclick="p52WeekOffset--;p52RenderWeek()">‹</button>
  <div>
    <div class="p52-nav lbl" style="margin:0;">Semana ${wn} — ${P52_MESES[days[3].getMonth()]} ${days[3].getFullYear()}</div>
    <div class="p52-nav sub" style="margin:0;">${d0.toLocaleDateString('pt-BR')} → ${d6.toLocaleDateString('pt-BR')}</div>
  </div>
  <button class="nav-btn" onclick="p52WeekOffset++;p52RenderWeek()">›</button>
  <button class="btn secondary" style="padding:5px 10px;font-size:12px;" onclick="p52WeekOffset=0;p52RenderWeek()">Hoje</button>
</div>
<div class="p52-prog">
  <div class="prog-lbl">Semana ${wn} · execução</div>
  <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
  <div class="prog-pct">${pct}%</div>
</div>
<div class="p52-week-wrap"><table class="p52-table"><thead><tr>
  <th class="col-area">Área</th>
  <th class="col-atv">Atividade</th>
  <th class="col-freq">Freq</th>`;

  days.forEach(d=>{
    const ds=p52DateStr(d);
    const isTod = ds===todayStr;
    html+=`<th class="${isTod?'today-col':''}">${P52_DIAS[d.getDay()]}<br><span style="font-size:15px;font-weight:800;">${d.getDate()}</span></th>`;
  });
  html+=`</tr></thead><tbody>`;

  for(const area of areas){
    const areaAtvs = atvs.filter(a=>a.area===area);
    if(!areaAtvs.length) continue;
    const isExtra = p52Atividades.find(a=>a.area===area)?.fonte==='extra';
    html+=`<tr><td colspan="${3+days.length}" class="area-hdr">${area}${isExtra?' <span style="font-size:10px;color:var(--teal-bright);opacity:.7;">(adicionado)</span>':''}</td></tr>`;

    for(const atv of areaAtvs){
      if(p52Filters.status){
        const hasStatus = days.some(d=>{
          const ds=p52DateStr(d);
          return (statuses[ds]?.[atv.id]?.status||'NP')===p52Filters.status;
        });
        if(!hasStatus) continue;
      }

      html+=`<tr><td class="atv-name" colspan="1" style="font-size:11px;color:var(--text-dim);padding:5px 10px;">${atv.area}</td>
        <td class="atv-name">${atv.atividade}</td>
        <td class="atv-freq">${atv.freq}</td>`;

      for(const d of days){
        const ds=p52DateStr(d);
        const isTod=ds===todayStr;
        const isFut=d>today;
        const planned=p52IsPlanned(atv,d);
        const st = statuses[ds]?.[atv.id]?.status || (planned?(isFut?'future':plStatusPadrao(atv,d,_chk[ds],_inicio)):'NP');
        const resp = statuses[ds]?.[atv.id]?.resp||'';
        const manual = statuses[ds]?.[atv.id]?.manual||false;

        const cellClass = isFut?'future':(!planned?'NP':st);
        const title = `${atv.atividade} · ${d.toLocaleDateString('pt-BR')}${resp?' · '+resp:''}${manual?' · manual':''}`;
        const clickable = !isFut && planned;

        html+=`<td class="${isTod?'today-col':''}" style="text-align:center;">
          <div class="p52-cell ${cellClass}" 
            title="${title}"
            ${clickable?`onclick="p52CellClick(event,'${atv.id}','${ds}','${st}','${atv.atividade.replace(/'/g,"\\'")}')"`:''}
          >${isFut?'·':(planned?st:'—')}</div>
        </td>`;
      }
      html+='</tr>';
    }
  }

  html+=p52LinhaAreasSemAtividade(3+days.length);
  html+='</tbody></table></div>';
  cont.innerHTML = html;
}

// ── VISÃO MENSAL ──────────────────────────────────────────────

async function p52RenderMonth(){
  const cont = document.getElementById('p52ViewContainer');
  const md = p52MonthDate(p52MonthOffset);
  const year=md.getFullYear(), month=md.getMonth();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const today = p52Today();

  const statuses = {};
  const promises = [];
  for(let d=1;d<=daysInMonth;d++){
    const ds = p52DateStr(new Date(year,month,d));
    promises.push(p52LoadStatusDay(ds).then(s=>{ statuses[ds]=s; }));
  }
  await Promise.all(promises);
  plLimparCacheNR();
  const _inicio = await plInicioRegistro();
  const _diasMes = []; for(let d=1;d<=daysInMonth;d++){ const x=new Date(year,month,d); if(x<=today) _diasMes.push(x); }
  const _chk = await plLerChecklists(_diasMes);

  let atvs = p52Atividades;
  if(p52Filters.area) atvs=atvs.filter(a=>a.area===p52Filters.area);
  if(p52Filters.freq) atvs=atvs.filter(a=>a.freq===p52Filters.freq);

  let totP=0,totE=0;
  for(let d=1;d<=daysInMonth;d++){
    const dt=new Date(year,month,d);
    if(dt>today) continue;
    const ds=p52DateStr(dt);
    for(const atv of atvs){
      if(!p52IsPlanned(atv,dt)) continue;
      totP++;
      if((statuses[ds]?.[atv.id]?.status || plStatusPadrao(atv,dt,_chk[ds],_inicio))==='E') totE++;
    }
  }
  const pct=totP>0?Math.round(totE/totP*100):0;

  const areas=[...new Set(atvs.map(a=>a.area))];

  let html=`
<div class="p52-nav">
  <button class="nav-btn" onclick="p52MonthOffset--;p52RenderMonth()">‹</button>
  <div>
    <div class="p52-nav lbl" style="margin:0;">${P52_MESES[month]} ${year}</div>
    <div class="p52-nav sub" style="margin:0;">${daysInMonth} dias · ${atvs.length} atividades no filtro</div>
  </div>
  <button class="nav-btn" onclick="p52MonthOffset++;p52RenderMonth()">›</button>
  <button class="btn secondary" style="padding:5px 10px;font-size:12px;" onclick="p52MonthOffset=0;p52RenderMonth()">Hoje</button>
</div>
<div class="p52-prog">
  <div class="prog-lbl">${P52_MESES[month]} · execução</div>
  <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
  <div class="prog-pct">${pct}%</div>
</div>
<div class="p52-month-grid">`;

  for(const area of areas){
    const areaTodas=atvs.filter(a=>a.area===area), areaAtvs=areaTodas.slice(0,8);
    if(!areaAtvs.length) continue;
    html+=`<div class="p52-month-card"><div class="p52-month-card-head">${area}</div>`;
    for(const atv of areaAtvs){
      let exec=0,total=0,mini='';
      for(let d=1;d<=daysInMonth;d++){
        const dt=new Date(year,month,d);
        const ds=p52DateStr(dt);
        const isFut=dt>today;
        if(!p52IsPlanned(atv,dt)){mini+=`<div class="p52-mini-d" style="background:var(--panel-2);opacity:.3;"></div>`;continue;}
        total++;
        const st=statuses[ds]?.[atv.id]?.status||(isFut?'future':plStatusPadrao(atv,dt,_chk[ds],_inicio));
        if(st==='E') exec++;
        const bg={E:'var(--ok)',PE:'var(--amber)',NR:'var(--bad)',R:'#a78bfa',future:'var(--panel-2)'}[st]||'var(--panel-2)';
        const op=isFut?'opacity:.25;':'';
        mini+=`<div class="p52-mini-d" style="background:${bg};${op}" title="${d}/${month+1}: ${st}"></div>`;
      }
      const epct=total>0?Math.round(exec/total*100):0;
      const bcolor=epct>=90?'var(--ok)':epct>=60?'var(--amber)':'var(--bad)';
      html+=`<div class="p52-month-row">
        <div class="p52-month-atv">${atv.atividade}</div>
        <div>
          <div class="p52-mini-bar">${mini}</div>
          <div style="margin-top:3px;font-size:11px;font-weight:700;color:${bcolor};">${total>0?epct+'%':'—'}</div>
        </div>
      </div>`;
    }
    if(areaTodas.length > areaAtvs.length) html+=`<div class="p52-month-row" style="font-size:11px;color:var(--text-dim);">+ ${areaTodas.length-areaAtvs.length} atividade(s) desta área — veja nas visões Semana/Anual</div>`;
    html+='</div>';
  }
  html+='</div>';
  { const _v = p52LinhaAreasSemAtividade(1); if(_v) html+='<table style="width:100%;margin-top:14px;"><tbody>'+_v+'</tbody></table>'; }
  cont.innerHTML=html;
}

  if(p52Filters.freq) atvs=atvs.filter(a=>a.freq===p52Filters.freq);

  let html=`
<div class="p52-nav" style="margin-bottom:14px;">

<div class="p52-annual-wrap"><table class="p52-annual-table"><thead><tr>
  <th class="col-l">Área</th><th class="col-atv">Atividade</th>`;

    areaAtvs.forEach((atv,ai)=>{
      html+=`<tr>`;
      if(ai===0) html+=`<td class="col-l" rowspan="${areaAtvs.length}" style="font-weight:700;color:var(--teal-bright);vertical-align:top;padding-top:10px;">${area}</td>`;
      html+=`<td class="col-atv">${atv.atividade}</td>`;
      for(let m=0;m<12;m++){
        const daysInM=new Date(2026,m+1,0).getDate();
        let plan=0,exec=0;
        for(let d=1;d<=daysInM;d++){
          const dt=new Date(2026,m,d);
          if(dt>today) continue;
          if(!p52IsPlanned(atv,dt)) continue;
          const ds=p52DateStr(dt);
          const pval=atv.planning?.[ds];
          plan++;
          if(pval==='E') exec++;
          if(p52StatusCache[ds]?.[atv.id]?.status==='E') exec++;
        }
        const pct=plan>0?Math.round(Math.min(exec,plan)/plan*100):0;
        const isFut=new Date(2026,m,1)>today;
        let bg,color;
        if(isFut||plan===0){bg='var(--panel-2)';color='var(--text-dim)';}
        else if(pct>=90){bg='rgba(76,175,110,.2)';color='var(--ok)';}
        else if(pct>=60){bg='rgba(227,179,65,.15)';color='var(--amber)';}
        else{bg='rgba(217,106,90,.18)';color='var(--bad)';}
        html+=`<td><div class="p52-ann-cell" style="background:${bg};color:${color};">${isFut||plan===0?'—':pct+'%'}</div></td>`;
      }
      html+=`</tr>`;
    });
  }
  html+=p52LinhaAreasSemAtividade(14);
  html+=`</tbody></table></div>`;
  cont.innerHTML=html;
}

}

<!-- ===== Gravação segura + Histórico de Alterações (auditoria) ===== -->
<script>
/* =====================================================================
   historico-auditoria.js — Sistema de Limpeza MG02
   ---------------------------------------------------------------------
   Bloco carregado DEPOIS do script principal.

   O que este arquivo faz (sem remover nada do sistema atual):
   1) Gravação segura do Plano de Limpeza: cada clique grava SOMENTE o
      item alterado, via transação do banco de dados. Evita que um celular com
      tela desatualizada (ou com falha de carregamento) apague as
      marcações feitas por outras pessoas no mesmo dia.
   2) Histórico de Alterações (auditoria): todo "Marcou"/"Desmarcou" gera
      um NOVO registro em  sistema_limpeza/auditLogs/<id gerado por push>.
      Registros nunca são sobrescritos pela aplicação.
   3) Nova tela administrativa "🕘 Histórico" (somente Admin), com filtros.
   ===================================================================== */
(function(){
  'use strict';

  const AUDIT_PATH = 'auditLogs';
  const params = new URLSearchParams(location.search);
  const KIOSK = params.get('tab')==='requests' || params.get('kiosk')==='1';

  const clone   = o => JSON.parse(JSON.stringify(o));
  const stateOf = v => !v ? 'pending' : (typeof v==='string' ? v : (v.state || 'pending'));
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  /* ------------------------------------------------------------------
     Aviso discreto (toast)
     ------------------------------------------------------------------ */
  function toast(msg){
    let el = document.getElementById('audToast');
    if(!el){
      el = document.createElement('div');
      el.id = 'audToast';
      el.style.cssText = 'position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--amber);color:var(--text);padding:12px 18px;border-radius:10px;font-size:13px;z-index:10001;max-width:420px;width:calc(100% - 32px);text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.5);line-height:1.5;display:none;';
      document.body.appendChild(el);
    }
    el.innerHTML = msg;
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(()=>{ el.style.display='none'; }, 6000);
  }

  /* ==================================================================
     1) CARREGAMENTO E GRAVAÇÃO SEGUROS DO PLANO DE LIMPEZA
     ================================================================== */
  const _base = {};            // ds -> último estado lido do servidor
  const _loadFailed = new Set();

  // Substitui loadDay: distingue "dia vazio" de "falha de conexão" e
  // atualiza o objeto do cache NO LUGAR (as telas abertas continuam
  // apontando para o mesmo objeto).
  loadDay = async function(ds){
    let fresh;
    try{
      const snap = await withTimeout(fbRoot.child(encodeKey('checklist:'+ds)).get());
      fresh = snap.exists() ? JSON.parse(snap.val()) : {};
    }catch(e){
      console.error('[Checklist] Falha ao carregar '+ds, e);
      _loadFailed.add(ds);
      if(!dayCache[ds]) dayCache[ds] = {};
      return dayCache[ds];
    }
    _loadFailed.delete(ds);
    const obj = dayCache[ds] || (dayCache[ds] = {});
    Object.keys(obj).forEach(k=>delete obj[k]);
    Object.assign(obj, fresh);
    _base[ds] = clone(fresh);
    return obj;
  };

  // Substitui saveDay: descobre exatamente o que o usuário mudou
  // (comparando com o último estado lido) e grava só isso, por transação.
  saveDay = async function(ds){
    const cur  = dayCache[ds] || (dayCache[ds] = {});
    const base = _base[ds] || {};
    const changes = [];
    new Set([...Object.keys(base), ...Object.keys(cur)]).forEach(k=>{
      const before = (k in base) ? base[k] : null;
      const after  = (k in cur)  ? cur[k]  : null;
      if(JSON.stringify(before) !== JSON.stringify(after)){
        changes.push({k, before: before===null?null:clone(before), after: after===null?null:clone(after)});
      }
    });
    if(!changes.length) return;

    const ref = fbRoot.child(encodeKey('checklist:'+ds));
    const tx = ref.transaction(v=>{
      let obj = {};
      if(v){ try{ obj = JSON.parse(v); }catch(e){ return; } } // dado corrompido: aborta, não sobrescreve
      changes.forEach(c=>{ if(c.after===null) delete obj[c.k]; else obj[c.k] = c.after; });
      return JSON.stringify(obj);
    });

    const onCommitted = res=>{
      const merged = JSON.parse(res.snapshot.val() || '{}');
      const obj = dayCache[ds] || (dayCache[ds] = {});
      Object.keys(obj).forEach(k=>delete obj[k]);
      Object.assign(obj, merged);
      _base[ds] = clone(merged);
      changes.forEach(c=>registrarAuditoria(ds, c.k, c.before, c.after));
    };

    try{
      const res = await withTimeout(tx, 15000);
      if(!res.committed) throw new Error('Transação não confirmada');
      onCommitted(res);
    }catch(e){
      if(e && e.message==='timeout'){
        // A transação continua na fila do banco de dados; se confirmar depois, registra a auditoria.
        tx.then(res=>{ if(res && res.committed) onCommitted(res); }).catch(()=>{});
        toast('⏳ <strong>Conexão lenta.</strong> A marcação ainda não foi confirmada pelo servidor. Confira a tela em alguns instantes antes de clicar de novo.');
      } else {
        console.error('[Checklist] Erro ao salvar '+ds, e);
        changes.forEach(c=>{ if(c.before===null) delete cur[c.k]; else cur[c.k] = c.before; });
        alert('❌ A alteração NÃO foi salva. Verifique a conexão e tente novamente.');
      }
    }
  };

  // Aviso na tela quando o dia não pôde ser carregado
  const _origRenderDay = renderDay;
  renderDay = async function(){
    const r = await _origRenderDay.apply(this, arguments);
    const ds = dateStr(currentDate);
    if(section==='checklist' && mode==='day' && _loadFailed.has(ds)){
      const app = document.getElementById('app');
      if(app && !document.getElementById('audLoadWarn')){
        const w = document.createElement('div');
        w.id = 'audLoadWarn';
        w.className = 'card';
        w.style.cssText = 'border-color:var(--bad);margin-bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;';
        w.innerHTML = '<div style="flex:1;min-width:200px;font-size:13px;">⚠️ <strong>Não foi possível carregar as marcações deste dia</strong> (falha de conexão). A tela pode estar incompleta.</div><button class="btn small" id="audRetryDay">Tentar novamente</button>';
        app.insertBefore(w, app.firstChild);
        document.getElementById('audRetryDay').addEventListener('click', ()=>renderDay());
      }
    }
    return r;
  };

  /* ==================================================================
     2) REGISTRO DE AUDITORIA
     ================================================================== */
  function hhmm(h,m){ return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }

  function descreverItem(loc, turnKey, idx, date){
    if(!loc) return 'Ocorrência '+(idx+1);
    const meal = loc.meals && loc.meals[turnKey] && loc.meals[turnKey][idx];
    if(meal) return meal.label+' ('+hhmm(meal.start[0],meal.start[1])+'–'+hhmm(meal.end[0],meal.end[1])+')';
    const n  = resolveFreq(loc, turnKey, date);
    const dl = occDeadline(loc, turnKey, idx, date);
    return 'Limpeza '+(idx+1)+' de '+n+(dl ? ' · prazo '+fmtTime(dl.getTime()) : '');
  }

  function registrarAuditoria(ds, k, before, after){
    try{
      const [locName, turnKey, idxStr] = k.split('|');
      const idx = parseInt(idxStr, 10) || 0;
      const [y,m,d] = ds.split('-').map(Number);
      const date = new Date(y, m-1, d);
      const loc = getLocationsForDate(date).find(l=>l.name===locName);
      const turno = TURNS.find(t=>t.key===turnKey);
      const antes = stateOf(before), depois = stateOf(after);
      const acao = depois==='done' ? 'marcou' : ((antes==='done' || !after) ? 'desmarcou' : 'marcou');

      const reg = {
        acao,
        itemId: k,
        lancamentoId: ds+'|'+k,
        area: locName,
        item: descreverItem(loc, turnKey, idx, date),
        turnoKey: turnKey,
        turno: turno ? turno.label : turnKey,
        dataPlano: ds,
        estadoAnterior: antes,
        estadoNovo: depois,
        usuario: currentUser ? currentUser.nome : null,
        usuarioPerfil: currentUser ? (currentUser.perfil || 'operador') : (isAdmin ? 'admin-senha' : null),
        usuarioIdentificado: !!currentUser,
        responsavelExecucao: (after && typeof after==='object' && after.emp) ? after.emp : null,
        tsCliente: Date.now(),
        ts: Date.now()
      };
      Object.keys(reg).forEach(key=>{ if(reg[key]===null) delete reg[key]; });

      withTimeout(fbRoot.child(AUDIT_PATH).push(reg), 15000).catch(e=>{
        console.warn('[Auditoria] Registro ainda não confirmado pelo servidor:', e);
        toast('⏳ O registro do histórico ainda não foi confirmado. Mantenha a página aberta até a conexão voltar.');
      });
    }catch(e){
      console.error('[Auditoria] Falha ao montar registro', e);
    }
  }

  /* ==================================================================
     3) TELA "HISTÓRICO DE ALTERAÇÕES" (somente Admin)
     ================================================================== */
  const style = document.createElement('style');
  style.textContent = `
    .aud-acao{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
    .aud-acao.marcou{background:rgba(76,175,110,.18);color:var(--ok);}
    .aud-acao.desmarcou{background:rgba(217,106,90,.18);color:var(--bad);}
    .aud-filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;}
    .aud-filtros .f{display:flex;flex-direction:column;gap:3px;flex:1;min-width:130px;}
    .aud-filtros label{font-size:11px;color:var(--text-dim);}
    .aud-filtros input,.aud-filtros select{background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:6px 8px;border-radius:6px;font-size:13px;font-family:inherit;width:100%;}
    .aud-filtros .acoes{display:flex;gap:8px;}
    .aud-sub{font-size:11px;color:var(--text-dim);margin-top:2px;}
    @media (max-width:767px){
      .aud-filtros .f{min-width:calc(50% - 5px);}
      .aud-filtros input,.aud-filtros select{font-size:16px;}
      .aud-filtros .acoes{width:100%;}
      .aud-filtros .acoes .btn{flex:1;}
    }`;
  document.head.appendChild(style);

  const fmtData = new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'numeric'});
  const fmtHora = new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit'});
  const fmtFull = new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',dateStyle:'short',timeStyle:'medium'});

  let filtros = null;
  let logs = [];

  function filtrosPadrao(){
    const hoje = actualDateTimeBRT();
    const ini = new Date(hoje); ini.setDate(ini.getDate()-6);
    return {de:dateStr(ini), ate:dateStr(hoje), usuario:'', turno:'', area:'', acao:''};
  }
  // Limites do período em horário de Brasília (UTC-3)
  function limitesBRT(de, ate){
    const [y1,m1,d1] = de.split('-').map(Number);
    const [y2,m2,d2] = ate.split('-').map(Number);
    return {ini: Date.UTC(y1,m1-1,d1,3,0,0,0), fim: Date.UTC(y2,m2-1,d2+1,3,0,0,0)-1};
  }
  const nomeUsuario = r => r.usuario || 'Admin (senha geral, sem usuário)';
  const tsDe = r => (typeof r.ts==='number' ? r.ts : r.tsCliente) || 0;

  async function renderHistorico(){
    const app = document.getElementById('app');
    if(!isAdmin){ app.innerHTML = '<div class="empty-state" style="margin-top:40px;">⛔ Acesso restrito ao administrador.</div>'; return; }
    if(!filtros) filtros = filtrosPadrao();

    app.innerHTML = `
      <div style="max-width:1100px;">
        <div style="margin-bottom:16px;">
          <div style="font-size:18px;font-weight:700;">🕘 Histórico de Alterações</div>
          <div style="font-size:13px;color:var(--text-dim);margin-top:2px;">Quem marcou e desmarcou itens do Plano de Limpeza. Registro somente leitura.</div>
        </div>
        <div class="aud-filtros">
          <div class="f"><label>De</label><input type="date" id="audDe" value="${filtros.de}"></div>
          <div class="f"><label>Até</label><input type="date" id="audAte" value="${filtros.ate}"></div>
          <div class="f"><label>Usuário</label><select id="audUsuario"><option value="">Todos</option></select></div>
          <div class="f"><label>Turno</label>
            <select id="audTurno">
              <option value="">Todos</option>
              <option value="T1" ${filtros.turno==='T1'?'selected':''}>T1 (diurno)</option>
              <option value="T2" ${filtros.turno==='T2'?'selected':''}>T2 (noturno)</option>
            </select></div>
          <div class="f"><label>Área</label><select id="audArea"><option value="">Todas</option></select></div>
          <div class="f"><label>Ação</label>
            <select id="audAcao">
              <option value="">Todos</option>
              <option value="marcou" ${filtros.acao==='marcou'?'selected':''}>Marcou</option>
              <option value="desmarcou" ${filtros.acao==='desmarcou'?'selected':''}>Desmarcou</option>
            </select></div>
          <div class="acoes">
            <button class="btn small" id="audAplicar">Aplicar</button>
            <button class="btn small secondary" id="audLimpar">Limpar filtros</button>
          </div>
        </div>
        <div id="audResultado"><div class="loading">Carregando histórico...</div></div>
      </div>`;

    document.getElementById('audAplicar').addEventListener('click', ()=>{
      let de = document.getElementById('audDe').value || filtros.de;
      let ate = document.getElementById('audAte').value || filtros.ate;
      if(de > ate){ const t = de; de = ate; ate = t; }
      Object.assign(filtros, {de, ate});
      lerFiltrosSelects();
      carregar();
    });
    document.getElementById('audLimpar').addEventListener('click', ()=>{ filtros = filtrosPadrao(); renderHistorico(); });
    ['audUsuario','audTurno','audArea','audAcao'].forEach(id=>{
      document.getElementById(id).addEventListener('change', ()=>{ lerFiltrosSelects(); desenhar(); });
    });

    await carregar();
  }

  function lerFiltrosSelects(){
    filtros.usuario = document.getElementById('audUsuario')?.value || '';
    filtros.turno   = document.getElementById('audTurno')?.value || '';
    filtros.area    = document.getElementById('audArea')?.value || '';
    filtros.acao    = document.getElementById('audAcao')?.value || '';
  }

  /* IDs gerados por push() começam com o horário (8 caracteres em base 64) — então um intervalo de CHAVES devolve só o período,
     sem precisar de índice nas regras. O filtro exato por 'ts' continua sendo aplicado depois, como antes. */
  const PUSH_CHARS = '-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz';
  function pushPrefixo(ts){ let id = '', t = Math.max(0, Math.floor(ts)); for(let i=0;i<8;i++){ id = PUSH_CHARS.charAt(t%64) + id; t = Math.floor(t/64); } return id; }
  const pushIdMin = ts => pushPrefixo(ts) + '------------';
  const pushIdMax = ts => pushPrefixo(ts) + 'zzzzzzzzzzzz';
  let _desenhoTok = 0, _cargaTok = 0, _lookbackPendente = null;
  const PAGINA = 100;                                   // desktop: o Histórico abre com as 100 mais recentes (+ "Carregar mais")
  let _pagCursor = null, _pagMais = false, _pagCtx = null;
  const _lista = snap => { const l = []; if(snap && snap.exists()) snap.forEach(ch=>{ l.push(Object.assign({id: ch.key}, ch.val())); }); return l; };
  async function carregarMais(){
    if(!_pagCtx || !_pagMais) return;
    const c = _pagCtx, ref = fbRoot.child(AUDIT_PATH), btn = document.getElementById('audMais');
    if(btn){ btn.disabled = true; btn.textContent = 'Carregando…'; }
    try{
      const r2 = await withTimeout(ref.orderByKey().startAt(pushIdMin(c.ini - 36*3600000)).endAt(_pagCursor).limitToLast(PAGINA + 1).get(), 20000);
      if(c.tok !== _cargaTok) return;
      const bruto = _lista(r2), novos = bruto.filter(x=>x.id !== _pagCursor);
      _pagCursor = bruto.length ? bruto[0].id : _pagCursor; _pagMais = novos.length >= PAGINA;
      const ids = new Set(logs.map(x=>x.id));
      const ok = novos.filter(x=>{ const t = tsDe(x); return t>=c.ini && t<=c.fim && !ids.has(x.id); });
      logs = logs.concat(ok).sort((a,b)=>tsDe(b)-tsDe(a)); preencherOpcoes(); desenhar();
    }catch(e){ console.error('[Auditoria] Falha ao carregar mais', e); if(btn){ btn.disabled = false; btn.textContent = 'Tentar de novo'; } }
  }
  async function carregar(){
    const out = document.getElementById('audResultado');
    if(!out) return;
    out.innerHTML = '<div class="loading">Carregando histórico...</div>';
    const {ini, fim} = limitesBRT(filtros.de, filtros.ate);
    const ref = fbRoot.child(AUDIT_PATH);
    const paraLista = snap=>{
      const lista = [];
      if(snap && snap.exists()) snap.forEach(ch=>{ lista.push(Object.assign({id: ch.key}, ch.val())); });
      return lista;
    };
    let lista, erroFinal = null;
    if(window.__dsDesk) try{
      // 0) janela por chave (rápida, sem índice). Folga de 7 dias antes: registros gravados offline e sincronizados depois.
      // Desktop: só as PAGINA mais recentes do período (a chave do push() é cronológica → sem índice e sem baixar o período inteiro).
      // Folga de 36 h antes do início (+ 2ª etapa em segundo plano até 72 h): registros gravados offline e sincronizados depois. O filtro exato por 'ts' vem em seguida.
      const tokC = ++_cargaTok; _lookbackPendente = null; _pagCursor = null; _pagMais = false;
      const r1 = await withTimeout(ref.orderByKey().startAt(pushIdMin(ini - 36*3600000)).endAt(pushIdMax(fim + 3600000)).limitToLast(PAGINA).get(), 20000);
      const bruto = paraLista(r1);
      _pagCursor = bruto.length ? bruto[0].id : null; _pagMais = bruto.length >= PAGINA; _pagCtx = {ini, fim, tok: tokC};
      lista = bruto.filter(r=>{ const t = tsDe(r); return t>=ini && t<=fim; });
      _lookbackPendente = () => {   // 2ª etapa, em segundo plano: restante da folga (até 72 h antes do início) p/ registros gravados offline e sincronizados depois
        ref.orderByKey().startAt(pushIdMin(ini - 72*3600000)).endAt(pushIdMin(ini - 36*3600000)).get().then(sn=>{
          if(tokC !== _cargaTok) return;
          const ids = new Set(logs.map(x=>x.id));
          const novos = paraLista(sn).filter(r=>{ const t = tsDe(r); return t>=ini && t<=fim && !ids.has(r.id); });
          if(novos.length){ logs = logs.concat(novos).sort((a,b)=>tsDe(b)-tsDe(a)); preencherOpcoes(); desenhar(); }
        }).catch(()=>{});
      };
    }catch(eChave){ console.warn('[Auditoria] Janela por chave indisponível; usando a consulta anterior:', eChave); lista = undefined; }
    if(lista === undefined) try{
      // 1ª tentativa: consulta por período no servidor (precisa de ".indexOn": ["ts"] nas regras)
      lista = paraLista(await withTimeout(ref.orderByChild('ts').startAt(ini).endAt(fim).get(), 20000));
    }catch(e1){
      console.warn('[Auditoria] Consulta por período recusada, usando leitura completa:', e1);
      try{
        // 2ª tentativa: lê todos os registros e filtra o período no navegador
        lista = paraLista(await withTimeout(ref.once('value'), 30000))
          .filter(r=>{ const t = tsDe(r); return t>=ini && t<=fim; });
      }catch(e2){
        erroFinal = e2;
      }
    }
    if(erroFinal){
      console.error('[Auditoria] Falha ao carregar histórico', erroFinal);
      const msg = String(erroFinal && (erroFinal.code || erroFinal.message) || erroFinal);
      let motivo = 'Erro: ' + esc(msg);
      if(/permission/i.test(msg)) motivo = 'O navegador não autorizou a leitura do armazenamento local. Verifique as permissões do navegador.';
      else if(msg==='timeout') motivo = 'O servidor não respondeu a tempo.';
      out.innerHTML = '<div class="empty-state" style="color:var(--bad);">Não foi possível carregar o histórico.<div style="font-size:12px;color:var(--text-dim);margin-top:6px;">'+motivo+'</div><br><button class="btn small" id="audTentar">Tentar novamente</button></div>';
      document.getElementById('audTentar').addEventListener('click', carregar);
      return;
    }
    logs = lista.sort((a,b)=>tsDe(b)-tsDe(a));
    preencherOpcoes();
    desenhar();
    if(_lookbackPendente){ const f = _lookbackPendente; _lookbackPendente = null; f(); }
  }

  function preencherOpcoes(){
    const fill = (id, valores, todos, atual)=>{
      const sel = document.getElementById(id);
      if(!sel) return;
      const lista = [...new Set(valores)].sort((a,b)=>a.localeCompare(b,'pt-BR'));
      if(atual && !lista.includes(atual)) lista.unshift(atual);
      sel.innerHTML = `<option value="">${todos}</option>` +
        lista.map(v=>`<option value="${esc(v)}" ${v===atual?'selected':''}>${esc(v)}</option>`).join('');
    };
    fill('audUsuario', logs.map(nomeUsuario), 'Todos', filtros.usuario);
    fill('audArea', logs.map(r=>r.area).filter(Boolean), 'Todas', filtros.area);
  }

  function desenhar(){
    const out = document.getElementById('audResultado');
    if(!out) return;
    const f = filtros;
    const diurno  = k => k==='T1D' || k==='T2D';
    const noturno = k => k==='T1N' || k==='T2N';
    const rows = logs.filter(r=>{
      if(f.usuario && nomeUsuario(r)!==f.usuario) return false;
      if(f.turno==='T1' && !diurno(r.turnoKey)) return false;
      if(f.turno==='T2' && !noturno(r.turnoKey)) return false;
      if(f.area && r.area!==f.area) return false;
      if(f.acao && r.acao!==f.acao) return false;
      return true;
    });

    if(!rows.length){
      out.innerHTML = '<div class="empty-state">Nenhum registro no período e filtros selecionados.' + (_pagMais ? '<div style="margin-top:10px"><button class="btn small secondary" id="audMais">Carregar mais registros</button></div>' : '') + '</div>';
      { const bm = out.querySelector('#audMais'); if(bm) bm.onclick = carregarMais; }
      return;
    }
    const LIMITE = 1000;
    const vis = rows.slice(0, LIMITE);
    const linha = r=>{
          const t = tsDe(r);
          const d = new Date(t);
          const tip = 'Registrado em '+fmtFull.format(d)+' · Lançamento: '+(r.lancamentoId||r.itemId||'')+' · ID do log: '+r.id;
          const resp = (r.responsavelExecucao && r.responsavelExecucao!==r.usuario)
            ? `<div class="aud-sub">Responsável pela execução: ${esc(r.responsavelExecucao)}</div>` : '';
          const semUsuario = r.usuario ? '' : ' style="color:var(--amber);"';
          return `<tr title="${esc(tip)}">
            <td style="white-space:nowrap;">${fmtData.format(d)}</td>
            <td style="white-space:nowrap;font-variant-numeric:tabular-nums;">${fmtHora.format(d)}</td>
            <td><span${semUsuario}>${esc(nomeUsuario(r))}</span>${resp}</td>
            <td style="white-space:nowrap;">${esc(r.turno||r.turnoKey||'—')}</td>
            <td>${esc(r.area||'—')}</td>
            <td>${esc(r.item||'—')}${r.dataPlano?`<div class="aud-sub">Plano de ${esc(r.dataPlano.split('-').reverse().join('/'))}</div>`:''}</td>
            <td><span class="aud-acao ${r.acao==='desmarcou'?'desmarcou':'marcou'}">${r.acao==='desmarcou'?'Desmarcou':'Marcou'}</span></td>
          </tr>`;
    };
    const PRIMEIRAS = window.__dsDesk ? 120 : vis.length;     // desktop: 120 linhas na hora e o resto em lotes; mobile: tudo de uma vez, como sempre
    out.innerHTML = `
      <div class="tablewrap"><table class="report-table">
        <thead><tr><th>Data</th><th>Horário</th><th>Usuário</th><th>Turno</th><th>Área</th><th>Item</th><th>Ação</th></tr></thead>
        <tbody>${vis.slice(0, PRIMEIRAS).map(linha).join('')}</tbody>
      </table></div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <span>${rows.length} registro(s)${_pagMais ? ' carregado(s) · há registros mais antigos neste período' : ''}${rows.length>LIMITE?` · exibindo os ${LIMITE} mais recentes (reduza o período para ver os demais)`:''}</span>
        ${(_pagMais && rows.length < LIMITE) ? '<button class="btn small secondary" id="audMais">Carregar mais</button>' : ''}
      </div>`;
    { const bm = out.querySelector('#audMais'); if(bm) bm.onclick = carregarMais; }
    if(vis.length > PRIMEIRAS){
      const tb = out.querySelector('tbody'), tok = ++_desenhoTok; let k = PRIMEIRAS;
      const lote = ()=>{ if(tok !== _desenhoTok || !tb || !tb.isConnected) return; tb.insertAdjacentHTML('beforeend', vis.slice(k, k+150).map(linha).join('')); k += 150; if(k < vis.length) requestAnimationFrame(lote); };
      requestAnimationFrame(lote);
    } else { _desenhoTok++; }
  }

  window.renderHistorico = renderHistorico;

  /* ==================================================================
     4) NAVEGAÇÃO (desktop + menu "Mais" do celular)
     ================================================================== */
  function atualizarVisibilidade(){
    const show = !!isAdmin;
    const b = document.getElementById('navHistorico');
    if(b){ b.style.display = show ? '' : 'none'; b.classList.toggle('active', section==='historico'); }
    const mb = document.getElementById('msheetHistorico');
    if(mb) mb.style.display = show ? '' : 'none';
  }

  function abrirHistorico(){
    if(!isAdmin){ alert('Acesso restrito ao administrador.'); return; }
    section = 'historico';
    renderTopControls();
    if(typeof window.updateMobileActiveState === 'function') window.updateMobileActiveState('navHistorico');
    renderHistorico();
  }

  function instalarNavegacao(){
    if(KIOSK) return;
    const nav = document.querySelector('.mainnav');
    if(nav && !document.getElementById('navHistorico')){
      const b = document.createElement('button');
      b.id = 'navHistorico';
      b.textContent = '🕘 Histórico';
      b.style.display = 'none';
      nav.insertBefore(b, document.getElementById('navAdmin'));
      b.addEventListener('click', abrirHistorico);
    }
    const sheet = document.querySelector('#mobileMoreMenu .mobile-more-sheet');
    if(sheet && !document.getElementById('msheetHistorico')){
      const mb = document.createElement('button');
      mb.id = 'msheetHistorico';
      mb.style.display = 'none';
      mb.innerHTML = '<span class="msheet-icon">🕘</span> Histórico de Alterações';
      sheet.insertBefore(mb, sheet.querySelector('button[data-target="navAdmin"]'));
      mb.addEventListener('click', ()=>{
        document.getElementById('mobileMoreMenu')?.classList.remove('open');
        abrirHistorico();
      });
    }
    atualizarVisibilidade();
  }

  // Mantém o botão sincronizado com login/logout/modo admin
  const _rtc = renderTopControls;
  renderTopControls = function(){ const r = _rtc.apply(this, arguments); atualizarVisibilidade(); return r; };
  const _sab = showAdminBadge;
  showAdminBadge = function(){ const r = _sab.apply(this, arguments); atualizarVisibilidade(); return r; };
  const _alo = adminLogout;
  adminLogout = function(){
    if(section==='historico') section = 'checklist';
    const r = _alo.apply(this, arguments); atualizarVisibilidade(); return r;
  };
  const _rul = renderUserLogin;
  renderUserLogin = async function(){
    if(section==='historico') section = 'checklist';
    const r = await _rul.apply(this, arguments); atualizarVisibilidade(); return r;
  };

  instalarNavegacao();
})();
</script>

<!-- ===== Relatório PDF — Performance Semanal ===== -->
<script>
/* =====================================================================
   RELATÓRIO PDF — PERFORMANCE SEMANAL | GESTÃO DE LIMPEZA
   ---------------------------------------------------------------------
   Botão na aba "Relatório" → escolhe o período → abre o relatório em
   A4 paisagem numa nova aba e já abre a janela de impressão
   ("Salvar como PDF"). Todos os números vêm dos dados reais do sistema:
     - Plano de Limpeza:  checklist:{data}      (loadDay)
     - Efetivo:           efetivo:{data}        (loadEfetivo + TURNO_PREVISTO)
     - Solicitações:      requests              (loadAllRequests)
   Nada é gravado no banco por este módulo (somente leitura).
   ===================================================================== */
(function(){
  'use strict';

  // ── Configurações ─────────────────────────────────────────────────
  // Logo oficial: coloque o arquivo da marca no MESMO repositório do
  // index.html com este nome (ou troque pelo caminho/URL correto).
  const LOGO_ML_URL   = 'logo-mercado-livre.png';
  const SLA_META_H    = 4;     // prazo de atendimento das solicitações (mesmo do painel)
  const META_PLANO    = (typeof GOAL_PCT==='number') ? GOAL_PCT : 95; // meta do plano (já usada no sistema)
  const MAX_DIAS      = 31;
  // Solicitação EXTRA = demanda registrada em Relatório → Solicitações, fora da rotina
  // do Plano de Limpeza. Hoje todo registro dessa base é uma solicitação extra.
  // Se no futuro existir um campo que diferencie, ajuste somente esta função.
  const isExtra = r => true;
  const MAX_TIPOS_GRAFICO = 7;  // acima disso, os menores são agrupados em "Demais tipos"

  const SLA_META_MS = SLA_META_H*3600000;
  const AZUL = '#2D3277', AMARELO = '#FFE600', AMARELO_BARRA = '#F5C400';
  const DIA_SEM = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const grupoTurno = k => window.efDim ? window.efDim.grupoManha(k) : ((k==='T1D'||k==='T2D') ? 'T1' : 'T2');   // T1 = Manhã | T2 = Noite
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const p2 = n => String(n).padStart(2,'0');
  const ddmm = d => p2(d.getDate())+'/'+p2(d.getMonth()+1);
  const ddmmaaaa = d => ddmm(d)+'/'+d.getFullYear();
  const pct = (a,b) => b>0 ? a/b*100 : null;
  const fmtPct = (v,dec=0) => v==null ? '—' : v.toFixed(dec).replace('.',',')+'%';
  const parseDs = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
  const dsOf = d => d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
  function fmtDur(ms){
    if(ms==null) return '—';
    const min = Math.round(ms/60000);
    if(min<60) return min+' min';
    const h=Math.floor(min/60), m=min%60;
    if(h<24) return m ? h+'h '+p2(m)+'min' : h+'h';
    const d=Math.floor(h/24), hr=h%24;
    return hr ? d+'d '+hr+'h' : d+'d';
  }
  function diasDoPeriodo(de, ate){
    const arr=[]; const fim=parseDs(ate);
    for(let d=parseDs(de); d<=fim; d.setDate(d.getDate()+1)) arr.push(new Date(d));
    return arr;
  }
  const clsPlano = v => v==null ? '' : (v>=META_PLANO ? 'ok' : v>=80 ? 'warn' : 'bad');

  /* ==================================================================
     1) COLETA E CÁLCULO (somente dados reais)
     ================================================================== */
  async function calcCumprimento(dias){
    const hoje = getOperationalDate();
    const agoraMs = actualDateTimeBRT().getTime();
    const cache = await Promise.all(dias.map(d=>loadDay(dsOf(d))));
    return dias.map((d, di)=>{
      const data = cache[di] || {};
      const r = { d, futuro: d>hoje, parcial: dsOf(d)===dsOf(hoje),
                  T1:{prev:0, real:0}, T2:{prev:0, real:0} };
      if(r.futuro) return r;
      getLocationsForDate(d).forEach(loc=>{
        activeTurns(d).forEach(t=>{
          const n = resolveFreq(loc, t.key, d);
          for(let i=0;i<n;i++){
            const feito = getEntry(data, loc.name+'|'+t.key+'|'+i).state==='done';
            if(r.parcial && !feito){
              // Dia em andamento: só entra no previsto o que já venceu o prazo
              const dl = occDeadline(loc, t.key, i, d);
              if(!dl || dl.getTime() > agoraMs) continue;
            }
            const g = grupoTurno(t.key);
            r[g].prev++;
            if(feito) r[g].real++;
          }
        });
      });
      return r;
    });
  }

  async function calcAbsenteismo(dias){
    const hoje = getOperationalDate();
    const efs = await Promise.all(dias.map(d=>loadEfetivo(dsOf(d))));
    return dias.map((d, di)=>{
      const ef = efs[di] || {};
      const r = { d, futuro: d>hoje,
                  T1:{prev:0, pres:0, lanc:false}, T2:{prev:0, pres:0, lanc:false} };
      if(r.futuro) return r;
      const turnos = ef._turnos || turnosEfetivoDia(d).map(t=>t.key);
      turnos.forEach(tk=>{
        if(!Array.isArray(ef[tk])) return;            // turno sem lançamento de efetivo
        const g = grupoTurno(tk);
        r[g].lanc = true;
        r[g].prev += efPrevistoReg(ef, tk, dsOf(d));
        r[g].pres += ef[tk].length;
      });
      ['T1','T2'].forEach(g=>{ r[g].aus = Math.max(0, r[g].prev - r[g].pres); });
      return r;
    });
  }

  async function calcSolicitacoes(dias){
    try{ _reqLoadTs = 0; }catch(e){}                   // força leitura atualizada
    const todas = await loadAllRequests();
    const ini = new Date(dias[0]); ini.setHours(0,0,0,0);
    const fim = new Date(dias[dias.length-1]); fim.setHours(23,59,59,999);
    const agora = Date.now();
    const lista = todas
      .filter(r=>r && r.status!=='excluida' && r.createdAt>=ini.getTime() && r.createdAt<=fim.getTime())
      .map(r=>{
        const concl = r.status==='concluida' && r.closedAt;
        const retroAuto = !!(concl && r.concluidoAutomaticamente);   // lançamento retroativo encerrado sem atendimento real
        const tempo = concl ? Math.max(0, r.closedAt - r.createdAt) : Math.max(0, agora - r.createdAt);
        const sla = retroAuto ? 'retro'
                  : concl ? (tempo<=SLA_META_MS ? 'dentro' : 'fora')
                          : (tempo>SLA_META_MS ? 'fora' : 'aberto');
        const h = new Date(r.createdAt).getHours();
        return Object.assign({}, r, {_concl:!!concl, _retroAuto:retroAuto, _extra:isExtra(r),
                                     _tempo:tempo, _sla:sla, _turno:(h>=7&&h<19)?'T1':'T2'});
      })
      .sort((a,b)=>a.createdAt-b.createdAt);

    const concl = lista.filter(r=>r._concl);
    const extrasConcl = concl.filter(r=>r._extra);
    // Base do tempo médio: extras concluídas (abertura → conclusão) + extras EM ATENDIMENTO
    // (status "Em andamento": tempo em aberto da abertura até agora).
    const baseConcl = extrasConcl.filter(r=>!r._retroAuto);
    const baseAnd   = lista.filter(r=>r._extra && r.status==='andamento');
    const baseTempo = baseConcl.concat(baseAnd);
    const tempoMedioExtras = baseTempo.length ? baseTempo.reduce((s,r)=>s+r._tempo,0)/baseTempo.length : null;

    // Por tipo de ocorrência (mesmo campo "Tipo de Ocorrência" da solicitação)
    const cont = {};
    lista.forEach(r=>{ const t = (r.tipo && String(r.tipo).trim()) || 'Não informado'; cont[t] = (cont[t]||0)+1; });
    let tipos = Object.entries(cont).map(([tipo,qtd])=>({tipo, qtd})).sort((a,b)=>b.qtd-a.qtd || a.tipo.localeCompare(b.tipo,'pt-BR'));
    if(tipos.length > MAX_TIPOS_GRAFICO){
      const resto = tipos.slice(MAX_TIPOS_GRAFICO-1);
      tipos = tipos.slice(0, MAX_TIPOS_GRAFICO-1).concat([{tipo:'Demais tipos ('+resto.length+')', qtd: resto.reduce((s,t)=>s+t.qtd,0)}]);
    }

    return {
      lista,
      total: lista.length,
      totalExtras: lista.filter(r=>r._extra).length,
      t1: lista.filter(r=>r._turno==='T1').length,
      t2: lista.filter(r=>r._turno==='T2').length,
      concluidas: concl.length,
      andamento: lista.filter(r=>r.status==='andamento').length,
      pendentes: lista.filter(r=>r.status==='aberta').length,
      tempoMedioExtras,
      qtdTempoExtras: baseTempo.length,
      qtdTempoConcl: baseConcl.length,
      qtdTempoAnd: baseAnd.length,
      retroSemTempo: extrasConcl.length - baseTempo.length,
      tipos,
    };
  }

  async function coletarDados(de, ate){
    const dias = diasDoPeriodo(de, ate);
    const [plano, abs, sol] = await Promise.all([calcCumprimento(dias), calcAbsenteismo(dias), calcSolicitacoes(dias)]);
    return {de, ate, dias, plano, abs, sol, geradoEm: actualDateTimeBRT()};
  }

  /* ==================================================================
     2) GRÁFICOS (SVG puro, nítidos na impressão)
     ================================================================== */
  function svgBarras(itens){
    const W=640, H=186, pl=34, pr=8, pt=24, pb=32, iw=W-pl-pr, ih=H-pt-pb;
    const vals = itens.flatMap(i=>[i.t1,i.t2]).filter(v=>v!=null);
    let min = vals.length ? Math.floor((Math.min(...vals)-5)/10)*10 : 0;
    min = Math.max(0, Math.min(min, 70));
    const max = 100, step = (max-min)>50 ? 20 : 10;
    const y = v => pt + ih - (Math.min(Math.max(v,min),max)-min)/(max-min)*ih;
    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Arial,sans-serif">`;
    s += `<rect x="${pl}" y="6" width="9" height="9" rx="2" fill="${AZUL}"/><text x="${pl+13}" y="14" font-size="10" fill="#374151">T1 (Manhã)</text>`;
    s += `<rect x="${pl+90}" y="6" width="9" height="9" rx="2" fill="${AMARELO_BARRA}"/><text x="${pl+103}" y="14" font-size="10" fill="#374151">T2 (Noite)</text>`;
    for(let v=min; v<=max; v+=step){
      s += `<line x1="${pl}" y1="${y(v)}" x2="${pl+iw}" y2="${y(v)}" stroke="#e5e7eb"/>`;
      s += `<text x="${pl-4}" y="${y(v)+3}" font-size="9" fill="#6b7280" text-anchor="end">${v}%</text>`;
    }
    s += `<line x1="${pl}" y1="${y(META_PLANO)}" x2="${pl+iw}" y2="${y(META_PLANO)}" stroke="#16a34a" stroke-width="1" stroke-dasharray="4 3"/>`;
    s += `<text x="${pl+iw}" y="${y(META_PLANO)-3}" font-size="8" fill="#16a34a" text-anchor="end">meta ${META_PLANO}%</text>`;
    const gw = iw/Math.max(1,itens.length), bw = Math.min(24, gw*0.34);
    itens.forEach((it, i)=>{
      const cx = pl + gw*i + gw/2;
      [['t1',AZUL,-1],['t2',AMARELO_BARRA,1]].forEach(([k,cor,lado])=>{
        const v = it[k]; if(v==null) return;
        const x = cx + (lado<0 ? -bw-1 : 1), yy = y(v);
        s += `<rect x="${x}" y="${yy}" width="${bw}" height="${pt+ih-yy}" fill="${cor}" rx="1.5"/>`;
        if(itens.length<=10) s += `<text x="${x+bw/2}" y="${yy-3}" font-size="8" font-weight="700" fill="#1f2937" text-anchor="middle">${Math.round(v)}%</text>`;
      });
      s += `<text x="${cx}" y="${H-19}" font-size="9" fill="#374151" text-anchor="middle">${esc(it.l1)}</text>`;
      s += `<text x="${cx}" y="${H-8}" font-size="9" fill="#374151" text-anchor="middle">${esc(it.l2)}</text>`;
    });
    s += `<line x1="${pl}" y1="${pt+ih}" x2="${pl+iw}" y2="${pt+ih}" stroke="#9ca3af"/></svg>`;
    return s;
  }

  function svgLinhas(itens){
    const W=340, H=190, pl=30, pr=16, pt=24, pb=32, iw=W-pl-pr, ih=H-pt-pb;
    const vals = itens.flatMap(i=>[i.t1,i.t2]).filter(v=>v!=null);
    const maxV = vals.length ? Math.max(...vals) : 0;
    const max = Math.max(10, Math.ceil((maxV+2)/5)*5), step = max<=20 ? (max<=10?2:5) : 10;
    const y = v => pt + ih - v/max*ih;
    const x = i => pl + (itens.length<=1 ? iw/2 : iw*i/(itens.length-1));
    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Arial,sans-serif">`;
    s += `<line x1="${pl}" y1="10" x2="${pl+14}" y2="10" stroke="${AZUL}" stroke-width="2.5"/><circle cx="${pl+7}" cy="10" r="3" fill="${AZUL}"/><text x="${pl+19}" y="13" font-size="10" fill="#374151">T1 (Manhã)</text>`;
    s += `<line x1="${pl+95}" y1="10" x2="${pl+109}" y2="10" stroke="${AMARELO_BARRA}" stroke-width="2.5"/><circle cx="${pl+102}" cy="10" r="3" fill="${AMARELO_BARRA}"/><text x="${pl+114}" y="13" font-size="10" fill="#374151">T2 (Noite)</text>`;
    for(let v=0; v<=max; v+=step){
      s += `<line x1="${pl}" y1="${y(v)}" x2="${pl+iw}" y2="${y(v)}" stroke="#e5e7eb"/>`;
      s += `<text x="${pl-4}" y="${y(v)+3}" font-size="9" fill="#6b7280" text-anchor="end">${v}%</text>`;
    }
    [['t1',AZUL],['t2',AMARELO_BARRA]].forEach(([k,cor])=>{
      let d='', aberto=false;
      itens.forEach((it,i)=>{
        if(it[k]==null){ aberto=false; return; }
        d += (aberto?'L':'M')+x(i).toFixed(1)+' '+y(it[k]).toFixed(1)+' '; aberto=true;
      });
      if(d) s += `<path d="${d}" fill="none" stroke="${cor}" stroke-width="2.2"/>`;
      itens.forEach((it,i)=>{
        if(it[k]==null) return;
        s += `<circle cx="${x(i)}" cy="${y(it[k])}" r="3" fill="${cor}"/>`;
        if(itens.length<=10) s += `<text x="${x(i)}" y="${y(it[k])+(k==='t1'?12:-5)}" font-size="8" font-weight="700" fill="${k==='t1'?AZUL:'#a16207'}" text-anchor="middle">${fmtPct(it[k],1)}</text>`;
      });
    });
    itens.forEach((it,i)=>{
      s += `<text x="${x(i)}" y="${H-19}" font-size="9" fill="#374151" text-anchor="middle">${esc(it.l1)}</text>`;
      s += `<text x="${x(i)}" y="${H-8}" font-size="9" fill="#374151" text-anchor="middle">${esc(it.l2)}</text>`;
    });
    s += `<line x1="${pl}" y1="${pt+ih}" x2="${pl+iw}" y2="${pt+ih}" stroke="#9ca3af"/></svg>`;
    return s;
  }

  const PALETA = ['#2D3277','#F5C400','#16a34a','#0ea5e9','#f97316','#dc2626','#8b5cf6','#9ca3af'];
  function svgTipos(tipos, total){
    const r=42, c=2*Math.PI*r;
    let acc=0;
    let s = `<svg viewBox="0 0 120 120" width="108" height="108" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Arial,sans-serif">
      <circle cx="60" cy="60" r="${r}" fill="none" stroke="#e5e7eb" stroke-width="18"/>`;
    if(total>0) tipos.forEach((t,i)=>{
      const len = c*t.qtd/total;
      s += `<circle cx="60" cy="60" r="${r}" fill="none" stroke="${PALETA[i%PALETA.length]}" stroke-width="18"
              stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 60 60)"/>`;
      acc += len;
    });
    s += `<text x="60" y="62" font-size="22" font-weight="800" fill="${AZUL}" text-anchor="middle">${total}</text>
          <text x="60" y="76" font-size="9" fill="#6b7280" text-anchor="middle">Total</text></svg>`;
    return s;
  }

     3) MONTAGEM DO DOCUMENTO A4

  function logoHtml(){

  const txtBaseTempo = sol => sol.qtdTempoExtras
    ? sol.qtdTempoConcl+' concluída'+(sol.qtdTempoConcl===1?'':'s')+' + '+sol.qtdTempoAnd+' em andamento'

  function montarHTML(D){
    const {plano, abs, sol, dias} = D;
    const periodo = ddmmaaaa(parseDs(D.de))+' a '+ddmmaaaa(parseDs(D.ate));
    const gerado = ddmmaaaa(D.geradoEm)+' às '+p2(D.geradoEm.getHours())+':'+p2(D.geradoEm.getMinutes());
    const soma = (arr, g, f) => arr.reduce((s,r)=>s+(r.futuro?0:r[g][f]),0);

    // ── Plano de limpeza ──
    const P = {
      t1p: soma(plano,'T1','prev'), t1r: soma(plano,'T1','real'),
      t2p: soma(plano,'T2','prev'), t2r: soma(plano,'T2','real'),

    P.totP = P.t1p+P.t2p; P.totR = P.t1r+P.t2r;

        <td class="${clsPlano(pt)}"><b>${fmtPct(pt)}</b></td></tr>`;

    const pT1=pct(P.t1r,P.t1p), pT2=pct(P.t2r,P.t2p), pTot=pct(P.totR,P.totP);
    const totalPlano = `<tr class="tot"><td class="l">Total da semana</td>
      <td>${P.t1p}</td><td>${P.t1r}</td><td>${fmtPct(pT1)}</td>
      <td>${P.t2p}</td><td>${P.t2r}</td><td>${fmtPct(pT2)}</td><td>${fmtPct(pTot)}</td></tr>`;
    const itensBar = plano.map(r=>({l1:DIA_SEM[r.d.getDay()], l2:ddmm(r.d),
      t1: r.futuro?null:pct(r.T1.real,r.T1.prev), t2: r.futuro?null:pct(r.T2.real,r.T2.prev)}));

    // ── Absenteísmo ──
    const A = {t1p:0,t1a:0,t2p:0,t2a:0};
    abs.forEach(r=>{ if(r.futuro) return;
      if(r.T1.lanc){ A.t1p+=r.T1.prev; A.t1a+=r.T1.aus; }

    const aT1=pct(A.t1a,A.t1p), aT2=pct(A.t2a,A.t2p), aTot=pct(A.t1a+A.t2a, A.t1p+A.t2p);
    const celAbs = t => t.lanc ? `<td>${t.prev}</td><td>${t.aus}</td><td><b>${fmtPct(pct(t.aus,t.prev),1)}</b></td>`
                               : `<td colspan="3" class="muted">sem lançamento</td>`;
    const linhasAbs = abs.map(r=>{

      return `<tr><td class="l">${lbl}</td>${celAbs(r.T1)}${celAbs(r.T2)}<td><b>${tp?fmtPct(pct(ta,tp),1):'—'}</b></td></tr>`;
    }).join('');
    const totalAbs = `<tr class="tot"><td class="l">Total da semana</td>
      <td>${A.t1p}</td><td>${A.t1a}</td><td>${fmtPct(aT1,1)}</td>
      <td>${A.t2p}</td><td>${A.t2a}</td><td>${fmtPct(aT2,1)}</td><td>${fmtPct(aTot,1)}</td></tr>`;
    const itensLinha = abs.map(r=>({l1:DIA_SEM[r.d.getDay()], l2:ddmm(r.d),
      t1: (!r.futuro && r.T1.lanc) ? pct(r.T1.aus,r.T1.prev) : null,
      t2: (!r.futuro && r.T2.lanc) ? pct(r.T2.aus,r.T2.prev) : null}));

    // ── Solicitações ──
    const naoRes = sol.andamento + sol.pendentes;
    const linhasTipo = sol.tipos.map((t,i)=>`<tr><td class="l"><span class="dot" style="background:${PALETA[i%PALETA.length]}"></span>${esc(t.tipo)}</td><td>${t.qtd}</td><td>${fmtPct(pct(t.qtd, sol.total))}</td></tr>`).join('');

    const kpi = (ico, cor, valor, titulo, sub, det) => `

<!-- ===== Efetivo — Absenteísmo semanal ===== -->
<script>
/* =====================================================================
   EFETIVO — CONSOLIDADO SEMANAL DE ABSENTEÍSMO
   ---------------------------------------------------------------------
   Aparece na aba 👷 Efetivo, logo abaixo do "Consolidado do mês".
   Usa o MESMO parâmetro do relatório semanal: o cadastro "Dimensionamento de Efetivo"
   (vigente na data). Ex. na base original: quadro de 42 pessoas em escala 12x36 →
   21 previstas por dia (T1 Manhã 11 + T2 Noite 10), alternando equipes Par/Ímpar.
   O cálculo é o mesmo do PDF (window.relAbsenteismo). Somente leitura.
   ===================================================================== */
(function(){
  'use strict';
  const p2 = n => String(n).padStart(2,'0');
  const ddmm = d => p2(d.getDate())+'/'+p2(d.getMonth()+1);
  const dsOf = d => d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
  const DIA = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const pct = (a,b) => b>0 ? a/b*100 : null;
  const fmtPct = v => v==null ? '—' : v.toFixed(1).replace('.',',')+'%';

  let semanaRef = null;   // qualquer data dentro da semana exibida

  function segundaDe(d){
    const x = new Date(d); x.setHours(0,0,0,0);
    const w = x.getDay(); x.setDate(x.getDate() - (w===0 ? 6 : w-1));
    return x;
  }
  // Quadro / previsto do dia: vêm do cadastro "Dimensionamento de Efetivo", na data de referência da semana exibida.
  const refData = () => new Date(semanaRef || currentDate);
  const turnosRef = () => efDim.turnosDoDia(refData());
  const quadro = () => efDim.turnos().filter(t=>efDim.ativoEm(t.key, dsOf(refData()))).reduce((s,t)=>s+efDim.previsto(t.key, dsOf(refData())),0);
  const previstoDia = () => turnosRef().reduce((s,t)=>s+efDim.previsto(t.key, dsOf(refData())),0);
  const detalheDia = () => turnosRef().map(t=>(efDim.grupoManha(t.key)==='T1'?'T1 Manhã':'T2 Noite')+' '+efDim.previsto(t.key, dsOf(refData()))).join(' + ');

  function injetar(){
    if(document.getElementById('efSemCard')) return;
    const consolCard = document.getElementById('consolResult')?.closest('.card');
    if(!consolCard) return;
    if(!semanaRef) semanaRef = new Date(currentDate);
    consolCard.insertAdjacentHTML('afterend', `
      <div class="section-title" style="margin-top:24px;">Absenteísmo semanal</div>
      <div class="card" id="efSemCard">
        <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px;">
          <button class="nav-btn" id="efSemPrev" title="Semana anterior">‹</button>
          <div><label class="lbl-base">SEMANA DE</label>
            <input type="date" id="efSemData" value="${dsOf(segundaDe(semanaRef))}"
              style="background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:8px;font-size:13px;font-family:inherit;"></div>
          <button class="nav-btn" id="efSemNext" title="Próxima semana">›</button>
          <button class="btn secondary" id="efSemAtual">Semana atual</button>
          <div id="efSemLbl" style="font-size:12.5px;color:var(--text-dim);"></div>
        </div>
        <div id="efSemResult"><div class="loading">Calculando...</div></div>
      </div>`);

    const irPara = d => { semanaRef = d; document.getElementById('efSemData').value = dsOf(segundaDe(d)); calcular(); };
    document.getElementById('efSemPrev').onclick = ()=>{ const d=segundaDe(semanaRef); d.setDate(d.getDate()-7); irPara(d); };
    document.getElementById('efSemNext').onclick = ()=>{ const d=segundaDe(semanaRef); d.setDate(d.getDate()+7); irPara(d); };
    document.getElementById('efSemAtual').onclick = ()=> irPara(getOperationalDate());
    document.getElementById('efSemData').onchange = e=>{
      if(!e.target.value) return;
      const [y,m,d] = e.target.value.split('-').map(Number);
      irPara(new Date(y,m-1,d));
    };
    calcular();
  }

  async function calcular(){
    const out = document.getElementById('efSemResult');
    if(!out) return;
    if(typeof window.relAbsenteismo !== 'function'){
      out.innerHTML = '<div class="empty-state">Cálculo indisponível (módulo do relatório não carregado).</div>'; return;
    }
    const seg = segundaDe(semanaRef);
    const dias = Array.from({length:7}, (_,i)=>{ const d=new Date(seg); d.setDate(seg.getDate()+i); return d; });
    const lbl = document.getElementById('efSemLbl');
    if(lbl) lbl.textContent = 'Seg '+ddmm(dias[0])+' a Dom '+ddmm(dias[6])+'/'+dias[6].getFullYear();
    out.innerHTML = '<div class="loading">Calculando...</div>';

    let linhas;
    try{ linhas = await window.relAbsenteismo(dias); }
    catch(e){
      console.error('[Efetivo semanal] falha', e);
      out.innerHTML = '<div class="empty-state" style="color:var(--bad);">Não foi possível calcular (falha de conexão). Tente novamente.</div>';
      return;
    }
    if(!document.getElementById('efSemResult')) return;   // usuário saiu da tela

    const T = {T1:{prev:0,pres:0,aus:0}, T2:{prev:0,pres:0,aus:0}};
    let semLanc = 0;
    linhas.forEach(r=>{
      if(r.futuro) return;
      ['T1','T2'].forEach(g=>{
        if(r[g].lanc){ T[g].prev+=r[g].prev; T[g].pres+=r[g].pres; T[g].aus+=r[g].aus; }
        else semLanc++;
      });
    });
    const tot = {prev:T.T1.prev+T.T2.prev, pres:T.T1.pres+T.T2.pres, aus:T.T1.aus+T.T2.aus};
    const absTot = pct(tot.aus, tot.prev);

    const celulas = t => t.lanc
      ? `<td class="num">${t.prev}</td><td class="num">${t.pres}</td><td class="num">${t.aus}</td><td class="num" style="font-weight:700;">${fmtPct(pct(t.aus,t.prev))}</td>`
      : `<td colspan="4" style="text-align:center;color:var(--text-dim);font-size:11.5px;">sem lançamento</td>`;
    const corpo = linhas.map(r=>{
      const dia = DIA[r.d.getDay()]+' '+ddmm(r.d);
      if(r.futuro) return `<tr style="opacity:.5;"><td>${dia}</td><td colspan="9" style="text-align:center;color:var(--text-dim);">Período futuro</td></tr>`;
      const tp=(r.T1.lanc?r.T1.prev:0)+(r.T2.lanc?r.T2.prev:0), ta=(r.T1.lanc?r.T1.aus:0)+(r.T2.lanc?r.T2.aus:0);
      return `<tr><td style="white-space:nowrap;">${dia}</td>${celulas(r.T1)}${celulas(r.T2)}<td class="num" style="font-weight:700;">${tp?fmtPct(pct(ta,tp)):'—'}</td></tr>`;
    }).join('');

    out.innerHTML = `
      <div class="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));">
        <div class="stat-box"><div class="num">${quadro()}</div><div class="lbl">Quadro (12x36)</div></div>
        <div class="stat-box"><div class="num">${tot.prev}</div><div class="lbl">Previsto na semana</div></div>
        <div class="stat-box"><div class="num" style="color:var(--ok);">${tot.pres}</div><div class="lbl">Presentes</div></div>
        <div class="stat-box"><div class="num" style="color:var(--bad);">${tot.aus}</div><div class="lbl">Ausentes</div></div>
        <div class="stat-box"><div class="num">${fmtPct(absTot)}</div><div class="lbl">Absenteísmo</div>
          <div style="font-size:11.5px;color:var(--text-dim);margin-top:4px;">T1: ${fmtPct(pct(T.T1.aus,T.T1.prev))} · T2: ${fmtPct(pct(T.T2.aus,T.T2.prev))}</div></div>
      </div>
      <div class="tablewrap"><table class="report-table">
        <thead>
          <tr><th rowspan="2">Dia</th><th colspan="4" style="text-align:center;">T1 (Manhã)</th><th colspan="4" style="text-align:center;">T2 (Noite)</th><th rowspan="2" class="num">Total %</th></tr>
          <tr><th class="num">Previsto</th><th class="num">Presentes</th><th class="num">Ausentes</th><th class="num">%</th>
              <th class="num">Previsto</th><th class="num">Presentes</th><th class="num">Ausentes</th><th class="num">%</th></tr>
        </thead>
        <tbody>${corpo}
          <tr style="background:var(--panel-2);font-weight:700;"><td>Total da semana</td>
            <td class="num">${T.T1.prev}</td><td class="num">${T.T1.pres}</td><td class="num">${T.T1.aus}</td><td class="num">${fmtPct(pct(T.T1.aus,T.T1.prev))}</td>
            <td class="num">${T.T2.prev}</td><td class="num">${T.T2.pres}</td><td class="num">${T.T2.aus}</td><td class="num">${fmtPct(pct(T.T2.aus,T.T2.prev))}</td>
            <td class="num">${fmtPct(absTot)}</td></tr>
        </tbody>
      </table></div>
      <div style="font-size:11.5px;color:var(--text-dim);margin-top:10px;line-height:1.5;">
        Quadro de ${quadro()} pessoas em escala 12x36: ${previstoDia()} previstas por dia (${detalheDia()}), alternando as equipes Par e Ímpar — dimensionamento vigente em ${dsOf(refData()).split('-').reverse().join('/')}, o mesmo do relatório semanal.
        Absenteísmo = (previsto − presentes) ÷ previsto.${semLanc ? ` ${semLanc} turno(s) sem lançamento de efetivo não entraram no cálculo.` : ''}
      </div>`;
  }

  if(typeof renderEfetivo === 'function'){
    const _orig = renderEfetivo;
    renderEfetivo = async function(){
      const r = await _orig.apply(this, arguments);
      try{ injetar(); }catch(e){ console.error('[Efetivo semanal]', e); }
      return r;
    };
  }
})();
</script>

<!-- ===== Áreas e Periodicidades (cadastro administrativo) ===== -->
<script>
/* =====================================================================
   ÁREAS E PERIODICIDADES — cadastro administrativo do Plano de Limpeza
   ---------------------------------------------------------------------
   banco de dados (mesmo banco/projeto, sem nova configuração):
     sistema_limpeza/areasPlano/versoes/{AAAA-MM-DD}
         { areas:{ <id>: {nome, ativo, ordem, banheiro,
                          turnos:{ T1:{periodicidade, quadros, dias, paridade, janelas},
                                   T2:{...} } } },
           salvoEm, salvoPor, formato:2 }
     sistema_limpeza/areasPlano/log/{pushId}   (trilha das alterações)

   Cada versão vale a partir da sua data (operacional). O Plano de
   Limpeza de um dia usa a última versão com data <= aquele dia; datas
   anteriores à primeira versão continuam usando a configuração antiga
   (código original), preservando os indicadores já fechados.

   Migração: na primeira carga, se ainda não houver versões, a lista
   atual do código (LOCATIONS) é convertida automaticamente, 1 vez só
   (transação — nunca duplica).
   ===================================================================== */
(function(){
  'use strict';

  const BASE = fbRoot.child('areasPlano');
  const VERSOES = BASE.child('versoes');
  const LOG = BASE.child('log');
  const DIA_ABREV = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const KEYS = { T1:{par:'T1D', impar:'T2D'}, T2:{par:'T1N', impar:'T2N'} };
  const TURNO_LBL = { T1:'T1 (Manhã)', T2:'T2 (Noite)' };
  const MAX_Q = { diaria:12, semanal:7 };
  const params = new URLSearchParams(location.search);
  const KIOSK = params.get('tab')==='requests' || params.get('kiosk')==='1';

  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
  const limpaNome = s => String(s||'').replace(/\s+/g,' ').trim();
  const novoId = () => 'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const hojeOp = () => dateStr(getOperationalDate());

  /* ------------------------------------------------------------------
     Modelo: 1 cadastro por área, com a configuração de cada turno
       { id, nome, ativo, ordem, banheiro,
         turnos: { T1: {periodicidade, quadros, dias, paridade, janelas},
                   T2: {...} } }
     (versões antigas gravadas "1 linha por turno" são convertidas na leitura)
     ------------------------------------------------------------------ */
  let versoes = [];          // [{ds, areas:{...}, locs:[...], salvoPor}] ordenado por ds
  let carregado = false;

  function versaoPara(ds){
    let v = null;
    for(const x of versoes){ if(x.ds <= ds) v = x; else break; }
    return v;
  }
  const versaoAtual = () => versoes.length ? versoes[versoes.length-1] : null;
  const areasAtuais = () => { const v = versaoAtual(); return v ? Object.values(v.areas||{}) : []; };
  const porOrdem = (a,b) => (a.ordem||0)-(b.ordem||0);
  const clone = o => JSON.parse(JSON.stringify(o));

  // Converte o formato antigo (1 linha por turno) no formato de 1 cadastro por área
  function linhasParaAreas(linhas){
    const areas = {}, porNome = new Map();
    Object.values(linhas||{}).filter(Boolean).sort(porOrdem).forEach(l=>{
      const k = norm(l.nome);
      let a = porNome.get(k);
      if(!a){ a = {id:l.id, nome:l.nome, ativo:false, ordem:l.ordem||0, turnos:{}, _tInat:{}}; porNome.set(k,a); areas[a.id] = a; }
      if(l.banheiro) a.banheiro = true;
      const cfg = {periodicidade:l.periodicidade, quadros:l.quadros, paridade:l.paridade||'todos'};
      if(l.dias) cfg.dias = l.dias;
      if(l.janelas) cfg.janelas = l.janelas;
      if(l.ativo!==false){
        if(!a.ativo){ a.ativo = true; a.turnos = {}; }       // descarta turnos que só existiam em linhas inativas
        if(!a.turnos[l.turno]) a.turnos[l.turno] = cfg;
      } else if(!a.ativo && !a.turnos[l.turno]) a.turnos[l.turno] = cfg;
    });
    Object.values(areas).forEach(a=>delete a._tInat);
    return areas;
  }
  const normalizaVersao = val => val && val.areas ? val.areas : linhasParaAreas(val && val.linhas);

  /* ------------------------------------------------------------------
     Conversão cadastro → formato usado pelo Plano de Limpeza
     ------------------------------------------------------------------ */
  function valorFreq(c){
    return c.periodicidade==='semanal' ? 'wk:'+(c.dias||[]).slice().sort((a,b)=>a-b).join(',') : (parseInt(c.quadros,10)||0);
  }
  function montarLocs(areas){
    return Object.values(areas||{}).filter(a=>a && a.ativo!==false && a.turnos && Object.keys(a.turnos).length)
      .sort(porOrdem).map(a=>{
        const loc = {name:a.nome, f:{T1D:0,T2D:0,T1N:0,T2N:0}};
        ['T1','T2'].forEach(t=>{
          const c = a.turnos[t]; if(!c) return;
          const k = KEYS[t];
          const alvo = c.paridade==='par' ? [k.par] : c.paridade==='impar' ? [k.impar] : [k.par, k.impar];
          alvo.forEach(key=>{ loc.f[key] = valorFreq(c); });
          if(Array.isArray(c.janelas) && c.janelas.length){ loc.meals = loc.meals || {}; alvo.forEach(key=>{ loc.meals[key] = c.janelas; }); }
        });
        if(a.banheiro) loc.banheiro = true;
        return loc;
      });
  }

  /* ------------------------------------------------------------------
     Migração automática da lista atual do código
     ------------------------------------------------------------------ */
  function normalizaValor(v){
    if(typeof v==='number' && v>0) return {periodicidade:'diaria', quadros:v};
    if(v==='3pw') return {periodicidade:'semanal', quadros:3, dias:[1,3,5]};
    if(typeof v==='string' && v.startsWith('wk:')){
      const dias = v.slice(3).split(',').map(Number).filter(n=>n>=0&&n<=6);
      return dias.length ? {periodicidade:'semanal', quadros:dias.length, dias} : null;
    }
    return null;
  }
  const _isBathroomOrig = isBathroomLoc;
  function areasDaListaDoCodigo(){
    const areas = {}; let ordem = 0;
    LOCATIONS.forEach(loc=>{
      const id = novoId()+ordem;
      const a = { id, nome:loc.name, ativo:true, ordem: ordem++, turnos:{}, criadoEm: Date.now(), origem:'migracao' };
      if(_isBathroomOrig(loc)) a.banheiro = true;
      ['T1','T2'].forEach(t=>{
        const k = KEYS[t];
        const vp = normalizaValor(loc.f[k.par]), vi = normalizaValor(loc.f[k.impar]);
        if(!vp && !vi) return;
        let cfg;
        if(vp && vi){
          if(JSON.stringify(vp)!==JSON.stringify(vi)) console.warn('[Áreas] '+loc.name+' '+t+': pares e ímpares diferentes — mantida a regra dos dias pares');
          cfg = Object.assign({paridade:'todos'}, vp);
        } else cfg = Object.assign({paridade: vp?'par':'impar'}, vp||vi);
        const jan = loc.meals ? (loc.meals[k.par] || loc.meals[k.impar]) : null;
        if(jan) cfg.janelas = jan;
        a.turnos[t] = cfg;
      });
      areas[id] = a;
    });
    return areas;
  }
  async function migrarSeNecessario(){
    const ds = hojeOp();
    try{
      const res = await VERSOES.transaction(cur=>{
        if(cur) return;                       // já migrado — não faz nada
        return { [ds]: { areas: areasDaListaDoCodigo(), salvoEm: Date.now(), salvoPor: 'Migração automática', formato:2 } };
      });
      if(res && res.committed){
        LOG.push({acao:'migracao', ts: Date.now(), por:'Sistema',
                  detalhe:'Áreas migradas da lista do código para o cadastro administrativo'});
      }
    }catch(e){ console.error('[Áreas] Falha na migração', e); }
  }

  /* ------------------------------------------------------------------
     Integração com o Plano de Limpeza (sem mexer no código original)
     ------------------------------------------------------------------ */
  const _getLocOrig = getLocationsForDate;
  getLocationsForDate = function(date){
    const v = versaoPara(dateStr(date));
    return v ? v.locs : _getLocOrig(date);
  };
  isBathroomLoc = function(loc){ return (loc && loc.banheiro===true) || _isBathroomOrig(loc); };

  function atualizarListaSolicitacoes(){
    const v = versaoAtual(); if(!v) return;
    const nomes = [...new Set(v.locs.map(l=>l.name))];
    const docas = LOCATION_NAMES.filter(n=>/^Doca \d+$/.test(n));
    const novos = nomes.concat(docas, ['Outro / não listado']);
    LOCATION_NAMES.length = 0; novos.forEach(n=>LOCATION_NAMES.push(n));
  }

  let _rerenderT = null;
  function aoMudarConfig(){
    atualizarListaSolicitacoes();
    clearTimeout(_rerenderT);
    _rerenderT = setTimeout(()=>{
      if(section==='checklist'){ try{ renderChecklist(); }catch(e){} }
      if(section==='areas'){ desenharLista(); }
    }, 250);
  }

  VERSOES.on('value', snap=>{
    const val = snap.val();
    if(!val){ if(!carregado){ carregado = true; migrarSeNecessario(); } return; }
    versoes = Object.keys(val).sort().map(ds=>{
      const areas = normalizaVersao(val[ds]);
      return { ds, areas, locs: montarLocs(areas), salvoPor: val[ds].salvoPor };
    });
    carregado = true;
    aoMudarConfig();
  }, err=>console.error('[Áreas] Falha ao ler configurações', err));

  /* ------------------------------------------------------------------
     Gravação (transação na versão de HOJE; baseada na última versão)
     ------------------------------------------------------------------ */
  async function salvarAlteracao(aplicar, logInfo){
    if(!isAdmin) throw new Error('Ação restrita ao administrador.');
    const ds = hojeOp();
    const anterior = (()=>{ let v=null; for(const x of versoes){ if(x.ds < ds) v=x; } return v; })();
    const quem = (currentUser && currentUser.nome) || 'Admin (senha geral)';
    const res = await withTimeout(VERSOES.child(ds).transaction(cur=>{
      const base = clone(cur ? normalizaVersao(cur) : (anterior ? anterior.areas : {}));
      if(aplicar(base)) return;              // retornou erro → aborta sem gravar
      return { areas: base, salvoEm: Date.now(), salvoPor: quem, formato:2 };
    }), 15000);
    if(!res.committed) throw new Error('A alteração não foi aplicada (conflito com outro cadastro). Revise e tente de novo.');
    LOG.push(Object.assign({ts: Date.now(), por: quem, vigencia: ds}, logInfo));
  }

  // Ao renomear, as marcações de HOJE feitas com o nome antigo acompanham o novo nome
  async function migrarMarcacoesDeHoje(nomeAntigo, nomeNovo){
    const ref = fbRoot.child(encodeKey('checklist:'+hojeOp()));
    try{
      await withTimeout(ref.transaction(v=>{
        if(!v) return v;
        let obj; try{ obj = JSON.parse(v); }catch(e){ return; }
        let mudou = false;
        Object.keys(obj).forEach(k=>{
          const [n, tk, i] = k.split('|');
          if(n===nomeAntigo){
            const nk = nomeNovo+'|'+tk+'|'+i;
            if(!(nk in obj)) obj[nk] = obj[k];
            delete obj[k]; mudou = true;
          }
        });
        return mudou ? JSON.stringify(obj) : v;
      }), 15000);
    }catch(e){ console.warn('[Áreas] Não foi possível mover as marcações de hoje', e); }
  }

  function desenharLista(){
    const out = document.getElementById('apLista'); if(!out) return;
    if(!carregado || !versaoAtual()){ out.innerHTML = '<div class="loading">Carregando áreas...</div>'; return; }
    const q = norm(filtroTxt);
    const todas = areasAtuais().sort(porOrdem);
    const lista = todas.filter(a=>{
      if(q && !norm(a.nome).includes(q)) return false;
      if(filtroSt==='ativas' && a.ativo===false) return false;
      if(filtroSt==='inativas' && a.ativo!==false) return false;
      return true;
    });
    const nAt = todas.filter(a=>a.ativo!==false).length;
    const v = versaoAtual();
    const linhaT = (a, fn) => turnosDe(a).map(t=>`<div class="ap-ln"><span class="ap-t ${t==='T2'?'t2':''}">${t}</span>${fn(a.turnos[t])}</div>`).join('') || '<span style="color:var(--text-dim)">—</span>';

        ${nAt} área(s) ativa(s) · ${todas.length-nAt} inativa(s) · última alteração: ${esc(v.ds.split('-').reverse().join('/'))}${v.salvoPor?' por '+esc(v.salvoPor):''}
      </div>
      ${lista.length ? `<div class="tablewrap"><table class="report-table">

          turnosDe(a).forEach(t=>{ const p=a.turnos[t].paridade; if(p && p!=='todos') tags.push(t+': '+PARIDADE_LBL[p].toLowerCase()); });
          return `<tr class="${a.ativo===false?'ap-inativa':''}">
            <td><div style="font-weight:600;">${esc(a.nome)}</div>${tags.map(t=>`<span class="ap-tag">${esc(t)}</span>`).join('')}</td>
            <td style="white-space:nowrap;">${turnosDe(a).map(t=>`<span class="ap-t ${t==='T2'?'t2':''}">${TURNO_LBL[t]}</span>`).join('<br>')||'—'}</td>
            <td>${linhaT(a, c=>`<span>${c.periodicidade==='semanal'?'Semanal':'Diária'} <span style="font-size:11px;color:var(--text-dim);">· ${esc(descricao(c))}</span></span>`)}</td>
            <td style="white-space:nowrap;">${linhaT(a, c=>quadrosVis(c.quadros))}</td>

            </td></tr>`;

  async function alternarAtivo(id){
    const a = areasAtuais().find(x=>x.id===id); if(!a) return;
    const ativar = a.ativo===false;
    if(ativar && !turnosDe(a).length){ alert('Edite a área e marque ao menos um turno antes de reativar.'); return; }
    const msg = ativar
      ? 'Reativar "'+a.nome+'"?\nA área volta ao Plano de Limpeza a partir de hoje ('+turnosDe(a).join(' e ')+').'
      : 'Inativar "'+a.nome+'" ('+turnosDe(a).join(' e ')+')?\n\nA área deixa de aparecer no Plano de Limpeza a partir de hoje.\nO histórico dos dias anteriores é preservado e ela pode ser reativada depois.';
    if(!confirm(msg)) return;
    try{
      await salvarAlteracao(areas=>{
        const x = areas[id]; if(!x) return 'não encontrada';
        x.ativo = ativar; x.atualizadoEm = Date.now();
      }, {acao: ativar?'reativou':'inativou', areaId:id, nome:a.nome});
    }catch(e){ alert('❌ '+(e.message||'Não foi possível salvar.')); }
  }

          </div></div>
        <div class="form-row"><label>Quantidade de quadros</label>
          <div class="ap-step"><button type="button" data-q="-1">−</button><input type="text" inputmode="numeric" data-qin value="${c.quadros}"><button type="button" data-q="1">+</button></div></div>
        ${c.periodicidade==='semanal' ? `<div class="form-row"><label>Dias da semana <span style="font-weight:400;">— selecione ${c.quadros} dia(s) (${c.dias.length} selecionado(s))</span></label>

        <div class="form-row"><label>Aplica-se a</label>
          <select data-par>${Object.entries(PARIDADE_LBL).map(([k,v])=>`<option value="${k}" ${c.paridade===k?'selected':''}>${v}</option>`).join('')}</select></div>

    function desenhar(){
      ['T1','T2'].forEach(t=>{
        const c = st.turnos[t]; if(!c) return;
        const max = MAX_Q[c.periodicidade];
        c.quadros = Math.min(max, Math.max(1, parseInt(c.quadros,10)||1));
