/* ═══════════════════════════════════════════════════════════════════
   RESPONSIVIDADE MOBILE — TESTE
   Não altera nenhuma lógica de negócio, apenas layout/CSS.
   Breakpoint mobile: < 768px (mesmo já usado no restante do sistema).
   ═══════════════════════════════════════════════════════════════════ */
.mobile-bottom-nav{ display:none; }
.mobile-more-menu{ display:none; }
.mobile-turn-focus{ display:none; } /* recurso mobile — escondido por padrão, media query abaixo reativa em telas pequenas */
.header-turn-selector{ display:none; } /* seletor T1/T2 do cabeçalho — só mobile */
.mobile-ef-summary{ display:none; } /* resumo do Efetivo — só mobile */
.mobile-ef-manage-toggle{ display:none; } /* botão de gerenciar — só mobile */

@media (max-width:767px){
  .topbar{ padding:10px 14px !important; min-height:auto !important; height:auto !important; position:relative !important; top:auto !important; flex-wrap:wrap !important; }
  .topbar .sub{ display:none !important; }
  .topbar h1{ font-size:15px !important; }
  .mainnav{ display:none !important; }
  .wrap{ padding-bottom:88px !important; }
  body.kiosk .wrap{ padding-bottom:16px !important; }

  .mobile-bottom-nav{
    display:flex;
    position:fixed;
    bottom:0; left:0; right:0;
    background:var(--panel);
    border-top:1px solid var(--line);
    z-index:500;
    padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -4px 16px rgba(0,0,0,.25);
  }
  .mobile-bottom-nav button{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; background:transparent; border:none; color:var(--text-dim);
    padding:8px 4px; min-height:52px; border-radius:10px;
    font-size:11px; font-weight:600; font-family:inherit; cursor:pointer;
    transition:background .15s, color .15s;
  }
  .mobile-bottom-nav button .mbn-icon{ font-size:22px; line-height:1; }
  .mobile-bottom-nav button.active{ color:var(--teal-bright); background:rgba(63,214,201,.10); }
  .mobile-bottom-nav button:active{ background:rgba(255,255,255,.06); }

  .mobile-more-menu.open{
    display:flex; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:600;
    align-items:flex-end; justify-content:center;
  }
  .mobile-more-sheet{
    background:var(--panel); border-radius:16px 16px 0 0; width:100%; max-width:520px;
    padding:8px 8px calc(12px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -8px 30px rgba(0,0,0,.4);
  }
  .mobile-more-sheet .msheet-handle{
    width:40px; height:4px; background:var(--line); border-radius:3px; margin:8px auto 14px;
  }
  .mobile-more-sheet button{
    display:flex; align-items:center; gap:14px; width:100%;
    background:transparent; border:none; border-bottom:1px solid var(--line);
    color:var(--text); padding:16px 14px; font-size:15px; font-weight:600;
    font-family:inherit; cursor:pointer; text-align:left;
  }
  .mobile-more-sheet button:last-child{ border-bottom:none; }
  .mobile-more-sheet button .msheet-icon{ font-size:20px; width:26px; text-align:center; }

  .progress-bar-outer{ padding:14px 16px !important; }
  .progress-bar-outer .label{ font-size:14px !important; min-width:0 !important; }

  .lsearch-wrap{ max-width:100% !important; }
  #locSearch{ padding:13px 12px 13px 38px !important; font-size:15px !important; }

  .loc-row{ padding:14px 16px !important; }
  .loc-name{ font-size:15px !important; font-weight:700 !important; margin-bottom:10px !important; }
  .occ{ width:48px !important; height:48px !important; font-size:19px !important; border-radius:10px !important; }
  .occ.blocked-late .occ-lock{ font-size:14px !important; }
  .occ-time{ font-size:11px !important; max-width:72px !important; }
  .occ-list{ gap:10px !important; }

  .turn-head{ padding:14px 16px !important; font-size:14px !important; }

  /* Busca fixa (sticky) durante a rolagem — fundo sólido para não deixar
     o conteúdo por trás atrapalhar a leitura. Fica logo abaixo do topbar
     mobile (~52px de altura). */
  .search-sticky-row{
    position:sticky;
    top:52px;
    z-index:150;
    background:var(--bg);
    padding:10px 0 12px !important;
    margin-bottom:6px !important;
    margin-left:-14px;
    margin-right:-14px;
    padding-left:14px !important;
    padding-right:14px !important;
    border-bottom:1px solid var(--line);
  }

  /* NÃO esconder #topControls por completo — ele contém navegação de data
     essencial (‹ ›, Hoje, Dia/Semana, datepicker do Efetivo). Apenas
     reorganiza para caber confortavelmente abaixo do cabeçalho, com o
     mínimo de altura possível — a busca de local é a prioridade visual. */
  #topControls{
    width:100%;
    flex-wrap:wrap;
    gap:6px !important;
    padding:6px 14px 8px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  /* Campo de nome sugerido (#empInput) não é mais essencial — o seletor de
     colaborador do turno já cobre essa necessidade. Ocupa muito espaço e
     confundia com o campo de login no cabeçalho. Escondido só em mobile. */
  #topControls #empInput{ display:none !important; }
  #topControls input[type="text"],
  #topControls input[type="date"]{
    font-size:13px !important;
    padding:6px 8px !important;
    flex:1;
    min-width:0;
  }
  #topControls .seg{ order:0; }
  #topControls .seg button{ padding:6px 12px !important; font-size:12.5px !important; min-height:34px; }
  #topControls .nav-btn{ width:34px !important; height:34px !important; font-size:14px !important; flex-shrink:0; }
  #topControls input[type="date"]{ flex:1; min-width:0 !important; max-width:120px; }
  #topControls #efHoje{ flex-shrink:0; white-space:nowrap; padding:6px 10px !important; font-size:12px !important; }
  #topControls .btn.small{ padding:6px 10px !important; font-size:12px !important; }
  /* A coluna DOM/SEG/TER... acima do datepicker soma altura desnecessária em mobile */
  #topControls > div > span{ display:none; }

  /* Abas do Efetivo (Lançamento Diário / Efetivo Contratado): menos padding lateral
     e permite quebra de texto sem ficar espremido */
  #efTab-dia, #efTab-contratado{
    padding:10px 10px !important;
    font-size:12.5px !important;
    line-height:1.3;
    flex:1;
  }

  /* Indicador "Dia par/ímpar — exibindo T1/T2..." só ocupa espaço em mobile;
     o próprio seletor T1/T2 abaixo já comunica isso de forma mais direta. */
  .desktop-only-parity{ display:none !important; }

  /* Seletor manual de turno em destaque — Automático / T1 / T2 */
  .mobile-turn-focus{
    display:flex;
    gap:6px;
    margin-top:8px;
  }
  .mobile-turn-focus button{
    flex:1;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:9px 8px;
    border-radius:8px;
    font-size:12.5px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    min-height:38px;
  }
  .mobile-turn-focus button.active{
    background:var(--teal);
    border-color:var(--teal);
    color:#06211f;
  }

  /* Resumo do Efetivo (Total/Presentes/Ausentes/Férias + Equipe do Turno) —
     visível por padrão em mobile. */
  .mobile-ef-summary{ display:block; }

  /* Botão "Gerenciar / Lançar presença" — visível por padrão em mobile,
     dá acesso à área funcional de cadastro (que continua 100% intacta). */
  .mobile-ef-manage-toggle{ display:block; margin-bottom:20px; }

  /* Seletor de turno no cabeçalho (T1/T2) — só mobile, sempre visível
     independente da tela/aba atual. Persistido via localStorage. */
  .header-turn-selector{
    display:flex;
    gap:4px;
    background:rgba(0,0,0,.25);
    border-radius:8px;
    padding:3px;
    order:1;
  }
  .header-turn-selector button{
    background:transparent;
    border:none;
    color:rgba(255,255,255,.75);
    padding:6px 16px;
    border-radius:6px;
    font-size:13px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    min-height:32px;
  }
  .header-turn-selector button.active{
    background:#fff;
    color:var(--teal);
  }
  /* Reativa a exibição do seletor T1/T2 do cabeçalho apenas em mobile */
  .header-turn-selector{ display:flex; }

  /* Área de gestão/cadastro do Efetivo: escondida por padrão em mobile,
     só aparece ao clicar no botão "Gerenciar / Lançar presença" acima.
     Em desktop, sempre visível (regra fora do media query). */
  .ef-manage-area{ display:none; }
  .ef-manage-area.open{ display:block; }
}

<script>
(function(){
  // Detecta modo kiosk (acesso direto via ?tab=requests ou ?kiosk=1) usando
  // a mesma condição já usada em todo o resto do sistema (ver _isKioskEarly
  // e o bloco isKioskFast dentro do IIFE de inicialização). Repetida aqui,
  // em vez de depender de _isKioskEarly, porque este script roda ANTES
  // daquela variável ser declarada mais abaixo no arquivo.
  const _params = new URLSearchParams(window.location.search);
  const _isKiosk = _params.get('tab')==='requests' || _params.get('kiosk')==='1';

  const bottomNav = document.getElementById('mobileBottomNav');
  const moreMenu = document.getElementById('mobileMoreMenu');

  // Modo kiosk = acesso exclusivo à tela de Solicitação de Limpeza (sem
  // login, usado via QR code/link direto). Nesse modo, a navegação para
  // as demais áreas do sistema (Plano, Efetivo, Mais) NÃO deve existir —
  // não só visualmente escondida, mas removida do DOM, então não há como
  // ela ser acionada de forma alguma. O desktop não é afetado: ele já
  // esconde .topbar/.mainnav via CSS (body.kiosk) e nunca teve essa barra.
  if(_isKiosk){
    if(bottomNav) bottomNav.remove();
    if(moreMenu) moreMenu.remove();
    return; // não instala nenhum listener — não há nada para conectar
  }

  function clickTarget(targetId){
    const el = document.getElementById(targetId);
    if(el) el.click();
  }

  // Botões principais da barra inferior disparam o clique real do botão desktop correspondente
  ['mbnHome','mbnPlano','mbnSolicitacoes','mbnEfetivo'].forEach(id=>{
    const btn = document.getElementById(id);
    if(!btn) return;
    btn.addEventListener('click', ()=>{
      clickTarget(btn.getAttribute('data-target'));
      updateMobileActiveState(btn.getAttribute('data-target'));
    });
  });

  // Botão "Mais" abre o menu inferior com as opções secundárias
  document.getElementById('mbnMais').addEventListener('click', ()=>{
    moreMenu.classList.add('open');
  });
  moreMenu.addEventListener('click', e=>{
    if(e.target === moreMenu) moreMenu.classList.remove('open');
  });

  // Cada item do menu "Mais" dispara o clique real do botão desktop correspondente e fecha o menu
  moreMenu.querySelectorAll('button[data-target]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      clickTarget(btn.getAttribute('data-target'));
      moreMenu.classList.remove('open');
      updateMobileActiveState(btn.getAttribute('data-target'));
    });
  });

  // Espelha a visibilidade do botão "Usuários" (só aparece para admin) também no menu Mais
  const usersObserver = new MutationObserver(()=>{
    const desktopUsers = document.getElementById('navUsers');
    const mobileUsers = document.getElementById('msheetUsers');
    if(desktopUsers && mobileUsers){
      mobileUsers.style.display = desktopUsers.style.display === 'none' ? 'none' : 'flex';
    }
  });
  const navUsersEl = document.getElementById('navUsers');
  if(navUsersEl) usersObserver.observe(navUsersEl, {attributes:true, attributeFilter:['style']});

  // Marca visualmente qual item da barra inferior está ativo
  window.updateMobileActiveState = function(targetId){
    bottomNav.querySelectorAll('button[data-target]').forEach(b=>{
      b.classList.toggle('active', b.getAttribute('data-target')===targetId);
    });
  };

  // Sincroniza o estado ativo inicial e sempre que a nav desktop mudar de "active"
  // (cobre navegação disparada por outros meios, ex: links internos)
  const navIds = ['navHome','navChecklist','navRequests','navEfetivo','navReport','nav52'];
  const navObserver = new MutationObserver(()=>{
    const activeDesktop = navIds.find(id=>{
      const el = document.getElementById(id);
      return el && el.classList.contains('active');
    });
    if(activeDesktop) window.updateMobileActiveState(activeDesktop);
  });
  navIds.forEach(id=>{
    const el = document.getElementById(id);
    if(el) navObserver.observe(el, {attributes:true, attributeFilter:['class']});
  });
})();
</script>

<script>
/* ================================================================
   MODO DEMONSTRAÇÃO — persistência local, sem banco de dados e sem backend
   Todos os dados ficam no navegador atual (IndexedDB; fallback local).
   Não existe URL, chave, SDK ou chamada para o banco de produção.
   ================================================================ */
const DEMO_DB_NAME = 'meli_sistema_limpeza_demo_v1';
const DEMO_DB_STORE = 'state';
const DEMO_DB_KEY = 'root';
const DEMO_LOCAL_PREFIX = 'meli_demo_local_v1::';

class DemoSnapshot {
  constructor(value, key){ this._value = value === undefined ? null : value; this.key = key || null; }
  exists(){ return this._value !== null && this._value !== undefined; }
  val(){ return this._value === undefined ? null : this._value; }
  forEach(fn){
    const v=this._value;
    if(!v || typeof v!=='object') return false;
    for(const k of Object.keys(v).sort()) if(fn(new DemoSnapshot(v[k],k))===true) return true;
    return false;
  }
}

class DemoLocalDB {
  constructor(){
    this.data={}; this.listeners=[]; this.dbPromise=this.open();
  }
  open(){
    return new Promise(resolve=>{
      if(!('indexedDB' in window)){ this.loadFallback(); resolve(null); return; }
      let req;
      try{ req=indexedDB.open(DEMO_DB_NAME,1); }catch(e){ this.loadFallback(); resolve(null); return; }
      req.onupgradeneeded=()=>{ if(!req.result.objectStoreNames.contains(DEMO_DB_STORE)) req.result.createObjectStore(DEMO_DB_STORE); };
      req.onsuccess=()=>{
        const db=req.result; this.db=db; const get=db.transaction(DEMO_DB_STORE,'readonly').objectStore(DEMO_DB_STORE).get(DEMO_DB_KEY);
        get.onsuccess=()=>{ this.data=get.result && typeof get.result==='object' ? get.result : {}; resolve(db); };
        get.onerror=()=>resolve(db);
      };
      req.onerror=()=>{ this.loadFallback(); resolve(null); };
    });
  }
  loadFallback(){ try{ this.data=JSON.parse(localStorage.getItem(DEMO_DB_NAME)||'{}'); }catch(e){ this.data={}; } }
  async persist(){
    const db=await this.dbPromise;
    if(db){ await new Promise((resolve,reject)=>{ const tx=db.transaction(DEMO_DB_STORE,'readwrite'); tx.objectStore(DEMO_DB_STORE).put(this.data,DEMO_DB_KEY); tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error); }); }
    else { try{ localStorage.setItem(DEMO_DB_NAME,JSON.stringify(this.data)); }catch(e){ console.error('[Demo] Limite de armazenamento local atingido.',e); throw e; } }
  }
  parts(path){ return String(path||'').split('/').filter(Boolean); }
  read(path){ let v=this.data; for(const p of this.parts(path)){ if(v==null || typeof v!=='object') return null; v=v[p]; } return v===undefined?null:v; }
  write(path,value){
    const ps=this.parts(path); if(!ps.length){ this.data=value==null?{}:value; return; }
    let node=this.data; for(let i=0;i<ps.length-1;i++){ const k=ps[i]; if(!node[k] || typeof node[k]!=='object') node[k]={}; node=node[k]; }
    if(value===null) delete node[ps[ps.length-1]]; else node[ps[ps.length-1]]=value;
  }
  notify(path){
    for(const l of this.listeners.slice()){
      if(path===l.path || path.startsWith(l.path+'/') || l.path.startsWith(path+'/')){
        try{ l.cb(new DemoSnapshot(this.queryValue(l.ref),this.lastKey(l.path))); }catch(e){ console.error('[Demo listener]',e); }
      }
    }
  }
  lastKey(path){ const p=this.parts(path); return p.length?p[p.length-1]:null; }
  ref(path=''){ return new DemoRef(this,path); }
  queryValue(ref){
    let v=this.read(ref.path);
    if(!v || typeof v!=='object' || Array.isArray(v)) return v;
    let entries=Object.entries(v);
    const q=ref.query||{};
    if(q.order==='child') entries=entries.filter(([k,val])=>{const x=val&&val[q.child];return x!==undefined;}).sort((a,b)=>{const x=a[1][q.child],y=b[1][q.child];return x<y?-1:x>y?1:a[0].localeCompare(b[0]);});
    else entries.sort((a,b)=>a[0].localeCompare(b[0]));
    const valOf=([k,val])=>q.order==='child'?(val&&val[q.child]):k;
    if(q.start!==undefined) entries=entries.filter(e=>valOf(e)>=q.start);
    if(q.end!==undefined) entries=entries.filter(e=>valOf(e)<=q.end);
    if(q.first!==undefined) entries=entries.slice(0,q.first);
    if(q.last!==undefined) entries=entries.slice(-q.last);
    return Object.fromEntries(entries);
  }
}
class DemoRef {
  constructor(db,path,query={}){ this.db=db; this.path=String(path||'').replace(/^\/+|\/+$/g,''); this.query=query; this.key=this.path?this.path.split('/').pop():null; }
  child(path){ return new DemoRef(this.db,[this.path,path].filter(Boolean).join('/')); }
  orderByKey(){ return new DemoRef(this.db,this.path,{...this.query,order:'key'}); }
  orderByChild(child){ return new DemoRef(this.db,this.path,{...this.query,order:'child',child}); }
  startAt(value){ return new DemoRef(this.db,this.path,{...this.query,start:value}); }
  endAt(value){ return new DemoRef(this.db,this.path,{...this.query,end:value}); }
  limitToFirst(n){ return new DemoRef(this.db,this.path,{...this.query,first:n}); }
  limitToLast(n){ return new DemoRef(this.db,this.path,{...this.query,last:n}); }
  async get(){ await this.db.dbPromise; return new DemoSnapshot(this.db.queryValue(this),this.key); }
  once(event){ return this.get(); }
  on(event,callback){ const l={path:this.path,cb:callback,ref:this}; this.db.listeners.push(l); this.get().then(s=>callback(s)); return callback; }
  off(event,callback){ this.db.listeners=this.db.listeners.filter(l=>!(l.path===this.path && (!callback || l.cb===callback))); }
  async set(value){ await this.db.dbPromise; this.db.write(this.path,value); await this.db.persist(); this.db.notify(this.path); return null; }
  async update(values){
    await this.db.dbPromise;
    for(const [k,v] of Object.entries(values||{})) this.db.write([this.path,k].filter(Boolean).join('/'),v);
    await this.db.persist(); this.db.notify(this.path); return null;
  }
  async remove(){ return this.set(null); }
  async transaction(updater){
    await this.db.dbPromise; const raw=this.db.read(this.path); const before=raw==null?null:JSON.parse(JSON.stringify(raw)); const next=updater(before);
    if(next===undefined) return {committed:false,snapshot:new DemoSnapshot(before,this.key)};
    this.db.write(this.path,next); await this.db.persist(); this.db.notify(this.path);
    return {committed:true,snapshot:new DemoSnapshot(next,this.key)};
  }
  push(value){
    const chars='-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz'; let t=Date.now(), prefix=''; for(let i=0;i<8;i++){prefix=chars.charAt(t%64)+prefix;t=Math.floor(t/64);} let suffix=''; for(let i=0;i<12;i++) suffix+=chars.charAt(Math.floor(Math.random()*64)); const key=prefix+suffix;
    const child=this.child(key);
    if(arguments.length) return child.set(value).then(()=>child);
    return child;
  }
}

    try{const snap=await withTimeout(fbRoot.child(encodeKey(key)).get());return snap.exists()?{key,value:snap.val(),shared:!!shared}:null;}catch(e){console.error('[Demo storage get]',e);return null;}

    if(LOCAL_ONLY_KEYS.has(key)){try{localStorage.setItem(DEMO_LOCAL_PREFIX+key,value);return {key,value,shared:false};}catch(e){return null;}}
    try{await withTimeout(fbRoot.child(encodeKey(key)).set(value));return {key,value,shared:!!shared};}catch(e){console.error('[Demo storage set]',e);return null;}

  }
};

//

//    → "Que dia e hora são AGORA, cronologicamente, em Brasília?"
//    → Usada por occDeadline/isBlockedLate/isOverdue para comparar contra
//      prazos — isso é INTOCADO, pois já funciona corretamente.
//

//   00:00:00 – 06:59:59 (BRT) → referência = dia anterior
//   07:00:00 – 23:59:59 (BRT) → referência = dia atual

  }
  return op;
}

// SHA-256 simples para validar senha sem expor em texto puro
async function hashPassword(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function resolveFreq(loc, turnKey, date){
  // Sempre usa a data explicitamente passada (lida do seletor de data do formulário).
  // Cria uma cópia normalizada para garantir que getDay() reflita o dia correto
  // independentemente do fuso horário local — evita off-by-one quando a data
  // vem de um <input type="date"> (ex: "2025-07-22" → new Date("2025-07-22")
  // é interpretado como UTC meia-noite, mas getDay() usa hora local).
  const ref = date ? (() => {
    const d = new Date(date);
    // Se a data veio de um input type="date" ela já está como objeto Date local;
    // se por acaso for meia-noite UTC (string ISO), corrige para o dia local:
    if(d.getHours()===0 && d.getMinutes()===0 && d.getTimezoneOffset()!==0){
      d.setMinutes(d.getMinutes() + d.getTimezoneOffset()); // ajusta para local
    }
    return d;
  })() : currentDate;
  const dow = ref.getDay(); // 0=Dom, 1=Seg … 6=Sáb

  const raw = loc.f[turnKey];
  if(raw === '3pw'){
    // Seg(1), Qua(3), Sex(5)
    return (dow===1||dow===3||dow===5) ? 1 : 0;
  }
  if(typeof raw === 'string' && raw.startsWith('wk:')){
    // 'wk:2,5' = ocorre nos dias da semana informados (0=Dom..6=Sáb), 1x em cada
    const days = raw.slice(3).split(',').map(Number);
    return days.includes(dow) ? 1 : 0;
  }
  return typeof raw === 'number' ? raw : 0;
}

}

/* ===================== ATRASO AUTOMÁTICO =====================
   Turno 1: 06h–18h  |  Turno 2: 18h–06h (do dia seguinte).
   Em cada dia, só uma das colunas (Par ou Ímpar) do turno está "em jogo",
   dependendo se o dia do mês é par ou ímpar. As ocorrências daquele turno
   são distribuídas em intervalos iguais dentro das 12h — ex: 6 ocorrências
   = 1 a cada 2h. Se o horário-limite de uma ocorrência já passou e ela
   continua "pendente", ela é destacada em vermelho automaticamente (sem
   alterar o dado salvo — é só um alerta visual). */
function isParDay(date){ return date.getDate()%2===0; }
function turnParity(turnKey){ return (turnKey==='T1D'||turnKey==='T1N') ? 'par' : 'impar'; }
function getShiftWindow(turnKey, date){
  const d = new Date(date); d.setHours(0,0,0,0);
  if(turnKey==='T1D' || turnKey==='T2D'){
    const start = new Date(d); start.setHours(7,0,0,0);
    const end = new Date(d); end.setHours(19,0,0,0);
    return {start, end};
  } else {
    const start = new Date(d); start.setHours(19,0,0,0);
    const end = new Date(d); end.setDate(end.getDate()+1); end.setHours(7,0,0,0);
    return {start, end};
  }
}
function occDeadline(loc, turnKey, idx, date){
  const n = resolveFreq(loc, turnKey, date);
  if(!n || idx>=n) return null;
  // Locais com janelas fixas (ex.: Refeitório Meli): o prazo é o horário de término
  // da própria refeição, em vez de intervalos iguais dentro do turno.
  if(loc.meals && loc.meals[turnKey] && loc.meals[turnKey][idx]){
    const m = loc.meals[turnKey][idx];
    const d = new Date(date); d.setHours(0,0,0,0);
    d.setHours(m.end[0], m.end[1], 0, 0);
    return d;
  }
  const {start,end} = getShiftWindow(turnKey, date);
  const interval = (end-start)/n;
  return new Date(start.getTime() + interval*(idx+1));
}
// Retorna true se o local é banheiro (frequência 6 por turno)
function isBathroomLoc(loc){
  return Object.values(loc.f).some(v => v === 6);
}
// Retorna a tolerância de bloqueio após o deadline (ms)
// Última ocorrência do turno: 30min após FIM do turno
// Demais ocorrências: 1h após o deadline da ocorrência
function blockTolerance(loc, turnKey, idx, date){
  const n = resolveFreq(loc, turnKey, date);
  const {end} = getShiftWindow(turnKey, date);
  const dl = occDeadline(loc, turnKey, idx, date);
  if(!dl) return 60*60*1000;
  const isLast = (idx === n-1);
  if(isLast){
    // Última ocorrência: permite até 30min após o fim do turno
    return (end.getTime() + 30*60*1000) - dl.getTime();
  } else {
    // Demais: 1h de tolerância após o deadline
    return 60*60*1000;
  }
}

// Overdue unificado: pendente e passou do deadline
function isOverdue(loc, turnKey, idx, date, state){
  if(state!=='pending') return false;
  const dayPar = isParDay(date);
  const colParity = turnParity(turnKey);
  if((dayPar && colParity!=='par') || (!dayPar && colParity!=='impar')) return false;
  const deadline = occDeadline(loc, turnKey, idx, date);
  if(!deadline) return false;
  const nowMs = dsNowBrtMs();
  return nowMs > deadline.getTime();
}

// Blocked unificado: pendente e passou deadline + tolerância
// Para banheiros: também bloqueia se muito cedo (>2h antes)
function isBlockedLate(loc, turnKey, idx, date, state){
  if(state !== 'pending') return false;
  if(isAdmin) return false;
  const deadline = occDeadline(loc, turnKey, idx, date);
  if(!deadline) return false;
  const nowMs = dsNowBrtMs();
  const dl = deadline.getTime();
  const tol = blockTolerance(loc, turnKey, idx, date);
  const tooLate = nowMs > dl + tol;
  if(isBathroomLoc(loc)){
    // Banheiros: também bloqueia antecipação >2h
    const tooEarly = nowMs < dl - 2*60*60*1000;
    return tooEarly || tooLate;
  }
  return tooLate;
}

// T1D/T2D = Par, T1N/T2N = Ímpar
// Dentro do turno: T*D (diurno) = 06:00-18:00 | T*N (noturno) = 18:00-06:00
// Retorna a hora BRT atual como objeto Date
function nowBRT(){ return new Date(dsNowBrtMs()); }
/* Hora de Brasília em ms. No desktop é calculada uma vez por segundo (a conversão por toLocaleString era refeita milhares de vezes por tela);
   no celular continua exatamente como antes. */
function dsNowBrtMs(){
  const conv = t => new Date(new Date(t).toLocaleString('en-US',{timeZone:'America/Sao_Paulo'})).getTime();
  if(!window.__dsDesk) return conv(Date.now());
  const t = Date.now(), T = window.__dsNowT || 0;
  if(!T || t - T > 1000 || t < T){ window.__dsNowB = conv(t); window.__dsNowT = t; return window.__dsNowB; }
  return window.__dsNowB + (t - T);
}

function isTurnBlocked(turnKey){
  if(isAdmin) return false;
  // Usa fuso de Brasília (UTC-3) para garantir horário correto independente do dispositivo
  const nowBRT = new Date(dsNowBrtMs());
  const h = nowBRT.getHours();
  const isDiurnoAgora = h >= 7 && h < 19;
  // D = diurno (06-18h), N = noturno (18-06h)
  const turnIsDiurno  = turnKey === 'T1D' || turnKey === 'T2D';
  const turnIsNoturno = turnKey === 'T1N' || turnKey === 'T2N';
  if(turnIsDiurno  && !isDiurnoAgora) return true;  // turno diurno bloqueado à noite
  if(turnIsNoturno &&  isDiurnoAgora) return true;  // turno noturno bloqueado de dia
  return false;
}

/* ===================== FOTO ANEXADA NAS SOLICITAÇÕES =====================
   Comprime a imagem no navegador (redimensiona + JPEG) antes de salvar como
   base64 junto da solicitação no banco de dados — evita depender de um serviço de
   armazenamento de arquivos separado. */
function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } }
        else { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('Não foi possível ler a imagem.'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('Não foi possível ler o arquivo.'));
    reader.readAsDataURL(file);
  });
}
async function compressImageWithLimit(file, maxBytes){
  let dataUrl = await compressImage(file, 900, 0.6);
  if(dataUrl.length > maxBytes) dataUrl = await compressImage(file, 700, 0.45);
  if(dataUrl.length > maxBytes) dataUrl = await compressImage(file, 500, 0.35);
  return dataUrl;
}

    document.getElementById('repNext').onclick = ()=>{
      if(reportPeriod==='day') reportDate.setDate(reportDate.getDate()+1);
      else if(reportPeriod==='week') reportDate.setDate(reportDate.getDate()+7);
      else reportDate.setMonth(reportDate.getMonth()+1);
      renderTopControls(); renderReport();
    };
    wireUserPillButtons();
  } else {
    tc.innerHTML = userPill;
    wireUserPillButtons();
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   ANEXOS POR LIMPEZA (fotos e PDF) — escopo: DIA + TURNO + LOCAL
   Padrão de armazenamento idêntico ao módulo de documentos já existente:
     anexosIdx/{ds}/{locKey}/{id}  → metadados mínimos (carregado com o dia)
     anexosThumbs/{id}             → miniatura (carregada só ao abrir o modal)
     anexosFiles/{id}              → arquivo completo em base64 (só ao abrir)
     anexosStats                   → {bytes,count} (medidor de uso, admin)
   A tela do Plano NUNCA baixa foto/PDF: só o índice (poucas centenas de bytes).
   Não altera nenhum dado nem regra do checklist (checklist:{ds} fica intocado).
   ═══════════════════════════════════════════════════════════════════════ */
const ANX_MAX_FILES  = 30;                 // por local/turno/dia
const ANX_MAX_PDF    = 3*1024*1024;        // 3 MB por PDF
const ANX_IMG_STEPS  = [[1280,0.68],[1024,0.58],[800,0.50]]; // tenta nesta ordem
const ANX_IMG_TARGET = 380*1024;           // alvo (caracteres do dataURL ≈ bytes gravados)
const ANX_IMG_HARD   = 700*1024;           // acima disso, recusa
const ANX_POOL       = 2;                  // arquivos processados em paralelo (poupa memória do celular)
const ANX_QUOTA      = 1024*1024*1024;     // 1 GB — plano gratuito do Realtime Database
const ANX_TURN_LABEL = {T1D:'T1 Par',T2D:'T1 Ímpar',T1N:'T2 Par',T2N:'T2 Ímpar'};
const _anxIdx = {};                        // ds → {ts, data}
const _anxThumbCache = new Map();          // id → dataURL

const _anxEsc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function anxLocKey(loc, turnKey){ return (turnKey+'~'+String(loc)).replace(/[.#$\[\]\/\u0000-\u001f]/g,'_'); }
function anxWho(){ return (currentUser && currentUser.nome) || currentEmployee || 'Operador'; }
function anxFmtSize(b){ return b>=1048576 ? (b/1048576).toFixed(1).replace('.',',')+' MB' : Math.max(1,Math.round(b/1024))+' KB'; }
function anxFmtWhen(ts){ const d=new Date(ts); return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }

async function anxLoadIndex(ds, force){
  const c = _anxIdx[ds];
  if(!force && c && (Date.now()-c.ts) < 60000) return c.data;
  try{
    const s = await withTimeout(fbRoot.child('anexosIdx/'+ds).get(), 15000);
    const data = s.exists() ? s.val() : {};
    _anxIdx[ds] = {ts:Date.now(), data};
    return data;
  }catch(e){ return (c && c.data) || {}; }
}
function anxItems(ds, lk){ const c=_anxIdx[ds]; return (c && c.data && c.data[lk]) || {}; }

/* Botão que aparece em cada linha de local (HTML gerado dentro do renderDay) */
function anxButtonHtml(locName, turnKey){
  return `<button type="button" class="anx-btn" data-loc="${_anxEsc(locName)}" data-turn="${turnKey}" data-lk="${_anxEsc(anxLocKey(locName,turnKey))}" title="Anexar fotos ou PDF desta limpeza"><span class="anx-ic">📎</span><span class="anx-lbl">Anexar</span></button>`;
}
function anxPaintButtons(ds){
  const data = (_anxIdx[ds] && _anxIdx[ds].data) || {};
  document.querySelectorAll('.anx-btn').forEach(b=>{
    const n = Object.keys(data[b.dataset.lk]||{}).length;
    b.classList.toggle('has', n>0);
    b.querySelector('.anx-lbl').textContent = n>0 ? String(n) : 'Anexar';
    b.title = n>0 ? n+' anexo(s) nesta limpeza — clique para ver' : 'Anexar fotos ou PDF desta limpeza';
  });
}
function anxWireOnce(){
  const app = document.getElementById('app');
  if(!app || app._anxWired) return;
  app._anxWired = true;
  app.addEventListener('click', e=>{
    const b = e.target.closest && e.target.closest('.anx-btn');
    if(!b) return;
    e.preventDefault(); e.stopPropagation();
    anxOpenModal(b.dataset.loc, b.dataset.turn);
  });
}
/* Chamado ao fim do renderDay: pinta com o cache na hora (sem piscar) e atualiza em segundo plano */
function anxAfterRender(ds){
  anxWireOnce();
  anxPaintButtons(ds);
  const c = _anxIdx[ds];
  if(!c || (Date.now()-c.ts) >= 60000){
    anxLoadIndex(ds).then(()=>{ if(dateStr(currentDate)===ds) anxPaintButtons(ds); });
  }
}

/* ── Preparação dos arquivos (redução no próprio celular) ── */
function anxReadB64(file){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onload = ()=>{ const s=String(fr.result); res(s.slice(s.indexOf(',')+1)); };
    fr.onerror = ()=>rej(new Error('Não foi possível ler o arquivo.'));
    fr.readAsDataURL(file);
  });
}
async function anxPrepare(file){
  const isPdf = file.type==='application/pdf' || /\.pdf$/i.test(file.name||'');
  const isImg = !isPdf && /^image\//.test(file.type||'');
  if(!isPdf && !isImg) throw new Error('Formato não aceito — use foto ou PDF.');
  if(isPdf){
    if(file.size > ANX_MAX_PDF) throw new Error('PDF com '+anxFmtSize(file.size)+' (limite '+anxFmtSize(ANX_MAX_PDF)+'). Reduza o arquivo e tente de novo.');
    const b64 = await anxReadB64(file);
    return {t:'pdf', b64, thumb:null, size:b64.length};
  }
  let full = null;
  for(const [dim,q] of ANX_IMG_STEPS){
    full = await compressImage(file, dim, q);          // função já existente no sistema
    if(full.length <= ANX_IMG_TARGET) break;
  }
  if(full.length > ANX_IMG_HARD) throw new Error('Imagem muito pesada mesmo após reduzir.');
  const thumb = await compressImage(file, 256, 0.6);
  return {t:'img', b64: full.slice(full.indexOf(',')+1), thumb, size: full.length + thumb.length};
}
async function anxSaveOne(ds, lk, file){
  const p = await anxPrepare(file);
  const id = 'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const meta = {n:(file.name||'arquivo').slice(0,80), t:p.t, s:p.size, by:anxWho(), ts:Date.now()};
  const up = {};
  up['anexosIdx/'+ds+'/'+lk+'/'+id] = meta;           // índice + arquivo + miniatura gravados juntos (atômico)
  up['anexosFiles/'+id] = p.b64;
  if(p.thumb) up['anexosThumbs/'+id] = p.thumb;
  try{ await withTimeout(fbRoot.update(up), 60000); }
  catch(e){ throw new Error('Sem conexão com o servidor — tente novamente.'); }
  try{ fbRoot.child('anexosStats').transaction(cur=>({bytes:((cur&&cur.bytes)||0)+p.size, count:((cur&&cur.count)||0)+1})); }catch(e){}
  if(p.thumb) _anxThumbCache.set(id, p.thumb);
  const c = _anxIdx[ds] || (_anxIdx[ds] = {ts:Date.now(), data:{}});
  (c.data[lk] = c.data[lk] || {})[id] = meta;
  return id;
}

/* ── Modal ── */
function anxOpenModal(locName, turnKey){
  const ds = dateStr(currentDate), lk = anxLocKey(locName, turnKey);
  document.getElementById('anxOverlay')?.remove();
  const ov = document.createElement('div');
  ov.id = 'anxOverlay'; ov.className = 'anx-overlay';
  ov.innerHTML = `
    <div class="anx-modal" role="dialog" aria-modal="true">
      <div class="anx-head">
        <div style="min-width:0;">
          <div class="anx-title">📎 Anexos da limpeza</div>
          <div class="anx-sub">${_anxEsc(locName)} · ${ANX_TURN_LABEL[turnKey]||turnKey} · ${fmtBR(currentDate)}</div>
        </div>
        <button type="button" class="anx-x" id="anxClose" aria-label="Fechar">✕</button>
      </div>
      <div class="anx-body">
        <div class="anx-actions">
          <button type="button" class="btn" id="anxPick">📷 Fotos / PDF</button>
          <button type="button" class="btn secondary" id="anxShoot">📸 Tirar foto</button>
        </div>
        <input type="file" id="anxFiles" accept="image/*,application/pdf,.pdf" multiple hidden>
        <input type="file" id="anxCam" accept="image/*" capture="environment" hidden>
        <div class="anx-hint">Fotos são reduzidas automaticamente. PDF até ${anxFmtSize(ANX_MAX_PDF)}. Máximo de ${ANX_MAX_FILES} arquivos por local/turno.</div>
        <div id="anxQueue"></div>
        <div id="anxGrid" class="anx-grid"></div>
      </div>
      <div class="anx-foot" id="anxFoot"></div>
    </div>`;
  document.body.appendChild(ov);

  const grid = ov.querySelector('#anxGrid'), queue = ov.querySelector('#anxQueue'), foot = ov.querySelector('#anxFoot');
  const close = ()=>{ ov.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e=>{ if(e.key==='Escape' && !document.getElementById('photoLightbox')?.style.display.includes('flex')) close(); };
  document.addEventListener('keydown', onKey);
  ov.querySelector('#anxClose').onclick = close;
  ov.addEventListener('click', e=>{ if(e.target===ov) close(); });

  async function paint(){
    const items = Object.entries(anxItems(ds,lk)).map(([id,m])=>({id,...m})).sort((a,b)=>b.ts-a.ts);
    if(!document.getElementById('anxGrid')) return;
    grid.innerHTML = items.length ? items.map(m=>`
      <div class="anx-item" data-id="${m.id}">
        ${m.t==='pdf'
          ? `<div class="anx-pdf"><span>📄</span><span class="anx-pdf-lbl">PDF</span></div>`
          : `<img class="anx-thumb" alt="" data-thumb="${m.id}">`}
        <div class="anx-cap" title="${_anxEsc(m.n)}">${_anxEsc(m.n)}</div>
        <div class="anx-cap sub">${anxFmtSize(m.s)} · ${_anxEsc((m.by||'').split(' ')[0])} · ${anxFmtWhen(m.ts)}</div>
        ${(isAdmin || m.by===anxWho()) ? `<button type="button" class="anx-del" data-del="${m.id}" aria-label="Excluir">🗑</button>` : ''}
      </div>`).join('') : `<div class="anx-empty">Nenhum anexo ainda. Toque em “Fotos / PDF” para adicionar.</div>`;
    foot.textContent = items.length ? items.length+' arquivo(s) neste local/turno' : '';
    anxPaintButtons(ds);
    // miniaturas: do cache ou buscadas (4 por vez)
    const pend = [];
    grid.querySelectorAll('img[data-thumb]').forEach(img=>{
      const id = img.dataset.thumb;
      if(_anxThumbCache.has(id)) img.src = _anxThumbCache.get(id); else pend.push(img);
    });
    let k = 0;
    await Promise.all(Array.from({length:Math.min(4,pend.length)}, async ()=>{
      while(k < pend.length){
        const img = pend[k++], id = img.dataset.thumb;
        try{
          const s = await withTimeout(fbRoot.child('anexosThumbs/'+id).get(), 20000);
          if(s.exists()){
            if(_anxThumbCache.size > 400) _anxThumbCache.clear();
            _anxThumbCache.set(id, s.val()); img.src = s.val();
          }
        }catch(e){}
      }
    }));
  }

  async function openItem(id){
    const m = anxItems(ds,lk)[id]; if(!m) return;
    const card = grid.querySelector(`[data-id="${id}"]`); card?.classList.add('busy');
    let w = null;
    if(m.t==='pdf'){ w = window.open('', '_blank'); if(w) w.document.write('<p style="font-family:Arial;padding:20px;color:#555">Carregando PDF…</p>'); }
    try{
      const s = await withTimeout(fbRoot.child('anexosFiles/'+id).get(), 60000);
      if(!s.exists()) throw new Error('Arquivo não encontrado no servidor.');
      if(m.t==='pdf'){
        const bin = atob(s.val()), u = new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
        const url = URL.createObjectURL(new Blob([u], {type:'application/pdf'}));
        if(w) w.location.href = url;
        else { const a=document.createElement('a'); a.href=url; a.download=m.n||'anexo.pdf'; document.body.appendChild(a); a.click(); a.remove(); }
        setTimeout(()=>URL.revokeObjectURL(url), 120000);
      } else showPhotoLightbox('data:image/jpeg;base64,'+s.val());
    }catch(e){ if(w) w.close(); alert('❌ '+(e.message||'Não foi possível abrir o anexo.')); }
    finally{ card?.classList.remove('busy'); }
  }
  async function delItem(id){
    const m = anxItems(ds,lk)[id]; if(!m) return;
    // validação real no momento da ação (não depende do botão estar visível)
    if(!(isAdmin || m.by===anxWho())){ alert('Somente o administrador ou quem anexou pode excluir.'); return; }
    if(!confirm('Excluir "'+m.n+'"?')) return;
    const up = {};
    up['anexosIdx/'+ds+'/'+lk+'/'+id] = null; up['anexosFiles/'+id] = null; up['anexosThumbs/'+id] = null;
    try{ await withTimeout(fbRoot.update(up), 30000); }catch(e){ alert('❌ Sem conexão — não foi possível excluir.'); return; }
    try{ fbRoot.child('anexosStats').transaction(cur=>({bytes:Math.max(0,((cur&&cur.bytes)||0)-(m.s||0)), count:Math.max(0,((cur&&cur.count)||0)-1)})); }catch(e){}
    delete _anxIdx[ds].data[lk][id]; _anxThumbCache.delete(id);
    paint();
  }
  grid.addEventListener('click', e=>{
    const d = e.target.closest('[data-del]');
    if(d){ e.stopPropagation(); delItem(d.dataset.del); return; }
    const it = e.target.closest('.anx-item'); if(it) openItem(it.dataset.id);
  });

  /* envio em lote com fila e barra de progresso */
  async function handleFiles(fileList){
    const files = Array.from(fileList||[]);
    if(!files.length) return;
    const room = ANX_MAX_FILES - Object.keys(anxItems(ds,lk)).length;
    if(room <= 0){ alert('Limite de '+ANX_MAX_FILES+' arquivos neste local/turno já atingido.'); return; }
    const take = files.slice(0, room);
    if(files.length > take.length) alert('Só cabem mais '+room+' arquivo(s) — os demais foram ignorados.');
    const rows = take.map((f,i)=>{
      const r = document.createElement('div'); r.className='anx-q';
      r.innerHTML = `<span class="n">${_anxEsc(f.name||'arquivo')}</span><span class="st">⏳ na fila</span>`;
      queue.appendChild(r); return r;
    });
    let next = 0, ok = 0, fail = 0;
    await Promise.all(Array.from({length:Math.min(ANX_POOL,take.length)}, async ()=>{
      while(next < take.length){
        const i = next++, st = rows[i].querySelector('.st');
        st.textContent = '⏳ enviando…';
        try{ await anxSaveOne(ds, lk, take[i]); st.textContent='✓ enviado'; st.className='st ok'; ok++; await paint(); }
        catch(e){ st.textContent='✕ '+(e.message||'falhou'); st.className='st bad'; fail++; }
      }
    }));
    setTimeout(()=>{ rows.forEach(r=>{ if(r.querySelector('.st.ok')) r.remove(); }); }, 2500);
    anxStatsFoot();
  }
  ov.querySelector('#anxPick').onclick  = ()=>ov.querySelector('#anxFiles').click();
  ov.querySelector('#anxShoot').onclick = ()=>ov.querySelector('#anxCam').click();
  [ov.querySelector('#anxFiles'), ov.querySelector('#anxCam')].forEach(inp=>{
    inp.addEventListener('change', ()=>{ const f=inp.files; handleFiles(f).finally(()=>{ inp.value=''; }); });
  });

  /* medidor de uso — somente administrador */
  async function anxStatsFoot(){
    if(!isAdmin) return;
    try{
      const s = await withTimeout(fbRoot.child('anexosStats').get(), 8000);
      const v = s.exists() ? s.val() : {bytes:0,count:0};
      const pct = Math.min(100, (v.bytes||0)/ANX_QUOTA*100);
      const el = document.getElementById('anxFoot'); if(!el) return;
      const base = el.dataset.base || el.textContent; el.dataset.base = base;
      el.innerHTML = `${_anxEsc(base)}<div class="anx-meter"><div class="anx-meter-bar"><i style="width:${Math.max(1,pct).toFixed(1)}%"></i></div><span>Uso total de anexos: ${anxFmtSize(v.bytes||0)} (${v.count||0} arquivos) — ${pct.toFixed(1).replace('.',',')}% de 1 GB do plano gratuito</span></div>`;
    }catch(e){}
  }
  (async ()=>{
    grid.innerHTML = '<div class="anx-empty">Carregando…</div>';
    await anxLoadIndex(ds, true);
    await paint();
    anxStatsFoot();
  })();
}

/* Nome curto para caber na célula: primeiro nome, no máx. 7 caracteres (ponto quando cortado).
   Só afeta a EXIBIÇÃO — o nome completo continua gravado e aparece no tooltip e no relatório. */
function occShortName(full){
  const first = String(full==null?'':full).trim().split(/\s+/)[0] || '';
  const MAX = 7;
  return first.length > MAX ? first.slice(0, MAX-1) + '.' : first;
}

async function renderDay(){
  const app = document.getElementById('app');
  // Preserva a posição de rolagem atual (desktop e celular) para restaurar após o re-render.
  const _scrollY = window.scrollY || window.pageYOffset || document.documentElement.scrollTop || 0;
  if(!app.innerHTML.includes('loading')) app.innerHTML = '<div class="loading">Carregando...</div>';
  const ds = dateStr(currentDate);
  const data = await loadDay(ds);
  const dayLocations = getLocationsForDate(currentDate);

  let totalOcc=0, doneOcc=0;
  const turns = activeTurns(currentDate);
  dayLocations.forEach(loc=>{
    turns.forEach(t=>{
      const n = resolveFreq(loc, t.key, currentDate);
      for(let i=0;i<n;i++){
        totalOcc++;
        const k = loc.name+'|'+t.key+'|'+i;
        if(getEntry(data,k).state==='done') doneOcc++;
      }
    });
  });
  const pct = totalOcc? Math.round(doneOcc/totalOcc*100):0;

  // turn color scheme: Par = teal, Ímpar = amber/purple
  const TURN_COLORS = {
    T1D: { head:'#1a5c5e', accent:'#3fd6c9', label:'Par' },
    T2D: { head:'#3b2a6b', accent:'#a78bfa', label:'Ímpar' },
    T1N: { head:'#1a5c5e', accent:'#3fd6c9', label:'Par' },
    T2N: { head:'#3b2a6b', accent:'#a78bfa', label:'Ímpar' },
  };
  const TURN_NAMES = {
    T1D: 'T1 Par', T2D: 'T1 Ímpar', T1N: 'T2 Par', T2N: 'T2 Ímpar',
  };

  // ── Progresso e performance POR TURNO ──────────────────────────────────
  // Cada turno ativo do dia recebe sua própria barra, com % geral do turno
  // (igual sempre foi: concluídas/total do turno) e cor de performance
  // baseada SOMENTE nas ocorrências já devidas (occDeadline <= agora),
  // reutilizando a mesma função de deadline já usada para bloqueios/atrasos.
  // Isso respeita automaticamente a virada de meia-noite do ciclo T*N,
  // pois occDeadline() já soma 1 dia internamente via getShiftWindow().
  const agora = actualDateTimeBRT();
  // ── Filtro de turno (T1/T2) — seleção manual persistente ──────────────
  // 'auto' = mostra os dois turnos do dia (comportamento original, sempre
  //          foi assim). 'T1' = mostra somente o turno diurno (T1D/T2D).
  // 'T2' = mostra somente o turno noturno (T1N/T2N).
  // Isso NÃO cria uma segunda fonte de dados: continua usando 'turns',
  // resultado de activeTurns(date) — só reduz a lista para o turno
  // escolhido antes de renderizar. Nenhum cálculo de frequência,
  // deadline ou periodicidade é alterado.
  const isMobileViewport = window.matchMedia('(max-width:767px)').matches;
  const renderOrder = (isMobileViewport && (turnFocus === 'T1' || turnFocus === 'T2'))
    ? turns.filter(t => turnFocus === 'T1'
        ? (t.key === 'T1D' || t.key === 'T2D') // diurno
        : (t.key === 'T1N' || t.key === 'T2N') // noturno
      )
    : turns;

  const turnStats = turns.map(t=>{
    let total=0, done=0, esperado=0, realizado=0;
    dayLocations.forEach(loc=>{
      const n = resolveFreq(loc, t.key, currentDate);
      for(let i=0;i<n;i++){
        total++;
        const k = loc.name+'|'+t.key+'|'+i;
        const isDone = getEntry(data,k).state==='done';
        if(isDone) done++;
        const dl = occDeadline(loc, t.key, i, currentDate);
        if(dl && dl.getTime() <= agora.getTime()){
          esperado++;
          if(isDone) realizado++;
        }
      }
    });
    const turnPct = total? Math.round(done/total*100):0;
    const performance = esperado>0 ? (realizado/esperado) : null;
    let barColor;
    if(performance === null){
      barColor = 'linear-gradient(90deg,var(--teal),var(--teal-bright))';
    } else if(performance >= 0.95){
      barColor = 'linear-gradient(90deg,#2d7d46,var(--ok))';
    } else if(performance >= 0.80){
      barColor = 'linear-gradient(90deg,#a67c1a,var(--amber))';
    } else {
      barColor = 'linear-gradient(90deg,#8a3229,var(--bad))';
    }
    return {key:t.key, total, done, turnPct, barColor};
  });
  const turnStatsOrdered = (isMobileViewport && (turnFocus === 'T1' || turnFocus === 'T2'))
    ? turnStats.filter(ts => turnFocus === 'T1'
        ? (ts.key === 'T1D' || ts.key === 'T2D')
        : (ts.key === 'T1N' || ts.key === 'T2N')
      )
    : turnStats;

  let html = `
    <div class="progress-bar-outer" style="flex-direction:column;align-items:stretch;gap:12px;">
      <div class="label" style="min-width:0;">${['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'][currentDate.getDay()]+', '+fmtBR(currentDate)} — progresso do dia</div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;">
        ${turnStatsOrdered.map(ts => `
          <div style="flex:1;min-width:200px;display:flex;align-items:center;gap:10px;">
            <span style="font-size:12px;color:var(--text-dim);min-width:64px;font-weight:600;">${TURN_NAMES[ts.key]}</span>
            <div class="progress-track" style="flex:1;"><div class="progress-fill" style="width:${ts.turnPct}%;background:${ts.barColor};"></div></div>
            <span style="font-size:13px;font-weight:700;color:var(--teal-bright);min-width:40px;text-align:right;">${ts.turnPct}%</span>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- lupa / filtro -->
    <div class="search-sticky-row">
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="lsearch-wrap">
          <span style="position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--text-dim);pointer-events:none;z-index:1;">🔍</span>
          <input type="text" id="locSearch" placeholder="Buscar local..." autocomplete="off"
            style="width:100%;padding:9px 12px 9px 34px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;font-size:13.5px;">
          <div class="lsearch-dd" id="locSearchDD"></div>
        </div>
        <div class="desktop-only-parity" style="display:flex;gap:8px;font-size:12px;">
          ${currentDate.getDate()%2===0
            ? '<span style="display:flex;align-items:center;gap:5px;color:#3fd6c9;font-weight:700;"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#1f8a8c;"></span>Dia par — exibindo T1 Par e T2 Par</span>'
            : '<span style="display:flex;align-items:center;gap:5px;color:#a78bfa;font-weight:700;"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#7c3aed;"></span>Dia ímpar — exibindo T1 Ímpar e T2 Ímpar</span>'
          }
        </div>
      </div>
    </div>

    <div class="turn-grid" id="turnGrid">
  `;

  renderOrder.forEach(t=>{
    const tc = TURN_COLORS[t.key];
    html += `<div class="turn-card" data-turn="${t.key}" style="border-color:${tc.accent}33;">
      <div class="turn-head" style="background:${tc.head};border-bottom-color:${tc.accent}44;">
        <span style="color:${tc.accent};">${t.label}</span>
        <span class="count" data-turncount="${t.key}" style="color:${tc.accent};opacity:.7;"></span>
      </div>`;
    dayLocations.forEach(loc=>{
      const n = resolveFreq(loc, t.key, currentDate);
      if(n<=0) return;
      html += `<div class="loc-row" data-locname="${loc.name.toLowerCase()}"><div class="loc-name">${loc.name}</div>${anxButtonHtml(loc.name,t.key)}<div class="occ-list">`;
      for(let i=0;i<n;i++){
        const k = loc.name+'|'+t.key+'|'+i;
        const entry = getEntry(data,k);
        const st = entry.state || 'pending';
        const overdue = isOverdue(loc, t.key, i, currentDate, st);
        const blocked = isBlockedLate(loc, t.key, i, currentDate, st) || (st==='pending' && isTurnBlocked(t.key));
        const cls = blocked ? 'overdue blocked-late' : overdue ? 'overdue' : st;
        const mealInfo = (loc.meals && loc.meals[t.key] && loc.meals[t.key][i]) ? loc.meals[t.key][i] : null;
        const fmt2 = (h,m)=>String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
        let title = mealInfo
          ? mealInfo.label+' — '+fmt2(mealInfo.start[0],mealInfo.start[1])+' às '+fmt2(mealInfo.end[0],mealInfo.end[1])
          : 'Pendente';
        if(entry.ts){
          title = (st==='done'?'Concluído':'Não realizado')+' em '+fmtBR(new Date(entry.ts))+' '+fmtTime(entry.ts);
          if(entry.emp) title += ' — '+entry.emp;
        } else if(st==='pending' && isTurnBlocked(t.key)){
          const isDiurno = t.key==='T1D'||t.key==='T2D';
          title = isDiurno
            ? 'Turno diurno — disponível das 07:00 às 19:00'
            : 'Turno noturno — disponível das 19:00 às 07:00';
        } else if(blocked){
          const dl = occDeadline(loc, t.key, i, currentDate);
          const now = Date.now();
          const dlMs = dl ? dl.getTime() : 0;
          const tooEarly = dlMs && now < dlMs - 2*3600000;
          title = tooEarly
            ? `Disponível a partir das ${fmtTime(dlMs - 2*3600000)} — aguarde o horário`
            : 'Prazo encerrado — lançamento não permitido.';
        } else if(overdue){
          const dl = occDeadline(loc, t.key, i, currentDate);
          title = 'Atrasado — deveria ter sido feito até '+fmtTime(dl.getTime());
        }
        const dl = occDeadline(loc, t.key, i, currentDate);
        const dlTime = dl ? fmtTime(dl.getTime()) : '';
        const isBathroom = isBathroomLoc(loc);
        const showTime = isBathroom || !!mealInfo;
        let timeHtml = '';
        if(entry.ts){
          // Exibe o horário exato do registro (Concluído/Não realizado) em QUALQUER ambiente,
          // não só banheiros/refeitório — mantendo o mesmo padrão de exibição já usado no sistema.
          timeHtml = `<div class="occ-time">${fmtTime(entry.ts)}</div>${entry.emp?`<div class="occ-time occ-who" title="${_anxEsc(entry.emp)}">${_anxEsc(occShortName(entry.emp))}</div>`:''}`;
        } else if(dlTime && showTime){
          const timeColor = blocked ? 'var(--bad)' : overdue ? 'var(--bad)' : 'var(--text-dim)';
          const mealLabel = mealInfo ? `<div class="occ-time" style="font-weight:600;color:${timeColor};">${mealInfo.label}</div>` : '';
          timeHtml = mealLabel + `<div class="occ-time" style="color:${timeColor};${(blocked||overdue)?'font-weight:600;':''}">${dlTime}</div>`;
        }
        if(!entry.ts && plExpirada(loc, t.key, i, currentDate, st)) timeHtml += '<div class="occ-time occ-who occ-nr" title="Não realizado — prazo encerrado sem execução">NR</div>';
        html += `<div class="occ-wrap"><div class="occ ${cls}" data-key="${k}" data-blocked="${blocked}" title="${title}">${blocked?'<span class="occ-lock">🔒</span>':overdue?'!':stateSymbol(st)}</div>${timeHtml}</div>`;
      }
      html += `</div></div>`;
    });
    html += `</div>`;
  });

  html += `</div>
    <div class="legend">
      <span><span class="dot pending"></span>Pendente</span>
      <span><span class="dot done"></span>Concluído</span>
      <span><span class="dot bad"></span>Não realizado</span>
      <span><span class="dot bad" style="animation:overduePulse 1.4s ease-in-out infinite;"></span>Atrasado (automático)</span>
      <span><b style="color:var(--bad);font-size:10.5px;">NR</b>&nbsp;Prazo encerrado sem execução</span>
    </div>
    <div class="legend">Clique numa célula para alternar: pendente → concluído → não realizado.</div>
  `;
  app.innerHTML = html;
  anxAfterRender(dateStr(currentDate));
  // Restaura a posição de rolagem exatamente onde estava antes do re-render.
  requestAnimationFrame(()=>{ window.scrollTo(0, _scrollY); });

  // (Seletor de turno agora fica no cabeçalho — ver wireHeaderTurnSelector())


  // contadores por turno
  turns.forEach(t=>{
    let total=0, done=0;
    dayLocations.forEach(loc=>{
      const n = resolveFreq(loc, t.key, currentDate);
      total += n;
      for(let i=0;i<n;i++){
        const k = loc.name+'|'+t.key+'|'+i;
        if(getEntry(data,k).state==='done') done++;
      }
    });
    const elSpan = app.querySelector(`[data-turncount="${t.key}"]`);
    if(elSpan) elSpan.textContent = done+'/'+total;
  });

  // lupa: filtra + autocomplete dropdown
  (function(){
    const input = document.getElementById('locSearch');
    const dd = document.getElementById('locSearchDD');
    if(!input || !dd) return;

    function getLocNames(){
      const names = new Set();
      app.querySelectorAll('.loc-row[data-locname]').forEach(r=>names.add(r.getAttribute('data-locname')));
      return [...names];
    }

    function filterRows(q){
      app.querySelectorAll('.loc-row[data-locname]').forEach(row=>{
        const match = !q || row.getAttribute('data-locname').includes(q);
        row.style.display = match ? '' : 'none';
      });
    }

    function openDD(q){
      const all = getLocNames();
      const filtered = q ? all.filter(n=>n.includes(q)) : all;
      dd.innerHTML = '';
      if(!filtered.length){
        dd.innerHTML = '<div class="lsearch-empty">Nenhum ambiente encontrado</div>';
      } else {
        // Show max 12 suggestions
        filtered.forEach(name=>{
          const div = document.createElement('div');
          div.className = 'lsearch-item';
          // Get display name from loc-row
          const row = app.querySelector(`.loc-row[data-locname="${name}"]`);
          const displayName = row ? (row.querySelector('.loc-name')?.textContent || name) : name;
          div.textContent = displayName;
          div.addEventListener('mousedown', e=>{
            e.preventDefault();
            input.value = displayName;
            filterRows(name);
            dd.classList.remove('open');
            // Scroll to first match
            const target = app.querySelector('.loc-row[data-locname="'+name+'"]');
            if(target) target.scrollIntoView({behavior:'smooth', block:'center'});
          });
          dd.appendChild(div);
        });
      }
      dd.classList.add('open');
    }

    input.addEventListener('focus', ()=>{ openDD(input.value.toLowerCase().trim()); });
    input.addEventListener('input', ()=>{
      const q = input.value.toLowerCase().trim();
      filterRows(q);
      openDD(q);
    });
    input.addEventListener('blur', ()=>{ setTimeout(()=>dd.classList.remove('open'), 200); });
    input.addEventListener('keydown', e=>{
      if(e.key==='Escape'){ input.value=''; filterRows(''); dd.classList.remove('open'); }
    });
    document.addEventListener('click', e=>{ if(!input.contains(e.target)&&!dd.contains(e.target)) dd.classList.remove('open'); });
  })();

  // clique nas ocorrências
  app.querySelectorAll('.occ').forEach(el=>{
    el.addEventListener('click', async ()=>{
      // Bloqueia lançamento retroativo para banheiros após 2h do prazo (admin pode ignorar)
      if(el.getAttribute('data-blocked')==='true' && !isAdmin){
        const key = el.getAttribute('data-key');
        const parts = key.split('|');
        const locName = parts[0];
        const turnKey = parts[1];
        const idx = parseInt(parts[2]);

        // Bloqueio de turno
        if(isTurnBlocked(turnKey)){
          const isDiurno = turnKey==='T1D'||turnKey==='T2D';
          showBlockedAlert('turn', isDiurno ? '07:00' : '19:00');
          return;
        }

        const loc = dayLocations.find(l=>l.name===locName);
        const dl = loc ? occDeadline(loc, turnKey, idx, currentDate) : null;
        const tooEarly = dl && Date.now() < dl.getTime() - 2*3600000;
        showBlockedAlert(tooEarly ? 'early' : 'late', dl ? fmtTime(dl.getTime() - 2*3600000) : '');
        return;
      }
      const k = el.getAttribute('data-key');
      const cur = getEntry(data,k).state;

      // Ao clicar num item já concluído (verde), pergunta antes de desmarcar —
      // em vez de avançar silenciosamente para "não realizado".
      if(cur==='done'){
        const confirmOverlay = document.createElement('div');
        confirmOverlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
        confirmOverlay.innerHTML = `<div style="background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 24px;max-width:360px;width:100%;text-align:center;">
          <div style="font-size:17px;font-weight:700;margin-bottom:8px;">Desmarcar atividade?</div>
          <div style="font-size:13px;color:var(--text-dim);margin-bottom:22px;line-height:1.5;">Essa marcação será removida do Plano de Limpeza.</div>
          <div style="display:flex;gap:10px;">
            <button id="unmarkNo" class="btn secondary" style="flex:1;">Não</button>
            <button id="unmarkYes" class="btn" style="flex:1;">Sim</button>
          </div>
        </div>`;
        document.body.appendChild(confirmOverlay);
        confirmOverlay.querySelector('#unmarkNo').addEventListener('click', ()=>confirmOverlay.remove());
        confirmOverlay.addEventListener('click', e=>{ if(e.target===confirmOverlay) confirmOverlay.remove(); });
        confirmOverlay.querySelector('#unmarkYes').addEventListener('click', async ()=>{
          confirmOverlay.remove();
          delete data[k];
          await saveDay(ds);
          renderDay();
        });
        return;
      }

      const next = cycleState(cur);
      if(next==='pending'){
        delete data[k];
        await saveDay(ds);
        renderDay();
      } else {
        // Busca efetivo do turno/data atual
        const kParts = k.split('|');
        const kTurnKey = kParts[1]; // ex: T1D, T2D, T1N, T2N
        const efData = await loadEfetivo(ds);
        const efLista = (efData[kTurnKey] || []).map(p => p.nome || p).filter(Boolean);

        // Labels dos turnos
        const TMAP = {T1D:'T1 Par (Diurno)',T1N:'T2 Par (Noturno)',T2D:'T1 Ímpar (Diurno)',T2N:'T2 Ímpar (Noturno)'};
        const turnLabel = TMAP[kTurnKey] || kTurnKey;
        const dateLabel = fmtBR(currentDate);

        // Cria modal
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';

        if(!efLista.length){
          overlay.innerHTML = `<div style="background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;max-width:420px;width:100%;">
            <div style="font-size:18px;font-weight:700;margin-bottom:12px;">⚠️ Efetivo não cadastrado</div>
            <div style="font-size:13px;color:var(--text-dim);margin-bottom:16px;">
              Não há colaboradores lançados no efetivo para:<br><br>
              <strong>${dateLabel} · ${turnLabel}</strong><br><br>
              Para registrar a realização, acesse a aba <strong>👷 Efetivo</strong> e lance os colaboradores presentes neste turno antes de continuar.
            </div>
            <button id="efModalClose" class="btn secondary" style="width:100%;">Entendido</button>
          </div>`;
          document.body.appendChild(overlay);
          overlay.querySelector('#efModalClose').addEventListener('click', ()=>overlay.remove());
          overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
          return;
        }

        overlay.innerHTML = `<div style="background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:420px;width:100%;">
          <div style="font-size:16px;font-weight:700;margin-bottom:4px;">👤 Responsável pela execução</div>
          <div style="font-size:12px;color:var(--text-dim);margin-bottom:16px;">${dateLabel} · ${turnLabel}</div>
          <select id="efModalSelect" style="width:100%;background:var(--panel-2);border:1px solid var(--teal);color:var(--text);padding:11px 12px;border-radius:8px;font-size:14px;font-family:inherit;margin-bottom:16px;">
            <option value="">— Selecione o responsável —</option>
            ${efLista.map(n=>`<option value="${n}">${n}</option>`).join('')}
          </select>
          <div style="display:flex;gap:10px;">
            <button id="efModalOk" class="btn" style="flex:1;">Confirmar</button>
            <button id="efModalCancel" class="btn secondary" style="flex:1;">Cancelar</button>
          </div>
        </div>`;
        document.body.appendChild(overlay);

        overlay.querySelector('#efModalCancel').addEventListener('click', ()=>overlay.remove());
        overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
        overlay.querySelector('#efModalOk').addEventListener('click', async ()=>{
          const sel = overlay.querySelector('#efModalSelect');
          const empName = sel.value;
          if(!empName){ sel.style.borderColor='var(--bad)'; return; }
          overlay.remove();
          await saveEmployee(empName);

          // ── INTEGRAÇÃO PLANO 52 SEMANAS ──────────────────────────────
          // Se houver atividades do Plano52 vinculadas a este local/turno, abre o checklist
          // e aguarda a confirmação do usuário antes de gravar. O checklist grava o detalhe
          // granular (por atividade) E devolve true/false indicando se deve prosseguir.
          // Se não houver atividades vinculadas (ou o módulo P52 não estiver carregado),
          // comportamento é o mesmo de sempre: grava direto.
          const kLocName = k.split('|')[0];
          let proceed = true;
          try{
            if(typeof p52TryOpenChecklist === 'function'){
              proceed = await p52TryOpenChecklist(kLocName, kTurnKey, currentDate, empName);
            }
          }catch(err){
            console.error('Plano52: erro ao abrir checklist, seguindo fluxo normal do Plano de Limpeza.', err);
            proceed = true; // nunca bloqueia a confirmação do Plano de Limpeza por erro no módulo P52
          }
          if(proceed === false) return; // usuário cancelou no checklist — não altera o quadradinho

          data[k] = {state:next, ts:Date.now(), emp:empName};
          await saveDay(ds);
          renderDay();
        });
        // Focus select
        setTimeout(()=>overlay.querySelector('#efModalSelect').focus(), 50);
      }
    });
  });
}

async function renderWeek(){
  const app = document.getElementById('app');
  app.innerHTML = '<div class="loading">Carregando semana...</div>';
  const monday = startOfWeek(currentDate);
  const days = [];
  for(let i=0;i<7;i++){ const d=new Date(monday); d.setDate(d.getDate()+i); days.push(d); }
  const dayNames = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  const dataByDay = {};
  for(const d of days){ const ds=dateStr(d); dataByDay[ds] = await loadDay(ds); }

  let html = `<div class="week-title">Semana de ${fmtBR(days[0])} a ${fmtBR(days[6])}</div>
    <div class="tablewrap"><table class="week"><thead><tr><th style="text-align:left">Local</th>`;
  days.forEach(d=>{ html += `<th>${dayNames[d.getDay()]}<br>${pad(d.getDate())}/${pad(d.getMonth()+1)}</th>`; });
  html += `</tr></thead><tbody>`;

  // Monta a lista de linhas (ambientes) a partir da configuração vigente em CADA dia exibido —
  // preserva o histórico caso a semana atravesse a data de implantação (CONFIG_CUTOVER_DATE).
  const weekRowNames = [];
  const weekRowSeen = new Set();
  days.forEach(d=>{
    getLocationsForDate(d).forEach(l=>{
      if(!weekRowSeen.has(l.name)){ weekRowSeen.add(l.name); weekRowNames.push(l.name); }
    });
  });

  weekRowNames.forEach(locName=>{
    html += `<tr><td class="locname">${locName}</td>`;
    days.forEach(d=>{
      const ds = dateStr(d);
      const data = dataByDay[ds];
      const loc = getLocationsForDate(d).find(l=>l.name===locName);
      let total=0, done=0, hasBad=false;
      if(loc){
        TURNS.forEach(t=>{
          const n = resolveFreq(loc, t.key, d);
          total += n;
          for(let i=0;i<n;i++){
            const k = loc.name+'|'+t.key+'|'+i;
            const st = getEntry(data,k).state;
            if(st==='done') done++;
            if(st==='bad') hasBad = true;
          }
        });
      }
      let cls='empty', label='—';
      if(done===total && total>0){cls='full'; label='✓';}
      else if(hasBad){cls='hasbad'; label=done+'/'+total;}
      else if(done>0){cls='partial'; label=done+'/'+total;}
      html += `<td class="daycell" data-date="${ds}"><span class="chip ${cls}">${label}</span></td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div>
    <div class="legend">
      <span><span class="chip full" style="padding:2px 6px;">✓</span> Tudo concluído</span>
      <span><span class="chip partial" style="padding:2px 6px;">n/m</span> Parcial</span>
      <span><span class="chip hasbad" style="padding:2px 6px;">n/m</span> Com não realizado</span>
      <span><span class="chip empty" style="padding:2px 6px;">—</span> Nada registrado</span>
    </div>
    <div class="legend">Clique em qualquer dia da semana para abrir o checklist detalhado.</div>
  `;
  app.innerHTML = html;
  app.querySelectorAll('.daycell').forEach(td=>{
    td.addEventListener('click', ()=>{

function genTicketId(){
  const d = new Date();
  const rand = Math.random().toString(36).slice(2,6).toUpperCase();
  return 'L'+pad(d.getDate())+pad(d.getMonth()+1)+'-'+rand;

/* ---- REQUEST STORAGE: memória primária + storage como backup ---- */
let _requests = []; // array em memória — sempre funciona
let _reqLoaded = false;

let _migrated = false;
async function migrateOldRequestsIfNeeded(){
  if(_migrated) return;
  _migrated = true;
  // Otimização de performance: a migração de dados antigos ('allreqs') só
  // precisa rodar UMA VEZ na vida do sistema. Depois da primeira vez bem
  // sucedida, gravamos uma marca local para nunca mais checar isso de novo
  // nesta aba/navegador — elimina 1-2 chamadas de rede (com timeout de 5s
  // cada) em toda visita à tela de Solicitações.
  try{
    const already = window.localStorage.getItem('sistemaLimpeza:migracaoSolicitacoesOk');
    if(already === '1') return;
  }catch(e){}
  try{
    const oldSnap = await withTimeout(fbRoot.child('allreqs').get(), 5000);
    if(oldSnap.exists()){
      const newSnap = await withTimeout(fbRequestsRef.get(), 5000);
      if(!newSnap.exists()){
        const arr = JSON.parse(oldSnap.val());
        if(Array.isArray(arr) && arr.length){
          const updates = {};
          arr.forEach(r=>{ if(r && r.id) updates[r.id]=r; });
          await fbRequestsRef.update(updates);
        }
      }
    }
    try{ window.localStorage.setItem('sistemaLimpeza:migracaoSolicitacoesOk', '1'); }catch(e){}
  }catch(e){ console.error('Falha na migração de solicitações antigas', e); }
}

let _reqLoadTs=0;
async function ensureRequestsLoaded(){
  const now=Date.now();
  // Cache de 60s — evita recarregar do banco de dados ao trocar entre sub-abas
  // (Pendentes/Em andamento/Concluídas), que antes buscava tudo de novo a
  // cada clique. saveRequest()/deleteRequest() já invalidam esse cache
  // manualmente quando os dados mudam, então continua sempre atualizado
  // após qualquer ação do próprio usuário.
  if(_requests.length>0 && (now-_reqLoadTs)<60000) return;
  await migrateOldRequestsIfNeeded();
  try{
    const snap = await withTimeout(fbRequestsRef.get());
    _requests = snap.exists() ? Object.values(snap.val()) : [];
    _reqLoadTs = Date.now();
  }catch(e){ /* mantém dados atuais em memória se a busca falhar */ }
  _reqLoaded = true;
}
async function loadAllRequests(){
  await ensureRequestsLoaded();
  return [..._requests].sort((a,b)=>b.createdAt-a.createdAt);
}
async function saveRequest(id, obj){
  _reqLoadTs=0; // invalida cache ao salvar
  try{
    await fbRequestsRef.child(id).set(obj);
    const idx = _requests.findIndex(r=>r.id===id);
    if(idx>=0) _requests[idx]=obj; else _requests.push(obj);
    return true;
  }catch(e){ console.error('Erro ao salvar solicitação', e); return false; }
}
async function loadRequest(id){
  await ensureRequestsLoaded();
  return _requests.find(r=>r.id===id) || null;
}
async function deleteRequest(id){
  await fbRequestsRef.child(id).remove();
  _requests = _requests.filter(r=>r.id!==id);
}

function fmtDuration(ms){
  const h = Math.floor(ms/3600000);
  const m = Math.round((ms%3600000)/60000);
  if(h===0) return m+'min';
  if(m===0) return h+'h';
  return h+'h '+m+'min';
}

function statusBadge(status){
  if(status==='concluida') return '<span class="badge concluida">Concluída ✓</span>';
  if(status==='excluida')  return '<span class="badge excluida">Excluída</span>';
  if(status==='andamento') return '<span class="badge andamento">Em andamento</span>';
  return '<span class="badge aberta">Pendente</span>';
}
function prioBadge(p){
  return p==='alta' ? '<span class="badge prio-alta">Urgente</span>' : '<span class="badge prio-normal">Normal</span>';
}

function openCloseModal(r, onConfirm){
  // Remove modal anterior se existir

  if(existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.id = 'closeModalOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9998;padding:16px;';

  overlay.innerHTML = `
    <div style="background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:480px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.5);">
      <div style="font-size:15px;font-weight:700;color:var(--teal-bright);margin-bottom:4px;">Encerrar solicitação</div>
      <div style="font-size:12.5px;color:var(--text-dim);margin-bottom:18px;">#${r.id} — ${r.local}</div>

      <div class="form-row">
        <label>Quem está encerrando?</label>

      </div>

      <div class="form-row" style="margin-top:14px;">
        <label>Foto de evidência <span style="color:var(--text-dim);font-weight:400;">(opcional)</span></label>
        <input type="file" id="closeEvidencia" accept="image/*" capture="environment"
          style="background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:8px;font-size:13px;">
        <div id="closeEvidenciaPreview" style="margin-top:10px;"></div>
      </div>

      <div id="closeModalError" style="font-size:12.5px;color:var(--bad);margin-top:8px;min-height:18px;"></div>

      <div style="display:flex;gap:10px;margin-top:18px;justify-content:flex-end;">
        <button class="btn secondary" id="closeModalCancel">Cancelar</button>
        <button class="btn" id="closeModalConfirm">Confirmar encerramento</button>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);

  let evidenciaDataUrl = null;

  document.getElementById('closeEvidencia').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    const previewEl = document.getElementById('closeEvidenciaPreview');
    if(!file){ evidenciaDataUrl=null; previewEl.innerHTML=''; return; }
    previewEl.innerHTML = '<span style="font-size:12px;color:var(--text-dim);">Processando foto...</span>';
    try{
      evidenciaDataUrl = await compressImageWithLimit(file, 700*1024);
      previewEl.innerHTML = `<img src="${evidenciaDataUrl}" class="foto-preview-thumb">`;
    }catch(err){
      evidenciaDataUrl = null;
      previewEl.innerHTML = '<span style="font-size:12px;color:var(--bad);">Não foi possível processar a foto. Tente outra.</span>';
    }
  });

  document.getElementById('closeModalCancel').addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });

  document.getElementById('closeModalConfirm').addEventListener('click', async ()=>{
    const who = document.getElementById('closeWho').value.trim();
    const errEl = document.getElementById('closeModalError');
    if(!who){ errEl.textContent = 'Informe o nome de quem está encerrando.'; return; }
    errEl.textContent = '';
    document.getElementById('closeModalConfirm').disabled = true;
    document.getElementById('closeModalConfirm').textContent = 'Salvando...';
    overlay.remove();
    await onConfirm(who, evidenciaDataUrl);
  });
}
