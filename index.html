function wireReqCard(card, onUpdate){
  const id = card.getAttribute('data-id');
  card.querySelectorAll('.req-photo-thumb').forEach(img=>{
    img.addEventListener('click', ()=> showPhotoLightbox(img.src));
  });
  card.querySelectorAll('[data-action]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const r = await loadRequest(id);
      const action = btn.getAttribute('data-action');
      if(action==='delete'){
        if(!isAdmin){ alert('Ação restrita ao administrador.'); return; }
        if(!confirm('Excluir esta solicitação permanentemente?')) return;
        // Marca como excluída em vez de deletar do banco de dados (preserva histórico)
        r.status = 'excluida';
        r.deletedAt = Date.now();
        r.updatedAt = Date.now();
        await saveRequest(id, r);
        onUpdate();
        return;
      }
      if(action==='concluida'){
        if(!r.assignee){
          alert('⚠️ É necessário atribuir um responsável antes de concluir a solicitação.');
          return;
        }
        openCloseModal(r, async (who, evidenciaDataUrl)=>{
          r.status='concluida';
          r.closedAt=Date.now();
          r.closedBy=who.trim();
          r.updatedAt=Date.now();
          if(evidenciaDataUrl) r.evidencia=evidenciaDataUrl;
          await saveRequest(id, r);
          onUpdate();
        });
      } else {
        r.status=action;
        r.updatedAt=Date.now();
        await saveRequest(id, r);
        onUpdate();
      }
    });
  });
  card.querySelectorAll('[data-assign]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const r = await loadRequest(id);
      const name = prompt('Nome do responsável pelo atendimento:', r.assignee||'');
      if(name===null) return;
      r.assignee = name.trim();
      r.assignedAt = Date.now();
      r.updatedAt = Date.now();
      // Ao atribuir responsável, promove automaticamente para "em andamento"
      if(r.status==='aberta') r.status='andamento';
      await saveRequest(id, r);
      onUpdate();
    });
  });
}

// ── Ação em massa: seleção de várias solicitações, um responsável, ────
// conclusão de todas de uma vez. Restrita ao gestor (isAdmin).
// Reaproveita saveRequest() e a mesma estrutura de dados de sempre —
// não cria nenhuma lógica paralela de conclusão.
function wireBulkActions(onUpdate){
  const bar = document.getElementById('reqBulkBar');
  if(!bar) return; // barra só existe para isAdmin (renderizada condicionalmente)

  function getChecked(){
    return Array.from(document.querySelectorAll('.req-bulk-check:checked')).map(cb=>cb.getAttribute('data-id'));
  }
  function updateBarVisibility(){
    const ids = getChecked();
    bar.style.display = ids.length ? 'flex' : 'none';
    const countEl = document.getElementById('reqBulkCount');
    if(countEl) countEl.textContent = ids.length + (ids.length===1 ? ' selecionada' : ' selecionadas');
  }

  document.querySelectorAll('.req-bulk-check').forEach(cb=>{
    cb.addEventListener('change', updateBarVisibility);
  });

  document.getElementById('reqBulkCancelar')?.addEventListener('click', ()=>{
    document.querySelectorAll('.req-bulk-check:checked').forEach(cb=>cb.checked=false);
    updateBarVisibility();
  });

  document.getElementById('reqBulkConcluir')?.addEventListener('click', async ()=>{
    // Validação real de permissão — não confia apenas na barra existir na
    // tela. Mesmo que alguém manipule o DOM para exibir a barra sem ser
    // admin, a conclusão em massa só é efetivada se isAdmin for true aqui.
    if(!isAdmin){ alert('Ação restrita ao administrador.'); return; }

    const ids = getChecked();
    if(!ids.length) return;
    const responsavel = document.getElementById('reqBulkResponsavel').value.trim();
    if(!responsavel){
      alert('⚠️ Informe o nome do responsável antes de concluir em massa.');
      return;
    }
    if(!confirm(`Concluir ${ids.length} solicitação(ões) com responsável "${responsavel}"?`)) return;

    const btn = document.getElementById('reqBulkConcluir');
    btn.disabled = true;
    btn.textContent = 'Concluindo...';

    const now = Date.now();
    for(const id of ids){
      const r = await loadRequest(id);
      if(!r || r.status==='concluida') continue;
      // Mesma estrutura de conclusão já usada no fluxo individual
      // (openCloseModal → data-action="concluida"), só que aplicada a
      // várias solicitações de uma vez, com o mesmo responsável para todas.
      r.assignee = responsavel;
      r.assignedAt = r.assignedAt || now;
      r.status = 'concluida';
      r.closedAt = now;
      r.closedBy = responsavel;
      r.updatedAt = now;
      r.concluidoEmMassa = true; // marca para auditoria, sem afetar cálculo de SLA
      await saveRequest(id, r);
    }

    btn.disabled = false;
    btn.textContent = 'Concluir selecionadas';
    onUpdate();
  });
}

async function renderRequests(){
  // Proteção de rota — redireciona para login se não autenticado.
  // Otimização: se já sabemos quem é o usuário (currentUser em memória),
  // não precisa buscar a lista completa de usuários de novo no banco de dados
  // toda vez que essa tela é aberta — só busca quando ainda não há sessão.
  if(!currentUser){
    const _users = await (async()=>{ try{ const s=await window.storage.get('system:users',true); return s?JSON.parse(s.value):[]; }catch(e){return [];} })();
    if(_users.length > 0){ await renderUserLogin(); return; }
  }

  const app = document.getElementById('app');
  app.innerHTML = `<div class="req-tabs">
    <button data-tab="new" class="${reqTab==='new'?'active':''}">+ Nova solicitação</button>

    <button data-tab="qr" onclick="showQRModal();event.stopPropagation();" style="background:transparent;border:1px solid rgba(63,214,201,.4);color:#3fd6c9;margin-left:auto;">📱 QR Code</button>
  </div>
  ${reqTab==='track' ? `<div class="req-tabs" style="margin-top:-10px;margin-bottom:4px;gap:6px;">
    <button data-subtab="pendentes" class="${reqSubTab==='pendentes'?'active':''}" style="${reqSubTab==='pendentes'?'background:var(--amber);color:#000;border-color:var(--amber);':''}">⏳ Pendentes</button>
    <button data-subtab="andamento" class="${reqSubTab==='andamento'?'active':''}" style="${reqSubTab==='andamento'?'background:#2563eb;color:#fff;border-color:#2563eb;':'border-color:#2563eb;color:#2563eb;'}">🔄 Em andamento</button>
    <button data-subtab="concluidas" class="${reqSubTab==='concluidas'?'active':''}">✅ Concluídas</button>
  </div>` : ''}
  <div id="reqContent"></div>`;

  app.querySelectorAll('.req-tabs button[data-tab]').forEach(b=>{
    b.addEventListener('click', ()=>{ reqTab=b.getAttribute('data-tab'); renderRequests(); });
  });
  app.querySelectorAll('button[data-subtab]').forEach(b=>{
    b.addEventListener('click', ()=>{
      reqSubTab=b.getAttribute('data-subtab');
      renderRequests();
    });
  });

  const content = document.getElementById('reqContent');

  /* ---- NOVA SOLICITAÇÃO ---- */
  if(reqTab==='new'){
    let optionsHtml = LOCATION_NAMES.map(n=>`<option value="${n}">${n}</option>`).join('');
    content.innerHTML = `
      <div class="card" style="max-width:560px;">
        <div class="form-row"><label>Seu nome</label><input type="text" id="reqNome" placeholder="Ex: João Silva"></div>
        <div class="form-row">
          <label>Local</label>
          <div class="lsearch-wrap" style="max-width:100%;width:100%;position:relative;">
            <span style="position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--text-dim);pointer-events:none;z-index:1;">🔍</span>
            <input type="text" id="reqLocalSearch" placeholder="Selecione ou digite o local" autocomplete="off"
              style="width:100%;padding:9px 12px 9px 34px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;font-size:13.5px;">
            <div class="lsearch-dd" id="reqLocalDD"></div>
          </div>
          <input type="hidden" id="reqLocal" value="">
        </div>
        <div class="form-row"><label>Tipo de Ocorrência <span style="color:var(--bad);">*</span></label>
          <select id="reqTipo">
            <option value="">— Selecione —</option>
            ${TIPOS_OCORRENCIA.map(t=>`<option value="${t}">${t}</option>`).join('')}
          </select>
        </div>
        <div class="form-row"><label>Descreva a solicitação</label>
          <textarea id="reqDesc" placeholder="Ex: Derramamento de líquido próximo à doca 3"></textarea></div>
        ${(isAdmin && !document.body.classList.contains('kiosk') && window.matchMedia('(min-width:768px)').matches) ? `
        <div class="form-row" id="reqDataOcorrenciaRow">
          <label>Data da ocorrência <span style="font-size:11px;color:var(--text-dim);font-weight:400;">(somente Admin — permite lançamento retroativo)</span></label>
          <input type="date" id="reqDataOcorrencia" value="${dateStr(nowBRT())}" max="${dateStr(nowBRT())}">
          <div id="reqRetroativoAviso" style="display:none;font-size:12px;color:var(--amber);margin-top:4px;">⚠ Lançamento retroativo — esta ocorrência será contabilizada na data selecionada.</div>
          <div id="reqConcluirAutoRow" style="display:none;margin-top:10px;">
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);font-weight:400;cursor:pointer;">
              <input type="checkbox" id="reqConcluirAuto" style="width:16px;height:16px;cursor:pointer;">
              Concluir automaticamente
            </label>
            <div style="font-size:11px;color:var(--text-dim);margin-top:2px;">Encerra o lançamento retroativo imediatamente, com SLA zerado (não gera impacto no indicador).</div>
          </div>
        </div>` : ''}
        <div class="form-row"><label>Foto (opcional)</label>
          <input type="file" id="reqFoto" accept="image/*" capture="environment">
          <div id="reqFotoPreview" style="margin-top:8px;"></div>
        </div>
        <div class="form-row"><label>Prioridade</label>
          <select id="reqPrio"><option value="normal">Normal</option><option value="alta">Alta (urgente)</option></select></div>
        <button class="btn" id="reqSubmit">Enviar solicitação</button>
        <div id="reqResult"></div>
      </div>`;
    let reqFotoDataUrl = null;

  // Autocomplete local — mesmo comportamento do "Buscar Local" do checklist
  (function(){
    const input = document.getElementById('reqLocalSearch');
    const dd = document.getElementById('reqLocalDD');
    const hidden = document.getElementById('reqLocal');
    if(!input||!dd||!hidden) return;

    const allItems = LOCATION_NAMES.map(n=>({value:n, text:n}));

    function getFiltered(q){
      return q ? allItems.filter(i=>i.text.toLowerCase().includes(q.toLowerCase())) : allItems;
    }

    function openDD(q){
      const filtered = getFiltered(q);
      dd.innerHTML = '';
      if(!filtered.length){
        dd.innerHTML = '<div class="lsearch-empty">Nenhum ambiente encontrado</div>';
      } else {
        filtered.forEach(item=>{
          const div = document.createElement('div');
          div.className = 'lsearch-item';
          div.textContent = item.text;
          div.addEventListener('mousedown', e=>{
            e.preventDefault();
            input.value = item.text;
            hidden.value = item.value;
            dd.classList.remove('open');
          });
          div.addEventListener('touchend', e=>{
            e.preventDefault();
            input.value = item.text;
            hidden.value = item.value;
            dd.classList.remove('open');
          });
          dd.appendChild(div);
        });
      }
      dd.classList.add('open');
    }

    input.addEventListener('focus', ()=>{ input.select(); openDD(input.value); });
    input.addEventListener('input', ()=>{ openDD(input.value); if(getFiltered(input.value).length===1){ hidden.value=getFiltered(input.value)[0].value; } });
    input.addEventListener('blur',  ()=>{ setTimeout(()=>dd.classList.remove('open'), 200); });
    input.addEventListener('keydown', e=>{
      if(e.key==='Escape'){ input.value=''; openDD(''); }
      if(e.key==='Enter'){
        const f=getFiltered(input.value);
        if(f.length>=1){ input.value=f[0].text; hidden.value=f[0].value; dd.classList.remove('open'); }
        e.preventDefault();
      }
    });
    document.addEventListener('click', e=>{ if(!input.contains(e.target)&&!dd.contains(e.target)) dd.classList.remove('open'); });

    // Campo inicia vazio — usuário seleciona ou digita
    input.value = '';
    hidden.value = '';
  })();

  document.getElementById('reqFoto').addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      const previewEl = document.getElementById('reqFotoPreview');
      if(!file){ reqFotoDataUrl=null; previewEl.innerHTML=''; return; }
      previewEl.innerHTML = '<span style="font-size:12.5px;color:var(--text-dim);">Processando foto...</span>';
      try{
        reqFotoDataUrl = await compressImageWithLimit(file, 700*1024);
        previewEl.innerHTML = `<img src="${reqFotoDataUrl}" class="foto-preview-thumb">`;
      }catch(err){
        console.error(err);
        reqFotoDataUrl = null;
        previewEl.innerHTML = '<span style="font-size:12.5px;color:var(--bad);">Não foi possível processar essa foto. Tente outra.</span>';
      }
    });

    // Aviso visual "Lançamento retroativo" e opção "Concluir automaticamente"
    // — só existem quando o campo de data existe (admin + desktop).
    // A opção de concluir automaticamente só aparece quando a data
    // selecionada é de fato retroativa (não faz sentido em datas normais).
    const dataOcorrenciaEl = document.getElementById('reqDataOcorrencia');
    if(dataOcorrenciaEl){
      const avisoEl = document.getElementById('reqRetroativoAviso');
      const concluirAutoRowEl = document.getElementById('reqConcluirAutoRow');
      const concluirAutoCheckEl = document.getElementById('reqConcluirAuto');
      const hojeStr = dateStr(nowBRT());
      const atualizarAviso = ()=>{
        const isRetroativo = dataOcorrenciaEl.value && dataOcorrenciaEl.value < hojeStr;
        avisoEl.style.display = isRetroativo ? 'block' : 'none';
        concluirAutoRowEl.style.display = isRetroativo ? 'block' : 'none';
        if(!isRetroativo && concluirAutoCheckEl) concluirAutoCheckEl.checked = false; // limpa se voltar pra data normal
      };
      dataOcorrenciaEl.addEventListener('change', atualizarAviso);
      atualizarAviso();
    }

    document.getElementById('reqSubmit').addEventListener('click', async ()=>{
      const nome = document.getElementById('reqNome').value.trim();
      let local = document.getElementById('reqLocal').value;
      const outroEl = document.getElementById('reqLocalOutro');
      if(local==='Outro / não listado' && outroEl && outroEl.value.trim()) local=outroEl.value.trim();
      const tipo = document.getElementById('reqTipo').value;
      const desc = document.getElementById('reqDesc').value.trim();
      const prio = document.getElementById('reqPrio').value;
      const resultEl = document.getElementById('reqResult');

      if(!nome||!desc||!tipo){
        resultEl.innerHTML=`<p style="color:var(--bad);font-size:13px;margin-top:10px;">Preencha seu nome, tipo de ocorrência e a descrição.</p>`;
        return;
      }

      const id=genTicketId(), now=Date.now();
      let createdAt = now;
      let retroativo = false;
      let dataLancamentoReal = null;

      // ── Lançamento retroativo — somente Admin, somente Desktop ──────
      // Validação real (não confia só em o campo existir na tela): mesmo
      // que alguém manipule o HTML/DOM para inserir o campo, a gravação
      // só aceita data retroativa se isAdmin for verdadeiro NESTE momento.
      // isAdmin é controlado pelo login (PIN de admin), não pela interface.
      const dataOcorrenciaInput = document.getElementById('reqDataOcorrencia');
      if(dataOcorrenciaInput && dataOcorrenciaInput.value && isAdmin){
        const [y,m,d] = dataOcorrenciaInput.value.split('-').map(Number);
        const dataEscolhida = new Date(y, m-1, d);
        const hoje = nowBRT(); hoje.setHours(0,0,0,0);
        if(dataEscolhida.getTime() !== hoje.getTime()){
          // Preserva a hora atual (não zera para 00:00), só troca o dia/mês/ano —
          // assim a ocorrência cai no dia certo sem perder granularidade de horário
          // nos cálculos que dependem de Date.now() normalmente.
          const agora = new Date(now);
          dataEscolhida.setHours(agora.getHours(), agora.getMinutes(), agora.getSeconds(), agora.getMilliseconds());
          createdAt = dataEscolhida.getTime();
          retroativo = true;
          dataLancamentoReal = now; // preserva quando o registro foi de fato criado, para auditoria
        }
      }

      const obj={
        id, nome, local, tipo, desc, prio, status:'aberta',
        createdAt, updatedAt:now, foto:reqFotoDataUrl||null,
        // Campos de auditoria — só preenchidos quando é retroativo; em
        // lançamentos normais ficam ausentes, sem alterar a estrutura
        // usada pelo restante do sistema (createdAt continua sendo o
        // único campo que os indicadores/relatórios já leem).
        ...(retroativo ? {
          retroativo: true,
          dataLancamentoReal,
          usuarioLancamento: currentUser?.nome || currentEmployee || ''
        } : {})
      };

      // ── Conclusão automática de lançamento retroativo (somente Admin) ──
      // Validação real: só tem efeito se retroativo===true (já validado
      // acima, via isAdmin) E isAdmin===true neste momento. Mesmo que um
      // usuário comum manipule o checkbox via DOM/console, esta condição
      // bloqueia a ação — a permissão nunca depende só da interface.
      const concluirAutoCheckEl = document.getElementById('reqConcluirAuto');
      const concluirAutomaticamente = retroativo && isAdmin && concluirAutoCheckEl && concluirAutoCheckEl.checked;

      if(concluirAutomaticamente){
        // SLA zerado: closedAt = createdAt faz (closedAt - createdAt) = 0
        // em TODAS as fórmulas de SLA já existentes no sistema (painel,
        // relatório, indicadores) — sem precisar alterar nenhuma delas,
        // pois todas usam essa mesma subtração para medir o tempo de
        // atendimento. Não há impacto negativo possível: o resultado é
        // sempre exatamente zero, independente de quantos dias se passaram
        // desde a data retroativa até agora.
        obj.status = 'concluida';
        obj.closedAt = obj.createdAt;
        obj.closedBy = currentUser?.nome || currentEmployee || '';
        obj.assignee = obj.closedBy; // conclusão exige responsável — usa o próprio admin
        obj.motivoConclusao = 'Conclusão de lançamento retroativo, sem impacto no SLA';
        obj.concluidoAutomaticamente = true;
      }

      await saveRequest(id, obj);

      // vai direto pro painel
      reqTab='track';
      renderRequests();
    });
  }

  /* ---- ACOMPANHAR / PAINEL UNIFICADO ---- */
  if(reqTab==='track'){
    content.innerHTML=`<div class="loading">Carregando...</div>`;
    const allRaw=await loadAllRequests();
    const all=allRaw.filter(r=>r.status!=='excluida'); // exclui dos indicadores

    // ── Helpers ──
    const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

    // SLA médio — duas variantes:
    // Pendentes: tempo em aberto (agora - createdAt)
    // Concluídas: tempo de resolução (closedAt - createdAt)
    function fmtDurationSla(ms){
      if(ms === null) return null;
      const h = ms/3600000;
      if(h < 1) return Math.round(h*60)+'min';
      if(h < 24) return h.toFixed(1)+'h';
      const d = Math.floor(h/24), hrem = Math.round(h%24);
      return hrem > 0 ? `${d}d ${hrem}h` : `${d}d`;
    }
    function calcSlaContextual(list, subTab){
      const now = Date.now();
      if(subTab === 'pendentes'){
        // Tempo em aberto para pendentes+andamento
        const valid = list.filter(r=>(r.status==='aberta'||r.status==='andamento')&&r.createdAt);
        if(!valid.length) return null;
        const avgMs = valid.reduce((s,r)=>s+(now-r.createdAt),0)/valid.length;
        return fmtDurationSla(avgMs);
      } else {
        // Tempo de resolução para concluídas
        const valid = list.filter(r=>r.status==='concluida'&&r.closedAt&&r.createdAt);
        if(!valid.length) return null;
        const avgMs = valid.reduce((s,r)=>s+(r.closedAt-r.createdAt),0)/valid.length;
        return fmtDurationSla(avgMs);
      }
    }
    function slaLabel(){ return reqSubTab==='pendentes' ? 'SLA médio em aberto' : 'SLA médio de resolução'; }
    function slaMedia(list){
      const valid = list.filter(r=>r.status==='concluida'&&r.closedAt&&r.createdAt);
      if(!valid.length) return null;
      const avgMs = valid.reduce((s,r)=>s+(r.closedAt-r.createdAt),0)/valid.length;
      return fmtDurationSla(avgMs);
    }
    function slaMediaMs(list){
      const valid = list.filter(r=>r.status==='concluida'&&r.closedAt&&r.createdAt);
      if(!valid.length) return null;
      return valid.reduce((s,r)=>s+(r.closedAt-r.createdAt),0)/valid.length;
    }

    // Available months from all requests
    const monthSet = new Set(all.map(r=>{ const d=new Date(r.createdAt); return d.getFullYear()+'-'+(d.getMonth()+1); }));
    const monthOptions = [...monthSet].sort().reverse().map(m=>{
      const [y,mo]=m.split('-'); return `<option value="${m}">${meses[parseInt(mo)-1]} ${y}</option>`;
    }).join('');

    // Get selected month from existing select if any
    const prevMonth = content.querySelector('#filterMonth')?.value || '';

    const excluidas=allRaw.filter(r=>r.status==='excluida');
    const abertas=all.filter(r=>r.status==='aberta');
    const andamento=all.filter(r=>r.status==='andamento');
    const concluidas=all.filter(r=>r.status==='concluida');

    // ── Função centralizada de KPIs ──────────────────────────────────────────
    const SLA_META_MS = 4 * 3600000; // meta: 4h

    function buildKpiHtml(dataset, subTab){
      const now = Date.now();
      const pAbertas   = dataset.filter(r=>r.status==='aberta');
      const pAndamento = dataset.filter(r=>r.status==='andamento');
      const pConcluidas= dataset.filter(r=>r.status==='concluida');
      const semResp    = pAbertas.filter(r=>!r.assignee);
      const urgentes   = dataset.filter(r=>(r.status==='aberta'||r.status==='andamento')&&r.prio==='alta');

      if(subTab === 'andamento'){
        const slaAnd = pAndamento.length
          ? fmtDurationSla(pAndamento.reduce((s,r)=>s+(now-r.createdAt),0)/pAndamento.length)
          : null;
        return `
          <div class="stat-box"><div class="num" style="color:#2563eb;">${pAndamento.length}</div><div class="lbl">Em andamento</div></div>
          <div class="stat-box"><div class="num" style="color:var(--ok);">${pAndamento.filter(r=>r.assignee).length}</div><div class="lbl">Com responsável</div></div>
          <div class="stat-box"><div class="num" style="color:var(--bad);">${pAndamento.filter(r=>!r.assignee).length}</div><div class="lbl">Sem responsável</div></div>
          <div class="stat-box"><div class="num" style="color:var(--teal-bright);">${slaAnd||'—'}</div><div class="lbl">Tempo médio em aberto</div></div>
          <div class="stat-box"><div class="num" style="color:var(--bad);">${pAndamento.filter(r=>r.prio==='alta').length}</div><div class="lbl">Urgentes</div></div>`;
      }
      if(subTab === 'pendentes'){
        // SLA médio em aberto (agora - createdAt) para pendentes+andamento
        const pendAll = [...pAbertas,...pAndamento];
        const slaAberto = pendAll.length
          ? fmtDurationSla(pendAll.reduce((s,r)=>s+(now-r.createdAt),0)/pendAll.length)
          : null;
        return `
          <div class="stat-box">
            <div class="num" style="color:var(--amber)">${pAbertas.length+pAndamento.length}</div>
            <div class="lbl">Não resolvidas</div>
          </div>
          <div class="stat-box">
            <div class="num" style="color:var(--bad)">${semResp.length}</div>
            <div class="lbl">Sem responsável</div>
          </div>
          <div class="stat-box">
            <div class="num" style="color:var(--teal-bright)">${pAndamento.length}</div>
            <div class="lbl">Em andamento</div>
          </div>
          <div class="stat-box" title="Tempo médio desde a abertura até agora.">
            <div class="num" style="color:${slaAberto?'var(--amber)':'var(--text-dim)'}">${slaAberto||'—'}</div>
            <div class="lbl">SLA médio em aberto</div>
          </div>
          <div class="stat-box">
            <div class="num" style="color:var(--bad)">${urgentes.length}</div>
            <div class="lbl">Urgentes</div>
          </div>`;
      } else {
        // Concluídas
        const validCon = pConcluidas.filter(r=>r.closedAt&&r.createdAt);
        const slaResolucao = validCon.length
          ? fmtDurationSla(validCon.reduce((s,r)=>s+(r.closedAt-r.createdAt),0)/validCon.length)
          : null;
        const dentroSla  = pConcluidas.filter(r=>r.closedAt&&r.createdAt&&(r.closedAt-r.createdAt)<=SLA_META_MS).length;
        const foraSla    = pConcluidas.filter(r=>r.closedAt&&r.createdAt&&(r.closedAt-r.createdAt)>SLA_META_MS).length;
        const taxaRes    = dataset.length ? Math.round(pConcluidas.length/dataset.length*100) : 0;
        return `
          <div class="stat-box">
            <div class="num" style="color:var(--ok)">${pConcluidas.length}</div>
            <div class="lbl">Concluídas</div>
          </div>
          <div class="stat-box" title="Tempo médio entre abertura e conclusão.">
            <div class="num" style="color:${slaResolucao?'var(--teal-bright)':'var(--text-dim)'}">${slaResolucao||'—'}</div>
            <div class="lbl">SLA médio de resolução</div>
          </div>
          <div class="stat-box">
            <div class="num" style="color:var(--ok)">${dentroSla}</div>
            <div class="lbl">Dentro do SLA</div>
          </div>
          <div class="stat-box">
            <div class="num" style="color:var(--bad)">${foraSla}</div>
            <div class="lbl">Fora do SLA</div>
          </div>
          <div class="stat-box">
            <div class="num" style="color:var(--teal-bright)">${taxaRes}%</div>
            <div class="lbl">Taxa de resolução</div>
          </div>`;
      }
    }

    function renderMonth(filterVal){
      const filtered = filterVal
        ? all.filter(r=>{ const d=new Date(r.createdAt); return (d.getFullYear()+'-'+(d.getMonth()+1))===filterVal; })
        : all;
      const fAbertas    = filtered.filter(r=>r.status==='aberta');
      const fAndamento  = filtered.filter(r=>r.status==='andamento');
      const fConcluidas = filtered.filter(r=>r.status==='concluida');
      const fSla = calcSlaContextual(filtered, reqSubTab);
      const fTx = filtered.length ? Math.round(fConcluidas.length/filtered.length*100) : 0;

      // Recalcula KPIs contextuais
      const kpisEl = document.getElementById('dash-kpis');
      if(kpisEl) kpisEl.innerHTML = buildKpiHtml(filtered, reqSubTab);
      
      const secAberta = document.getElementById('sec-aberta');
      const secAnd    = document.getElementById('sec-andamento');
      const secCon    = document.getElementById('sec-concluida');

      if(secAberta && reqSubTab==='pendentes'){
        const t=document.getElementById('sec-aberta-title'); if(t) t.textContent=`Pendente — sem responsável (${fAbertas.length})`;
        secAberta.innerHTML = fAbertas.length ? fAbertas.map(r=>reqCardHtml(r,true)).join('') : '<div class="empty-state">Nenhuma solicitação pendente 🎉</div>';
        secAberta.querySelectorAll('.req-card').forEach(card=>wireReqCard(card, renderRequests));
      }
      if(secAnd && (reqSubTab==='pendentes'||reqSubTab==='andamento')){
        const t=document.getElementById('sec-and-title'); if(t) t.textContent=`Em andamento — atribuídas (${fAndamento.length})`;
        secAnd.innerHTML = fAndamento.length ? fAndamento.map(r=>reqCardHtml(r,true)).join('') : '<div class="empty-state">Nenhuma em andamento.</div>';
        secAnd.querySelectorAll('.req-card').forEach(card=>wireReqCard(card, renderRequests));
      }
      if(secCon && reqSubTab==='concluidas'){
        const t=document.getElementById('sec-con-title'); if(t) t.textContent=`Concluídas (${fConcluidas.length})`;
        secCon.innerHTML = fConcluidas.length ? fConcluidas.map(r=>reqCardHtml(r,false)).join('') : '<div class="empty-state">Nenhuma concluída ainda.</div>';
        secCon.querySelectorAll('.req-card').forEach(card=>wireReqCard(card, renderRequests));
      }
      // Reconecta a barra de ação em massa aos novos checkboxes renderizados pelo filtro de mês
      wireBulkActions(renderRequests);
    }

    let html=`
      <!-- ── FILTRO DE MÊS ── -->
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;">
        <label style="font-size:13px;color:var(--text-dim);font-weight:500;">Filtrar por mês:</label>
        <select id="filterMonth" style="background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:8px;font-size:13px;font-family:inherit;">
          <option value="">Todos os períodos</option>
          ${monthOptions}
        </select>
        <span id="filterLabel" style="font-size:12px;color:var(--text-dim);"></span>
      </div>

      <!-- ── KPIs contextuais por aba ── -->
      <div id="dash-kpis" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:24px;">
        ${buildKpiHtml(all, reqSubTab)}
      </div>

      <!-- ── BUSCA ── -->
      <div class="search-row" style="margin-bottom:20px;">
        <input type="text" id="trackInput" placeholder="Buscar por código (ex: L3006-A1B2) ou nome do solicitante">
        <button class="btn" id="trackBtn">Buscar</button>
      </div>
      <div id="trackResult"></div>

      <!-- ── AÇÃO EM MASSA (somente Admin) ──────────────────────────────
           Permite selecionar várias solicitações pendentes/em andamento,
           atribuir um único responsável e concluir todas de uma vez.
           Reaproveita a mesma validação já usada individualmente: só
           conclui de fato quem tem isAdmin===true neste momento. -->
      ${isAdmin ? `
      <div id="reqBulkBar" style="display:none;position:sticky;top:8px;z-index:150;background:var(--panel);border:1px solid var(--teal);border-radius:10px;padding:12px 16px;margin-bottom:16px;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 4px 16px rgba(0,0,0,.3);">
        <span id="reqBulkCount" style="font-size:13px;font-weight:700;color:var(--teal-bright);">0 selecionadas</span>
        <input type="text" id="reqBulkResponsavel" placeholder="Nome do responsável" style="background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:8px;font-size:13px;flex:1;min-width:180px;">
        <button class="btn" id="reqBulkConcluir" style="white-space:nowrap;">Concluir selecionadas</button>
        <button class="btn secondary" id="reqBulkCancelar" style="white-space:nowrap;">Cancelar seleção</button>
      </div>` : ''}

      <!-- ── LISTAS ── -->
      ${reqSubTab==='pendentes' ? `
      <div id="sec-aberta-title" class="section-title">Pendente — sem responsável (${abertas.length})</div>
      <div id="sec-aberta">
        ${abertas.length ? abertas.map(r=>reqCardHtml(r,true)).join('') : '<div class="empty-state">Nenhuma solicitação pendente 🎉</div>'}
      </div>` : reqSubTab==='andamento' ? `
      <div class="section-title" style="color:#2563eb;">🔄 Em andamento — atribuídas (${andamento.length})</div>
      <div id="sec-andamento">
        ${andamento.length ? andamento.map(r=>reqCardHtml(r,true)).join('') : '<div class="empty-state">Nenhuma solicitação em andamento.</div>'}
      </div>` : `
      <div id="sec-con-title" class="section-title">Concluídas (${concluidas.length})</div>
      <div id="sec-concluida">
        ${concluidas.length ? concluidas.map(r=>reqCardHtml(r,false)).join('') : '<div class="empty-state">Nenhuma concluída ainda.</div>'}
      </div>
      ${isAdmin && excluidas.length ? `
      <div class="section-title" style="margin-top:24px;color:#888;">Excluídas pelo Admin (${excluidas.length})</div>
      <div id="sec-excluida" style="opacity:.6;">
        ${excluidas.map(r=>reqCardHtml(r,false)).join('')}
      </div>` : ''}
      `}
    `;
    content.innerHTML=html;

    // Wire all cards
    content.querySelectorAll('.req-card').forEach(card=>wireReqCard(card, renderRequests));
    wireBulkActions(renderRequests);

    // Month filter
    document.getElementById('filterMonth').addEventListener('change', function(){
      renderMonth(this.value);
    });

    // Search
    const doSearch=async()=>{
      const q=document.getElementById('trackInput').value.trim().toLowerCase();
      const resEl=document.getElementById('trackResult');
      if(!q){resEl.innerHTML='';return;}
      resEl.innerHTML='<div class="loading">Buscando...</div>';
      const matches=all.filter(r=>r.id.toLowerCase()===q||r.nome.toLowerCase().includes(q)||r.local.toLowerCase().includes(q));
      if(!matches.length){resEl.innerHTML=`<div class="empty-state">Nenhuma solicitação encontrada para "${q}".</div>`;return;}
      resEl.innerHTML=`<div class="section-title">Resultado da busca (${matches.length})</div>`+matches.map(r=>reqCardHtml(r,true)).join('');
      resEl.querySelectorAll('.req-card').forEach(card=>wireReqCard(card, renderRequests));
    };
    document.getElementById('trackBtn').addEventListener('click', doSearch);
    document.getElementById('trackInput').addEventListener('keydown',(e)=>{if(e.key==='Enter')doSearch();});
  }
}

/* ===================== RENDER REPORT ===================== */
let reportSection = 'checklist'; // 'checklist' | 'requests'

function monthLabel(d){
  const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return meses[d.getMonth()]+' de '+d.getFullYear();
}
function getDatesForPeriod(){
  if(reportPeriod==='day') return [new Date(reportDate)];
  if(reportPeriod==='week'){
    const monday=startOfWeek(reportDate), arr=[];
    for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(d.getDate()+i);arr.push(d);}
    return arr;
  }
  const y=reportDate.getFullYear(),m=reportDate.getMonth();
  const days=new Date(y,m+1,0).getDate(),arr=[];
  for(let i=1;i<=days;i++) arr.push(new Date(y,m,i));
  return arr;
}
function gaugeSvg(pct){
  const r=56,c=2*Math.PI*r,offset=c-(Math.min(pct,100)/100)*c;
  const color=pct>=GOAL_PCT?'#4caf6e':(pct>=80?'#e3b341':'#d96a5a');
  return `<svg width="140" height="140" viewBox="0 0 140 140">
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="#1c3436" stroke-width="14"/>
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="${color}" stroke-width="14"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
  </svg>`;
}

async function renderReport(){
  // Proteção de rota — redireciona para login se não autenticado
  const _users = await (async()=>{ try{ const s=await window.storage.get('system:users',true); return s?JSON.parse(s.value):[]; }catch(e){return [];} })();
  if(_users.length > 0 && !currentUser){ await renderUserLogin(); return; }

  const app=document.getElementById('app');
  app.innerHTML=`
    <div class="req-tabs" style="margin-bottom:18px;">
      <button id="repSecCL" class="${reportSection==='checklist'?'active':''}">Plano de Limpeza</button>
      <button id="repSecRQ" class="${reportSection==='requests'?'active':''}">Solicitações</button>
    </div>
    <div id="repContent"><div class="loading">Calculando...</div></div>`;

  document.getElementById('repSecCL').onclick=()=>{reportSection='checklist';renderReport();};
  document.getElementById('repSecRQ').onclick=()=>{reportSection='requests';renderReport();};

  if(reportSection==='checklist') await renderReportChecklist();
  else await renderReportRequests();
}

async function renderReportChecklist(){
  const content=document.getElementById('repContent');
  content.innerHTML='<div class="loading">Calculando cumprimento do plano...</div>';
  const dates=getDatesForPeriod();
  const dataByDate={};
  for(const d of dates){const ds=dateStr(d);dataByDate[ds]=await loadDay(ds);}

  // ── Helpers de pontualidade ──────────────────────────────────────────────
  // Reutiliza occDeadline existente para classificar cada chip:
  // NO HORÁRIO:  executado && entry.ts <= deadline
  // COM ATRASO:  executado && entry.ts > deadline && entry.ts <= deadline + 2h
  // NÃO EXEC:    não executado && agora > deadline + 2h  (janela encerrada)
  // PENDENTE:    não executado && ainda dentro da janela
  function classifyOcc(loc, turnKey, idx, date, entry){
    const st = entry.state || 'pending';
    const dl = occDeadline(loc, turnKey, idx, date);
    if(!dl) return st==='done' ? 'ontime' : 'pending';
    const dlMs = dl.getTime();
    const tol = 2*3600000;
    if(st==='done'){
      return entry.ts <= dlMs ? 'ontime' : 'late';
    } else {
      const nowMs = dsNowBrtMs();
      // Só considera não-exec se for hoje e janela fechou; para datas passadas sempre não-exec
      const today = new Date(dsNowBrtMs());
      const isToday = date.getDate()===today.getDate()&&date.getMonth()===today.getMonth()&&date.getFullYear()===today.getFullYear();
      if(isToday){
        return nowMs > dlMs+tol ? 'notdone' : 'pending';
      } else {
        return 'notdone'; // data passada sem marcação = não executado
      }
    }
  }
  function emptyAcc(){ return {total:0,ontime:0,late:0,notdone:0,pending:0}; }
  function accPct(a,field){ return a.total?Math.round(a[field]/a.total*100):0; }
  function addToAcc(acc, cls){ acc.total++; if(cls in acc) acc[cls]++; }

  // ── Acumuladores ─────────────────────────────────────────────────────────
  const globalAcc = emptyAcc();
  const turnAcc = {}; TURNS.forEach(t=>turnAcc[t.key]=emptyAcc());
  const dailyRows = [];

  dates.forEach(d=>{
    const ds=dateStr(d), data=dataByDate[ds];
    // Para modo DIA: usar só turnos ativos do dia
    const turnsForDay = reportPeriod==='day' ? activeTurns(d) : TURNS;
    const dayAcc = emptyAcc();
    const perTurnDay = {};
    turnsForDay.forEach(t=>{ perTurnDay[t.key]=emptyAcc(); });

    // Usa a configuração de ambientes/frequências vigente NA DATA "d" (getLocationsForDate),
    // e não a configuração atual — protege os indicadores de períodos já fechados.
    getLocationsForDate(d).forEach(loc=>{
      turnsForDay.forEach(t=>{
        const n=resolveFreq(loc,t.key,d);
        for(let i=0;i<n;i++){
          const k=loc.name+'|'+t.key+'|'+i;
          const entry=getEntry(data,k);
          const cls=classifyOcc(loc,t.key,i,d,entry);
          addToAcc(globalAcc,cls);
          addToAcc(dayAcc,cls);
          addToAcc(turnAcc[t.key],cls);
          addToAcc(perTurnDay[t.key],cls);
        }
      });
    });
    dailyRows.push({d, acc:dayAcc, perTurn:perTurnDay, turns:turnsForDay});
  });

  // ── Labels e cores ───────────────────────────────────────────────────────
  const overallPct = globalAcc.total ? Math.round((globalAcc.ontime+globalAcc.late)/globalAcc.total*100) : 0;
  const ontimePct  = accPct(globalAcc,'ontime');
  const latePct    = accPct(globalAcc,'late');
  const notdonePct = accPct(globalAcc,'notdone');
  const meetsGoal  = overallPct >= GOAL_PCT;
  const gap        = GOAL_PCT - overallPct;

  let periodLabel='';
  if(reportPeriod==='day'){
    const isPar = reportDate.getDate()%2===0;
    const turnLabels = activeTurns(reportDate).map(t=>t.label).join(' · ');
    periodLabel=`${fmtBR(reportDate)} <span style="font-size:12px;color:var(--text-dim);font-weight:400;">— Turnos previstos: ${turnLabels}</span>`;
  } else if(reportPeriod==='week'){
    const monday=startOfWeek(reportDate),sunday=new Date(monday);sunday.setDate(sunday.getDate()+6);
    periodLabel='Semana de '+fmtBR(monday)+' a '+fmtBR(sunday);
  } else periodLabel=monthLabel(reportDate);

  function pctColor(p){ return p===null?'var(--text-dim)':p>=GOAL_PCT?'var(--ok)':'var(--bad)'; }
  function pctLabel(p){ return p===null?'—':p+'%'; }

  // ── HTML ─────────────────────────────────────────────────────────────────
  let html=`
    <div class="goal-card">
      <div class="gauge">${gaugeSvg(overallPct)}<div class="gauge-value"><div class="pct">${overallPct}%</div><div class="lbl">Cumprimento</div></div></div>
      <div class="goal-info">
        <h3>${periodLabel}</h3>
        <p>Meta: <strong>${GOAL_PCT}%</strong>. Executadas <strong>${globalAcc.ontime+globalAcc.late}</strong> de <strong>${globalAcc.total}</strong> atividades previstas no plano.</p>
        <span class="status-pill ${meetsGoal?'ok':'warn'}">${meetsGoal?'Meta atingida ✓':`Abaixo da meta (faltam ${gap}p.p.)`}</span>
      </div>
    </div>

    <!-- KPIs de pontualidade -->
    <div class="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:20px;">
      <div class="stat-box">
        <div class="num">${globalAcc.total}</div>
        <div class="lbl">Planejadas</div>
      </div>
      <div class="stat-box">
        <div class="num" style="color:var(--ok);">${globalAcc.ontime}</div>
        <div class="lbl">No horário</div>
        <div style="font-size:12px;color:var(--ok);margin-top:2px;">${ontimePct}%</div>
      </div>
      <div class="stat-box">
        <div class="num" style="color:var(--amber);">${globalAcc.late}</div>
        <div class="lbl">Com atraso</div>
        <div style="font-size:12px;color:var(--amber);margin-top:2px;">${latePct}%</div>
      </div>
      <div class="stat-box">
        <div class="num" style="color:var(--bad);">${globalAcc.notdone}</div>
        <div class="lbl">Não executadas</div>
        <div style="font-size:12px;color:var(--bad);margin-top:2px;">${notdonePct}%</div>
      </div>
      ${globalAcc.pending>0?`<div class="stat-box"><div class="num" style="color:var(--text-dim);">${globalAcc.pending}</div><div class="lbl">Em andamento</div></div>`:''}
    </div>`;

  // ── Detalhamento por turno ────────────────────────────────────────────────
  const colOrder=[
    {key:'T1D', label:'T1 Par',   color:'#3fd6c9'},
    {key:'T1N', label:'T2 Par',   color:'#3fd6c9'},
    {key:'T2D', label:'T1 Ímpar', color:'#a78bfa'},
    {key:'T2N', label:'T2 Ímpar', color:'#a78bfa'},
  ];
  // No modo dia, mostrar só os turnos do dia selecionado
  const colsToShow = reportPeriod==='day'
    ? colOrder.filter(c=>activeTurns(reportDate).some(t=>t.key===c.key))
    : colOrder;

  html+=`<div class="section-title">Detalhamento por turno — Cumprimento do Plano</div>
    <div class="turn-breakdown" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));">`;

  colsToShow.forEach(col=>{
    const a=turnAcc[col.key];
    if(!a||a.total===0) return;
    const execPct=a.total?Math.round((a.ontime+a.late)/a.total*100):0;
    const pontPct=a.total?Math.round(a.ontime/a.total*100):0;
    html+=`<div class="turn-mini" style="border-left:3px solid ${col.color};">
      <div class="tlabel" style="color:${col.color};margin-bottom:10px;">${col.label}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;">
        <div><div style="font-size:18px;font-weight:700;color:var(--text);">${a.total}</div><div style="color:var(--text-dim);">Planejadas</div></div>
        <div><div style="font-size:18px;font-weight:700;color:var(--ok);">${a.ontime}</div><div style="color:var(--ok);">No horário</div></div>
        <div><div style="font-size:18px;font-weight:700;color:var(--amber);">${a.late}</div><div style="color:var(--amber);">Com atraso</div></div>
        <div><div style="font-size:18px;font-weight:700;color:var(--bad);">${a.notdone}</div><div style="color:var(--bad);">Não exec.</div></div>
      </div>
      <div style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;font-size:12px;">
        <span>Cumprimento: <strong style="color:${execPct>=GOAL_PCT?'var(--ok)':'var(--bad)'};">${execPct}%</strong></span>
        <span>Pontualidade: <strong style="color:${pontPct>=GOAL_PCT?'var(--ok)':'var(--amber)'};">${pontPct}%</strong></span>
      </div>
    </div>`;
  });
  html+=`</div>`;

  // ── Tabela diária (semana/mês) ────────────────────────────────────────────
  if(reportPeriod!=='day'){
    const dayNames=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    html+=`<div class="section-title">Detalhamento diário</div>
      <div class="tablewrap"><table class="report-table"><thead><tr>
        <th>Data</th><th>Turnos</th>
        <th class="num">Plan.</th>
        <th class="num" style="color:var(--ok);">No horário</th>
        <th class="num" style="color:var(--amber);">C/ atraso</th>
        <th class="num" style="color:var(--bad);">Não exec.</th>
        <th class="num">Cumprimento</th>
        <th class="num">Pontualidade</th>
      </tr></thead><tbody>`;
    dailyRows.forEach(r=>{
      const a=r.acc;
      const execP=a.total?Math.round((a.ontime+a.late)/a.total*100):null;
      const pontP=a.total?Math.round(a.ontime/a.total*100):null;
      const dow=dayNames[r.d.getDay()];
      const turnLabel=r.turns.map(t=>t.label).join(', ');
      html+=`<tr>
        <td style="white-space:nowrap;">${dow} ${fmtBR(r.d)}</td>
        <td style="font-size:11px;color:var(--text-dim);">${turnLabel}</td>
        <td class="num">${a.total}</td>
        <td class="num" style="color:var(--ok);">${a.ontime}</td>
        <td class="num" style="color:var(--amber);">${a.late}</td>
        <td class="num" style="color:var(--bad);">${a.notdone}</td>
        <td class="num" style="color:${pctColor(execP)};font-weight:700;">${pctLabel(execP)}</td>
        <td class="num" style="color:${pctColor(pontP)};font-weight:700;">${pctLabel(pontP)}</td>
      </tr>`;
    });
    html+=`</tbody></table></div>`;
  } else {
    // Modo DIA: card por turno com pontualidade detalhada
    const r=dailyRows[0];
    if(r){
      html+=`<div class="section-title">Detalhamento do dia — ${fmtBR(r.d)}</div>
        <div class="turn-breakdown" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));">`;
      r.turns.forEach(t=>{
        const a=r.perTurn[t.key]||emptyAcc();
        if(a.total===0) return;
        const col=colOrder.find(c=>c.key===t.key);
        const execPct=a.total?Math.round((a.ontime+a.late)/a.total*100):0;
        const pontPct=a.total?Math.round(a.ontime/a.total*100):0;
        html+=`<div class="turn-mini" style="border-left:3px solid ${col?.color||'var(--teal)'};">
          <div class="tlabel" style="color:${col?.color||'var(--teal)'};margin-bottom:10px;">${t.label}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;">
            <div><div style="font-size:18px;font-weight:700;color:var(--text);">${a.total}</div><div style="color:var(--text-dim);">Planejadas</div></div>
            <div><div style="font-size:18px;font-weight:700;color:var(--ok);">${a.ontime}</div><div style="color:var(--ok);">No horário</div></div>
            <div><div style="font-size:18px;font-weight:700;color:var(--amber);">${a.late}</div><div style="color:var(--amber);">Com atraso</div></div>
            <div><div style="font-size:18px;font-weight:700;color:var(--bad);">${a.notdone}</div><div style="color:var(--bad);">Não exec.</div></div>
          </div>
          <div style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;font-size:12px;">
            <span>Cumprimento: <strong style="color:${execPct>=GOAL_PCT?'var(--ok)':'var(--bad)'};">${execPct}%</strong></span>
            <span>Pontualidade: <strong style="color:${pontPct>=GOAL_PCT?'var(--ok)':'var(--amber)'};">${pontPct}%</strong></span>
          </div>
        </div>`;
      });
      html+=`</div>`;
    }
  }

  // ── Filtros da tabela detalhada ─────────────────────────────────────────
  html += `
    <div class="section-title" style="margin-top:24px;">Tabela detalhada — drill-down operacional</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;">
      <div style="font-size:12px;font-weight:600;color:var(--text-dim);width:100%;margin-bottom:4px;">Filtros da tabela:</div>
      <div style="display:flex;flex-direction:column;gap:3px;">
        <label style="font-size:11px;color:var(--text-dim);">Turno</label>
        <select id="dtFilterTurn" style="background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:5px 8px;border-radius:6px;font-size:12px;font-family:inherit;">
          <option value="">Todos</option>
          ${colsToShow.map(col=>`<option value="${col.key}">${col.label}</option>`).join('')}
        </select>
      </div>
      <div style="display:flex;flex-direction:column;gap:3px;">
        <label style="font-size:11px;color:var(--text-dim);">Status</label>
        <select id="dtFilterStatus" style="background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:5px 8px;border-radius:6px;font-size:12px;font-family:inherit;">
          <option value="">Todos</option>
          <option value="ontime">No horário</option>
          <option value="late">Com atraso</option>
          <option value="notdone">Não executado</option>
          <option value="pending">Pendente</option>
        </select>
      </div>
      <div style="display:flex;flex-direction:column;gap:3px;">
        <label style="font-size:11px;color:var(--text-dim);">Local</label>

      </div>
      <div style="display:flex;flex-direction:column;gap:3px;">
        <label style="font-size:11px;color:var(--text-dim);">Executor</label>
        <input type="text" id="dtFilterExec" placeholder="Filtrar executor..." style="background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:5px 8px;border-radius:6px;font-size:12px;font-family:inherit;width:140px;">

    </div>
    <div id="dtTableWrap"></div>
  `;

  content.innerHTML=html;

  // ── Monta registros detalhados ────────────────────────────────────────────
  function buildDetailRows(fTurn, fStatus, fLocal, fExec){
    const rows = [];
    dates.forEach(d=>{
      const ds = dateStr(d);
      const data = dataByDate[ds];
      const turnsForDay = reportPeriod==='day' ? activeTurns(d) : activeTurns(d); // sempre usa turnos do dia
      const dayNames2=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
      turnsForDay.forEach(t=>{
        if(fTurn && t.key!==fTurn) return;
        const col = [{key:'T1D',label:'T1 Par'},{key:'T1N',label:'T2 Par'},{key:'T2D',label:'T1 Ímpar'},{key:'T2N',label:'T2 Ímpar'}].find(x=>x.key===t.key);
        // Configuração vigente na data "d" — protege o detalhamento de períodos já fechados.
        getLocationsForDate(d).forEach(loc=>{
          if(fLocal && !loc.name.toLowerCase().includes(fLocal.toLowerCase())) return;
          const n = resolveFreq(loc,t.key,d);
          for(let i=0;i<n;i++){
            const k = loc.name+'|'+t.key+'|'+i;
            const entry = getEntry(data,k);
            const cls = classifyOcc(loc,t.key,i,d,entry);
            if(fStatus && cls!==fStatus) return;
            const exec = entry.ts ? (entry.emp||'—') : '—';
            if(fExec && exec!=='—' && !exec.toLowerCase().includes(fExec.toLowerCase())) return;
            if(fExec && exec==='—') return;
            const dl = occDeadline(loc,t.key,i,d);
            rows.push({
              data: dayNames2[d.getDay()]+' '+fmtBR(d),
              turno: col?.label||t.label,
              local: loc.name,
              planejado: dl ? fmtTime(dl.getTime()) : '—',
              limite: dl ? fmtTime(dl.getTime()+2*3600000) : '—',
              executado: entry.ts ? fmtTime(entry.ts) : '—',
              executor: exec,
              status: cls,
            });
          }
        });
      });
    });
    return rows;
  }

  const statusLabel = {ontime:'No horário', late:'Com atraso', notdone:'Não executado', pending:'Pendente'};
  const statusColor = {ontime:'var(--ok)', late:'var(--amber)', notdone:'var(--bad)', pending:'var(--text-dim)'};

  function renderDetailTable(rows){
    const wrap = document.getElementById('dtTableWrap');
    if(!rows.length){ wrap.innerHTML='<div class="empty-state">Nenhum registro para os filtros selecionados.</div>'; return; }
    wrap.innerHTML=`<div class="tablewrap"><table class="report-table">
      <thead><tr>
        <th>Data</th><th>Turno</th><th>Local</th>
        <th class="num">Planejado</th><th class="num">Limite</th><th class="num">Executado</th>
        <th>Executor</th><th>Status</th>
      </tr></thead><tbody>
      ${rows.map(r=>`<tr>
        <td style="white-space:nowrap;">${r.data}</td>
        <td>${r.turno}</td>
        <td>${r.local}</td>
        <td class="num" style="font-family:monospace;">${r.planejado}</td>
        <td class="num" style="font-family:monospace;">${r.limite}</td>
        <td class="num" style="font-family:monospace;color:${r.executado!=='—'?'var(--teal-bright)':'var(--text-dim)'};">${r.executado}</td>
        <td style="color:${r.executor!=='—'?'var(--text)':'var(--text-dim)'};">${r.executor}</td>
        <td><span style="color:${statusColor[r.status]};font-weight:600;font-size:12px;">${statusLabel[r.status]||r.status}</span></td>
      </tr>`).join('')}
      </tbody></table></div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:8px;">${rows.length} registro(s) encontrado(s)</div>`;
  }

  // Renderiza tabela inicial com todos os registros
  let currentRows = buildDetailRows('','','','');
  renderDetailTable(currentRows);

  // Wire filtros
  document.getElementById('dtApply').addEventListener('click', ()=>{
    const fTurn   = document.getElementById('dtFilterTurn').value;
    const fStatus = document.getElementById('dtFilterStatus').value;
    const fLocal  = document.getElementById('dtFilterLocal').value.trim();
    const fExec   = document.getElementById('dtFilterExec').value.trim();
    currentRows = buildDetailRows(fTurn, fStatus, fLocal, fExec);
    renderDetailTable(currentRows);
  });

  document.getElementById('dtClear').addEventListener('click', ()=>{
    document.getElementById('dtFilterTurn').value='';
    document.getElementById('dtFilterStatus').value='';
    document.getElementById('dtFilterLocal').value='';
    document.getElementById('dtFilterExec').value='';
    currentRows = buildDetailRows('','','','');
    renderDetailTable(currentRows);
  });

  // Exportar CSV respeitando filtros aplicados
  document.getElementById('dtExport').addEventListener('click', ()=>{
    const header = ['Data','Turno','Local','Planejado','Limite','Executado','Executor','Status'];
    const rows = currentRows.map(r=>[r.data,r.turno,r.local,r.planejado,r.limite,r.executado,r.executor,statusLabel[r.status]||r.status]);
    const csv = [header,...rows].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url;
    a.download='checklist_'+dateStr(reportDate||new Date())+'.csv';
    a.click(); URL.revokeObjectURL(url);
  });
}

    const avg=valid.reduce((s,r)=>s+(r.closedAt-r.createdAt),0)/valid.length;
    const h=avg/3600000;
    return h<1?Math.round(h*60)+'min':h<24?h.toFixed(1)+'h':(h/24).toFixed(1)+'d';

    }
    if(fTipo)  filtered=filtered.filter(r=>(r.tipo||'Não informado')===fTipo);
    if(fPrio)  filtered=filtered.filter(r=>r.prio===fPrio);

    const conF=filtered.filter(r=>r.status==='concluida');
    const aberF=filtered.filter(r=>r.status==='aberta');
    const andF=filtered.filter(r=>r.status==='andamento');
    const slaF=calcSla(conF);
    const txF=filtered.length?Math.round(conF.length/filtered.length*100):0;

    // Breakdown por tipo
    const tiposF={};
    filtered.forEach(r=>{ const t=r.tipo||'Não informado'; tiposF[t]=(tiposF[t]||0)+1; });
    const tipoBreakdown=Object.entries(tiposF).sort((a,b)=>b[1]-a[1]).map(([tipo,qtd])=>{
      const pct=filtered.length?Math.round(qtd/filtered.length*100):0;
      const conTipo=conF.filter(r=>(r.tipo||'Não informado')===tipo).length;
      return `<div class="stat-box">
        <div class="num" style="font-size:20px;color:var(--teal-bright);">${qtd}</div>
        <div style="font-size:11px;color:var(--text-dim);margin-top:4px;font-weight:600;">${tipo}</div>
        <div style="font-size:11px;color:var(--ok);margin-top:2px;">${conTipo} concluídas</div>
        <div style="margin-top:6px;height:4px;background:var(--panel-2);border-radius:3px;overflow:hidden;">
          <div style="height:100%;width:${pct}%;background:var(--teal);border-radius:3px;"></div>
        </div>
        <div style="font-size:10px;color:var(--text-dim);margin-top:3px;">${pct}% do filtro</div>
      </div>`;
    }).join('');

    // Descrição dos filtros ativos
    const filtrosAtivos = [
      (fDataDe || fDataAte) ? `Data: ${fDataDe && fDataAte && fDataDe!==fDataAte ? fmtBR(new Date(fDataDe+'T00:00:00'))+' a '+fmtBR(new Date(fDataAte+'T00:00:00')) : fmtBR(new Date((fDataDe||fDataAte)+'T00:00:00'))}` : (fMonth ? `Mês: ${fMonth}` : ''),
      fTipo  ? `Tipo: ${fTipo}` : '',
      fPrio  ? `Prioridade: ${fPrio==='alta'?'Urgente':'Normal'}` : '',
    ].filter(Boolean).join(' · ');

    // Substituir TODA a tela com o resultado filtrado
    content.innerHTML=`
      <!-- Barra de filtros ativa -->
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;background:var(--panel);border:1px solid var(--teal);border-radius:10px;padding:14px 18px;">
        <div style="font-size:13px;color:var(--teal-bright);font-weight:600;">🔍 Filtro ativo:</div>
        <div style="font-size:13px;color:var(--text);">${filtrosAtivos}</div>
        <button id="reqFilterClearResult" class="btn secondary" style="margin-left:auto;">✕ Limpar filtro</button>
      </div>

      <!-- KPIs do filtro -->
      <div class="stat-grid">
        <div class="stat-box"><div class="num">${filtered.length}</div><div class="lbl">Total</div></div>
        <div class="stat-box"><div class="num" style="color:var(--amber)">${aberF.length+andF.length}</div><div class="lbl">Não resolvidas</div></div>
        <div class="stat-box"><div class="num" style="color:var(--ok)">${conF.length}</div><div class="lbl">Concluídas</div></div>
        <div class="stat-box"><div class="num" style="color:${txF>=80?'var(--ok)':'var(--bad)'};">${txF}%</div><div class="lbl">Taxa resolução</div></div>
        <div class="stat-box"><div class="num" style="color:var(--teal-bright)">${slaF||'—'}</div><div class="lbl">SLA médio</div></div>
      </div>

      <!-- Breakdown por tipo (só se houver mais de 1) -->
      ${Object.keys(tiposF).length>1?`<div class="section-title">Por tipo de ocorrência</div><div class="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));">${tipoBreakdown}</div>`:''}

      <!-- Tabela de chamados -->
      <div class="section-title">Chamados (${filtered.length})</div>
      ${filtered.length
        ? tableHead+filtered.sort((a,b)=>b.createdAt-a.createdAt).map(reqRow).join('')+'</tbody></table></div>'
        : '<div class="empty-state">Nenhum resultado para os filtros selecionados.</div>'
      }
    `;
    wireReqReportRows(content, ()=>document.getElementById('reqFilterApply')?.click()); // reaplica o mesmo filtro após editar

    // Botão limpar volta para a tela completa
    document.getElementById('reqFilterClearResult')?.addEventListener('click', ()=>{
      renderReportRequests(content);
    });
  });
}

// Campo de busca acima do select — filtra opções em tempo real
function makeSearchableSelect(selectId){
  const sel = document.getElementById(selectId);
  if(!sel || sel._searchable) return;
  sel._searchable = true;
  sel.style.display = 'none';

  const allItems = Array.from(sel.options).map(o=>({value:o.value, text:o.text}));

  // Build wrapper
  const wrap = document.createElement('div');
  wrap.className = 'loc-ac-wrap';
  sel.parentNode.insertBefore(wrap, sel);
  wrap.appendChild(sel);

  // Input
  const input = document.createElement('input');
  input.type = 'text';
  input.autocomplete = 'off';
  input.spellcheck = false;
  input.placeholder = '🔍  Buscar local...';
  input.className = 'loc-ac-input';
  const curOpt = allItems.find(i=>i.value===sel.value);
  if(curOpt) input.value = curOpt.text;
  wrap.insertBefore(input, sel);

  // Chevron
  const icon = document.createElement('span');
  icon.className = 'loc-ac-icon';
  icon.textContent = '⌄';
  wrap.insertBefore(icon, sel);

  // Dropdown
  const dd = document.createElement('div');
  dd.className = 'loc-ac-dropdown';
  wrap.insertBefore(dd, sel);

  let hi = -1;

  function getFiltered(q){
    return q ? allItems.filter(i=>i.text.toLowerCase().includes(q.toLowerCase())) : allItems;
  }

  function renderDD(q){
    const f = getFiltered(q);
    hi = f.length===1 ? 0 : -1;
    dd.innerHTML = '';
    if(!f.length){
      dd.innerHTML = '<div class="loc-ac-empty">Nenhum ambiente encontrado</div>';
      return;
    }
    f.forEach((item,idx)=>{
      const div = document.createElement('div');
      div.className = 'loc-ac-item' + (idx===hi?' highlighted':'');
      div.textContent = item.text;
      div.addEventListener('mousedown', e=>{
        e.preventDefault();
        pickItem(item);
      });
      // Touch support
      div.addEventListener('touchend', e=>{
        e.preventDefault();
        pickItem(item);
      });
      dd.appendChild(div);
    });
  }

  function pickItem(item){
    sel.value = item.value;
    input.value = item.text;
    dd.classList.remove('open');
    icon.textContent = '⌄';
    sel.dispatchEvent(new Event('change', {bubbles:true}));
    input.blur();
  }

  function openDD(){
    renderDD(input.value);
    dd.classList.add('open');
    icon.textContent = '⌃';
  }

  function closeDD(){
    dd.classList.remove('open');
    icon.textContent = '⌄';
    // Restore label
    const cur = allItems.find(i=>i.value===sel.value);
    if(cur) input.value = cur.text;
  }

  input.addEventListener('focus', ()=>{ input.select(); openDD(); });
  input.addEventListener('input', ()=>{ openDD(); const f=getFiltered(input.value); if(f.length===1) sel.value=f[0].value; });
  input.addEventListener('blur',  ()=>{ setTimeout(closeDD, 250); });

  input.addEventListener('keydown', e=>{
    const f = getFiltered(input.value);
    if(e.key==='ArrowDown'){ e.preventDefault(); hi=Math.min(hi+1,f.length-1); updateHi(f); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); hi=Math.max(hi-1,0); updateHi(f); }
    else if(e.key==='Enter'){ e.preventDefault(); if(hi>=0&&f[hi]) pickItem(f[hi]); else if(f.length===1) pickItem(f[0]); }
    else if(e.key==='Escape'){ input.value=''; openDD(); }
  });

  function updateHi(f){
    dd.querySelectorAll('.loc-ac-item').forEach((el,i)=>{
      el.classList.toggle('highlighted', i===hi);
      if(i===hi) el.scrollIntoView({block:'nearest'});
    });
    if(hi>=0&&f[hi]) sel.value=f[hi].value;
  }

  document.addEventListener('click', e=>{ if(!wrap.contains(e.target)) closeDD(); });
}

async function renderUsers(){
  if(!isAdmin){ renderChecklist(); return; }

  try{ const snap=await window.storage.get('system:users',true); users=snap?JSON.parse(snap.value):[]; }catch(e){ users=[]; }

  const admins=sorted.filter(u=>u.perfil==='admin');
  const supervisors=sorted.filter(u=>u.perfil==='supervisor');
  const ops=sorted.filter(u=>u.perfil!=='admin' && u.perfil!=='supervisor');
  function userRow(u){
    const ri=users.findIndex(x=>x.nome===u.nome); const isAdm=u.perfil==='admin'; const isSup=u.perfil==='supervisor';
    const badgeColor = isAdm ? '#e3b341' : (isSup ? '#a78bfa' : 'var(--teal)');
    const badgeLabel = isAdm ? '👑 Admin' : (isSup ? '🧑‍💼 Supervisor' : '👤 Operador');

      <td style="padding:11px 16px;"><div style="display:flex;align-items:center;gap:10px;">
        <div style="width:32px;height:32px;border-radius:50%;background:${badgeColor};color:${isAdm?'#000':'#fff'};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;">${u.nome.charAt(0).toUpperCase()}</div>
        <div style="font-size:13px;font-weight:600;">${u.nome}</div>
      </div></td>

      <td style="padding:11px 16px;"><span style="font-size:12px;color:var(--text-dim);background:var(--panel-2);padding:3px 10px;border-radius:6px;letter-spacing:1px;">••••</span></td>

        <button class="btn small secondary" style="color:var(--bad);border-color:var(--bad);" data-del="${ri}" title="Excluir">✕</button>
      </td></tr>`;

  function tbl(list,title,color){
    if(!list.length) return '';
    return `<div style="font-size:11px;font-weight:700;color:${color};text-transform:uppercase;letter-spacing:.8px;margin:20px 0 8px;">${title} (${list.length})</div>
    <div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:4px;">
      <table style="width:100%;border-collapse:collapse;">

  app.innerHTML=`<div style="max-width:700px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;">
      <div><div style="font-size:18px;font-weight:700;">👥 Usuários</div>

  </div>`;
  document.getElementById('btnShowForm').addEventListener('click',()=>{ document.getElementById('formCard').style.display=''; document.getElementById('btnShowForm').style.display='none'; document.getElementById('uNome').focus(); });
  document.getElementById('btnHideForm')?.addEventListener('click',()=>{ document.getElementById('formCard').style.display='none'; document.getElementById('btnShowForm').style.display=''; });
  document.getElementById('uSave').addEventListener('click',async()=>{
    const nome=document.getElementById('uNome').value.trim(), pin=document.getElementById('uPin').value.trim(), perfil=document.getElementById('uPerfil').value, err=document.getElementById('uError');
    if(!nome){err.textContent='Informe o nome.';return;}
    if(pin.length<4){err.textContent='PIN deve ter pelo menos 4 caracteres.';return;}
    if(users.find(u=>u.nome.toLowerCase()===nome.toLowerCase())){err.textContent='Já existe um usuário com esse nome.';return;}
    if(users.find(u=>u.pin===pin)){err.textContent='Esse PIN já está em uso.';return;}
    err.textContent=''; users.push({nome,pin,perfil});
    await window.storage.set('system:users',JSON.stringify(users),true); renderUsers();
  });
  app.querySelectorAll('[data-editperfil]').forEach(sel=>{
    sel.addEventListener('change',async()=>{
      const idx=parseInt(sel.getAttribute('data-editperfil'));
      const u=users[idx];
      const novo=sel.value;
      const labelMap={admin:'👑 Administrador',supervisor:'🧑‍💼 Supervisor',operador:'👤 Operador'};
      if(!confirm('Alterar perfil de "'+u.nome+'" para '+labelMap[novo]+'?')){ sel.value=u.perfil||'operador'; return; }
      users[idx].perfil=novo;
      await window.storage.set('system:users',JSON.stringify(users),true);
      renderUsers();
    });
  });

  app.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const idx=parseInt(btn.getAttribute('data-edit'));
      const np=prompt('Novo PIN para "'+users[idx].nome+'" (mín. 4 caracteres):','');
      if(!np||np.length<4){if(np!==null)alert('PIN muito curto.');return;}
      users[idx].pin=np; await window.storage.set('system:users',JSON.stringify(users),true); renderUsers();
    });
  });
  app.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const idx=parseInt(btn.getAttribute('data-del'));
      if(!confirm('Excluir "'+users[idx].nome+'"?'))return;
      users.splice(idx,1); await window.storage.set('system:users',JSON.stringify(users),true); renderUsers();
    });
  });
}

/* ===================== LOGIN DE USUÁRIO ===================== */
async function ensureUserLogin(){
  if(window.demoReady) await window.demoReady;
  // Verifica se há usuários cadastrados
  let users = [];
  try{
    const snap = await window.storage.get('system:users', true);
    users = snap ? JSON.parse(snap.value) : [];
  }catch(e){ users = []; }

  // Se não há usuários cadastrados, mostra tela de login com aviso
  if(users.length === 0){
    await renderUserLogin(true); // true = modo sem usuários cadastrados
    return;
  }

  // Restaura sessão se válida (12h)
  try{
    const sess = await window.storage.get('userSession', false);
    if(sess){
      const u = JSON.parse(sess.value);
      if(u.ts && (Date.now()-u.ts) < 8*60*60*1000){  // sessão válida por 8h (1 turno), por dispositivo
        const found = users.find(x=>x.nome===u.nome && x.pin===u.pin);
        if(found){
          currentUser=found; currentEmployee=found.nome;
          isAdmin=(found.perfil==='admin');
          isSupervisor=(found.perfil==='supervisor');
          if(isAdmin) showAdminBadge();
          await abrirTelaInicial();
          updateNavAdminVisibility();
          hideLoader();
          return;
        }
      }
      // Sessão expirada ou inválida
      try{ await window.storage.delete('userSession',false); }catch(e){}
    }
  }catch(e){}
  await renderUserLogin();
}

              <input type="password" id="loginPin" placeholder="Mín. 4 caracteres" maxlength="8" autocomplete="current-password" style="width:100%;padding-right:44px;">
              <button type="button" id="togglePin" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-dim);font-size:17px;padding:0;line-height:1;" title="Mostrar/ocultar PIN">👁</button>
            </div>
          </div>
          <div id="loginError" style="color:var(--bad);font-size:12.5px;min-height:18px;margin-bottom:10px;text-align:center;"></div>
          <button class="btn" id="loginBtn" style="width:100%;padding:13px;font-size:15px;letter-spacing:.5px;">ENTRAR</button>
          <div style="text-align:center;margin-top:16px;font-size:12px;color:var(--text-dim);">Não tem acesso? Fale com o administrador.</div>
        </div>
      </div>
    </div>
  `;

  document.getElementById('togglePin').addEventListener('click', ()=>{
    const inp = document.getElementById('loginPin');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    document.getElementById('togglePin').textContent = inp.type === 'password' ? '👁' : '🙈';
  });

  async function doLogin(){
    const nome = document.getElementById('loginNome').value.trim();
    const pin  = document.getElementById('loginPin').value.trim();
    const err  = document.getElementById('loginError');
    const btn  = document.getElementById('loginBtn');
    if(!nome||!pin){ err.textContent='Preencha usuário e PIN.'; return; }
    btn.disabled=true; btn.textContent='Verificando...'; err.textContent='';
    try{
      const snap = await window.storage.get('system:users', true);
      const users = snap ? JSON.parse(snap.value) : [];
      const found = users.find(u=>u.nome.toLowerCase()===nome.toLowerCase()&&u.pin===pin);
      if(found){
        currentUser=found; currentEmployee=found.nome;
        isAdmin=(found.perfil==='admin');
        isSupervisor=(found.perfil==='supervisor');
        await window.storage.set('userSession', JSON.stringify({...found, ts:Date.now()}), false);
        await saveEmployee(found.nome);
        if(isAdmin) showAdminBadge();
        await abrirTelaInicial();
        updateNavAdminVisibility();
        hideLoader();
      } else {
        err.textContent='Usuário ou PIN incorretos.';
        btn.disabled=false; btn.textContent='ENTRAR';
        document.getElementById('loginPin').value='';
        document.getElementById('loginPin').focus();
      }
    }catch(e){
      err.textContent='Erro ao conectar. Tente novamente.';
      btn.disabled=false; btn.textContent='ENTRAR';
    }
  }

  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('loginPin').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('loginNome').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('loginPin').focus(); });
  setTimeout(()=>{ const el=document.getElementById('loginNome'); if(el) el.focus(); }, 100);
}

/* ===================== ALTERAR PIN ===================== */
function renderChangePinModal(){
  // Modal overlay
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9998;display:flex;align-items:center;justify-content:center;';
  overlay.innerHTML = `
    <div style="background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;width:340px;max-width:92vw;">
      <div style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:16px;">🔑 Alterar meu PIN</div>
      <div class="form-row" style="margin-bottom:12px;">
        <label style="font-size:12px;color:var(--text-dim);">PIN atual</label>
        <input type="password" id="pinAtual" placeholder="Mín. 4 caracteres" maxlength="8"
          style="width:100%;padding:9px 12px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:8px;font-size:14px;font-family:inherit;">
      </div>
      <div class="form-row" style="margin-bottom:12px;">
        <label style="font-size:12px;color:var(--text-dim);">Novo PIN</label>
        <input type="password" id="pinNovo" placeholder="Mín. 4 caracteres" maxlength="8"
          style="width:100%;padding:9px 12px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:8px;font-size:14px;font-family:inherit;">
      </div>
      <div class="form-row" style="margin-bottom:14px;">
        <label style="font-size:12px;color:var(--text-dim);">Confirmar novo PIN</label>
        <input type="password" id="pinConfirm" placeholder="Mín. 4 caracteres" maxlength="8"
          style="width:100%;padding:9px 12px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:8px;font-size:14px;font-family:inherit;">
      </div>
      <div id="pinError" style="color:var(--bad);font-size:12px;min-height:16px;margin-bottom:10px;"></div>
      <div style="display:flex;gap:10px;">
        <button id="pinSave" class="btn" style="flex:1;">Salvar</button>
        <button id="pinCancel" class="btn secondary" style="flex:1;">Cancelar</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('pinCancel').addEventListener('click', ()=>overlay.remove());
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  document.getElementById('pinSave').addEventListener('click', async ()=>{
    const atual   = document.getElementById('pinAtual').value.trim();
    const novo    = document.getElementById('pinNovo').value.trim();
    const confirm = document.getElementById('pinConfirm').value.trim();
    const err     = document.getElementById('pinError');
    if(!atual||!novo||!confirm){ err.textContent='Preencha todos os campos.'; return; }
    if(atual !== currentUser?.pin){ err.textContent='PIN atual incorreto.'; return; }
    if(novo.length < 4){ err.textContent='Novo PIN deve ter pelo menos 4 caracteres.'; return; }
    if(novo !== confirm){ err.textContent='Os PINs não coincidem.'; return; }
    err.textContent='';
    try{
      const snap = await window.storage.get('system:users', true);
      const users = snap ? JSON.parse(snap.value) : [];
      const idx = users.findIndex(u=>u.nome===currentUser.nome&&u.pin===currentUser.pin);
      if(idx<0){ err.textContent='Usuário não encontrado.'; return; }
      if(users.find((u,i)=>i!==idx&&u.pin===novo)){ err.textContent='Esse PIN já está em uso.'; return; }
      users[idx].pin = novo;
      currentUser.pin = novo;
      await window.storage.set('system:users', JSON.stringify(users), true);
      await window.storage.set('userSession', JSON.stringify(currentUser), false);
      overlay.remove();
      alert('✅ PIN alterado com sucesso!');
    }catch(e){ err.textContent='Erro ao salvar. Tente novamente.'; }
  });
}

    function getFiltered(q){ return q ? allItems.filter(i=>i.text.toLowerCase().includes(q.toLowerCase())) : allItems; }
    function openDD(q){
      const filtered = getFiltered(q);
      dd.innerHTML = '';
      if(!filtered.length){ dd.innerHTML='<div class="lsearch-empty">Nenhum ambiente encontrado</div>'; }
      else { filtered.forEach(item=>{ const div=document.createElement('div'); div.className='lsearch-item'; div.textContent=item.text; div.addEventListener('mousedown',e=>{ e.preventDefault(); input.value=item.text; hidden.value=item.value; dd.classList.remove('open'); }); div.addEventListener('touchend',e=>{ e.preventDefault(); input.value=item.text; hidden.value=item.value; dd.classList.remove('open'); input.blur(); }); dd.appendChild(div); }); }
      dd.classList.add('open');
    }
    // iOS Safari: usar click em vez de focus para garantir abertura do dropdown
    input.addEventListener('click', ()=>{ openDD(input.value); });
    input.addEventListener('focus', ()=>{ openDD(input.value); });
    input.addEventListener('touchstart', ()=>{ setTimeout(()=>openDD(input.value), 50); }, {passive:true});
    input.addEventListener('input', ()=>{ openDD(input.value); if(getFiltered(input.value).length===1) hidden.value=getFiltered(input.value)[0].value; });
    input.addEventListener('blur',  ()=>{ setTimeout(()=>dd.classList.remove('open'), 300); });
    input.addEventListener('keydown', e=>{ if(e.key==='Escape'){ input.value=''; openDD(''); } if(e.key==='Enter'){ const f=getFiltered(input.value); if(f.length>=1){ input.value=f[0].text; hidden.value=f[0].value; dd.classList.remove('open'); } e.preventDefault(); } });
    document.addEventListener('click', e=>{ if(!input.contains(e.target)&&!dd.contains(e.target)) dd.classList.remove('open'); });
    document.addEventListener('touchstart', e=>{ if(!input.contains(e.target)&&!dd.contains(e.target)) dd.classList.remove('open'); }, {passive:true});
    input.value = '';
    hidden.value = '';
  })();

    const file = e.target.files[0];
    if(!file){ reqFotoDataUrl=null; return; }
    try{ reqFotoDataUrl = await compressImageWithLimit(file, 700*1024); }
    catch(e){ reqFotoDataUrl=null; }
  });

  document.getElementById('kSubmit').addEventListener('click', async ()=>{
    const nome  = document.getElementById('kNome').value.trim();
    const local = document.getElementById('kLocal').value;
    const tipo  = document.getElementById('kTipo').value;
    const desc  = document.getElementById('kDesc').value.trim();

    document.getElementById('kSubmit').disabled = true;
