    const obj = {id, nome, local, tipo, desc, prio, status:'aberta', createdAt:now, updatedAt:now, foto:reqFotoDataUrl||null};
    await saveRequest(id, obj);

    document.getElementById('kPanelNew').style.display='none';
    document.getElementById('kSuccess').style.display='block';
    document.getElementById('kSuccessCode').textContent = '#'+id;
  });
}

// Troca de aba no quiosque
function kSwitchTab(tab){
  document.getElementById('kPanelNew').style.display    = tab==='new'   ? 'block' : 'none';
  document.getElementById('kPanelCheck').style.display  = tab==='check' ? 'block' : 'none';
  document.getElementById('kPanelMine').style.display   = tab==='mine'  ? 'block' : 'none';
  document.getElementById('kSuccess').style.display     = 'none';
  ['kTabNew','kTabMine','kTabCheck'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    const active = (id==='kTabNew'&&tab==='new')||(id==='kTabMine'&&tab==='mine')||(id==='kTabCheck'&&tab==='check');
    el.style.background = active ? 'var(--teal)' : 'var(--panel)';
    el.style.color      = active ? '#fff'        : 'var(--text)';
    el.style.border     = active ? 'none'        : '1px solid var(--line)';
  });

  if(tab==='check'){
    // Wire search button
    setTimeout(()=>{
      const btn = document.getElementById('kSearchBtn');
      if(btn && !btn._wired){
        btn._wired = true;
        btn.addEventListener('click', async ()=>{
          const code = document.getElementById('kCodeInput').value.trim().toUpperCase().replace('#','');
          const result = document.getElementById('kCheckResult');
          if(!code){ result.innerHTML='<div style="color:var(--bad);font-size:13px;">Informe o código.</div>'; return; }
          btn.disabled=true; btn.textContent='Consultando...';
          const r = await loadRequest(code);
          btn.disabled=false; btn.textContent='Consultar';
          if(!r || !r.id){
            result.innerHTML='<div style="color:var(--bad);font-size:13px;">Solicitação não encontrada. Verifique o código.</div>';
            return;
          }
          const statusMap = {
            aberta:   {label:'⏳ Pendente',      color:'var(--amber)'},
            andamento:{label:'🔧 Em andamento',   color:'var(--teal-bright)'},
            concluida:{label:'✅ Concluída',       color:'var(--ok)'},
          };
          const s = statusMap[r.status] || {label:r.status, color:'var(--text)'};
          const assigneeHtml = r.assignee ? '<div style="font-size:13px;color:var(--text-dim);margin-top:4px;"><strong style="color:var(--text);">Responsável:</strong> '+r.assignee+'</div>' : '';
          const closedHtml   = r.closedAt  ? '<div style="font-size:13px;color:var(--ok);margin-top:4px;">Concluída em: '+fmtBRTime(new Date(r.closedAt))+'</div>' : '';
          result.innerHTML =
            '<div style="background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;">' +
              '<div style="font-size:11px;color:var(--text-dim);margin-bottom:6px;">SOLICITAÇÃO #'+r.id+'</div>' +
              '<div style="font-size:15px;font-weight:700;color:'+s.color+';margin-bottom:10px;">'+s.label+'</div>' +
              '<div style="font-size:13px;color:var(--text-dim);"><strong style="color:var(--text);">Local:</strong> '+r.local+'</div>' +
              '<div style="font-size:13px;color:var(--text-dim);margin-top:4px;"><strong style="color:var(--text);">Descrição:</strong> '+r.desc+'</div>' +
              assigneeHtml + closedHtml +
              '<div style="font-size:11px;color:var(--text-dim);margin-top:8px;">Aberta em: '+fmtBRTime(new Date(r.createdAt))+'</div>' +
            '</div>';
        });
      }
      // Wire mine button
      const mineBtn = document.getElementById('kMineBtn');
      if(mineBtn && !mineBtn._wired){
        mineBtn._wired = true;
        mineBtn.addEventListener('click', async ()=>{
          const nome = document.getElementById('kMineInput').value.trim().toLowerCase();
          const result = document.getElementById('kMineResult');
          if(!nome){ result.innerHTML='<div style="color:var(--bad);font-size:13px;">Informe seu nome.</div>'; return; }
          mineBtn.disabled=true; mineBtn.textContent='Buscando...';
          await ensureRequestsLoaded();
          // Busca TODAS as solicitações — incluindo concluídas
          const all = _requests.filter(r=> r.nome && r.nome.toLowerCase().includes(nome))
                                .sort((a,b)=>b.createdAt-a.createdAt);
          mineBtn.disabled=false; mineBtn.textContent='Buscar minhas solicitações';
          if(!all.length){
            result.innerHTML='<div style="font-size:13px;color:var(--text-dim);text-align:center;padding:20px 0;">Nenhuma solicitação encontrada para "<strong>'+nome+'</strong>".</div>';
            return;
          }
          const statusMap={aberta:{label:'⏳ Pendente',color:'var(--amber)'},andamento:{label:'🔄 Em andamento',color:'#2563eb'},concluida:{label:'✅ Concluída',color:'var(--ok)'}};

          function cardHtml(r){
            const s=statusMap[r.status]||{label:r.status,color:'var(--text)'};
            return '<div style="background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;">'+
              '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">'+
                '<span style="font-size:11px;color:var(--text-dim);">#'+r.id+'</span>'+
                '<span style="font-size:12px;font-weight:700;color:'+s.color+';">'+s.label+'</span>'+
              '</div>'+
              '<div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px;">'+r.local+'</div>'+
              '<div style="font-size:12px;color:var(--text-dim);margin-bottom:4px;">'+r.tipo+'</div>'+
              (r.desc?'<div style="font-size:12px;color:var(--text-dim);margin-bottom:4px;">'+r.desc+'</div>':'')+
              '<div style="font-size:11px;color:var(--text-dim);">Aberta em: '+fmtBRTime(new Date(r.createdAt))+'</div>'+
              (r.assignee?'<div style="font-size:12px;color:var(--text-dim);margin-top:3px;">👤 Responsável: '+r.assignee+'</div>':'')+
              (r.status==='concluida'&&r.resolvedAt?'<div style="font-size:12px;color:var(--ok);margin-top:3px;">✅ Concluída em: '+fmtBRTime(new Date(r.resolvedAt))+'</div>':'')+
            '</div>';
          }

          let activeFilter='todas';
          function renderFull(){
            const ct={todas:all.length,aberta:all.filter(r=>r.status==='aberta').length,andamento:all.filter(r=>r.status==='andamento').length,concluida:all.filter(r=>r.status==='concluida').length};
            const filtered=activeFilter==='todas'?all:all.filter(r=>r.status===activeFilter);
            result.innerHTML=
              '<div style="font-size:12px;color:var(--text-dim);margin-bottom:10px;">'+all.length+' solicitação(ões) no histórico</div>'+
              '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;">'+
                [['todas','Todas'],['aberta','⏳ Pendentes'],['andamento','🔄 Em andamento'],['concluida','✅ Concluídas']].map(([v,l])=>
                  '<button data-f="'+v+'" style="padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:'+(activeFilter===v?'var(--teal)':'var(--panel)')+';color:'+(activeFilter===v?'#06211f':'var(--text-dim)')+';">'+l+' ('+ct[v]+')</button>'
                ).join('')+
              '</div>'+
              (filtered.length?filtered.map(cardHtml).join(''):'<div style="font-size:13px;color:var(--text-dim);text-align:center;padding:20px 0;">Nenhuma solicitação neste filtro.</div>');
            result.querySelectorAll('[data-f]').forEach(btn=>{
              btn.addEventListener('click',()=>{ activeFilter=btn.getAttribute('data-f'); renderFull(); });
            });
          }
          renderFull();
        });
      }
    }, 100);
  }
}

const CARGOS_EFETIVO = ['Operador de máquina','Descarte / Resíduos','Serviços Gerais','Encarregado','Supervisor','ASG de Refeitório'];
/* Valores ORIGINAIS que estavam fixos no código. Servem só como BASE da migração (vigência "desde o início")
   e como reserva se o cadastro ainda não puder ser lido. O dimensionamento real agora é o cadastro
   "📐 Dimensionamento de Efetivo" (window.efDim) — nunca altere números aqui. */
const TURNO_LABELS_PADRAO = {T1D:'T1 Par (Diurno)', T1N:'T2 Par (Noturno)', T2D:'T1 Ímpar (Diurno)', T2N:'T2 Ímpar (Noturno)'};
const TURNO_PREVISTO_PADRAO = {T1D:11, T1N:10, T2D:11, T2N:10};
/* Nome atual do turno (cadastro) — mantém a sintaxe TURNO_LABELS[chave] usada em toda a tela. */
const TURNO_LABELS = new Proxy({}, {get:(_,k)=> typeof k==='string' ? ((window.efDim && window.efDim.nome(k)) || TURNO_LABELS_PADRAO[k]) : undefined});
/* Reserva: previsto vigente HOJE. Os cálculos usam efPrevistoReg(registro, turno, data) — por data. */
const TURNO_PREVISTO = new Proxy({}, {get:(_,k)=> typeof k==='string' ? (window.efDim ? window.efDim.previsto(k, window.efDim.hoje()) : (TURNO_PREVISTO_PADRAO[k]||0)) : undefined});
/* Previsto de um turno numa data: usa a cópia guardada no lançamento (_previsto); sem ela, a vigência da data. */
function efPrevistoReg(reg, tk, ds){
  if(reg && reg._previsto && reg._previsto[tk]!=null) return reg._previsto[tk];
  return window.efDim ? window.efDim.previsto(tk, ds) : (TURNO_PREVISTO_PADRAO[tk]||0);
}

/* ── Cadastro de colaboradores: leitura e gravação seguras ──
   • leitura: falha de rede/tempo esgotado NÃO recria a lista (antes, a lista inicial era regravada por cima do cadastro real);
   • gravação: saveColaboradores() recebe a lista alterada na tela, descobre O QUE mudou em relação ao que a tela carregou
     (cadastro novo / situação ou dados alterados / remoção) e aplica só essa mudança, de forma ATÔMICA, sobre a versão mais recente
     do servidor — o que outra pessoa ou outra tela gravou antes NÃO é desfeito por uma tela desatualizada;
   • só termina com sucesso depois que o servidor confirma; se não confirmar, avisa e lança erro (os módulos que dependem do
     salvamento, como mover documentos de um colaborador renomeado, então não rodam). */
const COLAB_KEY = 'efetivo:colaboradores';
async function lerColabServidor(){
  const snap = await withTimeout(fbRoot.child(encodeKey(COLAB_KEY)).get(), 15000);
  if(!snap.exists()) return {lista:null, existe:false};
  let v = snap.val(); if(typeof v === 'string') v = JSON.parse(v);
  return {lista: Array.isArray(v) ? v : [], existe:true};
}
async function saveColaboradores(list){
  const falha = (msg) => { alert(msg); const e = new Error('colaboradores: não salvo'); e.naoSalvo = true; throw e; };
  if(window.__colabErro) falha('Não foi possível carregar o cadastro de colaboradores. Atualize a página (F5) antes de alterar, para não perder dados.');
  const nm = p => (p && p.nome) || p;
  const base = window.__colabBase || [];
  const novo = (list || []).map(p => typeof p === 'object' ? p : {nome:p});
  // o que mudou na tela em relação ao que ela carregou
  const ops = [];
  if(novo.length === base.length){
    novo.forEach((p,i)=>{ if(JSON.stringify(p) !== JSON.stringify(base[i])) ops.push({op:'update', de:nm(base[i]), para:p}); });
  } else if(novo.length === base.length + 1){
    const nomesBase = new Set(base.map(nm)); novo.forEach(p=>{ if(!nomesBase.has(nm(p))) ops.push({op:'add', para:p}); });
  } else if(novo.length === base.length - 1){
    const nomesNovo = new Set(novo.map(nm)); base.forEach(p=>{ if(!nomesNovo.has(nm(p))) ops.push({op:'remove', de:nm(p)}); });
  } else falha('Alteração não reconhecida no cadastro. Atualize a página (F5) e tente de novo.');
  if(!ops.length) return;
  let motivo = null;
  try{
    const ref = fbRoot.child(encodeKey(COLAB_KEY));
    const res = await Promise.race([
      ref.transaction(cur=>{
        motivo = null;
        if(cur === null) return cur;                       // 1ª chamada sem dado local: a transação mantém o valor atual do armazenamento local
        let lista; try{ lista = typeof cur === 'string' ? JSON.parse(cur) : cur; }catch(e){ motivo = 'O cadastro está ilegível. Atualize a página.'; return; }
        if(!Array.isArray(lista)){ motivo = 'O cadastro está ilegível. Atualize a página.'; return; }
        lista = lista.slice();
        for(const o of ops){
          if(o.op === 'add'){
            if(lista.some(p=>nm(p) === nm(o.para))){ motivo = 'Já cadastrado.'; return; }
            lista.push(o.para); lista.sort((a,b)=>String(nm(a)).localeCompare(String(nm(b))));
          } else {
            const i = lista.findIndex(p=>nm(p) === o.de);
            if(o.op === 'remove'){ if(i >= 0) lista.splice(i,1); continue; }      // já removido por outra pessoa: nada a fazer
            if(i < 0){ motivo = 'Este colaborador não foi encontrado: o cadastro foi alterado por outra pessoa. Atualize a tela e tente de novo.'; return; }
            if(nm(o.para) !== o.de && lista.some((p,k)=>k !== i && nm(p) === nm(o.para))){ motivo = 'Já existe outro colaborador com esse nome.'; return; }
            lista[i] = Object.assign({}, typeof lista[i] === 'object' ? lista[i] : {nome:lista[i]}, o.para);
          }
        }
        return JSON.stringify(lista);
      }),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('__sem_confirmacao__')), 20000))
    ]);
    if(!res.committed) falha(motivo || 'Não foi possível salvar. Nada foi alterado — tente novamente.');
    if(res.snapshot.val() === null) falha('O cadastro de colaboradores ainda não foi inicializado. Atualize a página (F5) e tente de novo.');
    try{ const v = res.snapshot.val(); window.__colabBase = JSON.parse(JSON.stringify(typeof v === 'string' ? JSON.parse(v) : v)); }catch(e){}
  }catch(e){
    if(e && e.naoSalvo) throw e;
    if(e && e.message === '__sem_confirmacao__') falha('O servidor não confirmou a gravação (conexão lenta ou sem internet). Se a conexão voltar, a alteração ainda pode ser enviada: recarregue a página e confira antes de repetir.');
    console.error('[Efetivo] Falha ao gravar o cadastro de colaboradores', e);
    falha('Não foi possível salvar. Nada foi alterado — tente novamente.');
  }
}

  async function buildHistorico(){
    const days=Array.from({length:14},(_,i)=>{ const d=new Date(currentDate); d.setDate(d.getDate()-(13-i)); return d; });
    const results=await Promise.all(days.map(d=>loadEfetivo(dateStr(d))));
    const rows=[];
    for(let i=0;i<14;i++){
      const d=days[i]; const ddata=results[i];
      const turnos=ddata._turnos||turnosEfetivoDia(d).map(t=>t.key);
      for(const tk of turnos){
        const lista=ddata[tk]||[]; const previsto=efPrevistoReg(ddata,tk,dateStr(d)); const realizado=lista.length;
        if(previsto===0&&realizado===0) continue;
        const diff=realizado-previsto; const ader=previsto>0?(realizado/previsto*100).toFixed(1)+'%':'—';
        rows.push(`<tr><td style="padding:9px 12px;white-space:nowrap;">${fmtBR(d)}</td>
          <td style="padding:9px 12px;">${TURNO_LABELS[tk]||tk}</td>
          <td style="padding:9px 12px;text-align:center;font-weight:600;">${previsto||'—'}</td>
          <td style="padding:9px 12px;text-align:center;font-weight:600;">${realizado}</td>
          <td style="padding:9px 12px;text-align:center;font-weight:600;color:${diff>=0?'var(--ok)':'var(--bad)'};">${diff>=0?'+':''}${diff}</td>
          <td style="padding:9px 12px;text-align:center;font-weight:600;">${ader}</td></tr>`);
      }
    }
    return rows.length?`<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;">
      <thead><tr style="border-bottom:2px solid var(--line);">
        <th style="padding:9px 12px;text-align:left;font-size:11px;color:var(--text-dim);">DATA</th>
        <th style="padding:9px 12px;text-align:left;font-size:11px;color:var(--text-dim);">PLANTÃO</th>
        <th style="padding:9px 12px;text-align:center;font-size:11px;color:var(--text-dim);">PREVISTO</th>
        <th style="padding:9px 12px;text-align:center;font-size:11px;color:var(--text-dim);">REALIZADO</th>
        <th style="padding:9px 12px;text-align:center;font-size:11px;color:var(--text-dim);">DIFERENÇA</th>
        <th style="padding:9px 12px;text-align:center;font-size:11px;color:var(--text-dim);">ADERÊNCIA</th>
      </tr></thead><tbody>${rows.join('')}</tbody></table></div>`
      :'<div class="empty-state">Nenhum lançamento nos últimos 14 dias.</div>';
  }

  async function buildConsolidado(ano,mes){
    const diasNoMes=new Date(ano,mes,0).getDate();
    const days=Array.from({length:diasNoMes},(_,i)=>new Date(ano,mes-1,i+1));
    const results=await Promise.all(days.map(d=>loadEfetivo(dateStr(d))));
    let totalPrev=0,totalReal=0;
    for(let i=0;i<diasNoMes;i++){
      const ddata=results[i]; const turnos=ddata._turnos||turnosEfetivoDia(days[i]).map(t=>t.key);
      for(const tk of turnos){ totalPrev+=efPrevistoReg(ddata,tk,dateStr(days[i])); totalReal+=(ddata[tk]||[]).length; }
    }
    const deficit=totalReal-totalPrev; const ader=totalPrev>0?(totalReal/totalPrev*100).toFixed(1):null;
    return {totalPrev,totalReal,deficit,ader};
  }

  // ════════════════════════════════════════════════════════════════════
  // RELATÓRIO MENSAL DE EFETIVO — exportação para Excel
  // ════════════════════════════════════════════════════════════════════
  // Reaproveita EXATAMENTE a mesma fonte de dados e fórmula de aderência
  // de buildConsolidado() acima — nenhuma base nova, nenhum cálculo novo.
  // A diferença é que aqui guardamos o detalhe de CADA dia/turno, em vez
  // de só o total agregado do mês.
  const DIAS_SEMANA_PT = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];

  async function coletarEfetivoDiario(ano, mes){
    const diasNoMes = new Date(ano, mes, 0).getDate();
    const days = Array.from({length:diasNoMes}, (_,i)=>new Date(ano, mes-1, i+1));
    const results = await Promise.all(days.map(d=>loadEfetivo(dateStr(d))));

    const linhas = [];
    let totalPrevGeral=0, totalRealGeral=0;
    const porTurno = {}; // agrega por chave de turno normalizada (T1/T2), como já é exibido na tela

    for(let i=0;i<diasNoMes;i++){
      const d = days[i];
      const ddata = results[i];
      // MESMA lógica de buildConsolidado(): turnos ativos do dia sempre vêm
      // de _turnos (se já registrado) ou de activeTurns(date) como fallback.
      // Isso garante que o TOTAL do mês bata exatamente com o que a tela
      // mostra em "Calcular" — a tela sempre conta o planejado do dia,
      // mesmo quando não houve lançamento algum naquele dia.
      const turnos = ddata._turnos || turnosEfetivoDia(d).map(t=>t.key);

      for(const tk of turnos){
        const previsto = efPrevistoReg(ddata, tk, dateStr(d));
        const lista = ddata[tk];
        // Mesma expressão exata usada em buildConsolidado(): (ddata[tk]||[]).length
        const praticado = (lista||[]).length;
        const houveLancamentoNesteTurno = Array.isArray(lista);
        // Nomes dos colaboradores lançados naquele turno — mesmo dado já
        // salvo pelo lançamento diário (campo 'nome' de cada item da lista),
        // nenhuma informação nova, só reaproveitando o que já existe.
        const nomes = (lista||[]).map(p=>p.nome).filter(Boolean);

        const grupo = efGrupoPar(tk);
        if(!porTurno[grupo]) porTurno[grupo] = {planejado:0, praticado:0};

        // Soma sempre o planejado (igual à tela) e o praticado real (0 se
        // não houve lançamento) — reproduz fielmente o total consolidado.
        totalPrevGeral += previsto;
        totalRealGeral += praticado;
        porTurno[grupo].planejado += previsto;
        porTurno[grupo].praticado += praticado;

        const aderencia = previsto>0 ? (praticado/previsto*100) : null;

        linhas.push({
          data: d,
          turnoLabel: TURNO_LABELS[tk] || tk,
          turnoGrupo: grupo,
          planejado: previsto,
          praticado: praticado,
          aderencia: aderencia,
          nomes: nomes,
          // Indicador informativo (não afeta os totais): distingue visualmente
          // no relatório os dias em que realmente não houve nenhum lançamento,
          // sem deixar de contabilizá-los no resumo — igual ao comportamento
          // já existente na tela de Efetivo.
          semLancamento: !houveLancamentoNesteTurno
        });
      }
    }

    const aderenciaMensal = totalPrevGeral>0 ? (totalRealGeral/totalPrevGeral*100) : null;
    const diasComDesvio = linhas.filter(l=>l.praticado!==l.planejado).length;

    return { linhas, totalPrevGeral, totalRealGeral, aderenciaMensal, porTurno, diasComDesvio };
  }

  async function gerarRelatorioEfetivoExcel(ano, mes){
    await loadXLSXIfNeeded(); // mesma biblioteca já usada pelo Plano 52 Semanas, carregada sob demanda
    const meses2 = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    const { linhas, totalPrevGeral, totalRealGeral, aderenciaMensal, porTurno, diasComDesvio } = await coletarEfetivoDiario(ano, mes);

    // ── Aba "Efetivo Diário" ──────────────────────────────────────────
    const header = ['Data','Dia da semana','Turno','Efetivo planejado','Efetivo praticado','Aderência','Colaboradores presentes'];
    const rows = linhas.map(l=>{
      // O planejado é sempre exibido (é o mesmo valor fixo por turno que a
      // tela usa em TURNO_PREVISTO). Quando não houve NENHUM lançamento
      // naquele dia/turno, o praticado mostra 0 com uma nota explícita —
      // sem inventar valor, apenas deixando claro que ninguém foi lançado
      // (mesmo critério que a tela já usa para contar 0 no total do mês).
      return [
        fmtBR(l.data),
        DIAS_SEMANA_PT[l.data.getDay()],
        l.turnoLabel + (l.semLancamento ? ' (sem lançamento)' : ''),
        l.planejado,
        l.praticado,
        l.aderencia!==null ? (l.aderencia/100) : 'Sem lançamento', // valor fracionário p/ formatação de % no Excel
        l.nomes && l.nomes.length ? l.nomes.join(', ') : (l.semLancamento ? '—' : ''),
      ];
    });

    const wsData = [
      ['RELATÓRIO DE EFETIVO — MG02'],
      ['Mês de referência: '+meses2[mes-1]+'/'+ano],
      [],
      header,
      ...rows
    ];
    const ws = XLSX.utils.aoa_to_sheet(wsData);

    // Nota importante: a versão gratuita/community do SheetJS (a mesma já
    // usada no restante do sistema) NÃO grava estilos de célula (negrito,
    // cor de fundo) no arquivo final — esse recurso existe apenas na
    // versão paga da biblioteca. Por isso, o destaque visual do título e
    // do cabeçalho fica por conta do próprio texto em maiúsculas e da
    // estrutura clara das linhas, sem prometer uma formatação que a
    // biblioteca disponível não é capaz de produzir de verdade.

    // Formata a coluna de aderência (F) como percentual nas linhas de dados
    // — isso SIM é suportado e funciona corretamente (número + formato numérico).
    const dataStartRow = 5; // linha 1-indexed onde começam os dados (após título+subtítulo+vazio+header)
    rows.forEach((r, idx)=>{
      const rowNum = dataStartRow + idx;
      const cellRef = 'F'+rowNum;
      if(ws[cellRef] && typeof ws[cellRef].v === 'number'){
        ws[cellRef].z = '0.00%';
      }
    });

    // Larguras de coluna
    ws['!cols'] = [{wch:12},{wch:15},{wch:24},{wch:18},{wch:18},{wch:12},{wch:45}];
    // Nota: congelamento de painel (freeze panes) também não é suportado
    // pela versão gratuita/community do SheetJS. O recurso confiável que
    // realmente funciona e foi aplicado é o filtro automático abaixo.
    // filtro automático e larguras de coluna ajustadas — que já cobrem
    // bem a usabilidade do arquivo para análise.
    ws['!autofilter'] = {ref:'A4:G'+(dataStartRow-1+rows.length)};

    // ── Aba "Resumo" ─────────────────────────────────────────────────
    const resumoData = [
      ['RESUMO DO MÊS'],
      [],
      ['Mês:', meses2[mes-1]+'/'+ano],
      [],
      ['Efetivo planejado total:', totalPrevGeral],
      ['Efetivo praticado total:', totalRealGeral],
      ['Aderência mensal:', aderenciaMensal!==null ? (aderenciaMensal/100) : 'Sem dados'],
      [],
    ];
    ['T1','T2'].forEach(grupo=>{
      const g = porTurno[grupo] || {planejado:0, praticado:0};
      const aderG = g.planejado>0 ? (g.praticado/g.planejado) : null;
      resumoData.push([grupo+':']);
      resumoData.push(['Planejado:', g.planejado]);
      resumoData.push(['Praticado:', g.praticado]);
      resumoData.push(['Aderência:', aderG!==null ? aderG : 'Sem dados']);
      resumoData.push([]);
    });
    resumoData.push(['Dias com desvio:', diasComDesvio]);

    const wsResumo = XLSX.utils.aoa_to_sheet(resumoData);
    // Formata células de aderência (linha 7 = aderência mensal, e as por-turno)
    [7, 12, 17].forEach(rowNum=>{ // linhas aproximadas das aderências (mensal, T1, T2)
      const ref = 'B'+rowNum;
      if(wsResumo[ref] && typeof wsResumo[ref].v === 'number' && wsResumo[ref].v <= 1){
        wsResumo[ref].z = '0.00%';
      }
    });
    wsResumo['!cols'] = [{wch:24},{wch:16}];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Efetivo Diário');
    XLSX.utils.book_append_sheet(wb, wsResumo, 'Resumo');

    const nomeArquivo = `Relatorio_Efetivo_${meses2[mes-1]}_${ano}.xlsx`;
    XLSX.writeFile(wb, nomeArquivo);
  }

function p52Today(){ return nowBRT(); }
function p52DateStr(d){ return dateStr(d); }

function p52GetWeekDates(offset){
  const today = p52Today();
  const dow = today.getDay();
  const monday = new Date(today);
  monday.setDate(today.getDate() - (dow===0 ? 6 : dow-1) + offset*7);
  monday.setHours(0,0,0,0);
  const days = [];
  for(let i=0;i<7;i++){
    const d = new Date(monday);
    d.setDate(monday.getDate()+i);
    days.push(d);
  }
  return days;
}

function p52WeekNum(d){
  const jan1 = new Date(d.getFullYear(),0,1);
  return Math.ceil(((d-jan1)/86400000 + jan1.getDay()+1)/7);
}

// Escuta execuções do Plano de Limpeza em tempo real
// IMPORTANTE: o Plano de Limpeza grava em 'checklist:{data}' (via window.storage),
// não em 'dias/{data}'. O caminho real no banco de dados é encodeKey('checklist:'+ds).
let _p52RT = null;                      // junta várias atualizações seguidas numa única re-renderização
function p52AgendarRender(){ clearTimeout(_p52RT); _p52RT = setTimeout(()=>{ if(section === 'p52sem') p52RenderWeek(); }, 250); }
function p52StartLocalSync(){
  if(p52LocalListener) return;
  const days = p52GetWeekDates(p52WeekOffset);
  days.forEach(d => {
    const ds = p52DateStr(d);
    fbRoot.child(encodeKey('checklist:'+ds)).on('value', snap => {
      if(!snap.exists()) return;
      let dayData;
      try{ dayData = JSON.parse(snap.val()); }catch(e){ return; }
      p52SyncDayFromChecklist(ds, dayData).then(()=>{
        if(section === 'p52sem'){ if(window.__dsDesk){ if(window.dsInvalidarChecklist) window.dsInvalidarChecklist(ds); p52AgendarRender(); } else p52RenderWeek(); }
      });
    });
  });
  p52LocalListener = true;
}

// Marca como E todas as atividades do plano 52 vinculadas ao mesmo local
// Formato real de dayData (vindo de 'checklist:{data}'): plano — chave "local|turno|idx" -> {state,ts,emp}
async function p52SyncDayFromChecklist(ds, dayData){
  if(!dayData || !p52Atividades.length) return;
  const statusDay = await p52LoadStatusDay(ds);
  let changed = false;
  const _memoLocal = new Map();         // atividades que casam com cada local (calculado uma vez por local)

  for(const [key, occData] of Object.entries(dayData)){
    if(!occData || occData.state !== 'done') continue;
    const parts = key.split('|');
    const locName = parts[0];
    const turnKey = parts[1]; // T1D, T2D, T1N, T2N
    const executor = occData.emp || occData.who || '';
    const ts = occData.ts || '';

    let matching = window.__dsDesk ? _memoLocal.get(locName) : null;
    if(!matching) matching = p52Atividades.filter(a => {
      if(a.fonte === 'extra') return p52MatchLocal(a.area, locName);
      // Alias 1→N (ex: Auditório → Sala Ladicá, Sala Ladilá): casa se locName bater com QUALQUER uma das salas
      if(P52_ALIAS_MULTI[a.area]) return P52_ALIAS_MULTI[a.area].some(nome => p52MatchLocal(nome, locName));
      return p52MatchLocal(P52_ALIAS[a.area] || a.area, locName);
    });
    _memoLocal.set(locName, matching);

    for(const atv of matching){
      const aid = atv.id;
      if(!statusDay[aid] || (!statusDay[aid].manual && statusDay[aid].status !== 'E')){
        statusDay[aid] = {status:'E', resp: executor, ts, manual:false};
        changed = true;
      }
    }
  }

  if(changed) await p52SaveStatusDay(ds, statusDay);
  p52StatusCache[ds] = statusDay;
}

const _p52Norm = new Map();   // normalização memorizada (antes era refeita a cada comparação)
function p52MatchLocal(a, b){
  if(!a||!b) return false;
  const n = s => { if(!window.__dsDesk) return s.toLowerCase().trim().replace(/[^a-z0-9]/g,''); let v = _p52Norm.get(s); if(v === undefined){ v = s.toLowerCase().trim().replace(/[^a-z0-9]/g,''); _p52Norm.set(s, v); } return v; };
  const x = n(a), y = n(b);
  return x === y || x.includes(y) || y.includes(x);
}

// Consolidação diária às 00:00 (idempotente)
// ════════════════════════════════════════════════════════════
// INTEGRAÇÃO: CHECKLIST DE ATIVIDADES NA CONCLUSÃO DA OCORRÊNCIA
// ════════════════════════════════════════════════════════════
// Chamada pelo Plano de Limpeza ao clicar em "Concluir" (após escolher o responsável).
// Retorna: true = pode prosseguir e gravar o quadradinho | false = usuário cancelou.
//
// Resolve o local (usando aliases + multi-alias), busca as atividades do Plano52
// vinculadas + previstas para a data/turno, e se houver alguma, abre o checklist.
// Se não houver nenhuma atividade vinculada, retorna true direto (comportamento
// atual do Sistema de Limpeza é preservado sem nenhuma mudança visual).
function p52ResolveLocalToAreas(locName){
  const areas = new Set();
  for(const atv of p52Atividades){
    if(atv.fonte === 'extra'){
      if(p52MatchLocal(atv.area, locName)) areas.add(atv.area);
      continue;
    }
    if(P52_ALIAS_MULTI[atv.area]){
      if(P52_ALIAS_MULTI[atv.area].some(n=>p52MatchLocal(n, locName))) areas.add(atv.area);
      continue;
    }
    const oficial = P52_ALIAS[atv.area] || atv.area;
    if(p52MatchLocal(oficial, locName)) areas.add(atv.area);
  }
  return [...areas];
}

     4) 'itens'     = lista de atividades, na ordem em que devem aparecer.

function ambTipoPlanoPadrao(){

  return null;
}

/* Normalização: sem acento, minúsculas, sem pontuação, espaços únicos.
   "  CCM ", "ccm", "CCM - Sistema" → começam todos com a palavra "ccm". */
function ambNormalizar(s){
  return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}
function ambSlug(s){ return ambNormalizar(s).replace(/ /g,'_'); }

/* Identifica o tipo de ambiente pelo INÍCIO do nome (limite de palavra).
   Retorna a chave do catálogo ou null (→ comportamento anterior, nada é inventado). */
function ambTipoDoLocal(nomeLocal){
  const n = ambNormalizar(nomeLocal);
  if(!n) return null;
  for(const [tipo, def] of Object.entries(AMBIENTES_LIMPEZA)){
    for(const r of (def.reconhecer||[])){
      const k = ambNormalizar(r);
      if(k && (n === k || n.startsWith(k+' '))) return tipo;
    }
  }
  return null;
}
/* Itens do tipo, com id estável (slug do texto) e SEM duplicatas. */
function ambItensDo(tipo){
  const def = AMBIENTES_LIMPEZA[tipo]; if(!def) return [];
  const vistos = new Set(), out = [];
  (def.itens||[]).forEach(t=>{
    const texto = String(t==null?'':t).trim(), id = ambSlug(texto);
    if(!texto || vistos.has(id)) return;
    vistos.add(id); out.push({id, texto});
  });
  return out;
}
/* Chave de estado: tipo + LOCAL + TURNO → dois locais/turnos nunca compartilham estado. */
function ambChave(tipo, locName, turnKey){ return tipo+'~'+ambSlug(locName)+'~'+turnKey; }
const ambEsc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Validação do catálogo ao carregar: avisa (console) sobre erros de cadastro. */
(function ambValidarCatalogo(){
  const dono = {};
  Object.entries(AMBIENTES_LIMPEZA).forEach(([tipo,def])=>{
    if(!ambItensDo(tipo).length) console.warn('[Ambientes] "'+tipo+'" está sem itens.');
    if((def.itens||[]).length !== ambItensDo(tipo).length) console.warn('[Ambientes] "'+tipo+'" tem itens duplicados/vazios (ignorados).');
    (def.reconhecer||[]).forEach(r=>{ const k=ambNormalizar(r);
      if(dono[k] && dono[k]!==tipo) console.warn('[Ambientes] palavra "'+r+'" reconhece "'+dono[k]+'" e "'+tipo+'" — o 1º do catálogo vence.');
      dono[k] = dono[k] || tipo; });
  });
})();

/* Estado salvo (nó próprio por dia+local+turno — gravação granular, sem sobrescrever outros locais). */
async function ambLerEstado(ds, chave){
  try{ const s = await withTimeout(fbRoot.child('ambChk/'+ds+'/'+chave).get(), 6000); return s.exists() ? s.val() : null; }
  catch(e){ return null; }   // falha de leitura nunca bloqueia: abre com tudo marcado, como sempre
}

/* Checklist do ambiente — mesmo comportamento do checklist atual:
   todos marcados por padrão; desmarque só o que NÃO foi feito; Confirmar grava; Cancelar não altera nada.
   Retorna Promise<true|false> (true = pode gravar o quadradinho). */
async function ambAbrirChecklist(tipo, locName, turnKey, date, empName){
  const def = AMBIENTES_LIMPEZA[tipo], itens = ambItensDo(tipo);
  if(!def || !itens.length) return true;                       // catálogo vazio → segue o fluxo normal
  const ds = dateStr(date), chave = ambChave(tipo, locName, turnKey);
  const salvo = await ambLerEstado(ds, chave);                  // restaura o que já foi marcado
  const turnLabel = ({T1D:'T1 Par (Diurno)',T2D:'T1 Ímpar (Diurno)',T1N:'T2 Par (Noturno)',T2N:'T2 Ímpar (Noturno)'})[turnKey] || turnKey;

  return new Promise(resolve=>{
    document.getElementById('ambChecklistOverlay')?.remove();
    const overlay = document.createElement('div');
    overlay.id = 'ambChecklistOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px;';
    const itemsHtml = itens.map(it=>{
      const marcado = !(salvo && salvo.itens && salvo.itens[it.id] && salvo.itens[it.id].s==='NR');
      return `<label style="display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;">
        <input type="checkbox" data-amb-id="${ambEsc(it.id)}" ${marcado?'checked':''} style="width:20px;height:20px;accent-color:var(--teal-bright);cursor:pointer;flex-shrink:0;">
        <span style="font-size:14px;color:var(--text);">${ambEsc(it.texto)}</span></label>`;
    }).join('');
    overlay.innerHTML = `
      <div style="background:var(--panel);border:1px solid var(--teal);border-radius:14px;padding:24px;max-width:440px;width:100%;max-height:85vh;display:flex;flex-direction:column;">
        <div style="font-size:16px;font-weight:700;margin-bottom:4px;">📋 Checklist — ${ambEsc(locName)}</div>
        <div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;">${fmtBR(date)} · ${turnLabel} · ${ambEsc(empName)}</div>
        <div style="display:inline-block;align-self:flex-start;font-size:11.5px;font-weight:700;color:var(--teal-bright);background:rgba(63,214,201,.12);border-radius:20px;padding:3px 10px;margin-bottom:10px;">Plano de limpeza: ${ambEsc(def.rotulo)} · ${itens.length} itens</div>
        <div style="font-size:11.5px;color:var(--text-dim);margin-bottom:14px;background:rgba(63,214,201,.08);border-radius:6px;padding:8px 10px;">
          ${salvo ? 'Estado anterior restaurado. ' : 'Todas as atividades vêm marcadas por padrão. '}Desmarque apenas as que <strong>não</strong> foram realizadas nesta execução.
        </div>
        <div style="overflow-y:auto;flex:1;margin-bottom:12px;">${itemsHtml}</div>
        <div id="ambChkErro" style="font-size:12px;color:var(--bad);min-height:16px;margin-bottom:8px;"></div>
        <div style="display:flex;gap:10px;">
          <button id="ambChkConfirm" class="btn" style="flex:1;">Confirmar conclusão</button>
          <button id="ambChkCancel" class="btn secondary" style="flex:1;">Cancelar</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#ambChkCancel').addEventListener('click', ()=>{ overlay.remove(); resolve(false); });
    overlay.addEventListener('click', e=>{ if(e.target===overlay){ overlay.remove(); resolve(false); } });
    overlay.querySelector('#ambChkConfirm').addEventListener('click', async ()=>{
      const btn = overlay.querySelector('#ambChkConfirm'); btn.disabled = true; btn.textContent = 'Salvando…';
      const reg = {tipo, local:locName, turno:turnKey, resp:empName, ts:new Date().toISOString(), itens:{}};
      overlay.querySelectorAll('input[data-amb-id]').forEach(cb=>{
        const it = itens.find(x=>x.id===cb.getAttribute('data-amb-id'));
        reg.itens[cb.getAttribute('data-amb-id')] = {s: cb.checked ? 'E' : 'NR', t: it ? it.texto : ''};
      });
      try{ await withTimeout(fbRoot.child('ambChk/'+ds+'/'+chave).set(reg), 15000); }
      catch(e){
        overlay.querySelector('#ambChkErro').textContent = 'Não foi possível salvar o checklist (sem conexão?). Tente novamente.';
        btn.disabled = false; btn.textContent = 'Confirmar conclusão'; return;     // mantém aberto: nada se perde
      }
      try{                                   // espelha no Plano 52: E/NR por atividade, nos mesmos ids da grade
        const st = await p52LoadStatusDay(ds);
        itens.forEach(it=>{ const r = reg.itens[it.id]; if(r) st[p52AtvId(locName, it.texto)] = {status:r.s, resp:empName, ts:reg.ts, manual:false}; });
        await p52SaveStatusDay(ds, st); p52StatusCache[ds] = st;
      }catch(e){}
      overlay.remove(); resolve(true);
    });
  });
}

/* Diagnóstico (rode no console: ambDiagnostico()). Mostra o que o catálogo cobre e onde
   ainda existe plano genérico legado — base para eliminar o "Sistema geral do ambiente" aos poucos. */
function ambDiagnostico(){
  const cobertos = [], semCatalogo = [];
  (typeof LOCATIONS!=='undefined' ? LOCATIONS : []).forEach(l=>{ const t=ambTipoDoLocal(l.name); if(t) cobertos.push({local:l.name,tipo:t}); else semCatalogo.push(l.name); });
  const porArea = {};
  (typeof p52Atividades!=='undefined' ? p52Atividades : []).forEach(a=>{ (porArea[a.area]=porArea[a.area]||[]).push(a.atividade); });
  const areas = [], variantes = [];
  Object.entries(porArea).forEach(([area,lista])=>{
    lista.forEach(x=>{ if(!ambEhGenerico(x) && /geral/i.test(String(x))) variantes.push({area, atividade:x}); });
    const g = lista.filter(ambEhGenerico); if(!g.length) return;
    const tipo = ambTipoDoLocal(area), soGen = g.length===lista.length;
    areas.push({area, tipoNoCatalogo:tipo, soGenerico:soGen, itens:lista.length,
                resultado: tipo ? 'catálogo por nome ('+tipo+')' : (soGen ? 'recebe o plano PADRÃO' : 'misto — permanece como está')});
  });
  const r = {catalogo:Object.fromEntries(Object.keys(AMBIENTES_LIMPEZA).map(t=>[t, ambItensDo(t).map(i=>i.texto)])),
             locaisCobertosPeloCatalogo:cobertos, qtdLocaisSemCatalogo:semCatalogo.length,
             areasP52ComPlanoGenerico:areas, variantesSuspeitas:variantes};
  console.table(areas); console.log(r); return r;
}

/* ═══════════════════════════════════════════════════════════════════════════
   PLANO DE LIMPEZA  →  PLANO DE 52 SEMANAS        (fonte única de áreas e atividades)
   ---------------------------------------------------------------------------
     ÁREAS        getLocationsForDate()  — cadastro "Áreas e Periodicidades" do Plano de Limpeza
     ATIVIDADES   plAtividadesDoLocal()  — ÚNICO resolvedor (checklist e Plano 52 usam o mesmo)
     PLANO 52     p52Atividades          — SEMPRE derivada daqui; nunca mais uma lista própria

   Ordem de precedência das atividades de um local:
     1) catálogo por nome (AMBIENTES_LIMPEZA: CCM, ESFERAS…)
     2) atividades específicas já registradas no Plano 52 antigo que pertencem ao local
        ("legado": fonte de ENTRADA transitória, SOMENTE LEITURA — desligue com PLANO52_USAR_LEGADO=false
         depois de promovê-las ao catálogo; veja plExportarLegadoComoCatalogo())
     3) plano PADRÃO quando o local só tem o item genérico ("Limpeza geral do ambiente")
   Item genérico NUNCA aparece junto de itens específicos.
   ═══════════════════════════════════════════════════════════════════════════ */
const PLANO52_USAR_LEGADO = true;
const PLANO52_MOSTRAR_AREAS_SEM_ATIVIDADE = true;
const P52_META_DERIVADO = {derivado:true, fonte:'plano-de-limpeza'};
let p52LegadoCache = [];          // lista antiga do Plano 52 (somente leitura)
let p52AreasSemAtividade = [];    // áreas do Plano de Limpeza que ainda não têm atividades
let p52LegadoOrfas = [];          // atividades antigas que não pertencem a nenhuma área do Plano de Limpeza
const _plAtivoCache = new Map();

/* mesma regra de vínculo do checklist (p52ResolveLocalToAreas), aplicada sobre a lista LEGADA */
function plLegadoAreasDoLocal(locName, legado){
  const areas = new Set();
  for(const atv of legado){
    if(atv.fonte === 'extra'){ if(p52MatchLocal(atv.area, locName)) areas.add(atv.area); continue; }
    if(P52_ALIAS_MULTI[atv.area]){ if(P52_ALIAS_MULTI[atv.area].some(n=>p52MatchLocal(n, locName))) areas.add(atv.area); continue; }
    const oficial = P52_ALIAS[atv.area] || atv.area;
    if(p52MatchLocal(oficial, locName)) areas.add(atv.area);
  }
  return [...areas];
}
function plLegadoDoLocal(locName, legado){
  const itens = [];
  plLegadoAreasDoLocal(locName, legado).forEach(a=>{
    legado.filter(x=>x.area===a).forEach(x=>itens.push({texto:x.atividade, origem:'legado:'+a, leg:x}));
  });
  return itens;
}
/* ÚNICO resolvedor de atividades de um local (ordem preservada, sem duplicatas) */
function plAtividadesDoLocal(locName, legado){
  const tipo = ambTipoDoLocal(locName);
  let itens;
  if(tipo){
    itens = ambItensDo(tipo).map(i=>({texto:i.texto, origem:'catalogo:'+tipo}));
  }else{
    itens = PLANO52_USAR_LEGADO ? plLegadoDoLocal(locName, legado||[]) : [];
    const especificos = itens.filter(x=>!ambEhGenerico(x.texto));
    if(itens.length && !especificos.length){                       // só genérico → plano padrão
      const t = ambTipoPlanoPadrao();
      itens = t ? ambItensDo(t).map(i=>({texto:i.texto, origem:'catalogo:'+t})) : itens;
    }else if(especificos.length !== itens.length){                 // genérico + específicos → só os específicos
      itens = especificos;
    }
  }
  const vistos = new Set();
  return itens.filter(x=>{ const k = ambSlug(x.texto); if(!k || vistos.has(k)) return false; vistos.add(k); return true; });
}
/* o local tem ocorrência neste dia? (usa a periodicidade REAL do Plano de Limpeza) */
function plLocalAtivoNoDia(locName, date){
  const ds = dateStr(date), k = ds+'|'+locName;
  if(_plAtivoCache.has(k)) return _plAtivoCache.get(k);
  const loc = getLocationsForDate(date).find(l=>l.name===locName);
  const v = !!loc && activeTurns(date).some(t=>resolveFreq(loc, t.key, date) > 0);
  _plAtivoCache.set(k, v); return v;
}
function plPerfilDoLocal(loc, base){
  let diurno=false, noturno=false, dias=0; const N = 14;
  for(let i=0;i<N;i++){
    const d = new Date(base); d.setDate(base.getDate()+i); let any=false;
    activeTurns(d).forEach(t=>{ if(resolveFreq(loc, t.key, d) > 0){ any=true; if(t.key==='T1D'||t.key==='T2D') diurno=true; else noturno=true; } });
    if(any) dias++;
  }
  return {turno: diurno&&noturno ? '1T/2T' : diurno ? '1T' : noturno ? '2T' : '1T/2T', freq: dias>=N-1 ? 'D' : (dias<=3 ? 'S' : 'D')};
}
/* Monta a lista no MESMO formato que as telas do Plano 52 já usam (id, area, atividade, freq, turno, planning) */
function plDerivarAtividadesP52(legado){
  _plAtivoCache.clear();
  legado = legado || [];
  const hoje = (typeof p52Today === 'function') ? p52Today() : new Date();
  const locais = getLocationsForDate(hoje);
  const out = [], vazias = [], usadas = new Set(), usoArea = {};
  locais.forEach(l=>plLegadoAreasDoLocal(l.name, legado).forEach(a=>{ (usoArea[a] = usoArea[a] || new Set()).add(l.name); }));
  locais.forEach(loc=>{
    const itens = plAtividadesDoLocal(loc.name, legado);
    if(!itens.length){ vazias.push(loc.name); return; }
    const perfil = plPerfilDoLocal(loc, hoje);
    itens.forEach(it=>{
      if(it.leg){                       // vem do legado: preserva id (histórico), freq, turno e planning
        usadas.add(it.leg);
        const compartilhada = usoArea[it.leg.area] && usoArea[it.leg.area].size > 1;
        out.push({id: compartilhada ? p52AtvId(loc.name+'::'+it.leg.area, it.texto) : it.leg.id,
                  area: loc.name, atividade: it.texto, freq: it.leg.freq, turno: it.leg.turno, planning: it.leg.planning || {},
                  fonte:'plano', plLocal: loc.name, plOrigem: it.origem});
      }else{                            // vem do catálogo: periodicidade real da área
        out.push({id: p52AtvId(loc.name, it.texto), area: loc.name, atividade: it.texto, freq: perfil.freq, turno: perfil.turno, planning: {},
                  fonte:'plano', plLocal: loc.name, plOrigem: it.origem, plDia: d=>plLocalAtivoNoDia(loc.name, d)});
      }
    });
  });
  p52AreasSemAtividade = vazias;
  p52LegadoOrfas = legado.filter(x=>!usadas.has(x));
  return out;
}
/* linha-resumo com as áreas do Plano de Limpeza que ainda não têm atividades (layout da grade intacto) */
function p52LinhaAreasSemAtividade(colspan){
  if(!PLANO52_MOSTRAR_AREAS_SEM_ATIVIDADE) return '';
  if(typeof p52Filters !== 'undefined' && (p52Filters.turno || p52Filters.freq || p52Filters.status)) return '';
  let v = p52AreasSemAtividade;
  if(typeof p52Filters !== 'undefined' && p52Filters.area) v = v.filter(a=>a===p52Filters.area);
  if(!v.length) return '';
  return `<tr><td colspan="${colspan}" style="padding:12px 14px;font-size:11.5px;color:var(--text-dim);border-top:1px solid var(--line);line-height:1.6;">
    <strong style="color:var(--teal-bright);">Áreas do Plano de Limpeza ainda sem atividades cadastradas (${v.length}):</strong> ${v.map(ambEsc).join(' · ')}</td></tr>`;
}
/* Auditoria: confere as regras (rode no console: plAuditoriaPlano52()) */
function plAuditoriaPlano52(){
  const hoje = (typeof p52Today === 'function') ? p52Today() : new Date();
  const locais = getLocationsForDate(hoje).map(l=>l.name);
  const porArea = new Map();
  p52Atividades.forEach(a=>{ if(!porArea.has(a.area)) porArea.set(a.area, []); porArea.get(a.area).push(a); });
  const r = {areasPlanoLimpeza: locais.length, areasComAtividades: 0, areasSemAtividades: p52AreasSemAtividade.length,
             areasAusentes: [], areasForaDoPlanoLimpeza: [], diferencas: [], duplicadas: [], genericoComEspecifico: [], colisoes: [], orfas: p52LegadoOrfas.map(x=>x.area+' → '+x.atividade)};
  locais.forEach(n=>{
    const esperado = plAtividadesDoLocal(n, p52LegadoCache).map(x=>x.texto);
    const noP52 = (porArea.get(n) || []).map(a=>a.atividade);
    if(!esperado.length){ if(!p52AreasSemAtividade.includes(n) || noP52.length) r.areasAusentes.push(n); return; }
    r.areasComAtividades++;
    if(!porArea.has(n)) r.areasAusentes.push(n);
    if(JSON.stringify(esperado) !== JSON.stringify(noP52)) r.diferencas.push({area:n, esperado, noP52});
    const slugs = noP52.map(ambSlug); if(new Set(slugs).size !== slugs.length) r.duplicadas.push(n);
    if(noP52.some(ambEhGenerico) && noP52.some(x=>!ambEhGenerico(x))) r.genericoComEspecifico.push(n);
    const alvo = p52ResolveLocalToAreas(n); if(alvo.length !== 1 || alvo[0] !== n) r.colisoes.push({local:n, casaCom:alvo});
  });
  [...porArea.keys()].forEach(a=>{ if(!locais.includes(a)) r.areasForaDoPlanoLimpeza.push(a); });
  r.ok = !r.areasAusentes.length && !r.diferencas.length && !r.duplicadas.length && !r.genericoComEspecifico.length && !r.areasForaDoPlanoLimpeza.length;
  console.log('[Auditoria Plano 52]', r); return r;
}
/* Gera o texto para PROMOVER as atividades antigas ao catálogo (e depois desligar o legado). */
function plExportarLegadoComoCatalogo(){
  const por = {};
  p52Atividades.filter(a=>/^legado:/.test(a.plOrigem||'')).forEach(a=>{ (por[a.area] = por[a.area] || []).push(a.atividade); });
  const txt = Object.entries(por).map(([area,l])=>
    "  "+ambSlug(area).toUpperCase()+": { rotulo: "+JSON.stringify(area)+", reconhecer: ["+JSON.stringify(ambNormalizar(area))+"], itens: [\n"+l.map(x=>"    "+JSON.stringify(x)+",").join('\n')+"\n  ] },").join('\n');
  console.log('// Cole dentro de AMBIENTES_LIMPEZA e depois defina PLANO52_USAR_LEGADO = false\n'+txt); return txt;
}

/* ═══════════════════════════════════════════════════════════════════════════
   NR — "NÃO REALIZADO" = PRAZO ENCERRADO SEM EXECUÇÃO
   Mesmo critério do cadeado do Plano de Limpeza (agora > prazo + tolerância), porém
   SÓ o lado "tarde demais": o cadeado de "cedo demais" (banheiros, >2h antes) NÃO é NR.
   Uma única regra alimenta: Plano de Limpeza (rótulo NR), Plano 52 (semanal/mensal) e Excel.
   Não altera isBlockedLate/isOverdue/occDeadline (funções protegidas).
   ═══════════════════════════════════════════════════════════════════════════ */
const PL_INICIO_REGISTRO_FIXO = null;   // opcional: 'AAAA-MM-DD' força a data em que o registro começou a valer
const _plNrCache = new Map();
let _plInicioReg = null;
function plLimparCacheNR(){ _plNrCache.clear(); }
/* prazo da ocorrência já encerrou e ela continua pendente? (independe do perfil: admin também) */
function plExpirada(loc, turnKey, idx, date, state){
  if(state !== 'pending') return false;
  const dl = occDeadline(loc, turnKey, idx, date); if(!dl) return false;
  const nowMs = dsNowBrtMs();
  return nowMs > dl.getTime() + blockTolerance(loc, turnKey, idx, date);
}
/* Situação do LOCAL no dia segundo o Plano de Limpeza: 'E' (alguma limpeza feita) · 'NR' (nada feito e
   tudo encerrado/não realizado) · 'PE' (ainda há ocorrência aberta) · null (sem base para decidir) */
function plStatusLocalDia(locName, date, dataDia){
  const k = dateStr(date)+'|'+locName; if(_plNrCache.has(k)) return _plNrCache.get(k);
  let r = null;
  const loc = getLocationsForDate(date).find(l=>l.name===locName);
  if(loc && dataDia){
    const ocs = [];
    activeTurns(date).forEach(t=>{ const n = resolveFreq(loc, t.key, date);
      for(let i=0;i<n;i++){ const e = getEntry(dataDia, loc.name+'|'+t.key+'|'+i); ocs.push({t:t.key, i, st:e.state || 'pending'}); } });
    if(ocs.length){
      if(ocs.some(o=>o.st==='done')) r = 'E';
      else if(ocs.every(o=>o.st==='bad' || plExpirada(loc, o.t, o.i, date, o.st))) r = 'NR';
      else r = 'PE';
    }
  }
  _plNrCache.set(k, r); return r;
}
/* Status de uma atividade num dia SEM registro gravado no Plano 52 (dia já previsto e não futuro).
   Antes do início do registro do sistema mantém PE (não existia Plano de Limpeza para cobrar). */
function plStatusPadrao(atv, date, dataDia, inicio){
  if(!inicio || dateStr(date) < inicio || !dataDia || !atv.plLocal) return 'PE';
  return plStatusLocalDia(atv.plLocal, date, dataDia) || 'PE';
}
async function plLerChecklists(days){
  const out = {};
  await Promise.all(days.map(async d=>{ const ds = dateStr(d);
    try{ const r = await window.storage.get('checklist:'+ds, false); out[ds] = r ? JSON.parse(r.value) : {}; }
    catch(e){ out[ds] = {}; } }));
  return out;
}
/* primeiro dia com dados no Plano de Limpeza (cache por sessão) */
async function plInicioRegistro(){
  if(PL_INICIO_REGISTRO_FIXO) return PL_INICIO_REGISTRO_FIXO;
  if(_plInicioReg !== null) return _plInicioReg;
  let ini = '';
  try{
    const snap = await withTimeout(fbRoot.orderByKey().startAt(encodeKey('checklist:')).limitToFirst(1).get(), 15000);
    if(snap.exists()) snap.forEach(ch=>{ const k = decodeKey(ch.key); if(!ini && k.startsWith('checklist:')) ini = k.slice(10); });
  }catch(e){
    const hoje = p52Today(), lista = [];
    for(let d=new Date(hoje.getFullYear(),0,1); d<=hoje; d.setDate(d.getDate()+1)) lista.push(dateStr(d));
    const _passo = window.__dsDesk ? 400 : 25;               // desktop: uma única rodada paralela; mobile: lotes de 25, como no original
    for(let i=0; i<lista.length && !ini; i+=_passo){
      const lote = lista.slice(i,i+_passo);
      const rs = await Promise.all(lote.map(ds=>window.storage.get('checklist:'+ds,false).catch(()=>null)));
      const j = rs.findIndex(r=>r && r.value); if(j>=0) ini = lote[j];
    }

  return _plInicioReg;
}

/* ═══════════════════════════════════════════════════════════════════════════
   INÍCIO — painel de indicadores (tela inicial do desktop)
   Todos os números vêm dos MESMOS dados e regras das telas de destino; nada é fixo:
     Cumprimento ........ regra do Relatório (no horário + com atraso ÷ planejadas), sobre checklist:{dia}
     Solicitações ....... loadAllRequests() (abertas + em andamento); variação por createdAt/closedAt
     Absenteísmo ........ Efetivo: previsto (TURNO_PREVISTO) × pessoas lançadas no turno
     Áreas críticas/Status/Feed ... ocorrências do dia (isOverdue, plExpirada, entradas concluídas)
   Cada bloco é clicável e abre a tela que contém o dado detalhado (via os botões de menu existentes).
   Semanas = domingo→sábado (a mesma convenção do Relatório, para os números baterem ao abrir).
   ═══════════════════════════════════════════════════════════════════════════ */
const INICIO_TELA_PADRAO_DESKTOP = true;   // desktop abre em Início após o login (celular continua no Plano de Limpeza)
let _inicioTok = 0, _inicioSemanas = 8, _inicioCache = null;

const inicioDia = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const inicioAgoraMs = () => dsNowBrtMs();
const inicioNum = (v,dec=0) => v.toLocaleString('pt-BR',{minimumFractionDigits:dec,maximumFractionDigits:dec});
const inicioPct = (v,dec=0) => v==null ? '—' : inicioNum(v,dec)+'%';
const inicioSinal = (v,dec=0) => (v>0?'+':(v<0?'−':''))+inicioNum(Math.abs(v),dec);

/* mesma classificação do Relatório (classifyOcc) */
function inicioClassifica(loc, turnKey, idx, date, entry, agoraMs, hojeDs){
  const st = entry.state || 'pending';
  const dl = occDeadline(loc, turnKey, idx, date);
  if(!dl) return st==='done' ? 'ontime' : 'pending';
  const dlMs = dl.getTime();
  if(st==='done') return entry.ts <= dlMs ? 'ontime' : 'late';
  if(dateStr(date)===hojeDs) return agoraMs > dlMs + 2*3600000 ? 'notdone' : 'pending';
  return 'notdone';
}
function inicioAcumula(datas, chk, hojeDs, agoraMs){
  const acc = {total:0, ontime:0, late:0, notdone:0, pending:0};
  datas.forEach(d=>{
    const data = chk[dateStr(d)] || {};
    getLocationsForDate(d).forEach(loc=>activeTurns(d).forEach(t=>{
      const n = resolveFreq(loc, t.key, d);
      for(let i=0;i<n;i++){
        const c = inicioClassifica(loc, t.key, i, d, getEntry(data, loc.name+'|'+t.key+'|'+i), agoraMs, hojeDs);
        acc.total++; acc[c]++;
      }
    }));
  });
  return acc;
}
/* denominador = planejadas COM PRAZO JÁ VENCIDO (total − pendentes ainda dentro do prazo). Em semana fechada não há pendentes,
   então é exatamente o número do Relatório; na semana em andamento mede o cumprimento até agora. */
const inicioBase = a => a.total - a.pending;
const inicioPctAcc = a => inicioBase(a) ? Math.round((a.ontime+a.late)/inicioBase(a)*100) : null;

function inicioSemanas(ancora, n){
  const dom = startOfWeek(ancora), out = [];
  for(let k=n-1;k>=0;k--){
    const ini = new Date(dom); ini.setDate(ini.getDate()-7*k);
    const dias = []; for(let i=0;i<7;i++){ const x = new Date(ini); x.setDate(ini.getDate()+i); dias.push(x); }
    out.push({ini, fim:dias[6], dias, label:'S'+p52WeekNum(ini)});
  }
  return out;
}
/* evolução semanal — só dias já ocorridos e a partir do início do registro (antes disso não há o que medir) */
async function inicioSerie(ancora, n, inicioReg){
  const hoje = inicioDia(p52Today()), hojeDs = dateStr(hoje), agora = inicioAgoraMs();
  const sem = inicioSemanas(ancora, n);
  const validos = s => s.dias.filter(d=>d<=hoje && dateStr(d)>=inicioReg);
  const chk = await plLerChecklists(sem.flatMap(validos));
  return sem.map(s=>{ const ds = validos(s); const acc = inicioAcumula(ds, chk, hojeDs, agora);
    return Object.assign({}, s, {acc, diasContados:ds.length, pct: inicioBase(acc) ? inicioPctAcc(acc) : null}); });
}
async function inicioEfetivo(ancora){
  const hoje = inicioDia(p52Today()), dom = startOfWeek(ancora), ant = new Date(dom); ant.setDate(dom.getDate()-7);
  const dias = ini => Array.from({length:7},(_,i)=>{ const x = new Date(ini); x.setDate(ini.getDate()+i); return x; }).filter(d=>d<=hoje);
  async function calc(lista){
    const rs = await Promise.all(lista.map(d=>loadEfetivo(dateStr(d))));
    let prev = 0, falt = 0, dl = 0;
    lista.forEach((d,i)=>{ const dd = rs[i] || {}; let lanc = false;
      (dd._turnos || turnosEfetivoDia(d).map(t=>t.key)).forEach(tk=>{ if(Array.isArray(dd[tk])){ lanc = true; const p = efPrevistoReg(dd, tk, dateStr(d)); prev += p; falt += Math.max(0, p-dd[tk].length); } });
      if(lanc) dl++; });
    return {prev, falt, dias:dl, pct: prev ? falt/prev*100 : null};
  }
  const [atual, anterior] = await Promise.all([calc(dias(dom)), calc(dias(ant))]);
  return {atual, anterior};
}
async function inicioSolicitacoes(){
  const todas = (await loadAllRequests()).filter(r=>r.status!=='excluida');
  const abertas = todas.filter(r=>r.status==='aberta' || r.status==='andamento');
  const T = Date.now() - 7*86400000;
  const ha7 = todas.filter(r=>(r.createdAt||0)<=T && (r.status!=='concluida' || (r.closedAt||0)>T)).length;
  return {abertas, qtd:abertas.length, delta:abertas.length-ha7};
}
/* dia selecionado: progresso por turno, situação por local e eventos */
async function inicioDiaDados(d){
  const agora = inicioAgoraMs(), hoje = inicioDia(p52Today()), ds = dateStr(d);
  const data = (await plLerChecklists([d]))[ds] || {};
  const grupo = k => (k==='T1D'||k==='T2D') ? 'T1' : 'T2';
  const prog = {T1:{done:0,total:0,label:'T1'}, T2:{done:0,total:0,label:'T2'}}, locais = [], eventos = [];
  getLocationsForDate(d).forEach(loc=>{
    const L = {name:loc.name, total:0, done:0, atras:0, nr:0};
    activeTurns(d).forEach(t=>{
      const g = grupo(t.key); prog[g].label = t.label;
      const n = resolveFreq(loc, t.key, d);
      for(let i=0;i<n;i++){
        const e = getEntry(data, loc.name+'|'+t.key+'|'+i), st = e.state || 'pending';
        L.total++; prog[g].total++;
        if(st==='done'){ L.done++; prog[g].done++;
          if(e.ts) eventos.push({tipo:'Concluída', ts:e.ts, texto:t.label+' — '+loc.name, hora:fmtTime(e.ts), emp:e.emp||'', dest:{tipo:'plano', data:d, local:loc.name, turno:g}}); }
        else if(st==='bad'){ L.nr++; }
        else if(st==='pending'){
          if(isOverdue(loc, t.key, i, d, st)){ L.atras++;
            if(plExpirada(loc, t.key, i, d, st)) L.nr++;
            const dl = occDeadline(loc, t.key, i, d);
            if(dl) eventos.push({tipo:'Atraso', ts:dl.getTime(), texto:t.label+' — '+loc.name, hora:fmtTime(dl.getTime()), dest:{tipo:'plano', data:d, local:loc.name, turno:g}}); }
        }
      }
    });
    if(L.total) locais.push(L);
  });
  locais.forEach(L=>{ L.cor = L.nr>0 ? 'bad' : (L.atras>0 ? 'amber' : (L.done>0 ? 'ok' : 'cinza')); });
  return {prog, locais, eventos, hojeEh: ds===dateStr(hoje), agora};
}

/* ── navegação: reaproveita os botões de menu (mesmos handlers, nenhuma rota nova) ── */
function inicioIr(dest){
  const dia = dest.data ? inicioDia(dest.data) : null;
  if(dest.tipo==='plano'){
    if(dia) currentDate = dia; mode = 'day';
    if(dest.turno){ turnFocus = dest.turno; saveTurnFocus(turnFocus); }
    document.getElementById('navChecklist').click();
    if(dest.local) inicioAplicarBusca(dest.local, 50);
  }else if(dest.tipo==='relatorio'){
    reportSection = 'checklist'; reportPeriod = dest.periodo || 'week'; reportDate = dia || inicioDia(p52Today());
    document.getElementById('navReport').click();
  }else if(dest.tipo==='solicitacoes'){
    reqTab = 'track'; reqSubTab = dest.sub || 'pendentes';
    document.getElementById('navRequests').click();
  }else if(dest.tipo==='efetivo'){
    if(dia) currentDate = dia; efAbaAtiva = 'dia';
    document.getElementById('navEfetivo').click();
  }
}
function inicioAplicarBusca(nome, tentativas){
  const inp = document.getElementById('locSearch'), linhas = document.querySelectorAll('.loc-row[data-locname]');
  if(!inp || !linhas.length){ if(tentativas>0) setTimeout(()=>inicioAplicarBusca(nome, tentativas-1), 120); return; }
  inp.value = nome; inp.dispatchEvent(new Event('input', {bubbles:true}));
  document.getElementById('locSearchDD')?.classList.remove('open');
  const alvo = [...linhas].find(r=>r.style.display!=='none'); if(alvo) alvo.scrollIntoView({block:'center'});
}

/* ── gráfico de linhas (SVG) ── */
function inicioGrafico(serie, Wp, Hp){   // Wp/Hp opcionais: só o painel desktop informa; sem argumentos = tamanho original (celular)
  const W=Wp||660, H=Hp||260, m={l:46,r:20,t:26,b:34}, iw=W-m.l-m.r, ih=H-m.t-m.b;
  const x = i => m.l + (serie.length>1 ? i*iw/(serie.length-1) : iw/2), y = v => m.t + ih - (v/100)*ih;
  let g = '';
  [0,25,50,75,100].forEach(v=>{ g += `<line class="ini-g" x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}"/><text class="ini-ax" x="${m.l-8}" y="${y(v)+4}" text-anchor="end">${v}%</text>`; });
  g += `<line class="ini-meta" x1="${m.l}" x2="${W-m.r}" y1="${y(GOAL_PCT)}" y2="${y(GOAL_PCT)}"/><text class="ini-meta-t" x="${W-m.r}" y="${y(GOAL_PCT)-5}" text-anchor="end">Meta ${GOAL_PCT}%</text>`;
  let seg = [], atual = [];
  serie.forEach((s,i)=>{ if(s.pct==null){ if(atual.length) seg.push(atual); atual = []; } else atual.push([x(i), y(s.pct)]); });
  if(atual.length) seg.push(atual);
  seg.forEach(p=>{
    if(p.length>1){ g += `<path class="ini-area" d="M${p[0][0]},${y(0)} L${p.map(q=>q.join(',')).join(' L')} L${p[p.length-1][0]},${y(0)} Z"/>`; g += `<polyline class="ini-line" points="${p.map(q=>q.join(',')).join(' ')}"/>`; }
  });
  serie.forEach((s,i)=>{
    const tip = s.pct==null ? 'Semana de '+fmtBR(s.ini)+' a '+fmtBR(s.fim)+' — sem registros' : 'Semana de '+fmtBR(s.ini)+' a '+fmtBR(s.fim)+' — '+s.pct+'% ('+(s.acc.ontime+s.acc.late)+' de '+inicioBase(s.acc)+' atividades). Clique para abrir o Relatório.';
    g += `<g class="ini-pt${s.pct==null?' vazio':''}" data-i="${i}" tabindex="0" role="button" aria-label="${ambEsc(tip)}"><title>${ambEsc(tip)}</title>`+
         `<rect class="ini-hit" x="${x(i)-26}" y="${m.t-6}" width="52" height="${ih+m.b+6}"/>`+
         (s.pct==null ? '' : `<circle cx="${x(i)}" cy="${y(s.pct)}" r="5"/><text class="ini-val" x="${x(i)}" y="${y(s.pct)-12}" text-anchor="middle">${s.pct}%</text>`)+
         `<text class="ini-ax ini-wk" x="${x(i)}" y="${H-10}" text-anchor="middle">${s.label}</text></g>`;
  });
  return `<svg class="ini-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução do cumprimento do plano por semana">${g}</svg>`;
}

async function p52TryOpenChecklist(locName, turnKey, date, empName){
  // Ambientes com plano próprio no catálogo (CCM, ESFERAS…): usa EXATAMENTE a lista do catálogo.
  // Qualquer outro local segue o fluxo do Plano 52 sem nenhuma alteração.
  const _tipoAmb = ambTipoDoLocal(locName);
  if(_tipoAmb) return ambAbrirChecklist(_tipoAmb, locName, turnKey, date, empName);
  // Se o preload de boot ainda não terminou (race condition rara), aguarda até 3s por ele.
  if(!p52Atividades.length){
    for(let tries=0; tries<6 && !p52Atividades.length; tries++){
      await new Promise(r=>setTimeout(r, 500));
    }
  }
  // Fallback final: tenta carregar direto, caso o preload de boot tenha falhado de fato.
  if(!p52Atividades.length){
    try{
      p52Meta = await p52LoadMeta();
      p52Atividades = await p52LoadAtividades();
    }catch(e){
      console.error('[Plano52] não foi possível carregar atividades — checklist não será exibido.', e);
      return true;
    }
  }
  if(!p52Meta || !p52Atividades.length){
    console.warn('[Plano52] nenhuma atividade carregada — o Excel foi importado?');
    return true;
  }

  const areasEncontradas = p52ResolveLocalToAreas(locName);
  if(!areasEncontradas.length){
    console.log('[Plano52] local "'+locName+'" não tem atividades vinculadas no Plano52.');
    return true;
  }

  const isDiurno = turnKey === 'T1D' || turnKey === 'T2D';
  const turnoFiltro = isDiurno ? '1T' : '2T';

  const atvsDoLocal = p52Atividades.filter(a =>
    areasEncontradas.includes(a.area) &&
    (a.turno.includes(turnoFiltro) || a.turno.includes('1T/2T')) &&
    p52IsPlanned(a, date)
  );

  if(!atvsDoLocal.length){
    console.log('[Plano52] áreas encontradas ('+areasEncontradas.join(', ')+') mas nenhuma atividade passou o filtro de turno/periodicidade para '+p52DateStr(date)+' turno '+turnKey+'.');
    return true;
  }

  // Plano genérico legado ("Limpeza geral do ambiente"): se TODAS as atividades que abririam são
  // genéricas, usa a lista padrão do catálogo. Áreas com itens específicos seguem como estão.
  if(atvsDoLocal.every(a => ambEhGenerico(a.atividade))){
    const _tipoPadrao = ambTipoPlanoPadrao();
    if(_tipoPadrao) return ambAbrirChecklist(_tipoPadrao, locName, turnKey, date, empName);
  }

  return new Promise(resolve => {
    const ds = p52DateStr(date);
    const turnLabelMap = {T1D:'T1 Par (Diurno)',T2D:'T1 Ímpar (Diurno)',T1N:'T2 Par (Noturno)',T2N:'T2 Ímpar (Noturno)'};
    const turnLabel = turnLabelMap[turnKey] || turnKey;

    const overlay = document.createElement('div');
    overlay.id = 'p52ChecklistOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px;';

    const itemsHtml = atvsDoLocal.map((atv,i) => `
      <label style="display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;">
        <input type="checkbox" data-p52-idx="${i}" checked
          style="width:20px;height:20px;accent-color:var(--teal-bright);cursor:pointer;flex-shrink:0;">
        <span style="font-size:14px;color:var(--text);">${atv.atividade}</span>
      </label>`).join('');

    overlay.innerHTML = `
      <div style="background:var(--panel);border:1px solid var(--teal);border-radius:14px;padding:24px;max-width:440px;width:100%;max-height:85vh;display:flex;flex-direction:column;">
        <div style="font-size:16px;font-weight:700;margin-bottom:4px;">📋 Checklist — ${locName}</div>
        <div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;">${fmtBR(date)} · ${turnLabel} · ${empName}</div>
        <div style="font-size:11.5px;color:var(--text-dim);margin-bottom:14px;background:rgba(63,214,201,.08);border-radius:6px;padding:8px 10px;">
          Todas as atividades vêm marcadas por padrão. Desmarque apenas as que <strong>não</strong> foram realizadas nesta execução.
        </div>
        <div style="overflow-y:auto;flex:1;margin-bottom:16px;">${itemsHtml}</div>
        <div style="display:flex;gap:10px;">
          <button id="p52ChkConfirm" class="btn" style="flex:1;">Confirmar conclusão</button>
          <button id="p52ChkCancel" class="btn secondary" style="flex:1;">Cancelar</button>
        </div>
      </div>`;

    document.body.appendChild(overlay);

    overlay.querySelector('#p52ChkCancel').addEventListener('click', ()=>{
      overlay.remove();
      resolve(false);
    });
    overlay.addEventListener('click', e=>{ if(e.target===overlay){ overlay.remove(); resolve(false); } });

    overlay.querySelector('#p52ChkConfirm').addEventListener('click', async ()=>{
      const checkboxes = overlay.querySelectorAll('input[data-p52-idx]');
      const statusDay = await p52LoadStatusDay(ds);
      const nowIso = new Date().toISOString();

      checkboxes.forEach(cb => {
        const idx = parseInt(cb.getAttribute('data-p52-idx'));
        const atv = atvsDoLocal[idx];
        const realizado = cb.checked;
        statusDay[atv.id] = {
          status: realizado ? 'E' : 'NR',
          resp: empName,
          ts: nowIso,
          manual: false,
        };
      });

      await p52SaveStatusDay(ds, statusDay);
      p52StatusCache[ds] = statusDay;
      overlay.remove();
      resolve(true);
    });
  });
}

async function p52ConsolidatePreviousDay(){
  const today = p52Today();
  const yesterday = new Date(today); yesterday.setDate(today.getDate()-1);
  const ds = p52DateStr(yesterday);

  const dayData = await loadDay(ds);
  if(dayData) await p52SyncDayFromChecklist(ds, dayData);

  const statusAfter = await p52LoadStatusDay(ds);
  let changed = false;
  for(const atv of p52Atividades){
    const aid = atv.id;
    if(!statusAfter[aid] && p52IsPlanned(atv, yesterday)){
      statusAfter[aid] = {status:'PE', resp:'', ts:'', manual:false};
      changed = true;
    }
  }
  if(changed) await p52SaveStatusDay(ds, statusAfter);
}

function p52IsPlanned(atv, date){
  if(typeof atv.plDia === 'function') return atv.plDia(date);   // item derivado do Plano de Limpeza
  if(atv.freq==='D') return true;
  if(atv.freq==='S') return date.getDay()===1;
  if(atv.freq==='Q'){ return p52WeekNum(date)%2===1; }
  return true;
}

function p52ScheduleConsolidation(){
  const now = p52Today();
  const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1, 0, 0, 5);
  const msUntil = midnight - now;
  setTimeout(async ()=>{
    await p52ConsolidatePreviousDay();
    p52ScheduleConsolidation();
  }, msUntil);
}

// ── IMPORTAÇÃO DO EXCEL (SheetJS) ────────────────────────────

// Carregamento sob demanda da biblioteca SheetJS (usada só para importar/
// atualizar o Excel do Plano 52 Semanas). Antes era carregada sempre no
// boot da página (~1MB), atrasando o carregamento inicial de TODAS as
// telas do sistema, mesmo para quem nunca usa essa funcionalidade.
let _xlsxLoadPromise = null;
function loadXLSXIfNeeded(){
  if(typeof XLSX !== 'undefined') return Promise.resolve();
  if(_xlsxLoadPromise) return _xlsxLoadPromise;
  _xlsxLoadPromise = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('Não foi possível carregar a biblioteca de leitura de Excel. Verifique sua conexão.'));
    document.head.appendChild(script);
  });
  return _xlsxLoadPromise;
}

async function p52ParseExcel(file){
  await loadXLSXIfNeeded();
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array'});
        const sheetName = wb.SheetNames.find(n=>n.trim().toLowerCase().includes('plan') && n.toLowerCase().includes('pt'));
        if(!sheetName) throw new Error('Aba "Plan PT" não encontrada no Excel.');
        const ws = wb.Sheets[sheetName];
        resolve({wb, ws, sheetName});
      }catch(err){ reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function p52ExtractFromSheet(ws){
  const range = XLSX.utils.decode_range(ws['!ref']);
  const maxRow = range.e.r+1;
  const maxCol = range.e.c+1;
  const cellVal = (r,c) => { const cell = ws[XLSX.utils.encode_cell({r,c})]; return cell ? cell.v : null; };

  let headerRow = -1;
  for(let r=0;r<30;r++){
    for(let c=0;c<20;c++){
      const v = cellVal(r,c);
      if(v && String(v).trim()==='Área'){ headerRow=r; break; }
    }
    if(headerRow>=0) break;
  }
  if(headerRow<0) throw new Error('Estrutura do Excel não reconhecida (cabeçalho não encontrado).');

  const dateRow = headerRow+1;
  const monthRow = headerRow-1;

  const MES_MAP = {
    'JANEIRO':1,'ENERO':1,'FEVEREIRO':2,'FEBRERO':2,'MARÇO':3,'MARZO':3,' ':3,
    'ABRIL':4,'MAYO':5,'JUNIO':6,'JULIO':7,'AGOSTO':8,'SEPTIEMBRE':9,
    'OCTUBRE':10,'NOVIEMBRE':11,'DICIEMBRE':12,'OUTUBRO':10,'NOVEMBRO':11,'DEZEMBRO':12
  };
  const monthStarts = [];
  for(let c=0;c<maxCol;c++){
    const v = cellVal(monthRow,c);
    if(v!=null){ const key = String(v).trim(); if(MES_MAP[key]!==undefined) monthStarts.push({col:c, mes:MES_MAP[key]}); }
  }

  const colToDate = {};
  for(let i=0;i<monthStarts.length;i++){
    const {col:cStart, mes} = monthStarts[i];
    const cEnd = i+1<monthStarts.length ? monthStarts[i+1].col : maxCol;
    for(let c=cStart;c<cEnd;c++){
      const day = cellVal(dateRow,c);
      if(day!=null && !isNaN(day)){ try{ colToDate[c] = new Date(2026,mes-1,parseInt(day)); }catch(e){} }
    }
  }

  const atividades = [];
  let currentArea = null;
  const dataStart = dateRow+2;

  for(let r=dataStart;r<maxRow;r++){
    const areaCell = cellVal(r,2);
    if(areaCell && String(areaCell).trim()) currentArea = String(areaCell).trim();
    const atvCell = cellVal(r,5);
    const freqCell = cellVal(r,8);
    const t1Cell = cellVal(r,9);
    const t2Cell = cellVal(r,10);
    if(!atvCell || !freqCell) continue;
    if(currentArea === 'Buffers') continue; // REMOVIDO

    const atv = String(atvCell).trim();
    const freq = String(freqCell).trim();
    const turno = [t1Cell,t2Cell].filter(t=>typeof t==='string').join('/') || '1T';

    const planning = {};
    for(const [col,date] of Object.entries(colToDate)){
      const v = cellVal(r,parseInt(col));
      if(v!=null){ planning[p52DateStr(date)] = String(v).trim(); }
    }

    const id = p52AtvId(currentArea||'', atv);
    atividades.push({id, area:currentArea||'', atividade:atv, freq, turno, planning, fonte:'excel'});
  }

  return {atividades, colToDate};
}

async function p52DoImport(file, onProgress){
  onProgress('Lendo arquivo Excel…');
  const {ws} = await p52ParseExcel(file);

  onProgress('Extraindo atividades…');
  const {atividades} = p52ExtractFromSheet(ws);

  onProgress('Adicionando áreas extras (Sorter, Mezanino, HS, HV)…');
  const extraAtv = [];
  for(const area of P52_AREAS_EXTRA){
    for(const a of area.atividades){
      const id = p52AtvId(area.nome, a.atv);
      const planning = {};
      for(let m=0;m<12;m++){
        const dias = new Date(2026,m+1,0).getDate();
        for(let d=1;d<=dias;d++){
          const dt = new Date(2026,m,d);
          planning[p52DateStr(dt)] = 'P';
        }
      }
      extraAtv.push({id, area:area.nome, atividade:a.atv, freq:a.freq, turno:a.turno, planning, fonte:'extra'});
    }
  }

  const all = [...atividades, ...extraAtv];
  onProgress('Gravando '+all.length+' atividades…');
  await p52SaveAtividades(all);                       // alimenta apenas o LEGADO
  p52Atividades = await p52LoadAtividades();          // a lista exibida é sempre derivada do Plano de Limpeza

  const meta = {importedAt: new Date().toISOString(), totalAtv:all.length, version:1};
  await p52SaveMeta(meta);
  p52Meta = meta;

  onProgress('Sincronizando execuções passadas (Jul–Ago 2026)…');
  await p52SyncRetroactive();

  onProgress('Concluído!');
  return {total:all.length, extras:extraAtv.length, fromExcel:atividades.length};
}

async function p52SyncRetroactive(){
  const start = new Date(2026,6,1);
  const today = p52Today();
  const end = new Date(Math.min(today.getTime(), new Date(2026,7,31).getTime()));
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    const ds = p52DateStr(new Date(d));
    try{
      const dayData = await loadDay(ds);
      if(dayData) await p52SyncDayFromChecklist(ds, dayData);
    }catch(e){}
  }
}

</div>`;
