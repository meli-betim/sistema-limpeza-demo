    const bell = document.getElementById('dsBell'); if(bell){ bell.classList.toggle('on', (estado.pendentes||0) > 0); bell.title = estado.pendentes ? (estado.pendentes+' solicitação(ões) pendente(s)') : 'Nenhuma solicitação pendente'; }
  }
  let ultimaBusca = 0;
  async function buscarPendentes(forcar){
    if(!currentUser || (!forcar && Date.now()-ultimaBusca < 60000)) return;
    ultimaBusca = Date.now();
    try{ const r = await inicioSolicitacoes(); if(r){ estado.pendentes = r.qtd; atualizarBadge(); } }catch(e){}
  }

  /* ───────────── CABEÇALHO (bell + usuário) ───────────── */
  const PERFIL = {admin:'Administrador', supervisor:'Supervisor', operador:'Operador'};
  function melhorarCabecalho(){
    const tc = document.getElementById('topControls'); if(!tc) return;
    if(!document.body.classList.contains('ds-on')) return;
    if(!document.getElementById('dsBell')){
      const b = document.createElement('button'); b.type='button'; b.id='dsBell'; b.setAttribute('aria-label','Solicitações pendentes');
      b.innerHTML = svg('bell','') + '<i></i>'; tc.appendChild(b);
      b.addEventListener('click', ()=>{ const s = document.getElementById('navRequests'); if(s){ reqTab='track'; reqSubTab='pendentes'; s.click(); } });
    }
    const pill = tc.querySelector('#btnChangePin') ? tc.querySelector('#btnChangePin').parentElement : null;
    if(pill && !pill.classList.contains('ds-user') && currentUser){
      const nome = String(currentUser.nome||''), perfil = PERFIL[currentUser.perfil] || (isAdmin?'Administrador':'Usuário');
      const keep = [pill.querySelector('#btnChangePin'), pill.querySelector('#btnLogoutUser')];
      pill.removeAttribute('style'); pill.className = 'ds-user';
      pill.innerHTML = `<span class="ds-av"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4"/><path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7z"/></svg></span><span class="ds-un"><b>${esc(nome)}</b><small>${esc(perfil)}</small></span>${svg('down','ds-uc')}<span class="ds-umenu"><button type="button" data-a="pin">Alterar PIN</button><button type="button" data-a="sair">Sair</button></span>`;
      keep.forEach(k=>{ if(k){ pill.appendChild(k); } });
      pill.addEventListener('click', e=>{
        const a = e.target.closest('[data-a]');
        const menu = pill.querySelector('.ds-umenu');
        if(a){ menu.classList.remove('open'); const alvo = pill.querySelector(a.dataset.a==='pin' ? '#btnChangePin' : '#btnLogoutUser'); if(alvo) alvo.click(); e.stopPropagation(); return; }
        menu.classList.toggle('open');
      });
    }
    tc.querySelectorAll('input[type=date]').forEach(inp=>{
      if(inp.parentElement.classList.contains('ds-dp')) return;
      const DS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'], MS=['jan.','fev.','mar.','abr.','mai.','jun.','jul.','ago.','set.','out.','nov.','dez.'];
      const fmt = v => { const p = String(v||'').split('-').map(Number); if(p.length<3||!p[0]) return 'Selecionar data'; const d = new Date(p[0],p[1]-1,p[2]); return DS[d.getDay()]+', '+String(p[2]).padStart(2,'0')+' de '+MS[p[1]-1]+' de '+p[0]; };
      const wrap = document.createElement('label'); wrap.className = 'ds-dp';
      const lab = document.createElement('span'); lab.textContent = fmt(inp.value);
      inp.parentNode.insertBefore(wrap, inp);
      wrap.innerHTML = svg('cal',''); wrap.appendChild(lab); wrap.insertAdjacentHTML('beforeend', svg('down','ds-dp-c')); wrap.appendChild(inp);
      ['input','change'].forEach(ev=>inp.addEventListener(ev, ()=>{ lab.textContent = fmt(inp.value); }));
      wrap.addEventListener('click', ()=>{ try{ inp.showPicker && inp.showPicker(); }catch(e){} });
    });
    atualizarBadge();
  }
  document.addEventListener('click', e=>{ if(!e.target.closest('.ds-user')) document.querySelectorAll('.ds-umenu.open').forEach(m=>m.classList.remove('open')); });

  function aplicarModo(){
    const lateral = mqLateral.matches && !document.body.classList.contains('kiosk') && !document.body.classList.contains('checklist-mode') && typeof currentUser!=='undefined' && !!currentUser;
    document.body.classList.toggle('ds-on', lateral);
    if(lateral){ construirLateral(); sincronizar(); melhorarCabecalho(); }
  }
  const _rtc = renderTopControls;
  renderTopControls = function(){ const r = _rtc.apply(this, arguments); try{ aplicarModo(); }catch(e){ console.warn('[Layout desktop]', e); } try{ if(window.dsPeriodoHeader) window.dsPeriodoHeader(); }catch(e){ console.warn('[Período]', e); } return r; };
  const reagir = ()=>{ aplicarModo(); if(typeof section!=='undefined' && section==='home' && currentUser){ renderTopControls(); renderInicio(); } };
  [mqPainel, mqLateral].forEach(m=>{ (m.addEventListener ? m.addEventListener('change', reagir) : m.addListener(reagir)); });
  window.dsBuscarPendentes = buscarPendentes;
  /* chamado pela lista viva de solicitações (módulo de desempenho): o selo acompanha em tempo real, sem nova leitura */
  window.dsAtualizarPendentes = ()=>{ try{ if(typeof _requests!=='undefined' && _reqLoaded){ estado.pendentes = _requests.filter(r=>r.status==='aberta'||r.status==='andamento').length; atualizarBadge(); } }catch(e){} };

  /* utilidades compartilhadas com o painel inicial (módulo "PAINEL INICIAL") */
  window.dsUI = {svg, esc, IC, estado, atualizarBadge};

  const css = document.getElementById('ds-estilo');
  aplicarModo();
  }catch(erro){
    document.body.classList.remove('ds-on'); window.dsDesktopAtivo = () => false;
    console.error('[Layout desktop] desativado por erro (o sistema segue com o layout anterior):', erro);
  }
})();
</script>

<script>
/* =====================================================================
   PAINEL INICIAL (desktop) — dashboard gerencial por PERÍODO
   ---------------------------------------------------------------------
   Fontes (as mesmas do restante do sistema; nada é estimado):
     • Cumprimento ....... checklist:{dia} + regras do Plano de Limpeza (inicioClassifica, a mesma do Início/Relatório):
                           realizadas = no horário + com atraso ÷ previstas com prazo vencido (total − pendentes).
     • Absenteísmo ....... efetivo:{dia}: faltas ÷ previsto (previsto pela vigência do Dimensionamento; faltas = max(0, previsto − presentes)).
     • Cobertura ......... horas de posto cobertas ÷ horas necessárias (12 h por posto/turno na escala 12x36), por turno T1/T2,
                           limitada ao previsto — um turno com falta não é "compensado" por excesso em outro.
     • Solicitações ...... requests (status mutuamente exclusivos: pendente=aberta · em andamento · concluída; excluídas ficam de fora),
                           contadas pela data de criação.
   Acumulados (mês, ano, histórico) = SOMA de numeradores e denominadores diários — nunca média de percentuais.
   Meses encerrados são gravados uma única vez em  consolidado/AAAA-MM  (somente leitura depois), preservando o histórico.
   Diagnóstico: ?semds=1 desliga este painel.
   ===================================================================== */
(function(){
  'use strict';
  const qs = new URLSearchParams(location.search);
  if(qs.get('tab')==='requests' || qs.get('kiosk')==='1' || qs.get('semds')==='1') return;
  try{
  const UI = window.dsUI; if(!UI) return;
  const {svg, esc} = UI;
  const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const MES3 = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const CP = '#22d3a0', CB = '#2f9bff', CR = '#ff5a5a', CY = '#ffe600';

  /* ───────── utilidades ───────── */
  const hojeD = () => inicioDia(p52Today());
  const ymKey = (a,m) => a+'-'+String(m+1).padStart(2,'0');
  const ultDia = (a,m) => new Date(a,m+1,0).getDate();
  const fmtDM = d => String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
  const parseDs = ds => { const [y,m,d] = ds.split('-').map(Number); return new Date(y,m-1,d); };
  const grp = k => window.efDim ? window.efDim.grupoManha(k) : ((k==='T1D'||k==='T2D') ? 'T1' : 'T2');
  const A0 = () => ({total:0, ontime:0, late:0, notdone:0, pending:0});
  const addA = (a,b) => { a.total+=b.total; a.ontime+=b.ontime; a.late+=b.late; a.notdone+=b.notdone; a.pending+=b.pending; return a; };
  const E0 = () => ({prev:0, falt:0, cov:0, pres:0, lanc:0});
  const addE = (a,b) => { a.prev+=b.prev; a.falt+=b.falt; a.cov+=b.cov; a.pres+=b.pres; a.lanc+=b.lanc; return a; };
  const baseA = a => a.total - a.pending, realA = a => a.ontime + a.late;
  const pctA = a => baseA(a) > 0 ? Math.round(realA(a)/baseA(a)*100) : null;
  const pctAbs = e => e.prev > 0 ? e.falt/e.prev*100 : null;
  const pctCob = e => e.prev > 0 ? Math.round(e.cov/e.prev*100) : null;
  const nf = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  const dec1 = v => (Math.round(v*10)/10).toFixed(1).replace('.',',');
  const sinal = (v,u,d) => (v>0?'+':(v<0?'−':''))+(d? dec1(Math.abs(v)) : Math.abs(v))+(u||'');

  /* ───────── agregação diária ───────── */
  function calcDia(d, chk, ef){
    const ds = dateStr(d), hojeDs = dateStr(hojeD()), agora = inicioAgoraMs();
    const g = {T1:A0(), T2:A0()}, areas = new Map();
    getLocationsForDate(d).forEach(loc=>activeTurns(d).forEach(t=>{
      const n = resolveFreq(loc, t.key, d), gr = grp(t.key); let A = areas.get(loc.name); if(!A){ A = A0(); areas.set(loc.name, A); }
      for(let i=0;i<n;i++){
        const c = inicioClassifica(loc, t.key, i, d, getEntry(chk, loc.name+'|'+t.key+'|'+i), agora, hojeDs);
        g[gr].total++; g[gr][c]++; A.total++; A[c]++;
      }
    }));
    const e = {T1:E0(), T2:E0()};
    (ef._turnos || turnosEfetivoDia(d).map(t=>t.key)).forEach(tk=>{
      if(!Array.isArray(ef[tk])) return;
      const p = efPrevistoReg(ef, tk, ds), n = ef[tk].length, E = e[grp(tk)];
      E.prev += p; E.falt += Math.max(0, p-n); E.cov += Math.min(n, p); E.pres += n; E.lanc++;
    });
    return {ds, T1:g.T1, T2:g.T2, e, areas};
  }
  const lerRaw = (pref, ds) => withTimeout(fbRoot.child(encodeKey(pref+ds)).get(), 20000).then(s=>{ if(!s.exists()) return {}; const v = s.val(); return typeof v==='string' ? JSON.parse(v) : v; });
  const diasDoMes = (a,m,reg) => { const hoje = hojeD(), out = []; for(let i=1;i<=ultDia(a,m);i++){ const d = new Date(a,m,i); if(d>hoje) break; if(dateStr(d) < reg) continue; out.push(d); } return out; };
  const mesFechado = (a,m) => { const lim = hojeD(); lim.setDate(lim.getDate()-1); return new Date(a,m,ultDia(a,m)) < lim; };

  function montarMes(a, m, dias){
    const areas = new Map();
    dias.forEach(d=>d.areas.forEach((A,nome)=>{ let X = areas.get(nome); if(!X){ X = A0(); areas.set(nome, X); } addA(X, A); }));
    return {a, m, ym:ymKey(a,m), dias:dias.map(d=>({ds:d.ds, T1:d.T1, T2:d.T2, e:d.e})), areas};
  }
  /* snapshot compacto de mês encerrado (consolidado/AAAA-MM) */
  const encA = a => [a.total,a.ontime,a.late,a.notdone,a.pending], decA = v => ({total:v[0],ontime:v[1],late:v[2],notdone:v[3],pending:v[4]});
  const encE = e => [e.prev,e.falt,e.cov,e.pres,e.lanc], decE = v => ({prev:v[0],falt:v[1],cov:v[2],pres:v[3],lanc:v[4]});
  function codificar(mes){
    return {v:1, ym:mes.ym, geradoEm:Date.now(),
      dias:mes.dias.map(d=>({d:d.ds, a:encA(d.T1), b:encA(d.T2), e:encE(d.e.T1), f:encE(d.e.T2)})),
      areas:[...mes.areas.entries()].map(([n,A])=>[n,...encA(A)])};
  }
  function decodificar(a, m, s){
    const areas = new Map(); (s.areas||[]).forEach(r=>areas.set(r[0], decA(r.slice(1))));
    return {a, m, ym:ymKey(a,m), areas, dias:(s.dias||[]).map(d=>({ds:d.d, T1:decA(d.a), T2:decA(d.b), e:{T1:decE(d.e), T2:decE(d.f)}}))};
  }

  const cacheMes = new Map();
  window.dsInvalidarMes = () => { const hoje = hojeD(); cacheMes.forEach((v,k)=>{ if(!mesFechado(+k.slice(0,4), +k.slice(5,7)-1)) cacheMes.delete(k); }); };
  function mesAgg(a, m, reg){
    const key = ymKey(a,m)+'|'+reg, c = cacheMes.get(key), fech = mesFechado(a,m);
    if(c && (fech || Date.now()-c.t < 60000)) return c.p;
    const p = fech ? mesEncerrado(a,m,reg) : mesVivo(a,m,reg);
    cacheMes.set(key, {t:Date.now(), p}); p.catch(()=>cacheMes.delete(key)); return p;
  }
  async function mesVivo(a, m, reg){
    const dias = diasDoMes(a,m,reg); if(!dias.length) return montarMes(a,m,[]);
    const [chk, efs] = await Promise.all([plLerChecklists(dias), Promise.all(dias.map(d=>loadEfetivo(dateStr(d))))]);
    return montarMes(a, m, dias.map((d,i)=>calcDia(d, chk[dateStr(d)]||{}, efs[i]||{})));
  }
  /* TODOS os consolidados dos meses encerrados numa única leitura (pequenos: ~10 KB por mês) */
  let consolMap = null;
  const lerConsolidados = () => consolMap || (consolMap = withTimeout(fbRoot.child('consolidado').get(), 15000).then(s=>s.val() || {}).catch(()=>({})));
  async function mesEncerrado(a, m, reg){
    try{
      const snap = (await lerConsolidados())[ymKey(a,m)];
      if(snap && snap.v === 1) return decodificar(a, m, snap);
    }catch(e){ /* sem snapshot (ou sem permissão): calcula */ }
    const dias = diasDoMes(a,m,reg); if(!dias.length) return montarMes(a,m,[]);
    // leitura direta (sem cache e com erro propagado): um snapshot NUNCA é gravado a partir de dado incompleto
    const [chk, efs] = await Promise.all([Promise.all(dias.map(d=>lerRaw('checklist:', dateStr(d)))), Promise.all(dias.map(d=>lerRaw('efetivo:', dateStr(d))))]);
    const mes = montarMes(a, m, dias.map((d,i)=>calcDia(d, chk[i]||{}, efs[i]||{})));
    try{ const r = await fbRoot.child('consolidado/'+mes.ym).transaction(cur => cur === null ? codificar(mes) : undefined); if(r && r.committed){ (await lerConsolidados())[mes.ym] = codificar(mes); } }catch(e){ console.info('[Painel] consolidado não gravado (sem permissão?):', e && e.message); }
    return mes;
  }

  /* ───────── período ───────── */
  const periodoAtual = () => window.__dsPeriodo || (()=>{ const h = hojeD(); return {t:'mes', a:h.getFullYear(), m:h.getMonth()}; })();
  let regIni = null;                                           // 1º dia com registro do Plano de Limpeza
  const mesesDisp = () => {
    const h = hojeD(), out = []; let a = h.getFullYear(), m = h.getMonth();
    const r = regIni && regIni !== '9999-12-31' ? parseDs(regIni) : null;
    while(true){ out.push({a,m}); if(!r || (a===r.getFullYear() && m===r.getMonth())) break; m--; if(m<0){ m=11; a--; } if(out.length>120) break; }
    return out;
  };
  const anosDisp = () => [...new Set(mesesDisp().map(x=>x.a))];
  function descPeriodo(p, ate){
    const h = hojeD();
    if(p.t==='mes'){ const atual = p.a===h.getFullYear() && p.m===h.getMonth(); return {titulo:MESES[p.m]+'/'+p.a, estado: atual ? 'Mês em andamento' : 'Fechamento mensal', verde: atual}; }
    if(p.t==='ano') return {titulo:'Acumulado de '+p.a, estado:'Acumulado até '+(ate||fmtBR(h)), verde:false};
    return {titulo:'Histórico completo', estado: ate ? 'Até '+ate : 'Todos os meses disponíveis', verde:false};
  }
  function mesesDoPeriodo(p){
    const h = hojeD(), r = regIni && regIni !== '9999-12-31' ? parseDs(regIni) : null; const out = [];
    const ok = (a,m) => !r || a>r.getFullYear() || (a===r.getFullYear() && m>=r.getMonth());
    if(p.t==='mes'){ if(ok(p.a,p.m)) out.push({a:p.a,m:p.m}); }
    else if(p.t==='ano'){ const ultimo = p.a===h.getFullYear() ? h.getMonth() : 11; for(let m=0;m<=ultimo;m++) if(ok(p.a,m)) out.push({a:p.a,m}); }
    else { for(const x of mesesDisp().reverse()) out.push(x); }
    return out;
  }
  const mesAnterior = (a,m) => m===0 ? {a:a-1,m:11} : {a,m:m-1};

  /* ───────── seleção de período no cabeçalho ───────── */
  window.dsPeriodoHeader = function(){
    const tc = document.getElementById('topControls'); if(!tc) return;
    const ativo = section==='home' && window.dsDesktopAtivo && window.dsDesktopAtivo() && !!currentUser;
    document.body.classList.toggle('ds-periodo', ativo);
    const velho = document.getElementById('dsPeriodo'); if(velho) velho.remove(); const velhoP = document.getElementById('dsPeriodoProx'); if(velhoP) velhoP.remove();
    if(!ativo) return;
    const p = periodoAtual(), d = descPeriodo(p, window.__dsAte);
    const box = document.createElement('div'); box.id = 'dsPeriodo'; box.className = 'pn-sel';
    box.innerHTML = `<button type="button" class="pn-sel-b" aria-haspopup="listbox" aria-expanded="false">${svg('cal','')}<span class="pn-sel-t"><small>Período de análise</small><b>${esc(d.titulo)}</b><em><i class="${d.verde?'on':''}"></i>${esc(d.estado)}</em></span>${svg('down','pn-sel-c')}</button><div class="pn-sel-m" role="listbox"></div>`;
    tc.insertBefore(box, tc.firstChild);
    const prox = document.createElement('button'); prox.type = 'button'; prox.id = 'dsPeriodoProx'; prox.className = 'pn-prox'; prox.title = 'Ir para o mês seguinte'; prox.setAttribute('aria-label','Mês seguinte'); prox.innerHTML = svg('chev','');
    const hh = hojeD(); const noAtual = p.t!=='mes' || (p.a===hh.getFullYear() && p.m===hh.getMonth()); prox.disabled = noAtual;
    prox.onclick = () => { if(prox.disabled) return; const n = p.m===11 ? {a:p.a+1,m:0} : {a:p.a,m:p.m+1}; window.__dsPeriodo = {t:'mes', a:n.a, m:n.m}; renderInicio(); };
    box.insertAdjacentElement('afterend', prox);
    const menu = box.querySelector('.pn-sel-m'), btn = box.querySelector('.pn-sel-b');
    const igual = x => p.t===x.t && p.a===x.a && p.m===x.m;
    const itens = [];
    mesesDisp().forEach(x=>itens.push({t:'mes', a:x.a, m:x.m, rot:MESES[x.m]+'/'+x.a}));
    itens.push({sep:true});
    anosDisp().forEach(a=>itens.push({t:'ano', a, rot:'Acumulado de '+a}));
    itens.push({t:'hist', rot:'Histórico completo'});
    menu.innerHTML = itens.map((x,i)=>x.sep ? '<div class="pn-sel-sep"></div>' : `<button type="button" role="option" data-i="${i}" class="${igual(x)?'sel':''}">${esc(x.rot)}</button>`).join('');
    btn.onclick = e => { e.stopPropagation(); const ab = menu.classList.toggle('open'); btn.setAttribute('aria-expanded', ab); };
    menu.onclick = e => { const b = e.target.closest('[data-i]'); if(!b) return; const x = itens[+b.dataset.i]; window.__dsPeriodo = {t:x.t, a:x.a, m:x.m}; menu.classList.remove('open'); window.__dsFiltro = window.__dsFiltro || 'ALL'; renderInicio(); };
  };
  document.addEventListener('click', e=>{ if(!e.target.closest('#dsPeriodo')){ const m = document.querySelector('#dsPeriodo .pn-sel-m.open'); if(m) m.classList.remove('open'); } });
  // abrir a página inicial sempre volta para o mês/ano atuais
  document.addEventListener('click', e=>{ if(e.target.closest && e.target.closest('#navHome')) window.__dsPeriodo = null; }, true);

  /* ───────── gráficos (SVG) ───────── */
  function grafico(pts, W, H){
    const m = {l:46, r:18, t:26, b:34}, iw = W-m.l-m.r, ih = H-m.t-m.b, n = pts.length;
    const x = i => m.l + (i+.5)*iw/n, y = v => m.t + ih - v/100*ih;
    let g = '';
    [0,25,50,75,100].forEach(v=>{ g += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="#22314d" stroke-dasharray="3 4"/><text x="${m.l-9}" y="${y(v)+4}" text-anchor="end" class="pn-ax">${v}%</text>`; });
    g += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(GOAL_PCT)}" y2="${y(GOAL_PCT)}" stroke="${CY}" stroke-width="1.4" stroke-dasharray="6 5"/><text x="${W-m.r}" y="${y(GOAL_PCT)-6}" text-anchor="end" class="pn-meta">Meta ${GOAL_PCT}%</text>`;
    const seg = (campo) => { const out = []; let at = []; pts.forEach((p,i)=>{ const v = p[campo] ? p[campo].pct : null; if(v==null){ if(at.length) out.push(at); at = []; } else at.push([x(i), y(v), i]); }); if(at.length) out.push(at); return out; };
    const sc = seg('cump'), sb = seg('cob');
    g += `<defs><linearGradient id="pnGr" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${CP}" stop-opacity=".30"/><stop offset="1" stop-color="${CP}" stop-opacity=".02"/></linearGradient></defs>`;
    sc.forEach(s=>{ if(s.length>1) g += `<path d="M${s[0][0]},${y(0)} L${s.map(q=>q[0]+','+q[1]).join(' L')} L${s[s.length-1][0]},${y(0)} Z" fill="url(#pnGr)"/>`; });
    sb.forEach(s=>{ if(s.length>1) g += `<polyline fill="none" stroke="${CB}" stroke-width="2.4" stroke-linejoin="round" points="${s.map(q=>q[0]+','+q[1]).join(' ')}"/>`; });

  function barras(itens, W, H){

  /* ───────── solicitações ───────── */

  }

  function seriePorSemana(dias, g){

  const somaMeses = meses => somaDias(meses.flatMap(x=>x.dias), 'ALL');

  function dadosPeriodo(){

  /* ── Carregamento: leituras em paralelo; cada bloco aparece assim que seus dados chegam ──

      const solP = (async()=>{ await new Promise(r=>setTimeout(r,60)); const todas = await seguro('solicitações', ()=>loadAllRequests()); if(!vivo()) return; est.todas = todas || []; delete est.pend.sol; pintar(); })();
      const [reg] = await Promise.all([seguro('registro', ()=>plInicioRegistro()), lerConsolidados()]);

      // meses necessários, por prioridade
      const ordem = [], vistos = new Set(); const add = (x) => { if(!x || !ok(x.a,x.m)) return; const k = ymKey(x.a,x.m); if(vistos.has(k)) return; vistos.add(k); ordem.push(x); };

      };

      const executar = async (fila) => { let idx = 0; const w = async () => { while(idx < fila.length){ const x = fila[idx++]; const r = await seguro('mês '+chaves(x), ()=>mesAgg(x.a, x.m, regIni)); if(!vivo()) return; if(r) est.mapa.set(chaves(x), r); atualizar(); pintar(); } }; await Promise.all([w(), w(), w()]); };
      if(!ordem.length){ delete est.pend.cur; delete est.pend.ref; delete est.pend.tend; delete est.pend.ano; est.meses = []; pintar(); }

  function ir(dest){ inicioIr(dest); }

  function desenhar(){

    lista.sort((a,b)=> est.ordem==='pior' ? (a.pct-b.pct)||(b.prev-a.prev) : (b.pct-a.pct)||(b.prev-a.prev));
    const top5 = lista.slice(0,5);
    // tendência
    const tend = (est.tend||[]).map(x=>{ const ss = somaMeses([x]); const pct = pctA(ss.a); return {label:MES3[x.m]+'/'+String(x.a).slice(2), pct, tip:MESES[x.m]+'/'+x.a+': '+(pct==null?'sem registros':pct+'% ('+realA(ss.a)+' de '+baseA(ss.a)+' atividades)')+(mesFechado(x.a,x.m)?'':' · mês em andamento')}; });
    // consolidado do período (cartão inferior)
    const cons = est.consol;
    let cs = null, csSol = null, csTit = '';
    if(cons==='ano'){ const ms = est.anoMeses || []; cs = ms.length ? somaMeses(ms) : null; csTit = est.anoCons; if(est.todas) csSol = solicitacoes(est.todas, new Date(est.anoCons,0,1), new Date(est.anoCons,11,31,23,59,59,999)); }
    else { cs = s; csSol = sol; csTit = ehMes ? MESES[p.m]+'/'+p.a : meu.titulo; }
    const sufix = cons==='ano' ? ['(acumulado)','(acumulada)','(ano)'] : ['(mês)','(mês)','(mês)'];
    const csPend = cons==='ano' ? pend.ano : pend.cur;
    const rowC = (cor, ic, rot, val, extra) => `<div class="pn-cl"><span class="pn-ci" style="background:${cor}">${svg(ic,'')}</span><span class="pn-clb"><small>${rot}</small>${extra||''}</span><b>${val}</b></div>`;
    const consBottom = csPend ? [1,2,3,4].map(()=>`<div class="pn-cl">${skel('26px','26px','border-radius:50%')}<span class="pn-clb">${skel('100%','13px')}</span></div>`).join('') :
      rowC('#12403a','target','Cumprimento do plano '+sufix[0], cs&&pctA(cs.a)!=null ? pctA(cs.a)+'%' : '—') +
      rowC('#7a5c10','users','Absenteísmo '+sufix[0], cs&&pctAbs(cs.e)!=null ? dec1(pctAbs(cs.e))+'%' : '—') +
      rowC('#173f86','user','Cobertura operacional '+sufix[1], cs&&pctCob(cs.e)!=null ? pctCob(cs.e)+'%' : '—') +
      `<div class="pn-cl"><span class="pn-ci" style="background:#7a5c10">${svg('doc','')}</span><span class="pn-clb"><small>Solicitações ${sufix[2]}</small>${csSol?`<span class="pn-mini"><i style="background:${CP}"></i>${csSol.concluida}<i style="background:${CB}"></i>${csSol.andamento}<i style="background:${CR}"></i>${csSol.pendente}</span>`:''}</span><b>${csSol?csSol.total:'—'}</b></div>`;
    // visão consolidada (lateral)
    const tabs = {mes:p.t==='mes', ano:p.t==='ano'};
    const dtx = (v,u,dec) => v==null ? 'sem base comparável' : (v===0 ? '— 0 '+u : sinal(v,'',dec)+' '+u)+' '+(ehMes ? curto : refTxt);
    const box = (ic, rot, valor, setaHtml, det) => `<div class="pn-cbox"><div class="pn-cbi">${svg(ic,'')}</div><div class="pn-cbt"><small>${rot}</small><b>${valor}</b></div><div class="pn-cd">${setaHtml}<span>${det}</span></div></div>`;
    const consRows = pend.cur ? [1,2,3,4].map(()=>`<div class="pn-cbox">${skel('100%','34px')}</div>`).join('') :
      box('clock','Cumprimento do plano', `<span style="color:${CP}">${pc!=null?pc+'%':'—'}</span>`, seta(dC,true), pend.ref?'…':dtx(dC,'p.p.')) +
      box('target','Absenteísmo', pa!=null?dec1(pa)+'%':'—', seta(dA,false), pend.ref?'…':dtx(dA,'p.p.',true)) +
      box('users','Cobertura operacional', `<span style="color:${CB}">${pb!=null?pb+'%':'—'}</span>`, seta(dB,true), pend.ref?'…':dtx(dB,'p.p.')) +
      box('doc','Solicitações (total)', sol?sol.total:'—', dS==null||dS===0?'<span class="pn-eq">—</span>':`<span class="${dS>0?'pn-up':'pn-dn'}" style="color:${CB}">${dS>0?'↑':'↓'}</span>`, sol ? (dS==null?'sem base comparável':sinal(dS,'%')+' '+(ehMes?curto:refTxt)) : '');

    const falhas = est.falha.length ? `<div class="pn-aviso">Alguns dados não puderam ser carregados (${esc(est.falha.join(', '))}). Nenhum valor foi estimado.</div>` : '';
    const proxOk = p.t==='mes' && !(p.a===hojeD().getFullYear() && p.m===hojeD().getMonth());
    app.innerHTML = `<div class="ds-home pn">${falhas}
      <section class="pn-hero"><div class="pn-hero-l"><i class="pn-bar-y"></i><div><h2>Olá, <em>${esc(nome||'bem-vindo(a)')}</em>!</h2><p>Aqui você acompanha os principais indicadores e o andamento das atividades de limpeza do MG02.</p></div></div>
        <div class="pn-hero-art" aria-hidden="true"><div class="pn-wh"></div><div class="pn-hero-t"><b>MG02</b><small>Mercado Livre — Betim</small></div></div></section>

            <div class="pn-ctl"><div class="pn-seg" role="tablist"><button type="button" data-esc="sem" class="${est.escala==='sem'?'on':''}">Semanas</button><button type="button" data-esc="mes" class="${est.escala==='mes'?'on':''}">Meses</button></div>

          <div class="pn-chart" id="pnChart">${grafHtml}<div class="pn-tip" id="pnTip" role="status"></div></div></section>
        <aside class="pn-card pn-cons"><header class="pn-ch"><h3>${svg('target','pn-yi')} Visão consolidada</h3></header>

            (top5.length ? `<table class="pn-tb"><thead><tr><th>Posição</th><th class="l">Área</th><th>Atividades previstas</th><th>Realizadas</th><th>%</th></tr></thead><tbody>${top5.map((x,i)=>`<tr data-area="${esc(x.n)}" tabindex="0" title="Abrir ${esc(x.n)} no Plano de Limpeza"><td><b>${i+1}</b></td><td class="l">${esc(x.n)}</td><td>${nf(x.prev)}</td><td>${nf(x.real)}</td><td class="${x.pct>=GOAL_PCT?'ok':(x.pct<50?'bad':'')}">${x.pct}%</td></tr>`).join('')}</tbody></table>` : '<div class="pn-vazio">Sem atividades previstas no período.</div>')}</section>
        <section class="pn-card"><header class="pn-ch"><h3>${svg('chart','pn-yi')} Tendência mensal <small>(últimos 6 meses)</small></h3></header>
          <button type="button" class="pn-lnk2 pn-sub-r" id="pnRelHist">Ver relatório de histórico →</button>
          <div class="pn-tend" id="pnTend">${pend.tend && !tend.length ? '<i class="ds-sk" style="position:absolute;inset:0;border-radius:8px"></i>' : (tend.length ? '' : '<div class="pn-vazio">Sem meses com registros.</div>')}</div>
          <div class="pn-lg pn-lg2"><span><i style="background:${CP}"></i>Cumprimento do plano</span><span><i class="dash"></i>Meta ${GOAL_PCT}%</span></div></section>
        <section class="pn-card"><header class="pn-ch"><h3>${svg('doc','pn-yi')} Solicitações por status</h3></header>
          ${(pend.sol||!sol) ? `<div class="pn-donutw">${skel('120px','120px','border-radius:50%')}<div style="flex:1">${skel('100%','14px','margin-bottom:14px')}${skel('100%','14px','margin-bottom:14px')}${skel('100%','14px')}</div></div>` :
            `<div class="pn-donutw">${rosca(sol)}<table class="pn-dl"><tbody>${[['Concluídas',sol.concluida,CP],['Em andamento',sol.andamento,CB],['Pendentes',sol.pendente,CR]].map(([r,v,c])=>`<tr><td><i style="background:${c}"></i>${r}</td><td>${v} <span>(${sol.total?Math.round(v/sol.total*100):0}%)</span></td></tr>`).join('')}</tbody></table></div>${sol.outros?`<div class="pn-nota">${sol.outros} solicitação(ões) com outro status não entram na rosca.</div>`:''}`}
          <button type="button" class="pn-lnk" id="pnTodasSol">Ver solicitações →</button></section>
        <section class="pn-card"><header class="pn-ch"><h3>${svg('target','pn-yi')} Consolidado do período</h3></header>
          <div class="pn-seg pn-seg2 pn-seg3"><button type="button" data-cons="mes" class="${cons==='mes'?'on':''}">Mensal</button><button type="button" data-cons="ano" class="${cons==='ano'?'on':''}">Anual</button></div>
          <p class="pn-sub" style="margin:0 0 4px">${cons==='ano'?'Acumulado de '+esc(String(csTit))+' (soma dos meses com registros)':esc(String(csTit))}</p>
          <div class="pn-cls">${consBottom}</div>
          <button type="button" class="pn-lnk" id="pnRelCons">Ver histórico completo →</button></section>
      </div></div>`;

    /* gráficos dimensionados pelo contêiner */
    const $ = id => document.getElementById(id);
    const sizeGraf = () => {
      const box = $('pnChart'); if(box && pts.length && !carregandoGraf){ const w = Math.max(360, box.clientWidth), hh = Math.max(180, box.clientHeight); const t = $('pnTip'); box.innerHTML = grafico(pts, w, hh); box.appendChild(t || Object.assign(document.createElement('div'),{id:'pnTip',className:'pn-tip'}));
        box.querySelectorAll('.pn-hit').forEach(r=>{ const i = +r.dataset.i, P = pts[i]; const mostra = ev => { const tp = $('pnTip'); const lin = [`<b>${esc(P.tit)}</b>`, `<span style="color:${CP}">●</span> Cumprimento: ${P.cump?P.cump.pct+'% ('+nf(P.cump.real)+' de '+nf(P.cump.base)+' atividades)':'sem registros'}`, `<span style="color:${CB}">●</span> Cobertura: ${P.cob?P.cob.pct+'% ('+nf(P.cob.cov)+' h de '+nf(P.cob.prev)+' h)':'sem lançamento de efetivo'}`, `<span style="color:${CY}">╌</span> Meta de cumprimento: ${GOAL_PCT}%`]; tp.innerHTML = lin.join('<br>'); tp.style.display = 'block'; const br = box.getBoundingClientRect(); let x = ev.clientX-br.left+14, y = ev.clientY-br.top-10; if(x+tp.offsetWidth>br.width-4) x = ev.clientX-br.left-tp.offsetWidth-14; tp.style.left = Math.max(4,x)+'px'; tp.style.top = Math.max(4,y)+'px'; };
          r.addEventListener('mousemove', mostra); r.addEventListener('mouseenter', mostra); r.addEventListener('mouseleave', ()=>{ $('pnTip').style.display = 'none'; }); });
      }
      const tb = $('pnTend'); if(tb && tend.length){ tb.innerHTML = barras(tend, Math.max(240, tb.clientWidth), Math.max(120, tb.clientHeight)); }
    };
    sizeGraf();
    if(!window.__pnRz){ window.__pnRz = true; window.addEventListener('resize', ()=>{ clearTimeout(window.__pnRzT); window.__pnRzT = setTimeout(()=>{ if(document.getElementById('pnChart') && window.__pnRedesenhar) window.__pnRedesenhar(); }, 150); }); }
    window.__pnRedesenhar = sizeGraf;

    /* interações */
    const on = (id, fn) => { const e = $(id); if(e) e.onclick = fn; };
    const fimP = ultDiaPeriodo();
    on('pnKCump', abrirRelatorio); on('pnRelCompleto', abrirRelatorio); on('pnRelHist', abrirRelatorio); on('pnAlerta', abrirRelatorio); on('pnRelCons', abrirRelatorio);
    on('pnKAbs', ()=>ir({tipo:'efetivo', data:fimP})); on('pnKCob', ()=>ir({tipo:'efetivo', data:fimP}));
    on('pnKSol', ()=>ir({tipo:'solicitacoes', sub:'pendentes'})); on('pnTodasSol', ()=>ir({tipo:'solicitacoes', sub:'pendentes'}));
    on('pnTodasAreas', ()=>{ const b = document.getElementById('navAreas'); if(b && getComputedStyle(b).display!=='none') b.click(); else ir({tipo:'plano', data:fimP}); });
    on('pnOrdem', ()=>{ window.__dsOrdem = est.ordem==='pior' ? 'melhor' : 'pior'; est.ordem = window.__dsOrdem; desenhar(); });
    on('pnSaiba', ()=>saibaMais());
    on('pnTotal', ()=>{ window.__dsFiltro = 'ALL'; est.filtro = 'ALL'; desenhar(); });
    app.querySelectorAll('.pn-tb tbody tr').forEach(tr=>{ const go = ()=>ir({tipo:'plano', data:fimP, local:tr.dataset.area}); tr.onclick = go; tr.onkeydown = e=>{ if(e.key==='Enter') go(); }; });
    app.querySelectorAll('[data-esc]').forEach(b=>b.onclick = ()=>{ window.__dsEscala = b.dataset.esc; est.escala = b.dataset.esc; if(est.escala==='mes') carregarMesesDoGrafico(); desenhar(); });
    app.querySelectorAll('[data-cons]').forEach(b=>b.onclick = ()=>{ window.__dsConsol = b.dataset.cons; est.consol = b.dataset.cons; desenhar(); });
    if($('pnFiltro')) $('pnFiltro').onchange = e=>{ window.__dsFiltro = e.target.value; est.filtro = e.target.value; desenhar(); };
    app.querySelectorAll('[data-per]').forEach(b=>b.onclick = ()=>{ const h2 = hojeD(); const base = est.p.t==='mes' ? est.p : {a:est.p.a||h2.getFullYear(), m:(est.p.m!=null?est.p.m:h2.getMonth())}; window.__dsPeriodo = b.dataset.per==='mes' ? {t:'mes', a:base.a, m:base.m} : {t:'ano', a:base.a}; renderInicio(); });
    try{ window.dsPeriodoHeader(); }catch(e){}
  }

  function saibaMais(){
    document.getElementById('pnModal')?.remove();
    const ov = document.createElement('div'); ov.id = 'pnModal'; ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';
    ov.innerHTML = `<div class="pn-card" style="max-width:640px;width:100%;max-height:88vh;overflow:auto;"><h3 style="margin:0 0 10px;color:#fff;font-size:16px;">Como os indicadores são calculados</h3>
      <ul style="margin:0;padding-left:18px;line-height:1.6;font-size:13px;color:#c9d4e6;">
      <li><b>Cumprimento do plano</b>: (atividades no horário + com atraso) ÷ (previstas − ainda dentro do prazo) × 100 — a mesma regra do Relatório. Meta: ${GOAL_PCT}%.</li>
      <li><b>Absenteísmo</b>: faltas ÷ efetivo previsto × 100. Previsto pela vigência do Dimensionamento de Efetivo; falta = previsto − presentes (nunca negativa).</li>
      <li><b>Cobertura operacional</b>: horas de posto cobertas ÷ horas necessárias (12 h por posto/turno, escala 12x36), por turno T1/T2, limitada ao previsto. Com a base atual (lista de presentes por turno) ela é o complemento do absenteísmo; passa a divergir se for estruturado o registro de horas.</li>
      <li><b>Solicitações</b>: contadas pela data de criação; pendente = aberta, em andamento, concluída (excluídas ficam de fora).</li>
      <li><b>Mês, ano e histórico</b>: somam numeradores e denominadores diários — não fazem média de percentuais. Meses encerrados são gravados uma vez em <code>consolidado/AAAA-MM</code>.</li>
      <li>Dias sem lançamento de efetivo não entram como zero: ficam fora do absenteísmo e da cobertura.</li></ul>

    document.body.appendChild(ov); ov.addEventListener('click', e=>{ if(e.target===ov || e.target.id==='pnFechar') ov.remove(); });
  }
  }catch(erro){ console.error('[Painel] desativado por erro (o sistema segue com o layout anterior):', erro); if(window.dsDesktopAtivo) window.dsDesktopAtivo = () => false; }
})();

<script>
/* =====================================================================
   DESEMPENHO — menos dados lidos, menos repetição, resposta mais rápida
   ---------------------------------------------------------------------
   Nenhuma regra de negócio muda; só se evita buscar de novo o que acabou de ser buscado:
   1) Checklists por dia e efetivo por dia ficam em cache de MEMÓRIA por pouco tempo
      (20–30 s para os dias recentes, 5 min para os antigos) e são descartados na hora
      se o próprio usuário gravar aquele dia. Nada é guardado no navegador (sem localStorage).
   2) Solicitações: uma única leitura que depois fica "viva" (o banco de dados só envia o que mudou),
      em vez de baixar a lista inteira — com fotos — a cada 60 s ou a cada tela.
   3) Chamadas simultâneas à mesma leitura passam a compartilhar a mesma busca.
   4) Status do Plano 52 e lista de colaboradores também ficam em cache curto; depois que o Início termina, uma pré-carga
      leve deixa Efetivo e Plano 52 com os dados à mão.
   Diagnóstico: abra o sistema com ?semperf=1 para desligar este módulo.
   ===================================================================== */
(function(){
  'use strict';
  const q = new URLSearchParams(location.search);
  if(q.get('tab')==='requests' || q.get('kiosk')==='1') return;
  if(!window.matchMedia('(min-width:769px)').matches) return;     // celular: nada deste módulo é aplicado (comportamento original)
  if(q.get('semperf')==='1'){ console.warn('[Desempenho] desligado por ?semperf=1'); return; }
  try{
    const clone = o => (o==null || typeof o!=='object') ? o : (typeof structuredClone==='function' ? structuredClone(o) : JSON.parse(JSON.stringify(o)));
    const limiteRecente = () => { const d = inicioDia(p52Today()); d.setDate(d.getDate()-2); return dateStr(d); };
    const recente = ds => ds >= limiteRecente();

    /* 1a) checklists por dia (usado por Início/Relatório via plLerChecklists) */
    const cacheChk = new Map(), _plL = plLerChecklists;
    plLerChecklists = async function(days){
      const out = {}, agora = Date.now();
      await Promise.all(days.map(async d=>{
        const ds = dateStr(d); let c = cacheChk.get(ds);
        if(!(c && agora - c.t < c.ttl)){
          c = {t:agora, ttl:recente(ds)?20000:300000};
          c.p = _plL([d]).then(o=>{ const v = o[ds] || {}; if(!Object.keys(v).length) c.ttl = 20000; return v; });
          cacheChk.set(ds, c); c.p.catch(()=>cacheChk.delete(ds));
        }
        out[ds] = clone(await c.p);
      }));
      return out;
    };
    /* 1b) efetivo por dia */
    const cacheEf = new Map(), _le = loadEfetivo;
    loadEfetivo = async function(ds){
      const agora = Date.now(); let c = cacheEf.get(ds);
      if(!(c && agora - c.t < c.ttl)){
        c = {t:agora, ttl:recente(ds)?45000:600000}; c.p = _le.apply(this, arguments);
        cacheEf.set(ds, c); c.p.catch(()=>cacheEf.delete(ds));
      }
      return clone(await c.p);
    };
    /* 1d) status do Plano 52 por dia */
    const cacheP52 = new Map(), _ps = p52LoadStatusDay;
    p52LoadStatusDay = async function(ds){
      const agora = Date.now(); let c = cacheP52.get(ds);
      if(!(c && agora - c.t < 30000)){ c = {t:agora}; c.p = _ps.apply(this, arguments); cacheP52.set(ds, c); c.p.catch(()=>cacheP52.delete(ds)); }
      return clone(await c.p);
    };
    /* gravou? descarta o cache correspondente imediatamente */
    const invalidar = k => { k = String(k||''); if(window.dsInvalidarMes && (k.indexOf('checklist:')===0 || k.indexOf('efetivo:')===0)) window.dsInvalidarMes();
      if(k.indexOf('checklist:')===0) cacheChk.delete(k.slice(10));
      else if(k.indexOf('efetivo:')===0) cacheEf.delete(k.slice(8));
      else if(k.indexOf('p52:status:')===0) cacheP52.delete(k.slice(11)); };
    ['set','delete'].forEach(m=>{
      const o = window.storage[m];
      window.storage[m] = function(k){ invalidar(k); const r = o.apply(this, arguments); return (r && r.then) ? r.then(v=>{ invalidar(k); return v; }) : r; };
    });

    window.dsInvalidarChecklist = ds => { cacheChk.delete(ds); };   // o listener do Plano 52 avisou mudança → próxima leitura é fresca
    /* pré-carga leve (chamada pelo Início depois de pronto): deixa Efetivo e Plano 52 com os dados já à mão */
    window.dsPrefetch = function(){
      try{ loadColaboradores().catch(()=>{}); }catch(e){}
      try{ p52GetWeekDates(0).forEach(d=>{ p52LoadStatusDay(p52DateStr(d)).catch(()=>{}); }); }catch(e){}
    };

    /* 2) solicitações: leitura única e viva */
    let vivo = false, iniciando = null;
    const _er = ensureRequestsLoaded;
    ensureRequestsLoaded = function(){
      if(vivo) return Promise.resolve();
      if(iniciando) return iniciando;
      iniciando = (async()=>{
        try{ await migrateOldRequestsIfNeeded(); }catch(e){}
        await new Promise(res=>{
          let fim = false; const ok = ()=>{ if(!fim){ fim = true; res(); } };
          try{
            fbRequestsRef.on('value', snap=>{
              _requests = snap.exists() ? Object.values(snap.val()) : []; _reqLoadTs = Date.now(); _reqLoaded = true; vivo = true;

            }, err=>{ console.warn('[Desempenho] lista viva indisponível; usando leitura normal', err); ok(); });

          setTimeout(ok, 20000);
        });
        if(!vivo) await _er();                            // reserva: comportamento original
      })().finally(()=>{ iniciando = null; });
      return iniciando;
    };
  }catch(erro){ console.error('[Desempenho] módulo desativado por erro (o sistema segue como antes):', erro); }
})();
</script>

  const segundaDe = d => { const x = dia0(d); return somaDias(x, -((x.getDay()+6)%7)); };

  /* Limites de usabilidade física (mm) */
  const FORMATOS = {
    A4: {w:297, h:210, nome:'A4'},

  };
  const MARGEM = 7, COL_DIA = 12, COL_DATA = 16, CAMPO_MIN = 11;   // campo HH:MM manuscrito ≥ 11 mm
  const capacidade = f => Math.floor((FORMATOS[f].w - 2*MARGEM - COL_DIA - COL_DATA - 1) / (2*CAMPO_MIN));

  function semanasDoMes(a, m){
    const ini = new Date(a, m, 1), fim = new Date(a, m+1, 0), out = [];
    for(let s = segundaDe(ini); s <= fim; s = somaDias(s, 7)) out.push(s);
    return out;
  }
  function diasDoMes(a, m){
    const out = [], n = new Date(a, m+1, 0).getDate();
    for(let i=1;i<=n;i++) out.push(new Date(a, m, i));

  }

  function chaveDoTurno(d, qual){

    return t ? t.key : null;
  }
  function localNoDia(nome, d){ return (getLocationsForDate(d)||[]).find(l => l.name===nome) || null; }

  }

  function areasDoMes(a, m){

      }
      const fim = occDeadline(loc, k, idx, d); if(!fim) return null;
      const ini = idx===0 ? getShiftWindow(k, d).start : occDeadline(loc, k, idx-1, d);
      return ini ? {rot:'', txt: hhmm(ini)+'–'+hhmm(fim)} : null;

  async function garantirAtividades(){

  function checklistDo(nome, k, d){

      if(tipo) return ambItensDo(tipo).map(i => i.texto);

      const areas = p52ResolveLocalToAreas(nome);
      if(!areas.length) return [];
      const filtro = T1KEYS.includes(k) ? '1T' : '2T';
      const at = p52Atividades.filter(a => areas.includes(a.area) &&
        (String(a.turno||'').includes(filtro) || String(a.turno||'').includes('1T/2T')) && p52IsPlanned(a, d));
      if(!at.length) return [];
      if(at.every(a => ambEhGenerico(a.atividade))){
        const t = ambTipoPlanoPadrao();
        if(t) return ambItensDo(t).map(i => i.texto);
      }
      const vistos = new Set();
      return at.map(a => String(a.atividade||'').trim()).filter(t => { const s = t.toLowerCase(); if(!t || vistos.has(s)) return false; vistos.add(s); return true; });
    }catch(e){ console.warn('[Impressão] checklist', e); return null; }
  }
  /* junta a lista dos dias da semana; itens que não valem em todos os dias recebem os dias */
  function consolidarChecklist(listas){
    if(!listas.length) return {estado:'sem-dias', itens:[]};
    if(listas.some(l => l.itens===null)) return {estado:'indisponivel', itens:[]};
    const ordem = [], dias = new Map();
    listas.forEach(l => l.itens.forEach(t => {
      if(!dias.has(t)){ dias.set(t, []); ordem.push(t); }
      dias.get(t).push(l.d.getDay());
    }));
    if(!ordem.length) return {estado:'sem-checklist', itens:[]};
    const total = listas.length;
    return {estado:'ok', itens: ordem.map(t => {
      const ds = dias.get(t);
      return {texto:t, nota: ds.length < total ? [...new Set(ds)].sort((a,b)=>((a+6)%7)-((b+6)%7)).map(x=>DIAS[x]).join(', ') : ''};
    })};
  }

  function montarSemana(nome, seg){
    const dias = Array.from({length:7}, (_,i) => somaDias(seg, i));
    const turnos = ['T1','T2'].map(q => {
      const linhas = dias.map(d => {
        const loc = localNoDia(nome, d), k = chaveDoTurno(d, q);
        const n = (loc && k) ? qtdNoDia(nome, d, q) : 0;
        return {d, k, loc, n};
      });
      const N = Math.max(0, ...linhas.map(l => l.n));
      const cols = [];
      for(let i=0;i<N;i++){
        const jans = new Set(), rots = new Set();
        linhas.forEach(l => { if(l.n > i){ const j = janela(l.loc, l.k, i, l.d); if(j){ jans.add(j.txt); if(j.rot) rots.add(j.rot); } } });
        cols.push({janela: jans.size===1 ? [...jans][0] : (jans.size>1 ? 'varia conforme o dia' : ''), rotulo: rots.size===1 ? [...rots][0] : ''});
      }
      const ativos = linhas.filter(l => l.n > 0);
      const qtds = [...new Set(ativos.map(l => l.n))];
      const lista = consolidarChecklist(ativos.map(l => ({d:l.d, itens: checklistDo(nome, l.k, l.d)})));
      return {q, linhas, N, cols, ativos: ativos.length, qtds, lista};
    });
    return {nome, seg, dias, turnos};
  }

  const ICO = {

    escudo:'<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8 7.5 9.5 4.3-1.5 7.5-4.9 7.5-9.5V6z"/><path d="m8.8 12.2 2.3 2.3 4.2-4.4"/></svg>',

  /* calcula alturas para caber os dois turnos sem espremer os campos */
  function layoutDaFolha(sem, fmt){
    const F = FORMATOS[fmt];
    const internoH = F.h - 2*MARGEM - 2.4;              // 2,4 mm reservados ao carimbo
    const blocos = sem.turnos.filter(t => t.N > 0), vazios = sem.turnos.filter(t => t.N === 0);
    // legenda: estima linhas
    const listas = legendaGrupos(sem);
    const itensLeg = listas.reduce((a,g) => a.concat(g.itens), []);
    const lc = itensLeg.length > 12 ? 3 : itensLeg.length > 4 ? 2 : 1;
    const legW = (F.w - 2*MARGEM) * .52 - 4;            // largura útil da legenda (mm)
    const colW = (legW - 3*(lc-1)) / lc - 3.6;          // largura útil de cada coluna (mm)
    const CH = 1.32;                                     // mm por caractere a 6,6 pt (estimativa conservadora)
    const linhasItens = itensLeg.map(i => Math.max(1, Math.ceil((i.texto.length + (i.nota ? i.nota.length + 11 : 0)) * CH / colW)));
    // distribui em colunas (aprox.): soma das linhas / colunas, mas nunca menos que o maior item
    const totLin = linhasItens.reduce((a,b) => a+b, 0);
    const linhas = itensLeg.length ? Math.max(Math.ceil(totLin / lc) + (lc>1 ? 1 : 0), Math.max(...linhasItens)) : 0;
    const extras = listas.filter(g => g.estado!=='ok').length * 2;
    let rodH = 4.2 + 3.4 + 2.4 + (linhas + extras) * 2.95 + 1.2;   // título + frase + respiro + linhas
    rodH = Math.max(rodH, fmt==='A3' ? 34 : 28.5);
    rodH = Math.min(rodH, fmt==='A3' ? 70 : 48);
    const GAP = 2.2;
    const itens = 1 + blocos.length + vazios.length + 1;
    let livre = internoH - 19 - rodH - vazios.length*10 - GAP*(itens-1);
    const cabBloco = 9.5 + 4.2 + .8;
    let linhaH = blocos.length ? (livre / blocos.length - cabBloco) / 7 : 0;
    const maxH = fmt==='A3' ? 15 : (blocos.length===1 ? 13 : 11.5);
    if(linhaH > maxH) linhaH = maxH;
    const N = Math.max(0, ...sem.turnos.map(t => t.N));
    const campoW = N ? (F.w - 2*MARGEM - COL_DIA - COL_DATA - 1) / (2*N) : 99;
    return {rodH, linhaH, lc, listas, apertado: (blocos.length && linhaH < 6.5) || campoW < CAMPO_MIN, campoW, N};
  }

  /* legenda única: itens dos dois turnos, com a observação de turno/dia quando o item não vale sempre */
  function legendaGrupos(sem){
    const ts = sem.turnos.filter(t => t.N > 0);
    if(!ts.length) return [];
    const ruins = ts.filter(t => t.lista.estado!=='ok');
    if(ruins.some(t => t.lista.estado==='indisponivel')) return [{titulo:'', estado:'indisponivel', itens:[]}];
    const oks = ts.filter(t => t.lista.estado==='ok');
    if(!oks.length) return [{titulo:'', estado:'sem-checklist', itens:[]}];
    const ordem = [], mapa = new Map();
    oks.forEach(t => t.lista.itens.forEach(i => {
      if(!mapa.has(i.texto)){ mapa.set(i.texto, {}); ordem.push(i.texto); }
      mapa.get(i.texto)[t.q] = i.nota;
    }));
    const itens = ordem.map(texto => {
      const m = mapa.get(texto), qs = Object.keys(m);
      let nota = '';
      if(ts.length > 1 && qs.length < ts.length) nota = qs.map(q => q + (m[q] ? ': '+m[q] : '')).join('; ');
      else if(qs.length > 1 && m.T1 !== m.T2) nota = qs.map(q => q + ': ' + (m[q] || 'todos os dias')).join('; ');
      else nota = m[qs[0]] || '';
      return {texto, nota};
    });
    const grupos = [{titulo:'', estado:'ok', itens}];
    ruins.forEach(t => grupos.push({titulo: t.q==='T1'?'T1 · Manhã':'T2 · Noite', estado:t.lista.estado, itens:[]}));
    return grupos;
  }

  function htmlBloco(t, L){
    const ehT1 = t.q==='T1';
    if(!t.N){
      return `<div class="vazio"><i>${ehT1?ICO.sol:ICO.lua}</i><span><b>${ehT1?'T1 · Manhã':'T2 · Noite'}</b> — sem execução prevista para este local nesta semana no planejamento vigente.</span></div>`;
    }
    const sub = t.qtds.length===1 ? `${t.qtds[0]}× por dia` : `até ${t.N}× por dia (varia)`;
    const horario = ehT1 ? '07h às 19h' : '19h às 07h';
    const colg = `<col style="width:${COL_DIA}mm"><col style="width:${COL_DATA}mm">` + '<col>'.repeat(2*t.N);
    const h1 = t.cols.map((c,i) => `<th class="per" colspan="2"><div class="per-in"><span class="per-n">${i+1}</span><span class="per-t">${c.rotulo ? ESC(c.rotulo) : (i+1)+'ª periodicidade'}</span><span class="per-j">${c.janela ? ESC(c.janela) : '&nbsp;'}</span></div></th>`).join('');
    const h2 = t.cols.map(() => `<th class="sub ini">Início</th><th class="sub">Fim</th>`).join('');
    const corpo = t.linhas.map(l => {
      let cels = '';
      if(!l.n){
        cels = `<td class="c" colspan="${2*t.N}"><div class="cx np"><span>SEM EXECUÇÃO PREVISTA NESTE DIA</span></div></td>`;
      }else{
        for(let i=0;i<t.N;i++){
          if(i < l.n) cels += `<td class="c ini"><div class="cx"><span>:</span></div></td><td class="c"><div class="cx"><span>:</span></div></td>`;
          else cels += `<td class="c ini" colspan="2"><div class="cx np"><span>NÃO PREVISTA</span></div></td>`;
        }
      }
      return `<tr style="height:${L.linhaH.toFixed(2)}mm"><td class="dia">${DIAS[l.d.getDay()]}</td><td class="data">${ddmm(l.d)}</td>${cels}</tr>`;
    }).join('');
    return `<div class="bloco ${ehT1?'t1':'t2'}" style="--ch:${Math.max(4, L.linhaH-1.4).toFixed(2)}mm"><table><colgroup>${colg}</colgroup>
      <thead><tr style="height:9.5mm"><th class="tt" colspan="2"><div class="tt-in"><i>${ehT1?ICO.sol:ICO.lua}</i><div><b>${ehT1?'T1 · MANHÃ':'T2 · NOITE'}</b><span>${sub}</span><span>${horario}</span></div></div></th>${h1}</tr>
      <tr style="height:4.2mm"><th class="sub dd">DIA</th><th class="sub dd">DATA</th>${h2}</tr></thead>
      <tbody>${corpo}</tbody></table></div>`;
  }

  function htmlLegenda(sem, L){
    const N = Math.max(...sem.turnos.map(t => t.N));
    const faixa = N > 1 ? `P1 a P${N}` : 'P1';
    let html = `<div class="leg" style="--lc:${L.lc}"><span class="leg-t">LEGENDA DAS PERIODICIDADES</span>`;
    if(!N){
      html += `<p>Não há periodicidades previstas para este local nesta semana.</p></div>`;
      return html;
    }
    html += `<p><b>${faixa}</b>: cada periodicidade é uma execução completa do checklist abaixo.</p>`;
    L.listas.forEach(g => {
      const tit = g.titulo ? `<b>${ESC(g.titulo)}:</b> ` : '';
      if(g.estado==='ok') html += `<ol>${g.itens.map(i => `<li><span>${ESC(i.texto)}${i.nota?` <em>(somente ${ESC(i.nota)})</em>`:''}</span></li>`).join('')}</ol>`;
      else if(g.estado==='sem-checklist') html += `<p>${tit}${tit?'sem':'Sem'} checklist de atividades cadastrado para este local; registre cada limpeza conforme o plano.</p>`;
      else if(g.estado==='indisponivel') html += `<p>${tit}${tit?'não':'Não'} foi possível carregar o checklist agora. Gere a folha novamente com conexão para incluir as atividades.</p>`;
    });
    return html + '</div>';
  }

  function htmlFolha(sem, ctx){
    const L = layoutDaFolha(sem, ctx.fmt);
    const fim = somaDias(sem.seg, 6);
    const blocos = sem.turnos.map(t => htmlBloco(t, L)).join('');
    return `<section class="folha">
  <header class="cab">
    <div class="marca"><img src="${LOGO}" alt=""><b>mercado<br>livre</b></div>
    <div class="tit"><h1>FACILITIES | MG02</h1><h2>CONTROLE OPERACIONAL DE LIMPEZA</h2></div>
    <div class="info">
      <div class="cx-i"><small>Área / Local</small><b>${ESC(sem.nome)}</b></div>
      <div class="cx-i"><small>Semana</small><b>${ddmmaaaa(sem.seg)} a ${ddmmaaaa(fim)}</b></div>
      <div class="cx-i"><small>Responsável</small><div class="ln"></div></div>
      <div class="cx-i"><small>Líder / Fiscal</small><div class="ln"></div></div>
    </div>
    <div class="selo"><i>${ICO.cal}</i><div><b>PLANO SEMANAL DE LIMPEZA</b><span>${MESES[ctx.m].toUpperCase()} / ${ctx.a}</span><em>Semana ${ctx.idx+1} de ${ctx.total}</em></div></div>
  </header>
  ${blocos}
  <footer class="rod" style="height:${L.rodH.toFixed(1)}mm">
    ${htmlLegenda(sem, L)}
    <div class="obs"><small>Observações / pendências</small><div class="linhas"></div></div>
    <div class="conf"><div class="ins"><i>${ICO.escudo}</i><span>Registrar o horário de início e término de cada periodicidade conforme a execução. No T2, use a data de início do turno (19h).</span></div>
      <div class="ln">Conferência do responsável:</div><div class="ln"><span></span></div><div class="ln">Data: <span></span>/<span></span>/<span></span></div></div>
    <div class="slog"><b>Juntos por<br>um ambiente<br>melhor.</b><img src="${LOGO}" alt=""></div>
  </footer>
  <div class="carimbo"><span>Espelho do planejamento digital vigente · gerado em ${ESC(ctx.gerado)}${ctx.usuario?' por '+ESC(ctx.usuario):''}</span><span>A ficha não substitui o lançamento no sistema: a transcrição exige validação do responsável.</span><span>Folha ${ctx.idx+1}/${ctx.total}</span></div>
</section>`;

  function documento(semanas, ctx, opcoes){

    const s = estado.semanas[estado.semana], fim = somaDias(s.sem.seg, 6);
    pv.querySelector('#pvSemTxt').textContent = `Semana ${estado.semana+1} de ${estado.semanas.length} · ${ddmm(s.sem.seg)} a ${ddmm(fim)}`;
    pv.querySelector('#pvAnt').disabled = estado.semana===0;
    pv.querySelector('#pvProx').disabled = estado.semana===estado.semanas.length-1;
    pv.querySelector('#pvImpMesTxt').textContent = `Imprimir mês (${estado.semanas.length} folhas)`;
    pv.querySelectorAll('.pv-seg button').forEach(b => b.classList.toggle('on', b.dataset.f===estado.fmt));
    // aviso de usabilidade física
    const L = layoutDaFolha(s.sem, estado.fmt), aviso = pv.querySelector('#pvAviso');
    const mxMes = Math.max(...estado.semanas.map(x => Math.max(...x.sem.turnos.map(t => t.N))));
    if(estado.fmt==='A4' && mxMes > capacidade('A4')){
      aviso.innerHTML = `<span>Este local tem até ${mxMes} periodicidades por turno. Em A4 cada campo de horário fica com ${L.campoW.toFixed(0)} mm, pouco para escrever à mão.</span><button type="button" id="pvUsarA3">Usar A3</button>`;
      aviso.classList.add('on'); aviso.querySelector('#pvUsarA3').onclick = () => { estado.fmt = 'A3'; estado.fmtEscolhido = true; desenharPrevia(); };
    }else if(!mxMes){
      aviso.innerHTML = '<span>Não há periodicidades previstas para este local no mês selecionado. As folhas sairão apenas com a identificação.</span>'; aviso.classList.add('on');
    }else if(L.apertado){
      aviso.innerHTML = '<span>O conteúdo desta semana deixa as linhas de registro baixas nesta folha.</span><button type="button" id="pvUsarA3">Usar A3</button>';
      aviso.classList.add('on'); const b = aviso.querySelector('#pvUsarA3'); if(estado.fmt==='A3') b.remove(); else b.onclick = () => { estado.fmt='A3'; estado.fmtEscolhido = true; desenharPrevia(); };
    }else{ aviso.classList.remove('on'); aviso.innerHTML = ''; }
    // folha
    const F = FORMATOS[estado.fmt], MM = 96/25.4, W = Math.round(F.w*MM), H = Math.round(F.h*MM);
    const area = pv.querySelector('#pvArea');
    area.innerHTML = `<div class="pv-folha" id="pvFolha"><iframe id="pvFrame" title="Prévia da folha" width="${W}" height="${H}" scrolling="no"></iframe></div>`;
    const fr = area.querySelector('#pvFrame');
    fr.srcdoc = documento([s], ctxBase(), {previa:true});
    fr.dataset.w = W; fr.dataset.h = H;
    escalar();
  }
  function escalar(){
    const area = document.getElementById('pvArea'), box = document.getElementById('pvFolha'), fr = document.getElementById('pvFrame');
    if(!area || !box || !fr) return;
    const W = +fr.dataset.w, H = +fr.dataset.h;
    const pad = window.innerWidth <= 768 ? 20 : 44;
    const porLargura = (area.clientWidth - pad) / W, porAltura = (area.clientHeight - pad) / H;
    // folha inteira visível; em telas estreitas prioriza a largura (rolagem vertical)
    const sc = Math.min(1.35, Math.max(.2, window.innerWidth <= 768 ? porLargura : Math.max(Math.min(porLargura, porAltura), Math.min(porLargura, .62))));
    fr.style.transform = `scale(${sc})`;
    box.style.width = (W*sc)+'px'; box.style.height = (H*sc)+'px';
  }
  function fecharPrevia(){
    const pv = document.getElementById('ppPrevia');
    if(resizeObs){ try{ resizeObs.disconnect(); }catch(e){} resizeObs = null; }
    if(pv){ pv.remove(); document.body.style.overflow = ''; }
    const b = document.getElementById('ppBtnAbrir'); if(b) try{ b.focus(); }catch(e){}
  }

  function imprimir(lista){
    if(!lista || !lista.length) return;
    const pv = document.getElementById('ppPrevia');
    const botoes = pv ? pv.querySelectorAll('#pvImpSem,#pvImpMes') : [];
    botoes.forEach(b => b.disabled = true);
    document.getElementById('ppImpFrame')?.remove();
    const fr = document.createElement('iframe');
    fr.id = 'ppImpFrame'; fr.setAttribute('aria-hidden','true'); fr.tabIndex = -1;
    fr.style.cssText = 'position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0;pointer-events:none;';
    document.body.appendChild(fr);
    const liberar = () => botoes.forEach(b => b.disabled = false);
    fr.onload = () => {
      setTimeout(() => {
        try{
          const w = fr.contentWindow;
          w.addEventListener('afterprint', () => { liberar(); setTimeout(() => fr.remove(), 500); });
          w.focus(); w.print();
        }catch(e){ console.error('[Impressão]', e); alert('Não foi possível abrir a impressão neste navegador.'); }
        setTimeout(liberar, 1500);
      }, 300);
    };
    fr.srcdoc = documento(lista, ctxBase());
  }

  document.addEventListener('keydown', e => {
    if(e.key!=='Escape') return;
    if(document.getElementById('ppPainel')){ fecharPainel(); e.stopPropagation(); }
    else if(document.getElementById('ppPrevia')){ fecharPrevia(); e.stopPropagation(); }
  }, true);

  /* ---------- botão no cabeçalho do Plano de Limpeza ---------- */
  function injetarBotao(){
    let sec = null; try{ sec = section; }catch(e){}
    const velho = document.getElementById('ppBtnAbrir');
    if(sec!=='checklist'){ if(velho) velho.remove(); return; }
    const tc = document.getElementById('topControls'); if(!tc || velho) return;
    const b = document.createElement('button');
    b.type = 'button'; b.id = 'ppBtnAbrir'; b.className = 'pp-btn-abrir';
    b.title = 'Imprimir o plano físico semanal por local e turno';
    b.innerHTML = IC.print + '<span>Imprimir Plano</span>';
    b.onclick = abrirPainel;
    const hoje = document.getElementById('btnHoje');
    if(hoje && hoje.parentNode===tc) hoje.insertAdjacentElement('afterend', b); else tc.appendChild(b);
  }
  try{
    const _rtcImp = renderTopControls;
    renderTopControls = function(){ const r = _rtcImp.apply(this, arguments); try{ injetarBotao(); }catch(e){ console.warn('[Impressão]', e); } return r; };
    injetarBotao();
  }catch(e){ console.error('[Impressão] módulo não instalado (o sistema segue normalmente):', e); }

  /* gera o documento de impressão sem abrir a tela (conferência/teste): ppDocumento('CCM', 2026, 9, 'A4') */
  window.ppDocumento = async function(area, a, m, fmt){
    await garantirAtividades();
    const semanas = semanasDoMes(a, m).map((seg, idx) => ({idx, sem: montarSemana(area, seg)}));
    const g = new Date();
    return documento(semanas, {area, a, m, fmt: fmt||'A4', total: semanas.length, gerado: ddmmaaaa(g)+' '+hhmm(g), usuario: usuarioAtual()});
  };
  /* utilitário de conferência (console): ppConferir('Banheiro Staff', 2026, 9) */
  window.ppConferir = async function(area, a, m){
    await garantirAtividades();
    return semanasDoMes(a, m).map(seg => { const s = montarSemana(area, seg); return {
      semana: ddmmaaaa(seg), T1: s.turnos[0].linhas.map(l => DIAS[l.d.getDay()]+' '+ddmm(l.d)+': '+l.n),
      T2: s.turnos[1].linhas.map(l => DIAS[l.d.getDay()]+' '+ddmm(l.d)+': '+l.n),
      checklistT1: s.turnos[0].lista, checklistT2: s.turnos[1].lista }; });
  };
})();

</script>
